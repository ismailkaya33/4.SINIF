<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>4. Sınıf | Öğretmen Girişi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
    }
    .panel {
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #0001;
      text-align: center;
      width: min(360px, 85vw);
    }
    h1 { color: #1e293b; }
    button {
      padding: 14px 22px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    #bilgi { margin-top: 20px; }
    #kimlik {
      overflow-wrap: anywhere;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Öğretmen Paneli</h1>
    <p>4. Sınıf Eğitim Portalı</p>
    <button id="giris">Google ile Giriş Yap</button>
    <div id="bilgi" role="status"></div>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    import { getFirestore, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    // Firebase proje bilgileri
    const firebaseConfig = {
      apiKey: "AIzaSyArEQt8alG-UcD4-BrNEgqr1aJnIRfdt58",
      authDomain: "sinif-egitim-portali.firebaseapp.com",
      projectId: "sinif-egitim-portali",
      appId: "1:972010232888:web:6a9d59f16b9cd28cefdacd",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const bilgi = document.getElementById("bilgi");
    const giris = document.getElementById("giris");

    async function yoneticiKontrol(user) {
      if (!user) {
        giris.hidden = false;
        bilgi.textContent = "Google hesabınızla giriş yapın.";
        return;
      }

      giris.hidden = true;
      bilgi.textContent = "Öğretmen yetkisi kontrol ediliyor...";

      try {
        const kayit = await getDoc(doc(db, "teachers", user.uid));
        if (kayit.exists() && kayit.data().role === "admin") {
          bilgi.textContent = "✅ Yönetici doğrulandı! Öğretmen paneline hoş geldiniz.";
        } else {
          bilgi.textContent = "⛔ Bu hesap için öğretmen yetkisi tanımlanmamış.";
        }
      } catch (error) {
        bilgi.textContent = "Yetki kontrolü başarısız: " + (error.code || "bilinmeyen-hata");
      }
    }

    giris.addEventListener("click", async () => {
      giris.disabled = true;
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        bilgi.textContent = "Giriş hatası: " + (error.code || "bilinmeyen-hata");
      } finally {
        giris.disabled = false;
      }
    });

    onAuthStateChanged(auth, yoneticiKontrol);
  </script>
</body>
</html>
