const P=(o,a)=>[20+(o-26)*29.5,20+(42.2-a)*38];
const OUT=[[26.1,41.8],[27.9,42],[29.1,41.2],[31,41.1],[33,42],[35.1,42],[36.3,41.4],[39,41],[41.5,41.5],[43.4,41.1],[44.2,40],[44.8,39.6],[44,38.4],[44.6,37.2],[42.2,37.3],[40,36.85],[38,36.8],[36.6,36.6],[36.2,36],[35.8,36.6],[34.6,36.8],[33.5,36.2],[32,36.1],[30.7,36.8],[29.1,36.6],[28.2,36.8],[27.3,37],[27.25,37.9],[26.75,38.35],[26.8,39.3],[26.2,39.95],[26.3,40.5]];
function svgMap(R,M){const pt=OUT.map(p=>P(...p).join(',')).join(' '),[mx,my]=P(28.2,40.7);
return `<svg viewBox="0 0 600 285" role="img" aria-label="Şematik Türkiye haritası"><polygon points="${pt}" fill="#fff3d6" stroke="#1b2a5c" stroke-width="2"/><ellipse cx="${mx}" cy="${my}" rx="32" ry="10" fill="#eaf5ff" stroke="#1b2a5c"/>`
+R.map(r=>{const[x,y]=P(r.lo,r.la);return `<ellipse data-k="${r.k}" cx="${x}" cy="${y}" rx="${r.rx}" ry="${r.ry}" fill="${r.col}" fill-opacity=".4" stroke="${r.col}" stroke-width="2"/>`+(r.t?`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d2b" pointer-events="none">${r.t}</text>`:'')}).join('')
+M.map(m=>{const[x,y]=P(m.lo,m.la),dx=m.dx??11;return `<g data-k="${m.k}"><circle cx="${x}" cy="${y}" r="10" fill="transparent"/><circle cx="${x}" cy="${y}" r="7" fill="${m.hi?'#c8102e':'#1b2a5c'}" stroke="#fff" stroke-width="2"/><text x="${x+dx}" y="${y+(m.dy??5)}" font-size="16" font-weight="700" fill="#1b2a5c" text-anchor="${m.a||(dx<0?'end':'start')}" paint-order="stroke" stroke="#fffaf0" stroke-width="4">${m.t}</text></g>`}).join('')+`</svg>`}
const rg=(f,l)=>Object.keys(FR).map(k=>({k,lo:FR[k].lo,la:FR[k].la,rx:FR[k].rx,ry:FR[k].ry,col:f(k),t:l?FR[k].n+' Cephesi':''}));

/* ---------- OYUN MOTORLARI ---------- */
function quiz(id,el,L){L=sh(L);let i=0,ok=0;const go=()=>{
if(i>=L.length){sc[id]=Math.max(sc[id]||0,ok);upd();H(el,`<div class="card"><h3>🎉 ${ok}/${L.length} doğru</h3><button class="btn">Tekrar Oyna</button></div>`);el.querySelector('button').onclick=()=>quiz(id,el,L);return}
const q=L[i];H(el,`<div class="card"><b>Soru ${i+1}/${L.length}</b><p>${q.q}</p>${q.o?sh(q.o).map(x=>`<button class="btn a">${x}</button>`).join(''):'<input id="fi" size="14" aria-label="Cevap"> <button class="btn a" id="fk">Kontrol Et</button>'}<p id="fb"></p></div>`);
const fin=(v,b)=>{const e=v.trim()==='',c=!e&&nm(v)==nm(q.a);if(c)ok++;
el.querySelectorAll('.a,input').forEach(x=>{x.disabled=true;if(q.o&&nm(x.textContent)==nm(q.a))x.classList.add('good')});if(b&&!c)b.classList.add('bad');
H($('fb'),(c?'✅ Doğru! ':e?'💡 Boş bıraktın. Doğru cevap: <b>'+q.a+'</b>. ':'❌ Doğru cevap: <b>'+q.a+'</b>. ')+q.e+'<br><button class="btn" id="nx">Devam</button>');$('nx').onclick=()=>{i++;go()}};
if(q.o)el.querySelectorAll('.a').forEach(b=>b.onclick=()=>fin(b.textContent,b));else $('fk').onclick=()=>fin($('fi').value)};go()}
function order(id,el,A,pr){const S=sh(A);let q=[];const dr=(m='')=>{H(el,`<div class="card"><p>${pr}</p>${S.map(x=>`<button class="btn it${q.includes(x)?' sel':''}">${q.includes(x)?(q.indexOf(x)+1)+'. ':''}${x}</button>`).join('')}<p><button class="btn" id="${id}k">Kontrol Et</button> <button class="btn" id="${id}r">Sıfırla</button></p><p>${m}</p></div>`);
el.querySelectorAll('.it').forEach((b,i)=>b.onclick=()=>{if(!q.includes(S[i])){q.push(S[i]);dr()}});
$(id+'r').onclick=()=>{q=[];dr()};
$(id+'k').onclick=()=>{const n=q.filter((x,i)=>x==A[i]).length;sc[id]=Math.max(sc[id]||0,n);upd();dr(n==A.length?`🎉 Harika! ${n}/${A.length} doğru.`:`${q.length?'❌':'💡 Boş bıraktın.'} ${n}/${A.length} doğru. Doğru sıra: <b>${A.join(' → ')}</b>`)}};dr()}
function match(id,el,Pr){const M=new Map(Pr),L=sh(Pr.map(p=>p[0])),R=sh(Pr.map(p=>p[1]));let s=null,ok=0,dn=0;
H(el,`<div class="card"><p>Soldan birini, sonra sağdan eşini seç.</p><div class="two"><div>${L.map(x=>`<button class="btn l">${x}</button>`).join('')}</div><div>${R.map(x=>`<button class="btn r">${x}</button>`).join('')}</div></div><p><button class="btn" id="${id}a">Cevapları Göster</button> <button class="btn" id="${id}n">Yeniden Oyna</button></p><p id="${id}f"></p></div>`);
const ls=[...el.querySelectorAll('.l')],rs=[...el.querySelectorAll('.r')],f=m=>H($(id+'f'),m);
const fix=(l,r,g)=>{l.disabled=r.disabled=true;l.classList.remove('sel');l.classList.add(g?'good':'bad');r.classList.add('good');dn++;if(g)ok++;sc[id]=Math.max(sc[id]||0,ok);upd();if(dn==Pr.length)f(`🎉 İlk denemede ${ok}/${Pr.length} doğru.`)};
ls.forEach(b=>b.onclick=()=>{ls.forEach(x=>x.classList.remove('sel'));s=b;b.classList.add('sel')});
rs.forEach(b=>b.onclick=()=>{if(!s)return f('Önce soldan bir seçim yap.');const l=s,a=M.get(l.textContent);s=null;if(a==b.textContent)fix(l,b,1);else{f(`❌ ${l.textContent} → <b>${a}</b>`);fix(l,rs.find(x=>x.textContent==a),0)}});
$(id+'a').onclick=()=>f(Pr.map(p=>p.join(' → ')).join('<br>'));$(id+'n').onclick=()=>match(id,el,Pr)}
function ff(el){const Q=sh(Object.keys(FR));let i=0,ok=0;const go=()=>{
if(i>=3){sc.ff=Math.max(sc.ff||0,ok);upd();H(el,`<div class="card"><h3>🎉 ${ok}/3 doğru</h3><button class="btn">Tekrar Oyna</button></div>`);el.querySelector('button').onclick=()=>ff(el);return}
H(el,`<div class="card"><p class="tag">Şematik harita</p><p><b>${FR[Q[i]].n} Cephesi</b>'ni haritada bul!</p><div id="fm">${svgMap(rg(()=>'#8aa'),[])}</div><p><button class="btn" id="fq">Bilmiyorum</button></p><p id="ffb"></p></div>`);
const end=(c,k)=>{if(c)ok++;$('fm').onclick=null;$('fq').remove();H($('fm'),svgMap(rg(x=>x==Q[i]?'#2e9e5b':'#8aa',1),[]));H($('ffb'),(c?'✅ Doğru! ':k?`❌ Burası ${FR[k].n} Cephesi değil. `:'💡 Boş bıraktın. ')+`${FR[Q[i]].n} Cephesi yeşil bölgedir.<br><button class="btn" id="fn">Devam</button>`);$('fn').onclick=()=>{i++;go()}};
$('fm').onclick=e=>{const t=e.target.closest('[data-k]');if(t)end(t.dataset.k==Q[i],t.dataset.k)};$('fq').onclick=()=>end(0,0)};go()}
const GM=[["Tarihleri Sırala",e=>order('od1',e,["Mondros Ateşkesi","Samsun'a çıkış","Amasya Genelgesi","TBMM'nin açılışı","Sakarya Meydan Muharebesi","Büyük Taarruz","Cumhuriyet'in ilanı"],"Olayları eskiden yeniye doğru sırala.")],
["Kahraman–Şehir",e=>match('mt1',e,KS)],["Cepheyi Bul",ff],["Doğru / Yanlış",e=>quiz('tf',e,TF)],["Boşluk Doldur",e=>quiz('fl',e,FL)],["Çoktan Seçmeli",e=>quiz('mc',e,MC)],["Neden–Sonuç",e=>match('mt2',e,NS)],["Eksik Bilgi",e=>quiz('ek',e,EK)]];

/* ---------- BÖLÜMLER ---------- */
function r0(){const d=$('c0');H(d,'<p>Bir olaya dokun, ayrıntılarını gör.</p><div class="grid">'+E.map((e,i)=>`<button class="btn" data-i="${i}">${e[4]} <b>${e[0]}</b><br>${e[1]}</button>`).join('')+'</div>');
d.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const e=E[b.dataset.i];H($('dgb'),`<h3>${e[4]} ${e[1]}</h3><p>📅 <b>${e[0]}</b></p><p>${e[2]}</p><p>⭐ <b>Önemi:</b> ${e[3]}</p>`);$('dg').showModal()})}
function r1(){const d=$('c1');let k=null;
H(d,`<p class="tag">Şematik haritadır; şehirlerin yeri yaklaşık gösterilmiştir.</p><div id="m1"></div><div id="i1" class="card">Haritada bir şehre dokun 👆</div><div class="card"><b>Ana fikir:</b> Amasya'da millî bağımsızlık ve milletin kararlılığı, Erzurum'da vatanın bütünlüğü, Sivas'ta direnişin birleştirilmesi vurgulandı.</div><h3>Etkinlik 1: Olay hangi şehirde?</h3><div id="a1"></div><h3>Etkinlik 2: Durakları sırala</h3><div id="b1"></div>`);
const dr=()=>H($('m1'),svgMap([],Object.keys(C).map(c=>({k:c,lo:C[c][0],la:C[c][1],t:c,dx:c=='Havza'?-11:11,hi:c==k}))));
$('m1').onclick=e=>{const t=e.target.closest('[data-k]');if(t){k=t.dataset.k;H($('i1'),`<h3>📍 ${k}</h3><p>${C[k][2]}</p>`);dr()}};dr();
match('mt3',$('a1'),[["Havza Genelgesi","Havza"],["Amasya Genelgesi","Amasya"],["Erzurum Kongresi","Erzurum"],["Sivas Kongresi","Sivas"],["Samsun'a çıkış","Samsun"],["TBMM'nin açılışı","Ankara"]]);
order('od2',$('b1'),["Havza","Amasya","Erzurum","Sivas","Ankara"],"Mustafa Kemal Samsun'dan sonra hangi sırayla durdu?")}
function r2(){const d=$('c2');
H(d,`<p class="tag">Bu harita şematiktir. Bölgeler yaklaşık gösterilmiştir; günümüz sınırlarıyla birebir aynı değildir.</p><div id="m2"></div><p id="bt2"></p><div id="i2" class="card">Bir cepheye dokun 👆</div><div class="card"><b>Kuvâ-yı Milliye ve düzenli ordu:</b> Kuvâ-yı Milliye, halkın gönüllü kurduğu direniş birlikleridir. Düzenli ordu, devletin eğitimli ve komutanlarca yönetilen ordusudur.</div>`);
const fr=k=>{const f=FR[k];H($('i2'),`<h3 style="color:${f.c}">${f.n} Cephesi</h3><p>🔸 <b>Karşı taraf:</b> ${f.v}</p><p>🔸 <b>Kahramanlar:</b> ${f.h}</p><p>🔸 <b>Şehirler:</b> ${f.s}</p><p>${f.x}</p><p>🏁 <b>Sonuç:</b> ${f.r}</p>`)};
H($('m2'),svgMap(rg(k=>FR[k].c,1),[]));$('m2').onclick=e=>{const t=e.target.closest('[data-k]');if(t)fr(t.dataset.k)};
H($('bt2'),Object.keys(FR).map(k=>`<button class="btn" data-f="${k}" style="border-color:${FR[k].c}">${FR[k].n} Cephesi</button>`).join(''));
$('bt2').querySelectorAll('button').forEach(b=>b.onclick=()=>fr(b.dataset.f))}
function r3(){const d=$('c3');let sel=null;
H(d,`<p class="tag">Şematik harita: konumlar yaklaşık, hareket yönleri gösterilmemiştir.</p><div id="m3"></div><div id="i3" class="card">Bir savaşa dokun 👇</div><div id="l3" class="grid"></div><div class="card">🛡️ <b>Sakarya'da savunma anlayışı:</b> Mustafa Kemal “Hattı müdafaa yoktur, sathı müdafaa vardır” dedi. Yani savunma tek bir çizgide değil, bütün yurtta yapılır; her karış toprak savunulur.</div><h3>Etkinlik: Savaşları sırala</h3><div id="o3"></div>`);
const dr=()=>H($('m3'),svgMap([],Object.keys(MK).map(k=>({k,lo:MK[k][0],la:MK[k][1],t:MK[k][2],dx:MK[k][3],dy:MK[k][4],a:MK[k][5],hi:k==sel}))));
const pk=(k,i)=>{sel=k;H($('i3'),BT.filter((b,j)=>i==null?b[4]==k:j==i).map(b=>`<h3>${b[0]}</h3><p>📅 ${b[1]}</p><p>${b[2]}</p><p>⭐ <b>Sonuç:</b> ${b[3]}</p>`).join('<hr>'));dr()};
$('m3').onclick=e=>{const t=e.target.closest('[data-k]');if(t)pk(t.dataset.k)};dr();
H($('l3'),BT.map((b,i)=>`<button class="btn" data-i="${i}">${i+1}. ${b[0]}<br><small>${b[1]}</small></button>`).join(''));
$('l3').querySelectorAll('button').forEach(b=>b.onclick=()=>pk(BT[b.dataset.i][4],+b.dataset.i));
order('od3',$('o3'),BT.map(b=>b[0]),"Savaşları eskiden yeniye doğru sırala.")}
function r4(){H($('c4'),`<div class="grid">${[["🤝","Mudanya Ateşkes Antlaşması","11 Ekim 1922","Savaş durdu. Askerî mücadeleden diplomasi dönemine geçildi. Barış görüşmelerinin yolu açıldı."],["🕊️","Lozan Barış Antlaşması","24 Temmuz 1923","Savaş resmen sona erdi. Yeni Türk devletinin bağımsızlığı uluslararası alanda kabul edildi."],["🇹🇷","Cumhuriyet'in İlanı","29 Ekim 1923","Devletin yönetim şekli Cumhuriyet oldu. Mustafa Kemal Atatürk ilk Cumhurbaşkanı seçildi."]].map(c=>`<div class="card"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><p>📅 ${c[2]}</p><p>${c[3]}</p></div>`).join('')}</div><div class="card"><b>Ateşkes mi, barış mı?</b><p>🔸 <b>Ateşkes:</b> Savaşa geçici olarak ara verilir.</p><p>🔸 <b>Barış antlaşması:</b> Savaşı resmen bitirir ve kalıcı kuralları belirler.</p></div><div class="card"><b>Bağlantı kur:</b> TBMM 23 Nisan 1920'de açıldı ve egemenliğin millete ait olduğu ilkesi esas alındı. 29 Ekim 1923'te devletin yönetim şekli de Cumhuriyet olarak belirlendi.</div>`)}
function r5(){H($('c5'),`<p class="tag">Simgeler temsilîdir; gerçek fotoğraf değildir.</p><div class="grid">${HR.map(h=>`<div class="card"><div class="ic">${h[0][0]}</div><h3>${h[0]}</h3><p><b>Görev / Bölge:</b> ${h[1]}</p><p><b>Katkısı:</b> ${h[2]}</p><p>💡 <b>Hatırla:</b> ${h[3]}</p></div>`).join('')}</div>`)}
function r6(){const d=$('c6');H(d,GM.map((g,i)=>`<button class="btn" data-i="${i}">${g[0]}</button>`).join('')+'<div id="gm"></div>');
const pl=i=>{d.querySelectorAll('[data-i]').forEach((b,k)=>b.classList.toggle('sel',k==i));GM[i][1]($('gm'))};

$('tg').onclick=()=>show(t.s);$('ta').onclick=()=>{r=1;dr()};$('tp').onclick=()=>{i=Math.max(0,i-1);r=0;dr()};$('tn').onclick=()=>{i=Math.min(TS.length-1,i+1);r=0;dr()}};dr()}

H($('nv'),SEC.map(s=>`<button>${s[0]} ${s[1]}</button>`).join('')+'<button onclick="print()">🖨️ Yazdır</button>');
H($('mn'),SEC.map((s,i)=>`<section id="s${i}"><h2>${s[0]} ${s[1]}</h2><div id="c${i}"></div></section>`).join(''));

[r0,r1,r2,r3,r4,r5,r6,r7].forEach(f=>f());

show(0);
