<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kroki Atölyesi</title>
<style>
:root{--ana:#ff8c42;--ikinci:#2a7fd4;--gok1:#a9d8ff;--gok2:#eef7ff;--kart:#fff;--yazi:#1f2a44;--soluk:#55627a;--ok:#1f8a4c;--hata:#c0392b;--zemin:#fffdf6;--duvar:#33415c}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--yazi);font:18px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;background-color:var(--gok2);
  background-image:linear-gradient(rgba(42,127,212,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(42,127,212,.10) 1px,transparent 1px),linear-gradient(180deg,var(--gok1),var(--gok2) 65%);
  background-size:26px 26px,26px 26px,100% 100%;background-attachment:fixed;overflow-x:hidden}
#app{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:12px 14px 90px}
#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
h1,h2,.baslik{font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:800}
h1{font-size:clamp(1.6rem,4.8vw,2.3rem);margin:6px 0 4px;text-align:center}
h2{font-size:1.35rem;margin:6px 0}
.kart{background:var(--kart);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 7px 0 rgba(31,42,68,.10),0 14px 30px rgba(31,42,68,.12)}
button{font:inherit;cursor:pointer;color:var(--yazi)}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid #ffb703;outline-offset:3px}
.buyuk{display:block;margin:14px auto 4px;background:var(--ana);color:#fff;border:0;border-radius:18px;padding:12px 28px;min-height:58px;font-size:1.25rem;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.buyuk:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.ust{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ust .baslik{font-size:1rem;background:#fffc;border-radius:999px;padding:4px 14px}
.sag{display:flex;gap:8px;align-items:center}
.puan{background:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.puan.pop{animation:pop .4s}
.ses{background:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.yol{display:flex;align-items:center;flex-wrap:wrap;gap:3px;margin:10px 0 0;padding:7px 10px;background:#fffc;border-radius:16px}
.durak{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800;background:#fff;color:var(--soluk);border:2px dashed #b9c3d6}
.durak.simdi{border:3px solid var(--ana);color:var(--ana)}
.durak.yildiz,.durak.yarim,.durak.ogrendi{border:2px solid transparent;font-size:.9rem}
.durak.yildiz{background:#fff3c4}.durak.yarim{background:#e2f7f4}.durak.ogrendi{background:#e8ecff}
.cizgi{flex:1 1 3px;min-width:3px;max-width:14px;height:3px;border-radius:2px;background:#b9c3d6}
.durak.son{width:32px;height:32px;font-size:1.1rem;border:3px solid #ffd166;background:#fff8e1}
.etiket{display:inline-block;background:var(--ikinci);color:#fff;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.88rem}
.gorsel{display:flex;justify-content:center;margin:10px 0 2px}
.gorsel svg{width:100%;max-width:440px;height:auto}
.emoji-gorsel{font-size:clamp(2rem,7vw,2.8rem);line-height:1.2;text-align:center;margin:8px 0 2px}
.soru{font-size:clamp(1.2rem,3.8vw,1.55rem);font-weight:800;margin:10px 0 14px;text-align:center}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.sec{grid-template-columns:1fr}}
.sec button{position:relative;min-height:62px;border-radius:18px;border:3px solid var(--c);background:var(--z);font-size:1.08rem;font-weight:700;
  padding:8px 40px 8px 52px;text-align:left;box-shadow:0 5px 0 var(--c)}
.sec button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.sec button:nth-child(1){--c:#ff8a5c;--z:#fff0e9}.sec button:nth-child(2){--c:#2ec4b6;--z:#e4f8f6}
.sec button:nth-child(3){--c:#f4a300;--z:#fff6dc}.sec button:nth-child(4){--c:#7b5cff;--z:#efeaff}
.sec .no{position:absolute;left:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1rem}
.sec.resimli{grid-template-columns:1fr 1fr;max-width:640px;margin:0 auto}
.sec.resimli button{padding:40px 6px 6px;text-align:center}
.sec.resimli .no{top:6px;margin-top:0}
.sec.resimli svg{display:block;width:100%;height:auto;background:#fff;border-radius:10px}
.sec button.dogru{--c:var(--ok);--z:#e3f7ec}
.sec button.dogru::after{content:"✔";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:1.5rem}
.sec.resimli button.dogru::after,.sec.resimli button.yanlis::after{top:20px}
.sec button.yanlis{--c:#a7b0c0;--z:#f1f3f7;color:#6c7589}
.sec:not(.resimli) button.yanlis{text-decoration:line-through}
.sec.resimli button.yanlis svg{opacity:.45}
.sec button.yanlis::after{content:"✖";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--hata);font-size:1.3rem}
.alt{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.ipucu-btn{background:#fff8e1;border:3px solid #ffd166;border-radius:999px;padding:6px 18px;min-height:50px;font-weight:800;box-shadow:0 4px 0 #ffd166}
.karakter-satir{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.krk{flex:0 0 auto;width:104px}
.krk.kucuk{width:84px}
.krk svg{display:block;width:100%;height:auto;transform-origin:50% 100%}
.goz-mutlu,.kas{display:none}
.krk.mutlu .goz-mutlu{display:inline}.krk.mutlu .goz-acik{display:none}
.krk.dusun .goz-acik{transform:translate(3px,-4px)}
.krk.uzgun .kas{display:inline}.krk.uzgun .goz-acik{transform:translateY(3px)}
.balon{position:relative;flex:1;background:#fff;border-radius:20px;padding:12px 16px;font-weight:600;min-height:3.2em;margin-bottom:24px;box-shadow:0 5px 0 rgba(31,42,68,.10);border:3px solid #fff}
.balon::before{content:"";position:absolute;left:-14px;bottom:16px;border:9px solid transparent;border-right:14px solid #fff;border-left:0}
.balon.mutlu{border-color:#bfead2}.balon.uzgun{border-color:#ffd3cc}.balon.dusun{border-color:#ffe7a3}
.devam-yer{text-align:center}
/* Kroki + açıklama kutusu */
.kroki-kap{margin:8px 0 4px}
.kroki-ic{position:relative;max-width:440px;margin:0 auto}
.kroki-ic svg{display:block;width:100%;height:auto}
.dokun{position:absolute;background:transparent;border:2px dashed rgba(42,127,212,.55);border-radius:10px;padding:0;min-height:0}
.dokun:hover:not(:disabled){background:rgba(255,183,3,.18);border-color:#ff8c42}
.dokun.yanlis{border:3px solid var(--hata);background:rgba(192,57,43,.16)}
.dokun.dogru{border:3px solid var(--ok);background:rgba(31,138,76,.18)}
.dokun.dogru::after,.dokun.yanlis::after{position:absolute;right:2px;top:0;font-size:1.1rem;font-weight:800;line-height:1;background:#fff;border-radius:50%;padding:2px 3px}
.dokun.dogru::after{content:"✔";color:var(--ok)}.dokun.yanlis::after{content:"✖";color:var(--hata)}
.lejant{max-width:440px;margin:8px auto 0;border:2px dashed #8aa4c8;border-radius:14px;padding:6px 10px;background:#f7fbff;font-size:.95rem}
.lejant b{display:block;font-size:.85rem;color:var(--soluk)}
.lejant span{display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0}
.lejant svg{width:34px;height:34px;background:var(--zemin);border-radius:6px}
.betim{background:#fff8e1;border-radius:14px;padding:8px 14px;margin:6px 0;font-size:1rem}
.betim ol,.betim ul{margin:4px 0;padding-left:22px}
.betim li{margin:2px 0}
/* Atölye (kroki kurma) */
.atolye{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin-top:6px}
.oda-sar{flex:1 1 300px;max-width:420px}
.oda-ust{display:flex;justify-content:space-between;align-items:center}
.oda-ad{font-weight:800;color:var(--soluk)}
.ok-kucuk svg{width:58px;height:60px;display:block}
.oda{display:grid;gap:3px;border:8px solid var(--duvar);background:var(--zemin);padding:3px;touch-action:none}
.hucre{position:relative;aspect-ratio:1/1;min-height:0;border:1.5px dashed #c9d3e2;border-radius:6px;background:transparent;padding:0;display:block}
.hucre svg{display:block;width:100%;height:100%}
.hucre.hedef{background:#fff1c9;border-color:#ff8c42}
.hucre.yanlis{background:#ffe1dc;border:2.5px solid var(--hata)}
.hucre.yanlis::after{content:"✖";position:absolute;right:1px;top:-3px;color:var(--hata);font-size:.95rem;font-weight:800}
.hucre.dogru{background:#e1f6e8;border:2px solid var(--ok)}
.hucre.dogru::after{content:"✔";position:absolute;right:1px;top:-3px;color:var(--ok);font-size:.95rem;font-weight:800}
.tepsi-sar{flex:1 1 220px;max-width:420px;border:2px dashed #8aa4c8;border-radius:14px;padding:8px;background:#f7fbff}
.tepsi-sar>b{font-size:.9rem;color:var(--soluk)}
.tepsi{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:6px}
.parca{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid #9cc0ea;border-radius:14px;background:#fff;padding:4px;min-height:84px;font-size:.85rem;font-weight:700;line-height:1.1;touch-action:none}
.parca svg{width:44px;height:44px;background:var(--zemin);border-radius:6px}
.parca.secili{border-color:var(--ana);background:#fff1e6;box-shadow:0 0 0 3px #ffd2b3}
.parca:disabled{opacity:.35}
.parca .adet{position:absolute;right:4px;top:3px;background:var(--ikinci);color:#fff;border-radius:999px;font-size:.75rem;padding:0 6px}
.kur-dug{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.kontrol{background:var(--ok);color:#fff;border:0;border-radius:16px;padding:10px 22px;min-height:54px;font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 #145c33}
.temizle{background:#fff;border:3px solid #b9c3d6;border-radius:16px;padding:8px 16px;min-height:54px;font-weight:700}
.hayalet{position:fixed;z-index:60;width:58px;height:58px;pointer-events:none;transform:translate(-50%,-60%);background:#fffdf6;border:3px solid var(--ana);border-radius:12px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.hayalet svg{width:100%;height:100%}
/* Aşama girişi */
.asama-no{display:inline-block;background:var(--ana);color:#fff;border-radius:999px;padding:2px 14px;font-weight:800}
.kural{background:#e8f2ff;border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:600}
.kiyas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kiyas>div{border-radius:14px;padding:8px 6px;text-align:center;font-size:.86rem;line-height:1.3;border:3px solid var(--k)}
.kiyas .bas{font-weight:800;font-size:1rem;display:block;margin-bottom:2px}
.kiyas .em{font-size:1.7rem;display:block}
.kiyas p{margin:3px 0}
.adimlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0;padding:0;list-style:none;counter-reset:a}
.adimlar li{counter-increment:a;background:#f2f7ff;border-radius:14px;padding:8px 10px 8px 42px;position:relative;font-weight:600;font-size:.95rem}
.adimlar li::before{content:counter(a);position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--ikinci);color:#fff;display:grid;place-items:center;font-weight:800}
.ok-ornek{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0}
.ok-ornek figure{margin:0;text-align:center;font-size:.85rem;font-weight:600;max-width:150px}
.ok-ornek svg{width:120px;height:auto}
.bitis{text-align:center}
.rozet{width:126px;height:auto}
.rozet-ad{font-weight:800;font-size:1.25rem;margin-top:-4px}
.yildizlar{font-size:1.5rem;letter-spacing:3px;margin:6px 0;word-break:break-all}
#karne .rm{padding:4px 0;text-align:left}
#karne .rm h2{text-align:center}
#karne .rm-k{border:0;background:#f5f8ff;border-radius:16px}
.unutma{text-align:left;background:#fff8e1;border-radius:16px;padding:10px 14px;margin-top:10px}
.unutma ol{margin:6px 0;padding-left:22px}
@media (max-width:440px){
  #app{padding:10px 8px 80px}.kart{padding:12px 10px;border-radius:18px}
  .oda{border-width:6px;padding:2px;gap:2px}
  .kiyas{gap:5px}.kiyas>div{font-size:.78rem;padding:6px 3px}
  .krk.kucuk{width:70px}.balon{padding:10px 12px;font-size:.95rem}
  .sec.resimli{gap:8px}.sec.resimli button{padding:38px 4px 4px}
}
@media (prefers-reduced-motion:no-preference){
  .krk.zipla svg{animation:zipla .6s}
  .krk.salla svg,.sec button.salla{animation:salla .45s}
  .kart.gir{animation:gir .35s ease-out}
  .sec button{transition:transform .08s,box-shadow .08s,background .15s}
}
@keyframes zipla{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes salla{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes gir{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.25)}}
</style>

<body>
<canvas id="konfeti" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
/* RaporMotoru v2 — 4/D portalına bağlı (her etkinliğin içine gömülür; tek dosya, çevrimdışı).
 *
 * Akış:
 *   RaporMotoru.init({oyunId, oyunAdi, kazanimlar:[{kod, ad}]})   oyun başında (ve "yeniden oyna"da)
 *   RaporMotoru.kaydet({...})                                       her maddeden sonra
 *   RaporMotoru.ekranCiz(el)                                        oyun sonunda: öğrenciye "Kazanım Karnem"
 *
 * Portal bağlantısı (öğrenci kodla giriş yaptıysa etkinlik portalın içinde açılır):
 *   - Her madde: {type:'4d:item-result'} mesajı (madde bazlı kazanım/yanılgı verisi)
 *   - Oyun sonu: {type:'4d:activity-finished'} mesajı, oyun başına BİR kez (mevcut sonuç kaydı)
 *   Sayfa portal dışında (kodsuz) açıldıysa mesajlar gitmez; karne yine gösterilir.
 *   Mesajı yalnızca portal kayıt listesinde (portal/etkinlik-kayitlari.json) olan etkinlikler için
 *   sunucu kaydeder; oyunId bu listedeki "id" ile aynı olmalı.
 *
 * Seviye eşikleri öğretmen panelindekiyle AYNI olmalı (ESIK, seviye).
 */
const RaporMotoru = (() => {
  const SURUM = 3;
  const ESIK = { ustalik: 0.85, gelisiyor: 0.6, ipucuUst: 0.25, minMadde: 3 };
  let meta = null, kayit = [], t0 = Date.now(), denemeKimligi = '', bitisGonderildi = false;

  function yeniKimlik() {
    let r = '';
    try { const a = new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b => { r += b.toString(16).padStart(2, '0'); }); }
    catch (e) { r = Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    return 'rm_' + r;
  }
  function portalaGonder(mesaj) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(mesaj, '*'); } catch (e) { /* portal yok */ }
  }


  /* --- Cevap defteri (v3, öğretmenin kararı 2026-11-27) ---
   * Her ilk kez çözülen madde portala tek tek gider (4d:answer); portal Google tablosuna yazar, İLK kayıt kilitlidir.
   * Etkinlik açılınca (init) portal kayıtlı cevapları geri verir (4d:saved-answers) → RaporMotoru.kayitli(id).
   * Etkinlik isterse RaporMotoru.onKayitli(fn) ile kayıtlı maddeleri atlar/kilitler. Onay (4d:answer-ack) gelene
   * kadar cevap 5 saniyede bir yeniden gönderilir; portal yoksa hiçbir şey gitmez. */
  let kayitliCevaplar = {}, kayitliDinleyiciler = [], bekleyenCevaplar = {}, cevapZamanlayici = null;
  function hazirGonder() { if (meta) portalaGonder({ type: '4d:ready', schemaVersion: 1, activityId: meta.oyunId }); }
  function bekleyenleriGonder() {
    const k = Object.keys(bekleyenCevaplar);
    k.forEach(q => portalaGonder(bekleyenCevaplar[q]));
    if (!k.length && cevapZamanlayici) { clearInterval(cevapZamanlayici); cevapZamanlayici = null; }
  }
  function cevapGonder(x) {
    if (!meta || x.r || !x.m || kayitliCevaplar[x.m] || bekleyenCevaplar[x.m]) return;
    bekleyenCevaplar[x.m] = { type: '4d:answer', schemaVersion: 1, activityId: meta.oyunId, questionId: x.m,
      correct: !x.c, firstTry: !!x.i && !x.c };
    portalaGonder(bekleyenCevaplar[x.m]);
    if (!cevapZamanlayici && window.parent !== window) cevapZamanlayici = setInterval(bekleyenleriGonder, 5000);
  }
  try {
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (ev.source !== window.parent || !d || typeof d !== 'object' || !meta || d.activityId !== meta.oyunId) return;
      if (d.type === '4d:saved-answers' && Array.isArray(d.answers)) {
        d.answers.forEach(a => { if (a && typeof a.questionId === 'string') kayitliCevaplar[a.questionId] = { correct: !!a.correct, firstTry: !!a.firstTry, answer: String(a.answer || '') }; });
        Object.keys(kayitliCevaplar).forEach(q => { delete bekleyenCevaplar[q]; });
        kayitliDinleyiciler.forEach(fn => { try { fn(Object.assign({}, kayitliCevaplar)); } catch (e) { /* etkinlik hatası */ } });
      } else if (d.type === '4d:answer-ack' && typeof d.questionId === 'string') {
        delete bekleyenCevaplar[d.questionId];
        if (d.saved && typeof d.saved === 'object') kayitliCevaplar[d.questionId] = { correct: !!d.saved.correct, firstTry: !!d.saved.firstTry, answer: String(d.saved.answer || '') };
      }
    });
  } catch (e) { /* tarayıcı mesaj dinleyemiyor */ }
  /** Daha önce kaydedilmiş madde: {correct, firstTry, answer} ya da null. */
  function kayitli(madde) { return kayitliCevaplar[String(madde)] || null; }
  /** Portal kayıtlı cevapları verdiğinde çağrılır: fn({maddeId: {correct, firstTry, answer}}). */
  function onKayitli(fn) { if (typeof fn === 'function') kayitliDinleyiciler.push(fn); }

  /** m = {oyunId, oyunAdi, kazanimlar:[{kod, ad}]}  (kod = MEB kazanım kodu, ör. "M.4.1.2.3") */
  function init(m) {
    meta = { oyunId: String(m.oyunId), oyunAdi: String(m.oyunAdi), kazanimlar: m.kazanimlar.map(k => ({ kod: String(k.kod), ad: String(k.ad) })) };
    kayit = []; t0 = Date.now(); denemeKimligi = yeniKimlik(); bitisGonderildi = false;
    bekleyenCevaplar = {}; hazirGonder();
  }

  /** r = {kazanim:kod, madde:id, yanilgi:'etiket'|'', ilkDenemeDogru:bool, deneme:n, ipucu:0-3,
   *       cozumGoruldu:bool, sureMs:n, tekrar:bool}   tekrar=true → seviye hesabına katılmaz */
  function kaydet(r) {
    const i = meta ? meta.kazanimlar.findIndex(k => k.kod === r.kazanim) : -1;
    if (i < 0) { console.warn('RaporMotoru: bilinmeyen kazanım', r.kazanim); return false; }
    const x = {
      k: i, m: String(r.madde || '').slice(0, 40), y: String(r.yanilgi || '').slice(0, 40),
      i: r.ilkDenemeDogru ? 1 : 0, d: Math.max(1, r.deneme | 0), h: Math.max(0, Math.min(3, r.ipucu | 0)),
      c: r.cozumGoruldu ? 1 : 0, s: Math.max(0, Math.round((r.sureMs || 0) / 1000)), r: r.tekrar ? 1 : 0
    };
    kayit.push(x);
    portalaGonder({ type: '4d:item-result', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      kazanim: meta.kazanimlar[i].kod, madde: x.m, yanilgi: x.y, ilkDogru: x.i, deneme: x.d, ipucu: x.h,
      cozum: x.c, sureSn: x.s, tekrar: x.r });
    cevapGonder(x);
    return true;
  }

  function seviye(a) {            // a: ilk kez sorulan madde kayıtları
    const n = a.length;
    if (n < ESIK.minMadde) return 'veri-az';
    const p = a.filter(x => x.i).length / n, h = a.filter(x => x.h > 0).length / n;
    if (p >= ESIK.ustalik && h <= ESIK.ipucuUst) return 'ustalasti';
    if (p >= ESIK.gelisiyor) return 'gelisiyor';
    return 'destek';
  }

  function ozet() {
    return meta.kazanimlar.map((k, idx) => {
      const hepsi = kayit.filter(x => x.k === idx), a = hepsi.filter(x => !x.r);
      const yan = {};
      hepsi.forEach(x => { if (x.y) yan[x.y] = (yan[x.y] || 0) + 1; });
      return {
        kod: k.kod, ad: k.ad, n: a.length, dogru: a.filter(x => x.i).length,
        p: a.length ? a.filter(x => x.i).length / a.length : null,
        ipucuOran: a.length ? a.filter(x => x.h > 0).length / a.length : 0,
        seviye: seviye(a), yanilgilar: yan
      };
    });
  }

  function bitir() {
    if (!meta || bitisGonderildi) return;

      wrongAttempts: a.reduce((t, x) => t + (x.d - 1), 0), firstTry: Math.min(ilk, cozulen),
      durationSeconds: Math.min(86400, Math.round((Date.now() - t0) / 1000)) });
  }

  const ETIKET = {
    ustalasti: ['Harika! Bu konuyu iyi biliyorsun.', '#1b7f4b'],
    gelisiyor: ['Gelişiyorsun. Biraz daha tekrar iyi gelir.', '#b26a00'],
    destek: ['Bu konuyu birlikte tekrar edelim.', '#b3261e'],
    'veri-az': ['Bu konuda daha fazla soru çözmen gerek.', '#5b6470']
  };

  /** Öğrenciye olumlu dilli "Kazanım Karnem" ekranı; sonucu portala da gönderir. */
  function ekranCiz(el) {
    bitir();
    if (!document.getElementById('rm-css')) {
      const st = document.createElement('style'); st.id = 'rm-css';
      st.textContent = '.rm{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;max-width:720px;margin:0 auto;padding:16px;color:inherit}' +
        '.rm h2{margin:0 0 4px;font-size:1.5rem}.rm p{margin:4px 0 12px;opacity:.85}' +
        '.rm-k{border:1px solid #c9d1dc;border-radius:14px;padding:12px 14px;margin:10px 0}' +
        '.rm-k b{display:block;font-size:1.05rem}.rm-bar{height:14px;background:#e8ebf0;border-radius:8px;overflow:hidden;margin:8px 0}' +
        '.rm-bar i{display:block;height:100%;border-radius:8px}.rm-m{font-size:.95rem;font-weight:700}.rm-d{font-size:.9rem;opacity:.8}';
      document.head.appendChild(st);
    }
    const o = ozet();
    const guclu = o.filter(x => x.seviye === 'ustalasti').length, tekrar = o.filter(x => x.seviye === 'destek' || x.seviye === 'gelisiyor').length;
    let h = '<div class="rm"><h2>Kazanım Karnem</h2><p>' + esc(meta.oyunAdi) + '</p><p>' + guclu + ' konuda güçlüsün' +
      (tekrar ? ', ' + tekrar + ' konuyu tekrar edeceksin.' : '.') + '</p>';
    o.forEach(x => {

      h += '<div class="rm-k"><b>' + esc(x.ad) + '</b><div class="rm-bar" role="img" aria-label="ilk denemede doğru: %' + yuzde + '"><i style="width:' + yuzde + '%;background:' + e[1] + '"></i></div>' +
        '<span class="rm-m" style="color:' + e[1] + '">' + e[0] + '</span> <span class="rm-d">(' + x.dogru + '/' + x.n + ' ilk denemede doğru)</span></div>';
    });
    h += '<p class="rm-d">' + (window.parent !== window ? 'Sonucun öğretmenine gönderildi.' : 'Sonucunun öğretmenine gitmesi için etkinliği öğrenci portalından aç.') + '</p></div>';
    el.innerHTML = h;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

  return { init, kaydet, ozet, bitir, ekranCiz, seviye, kayitli, onKayitli, ESIK, SURUM };
})();

  if ((m.kuzey || 0) !== 0 && (ew || ns || rot)) return 'yon-ekrana-gore';
  if (ew) return 'dogu-bati-ters';
  if (ns) return 'kuzey-guney-ters';
  return 'yer-iliskisi';
}
function kontrol() {
  if (!durum || durum.kilit || durum.m.tur !== 'kur') return;
  const m = durum.m, top = m.parcalar.reduce((s, p) => s + p.n, 0), yerlesen = durum.yer.filter(Boolean).length;
  if (yerlesen < top) { cal('tik'); ruh('dusun', null, '🧩 Önce bütün parçaları yerleştir. Kalan parça: ' + (top - yerlesen)); return; }
  const yanlis = [];
  durum.yer.forEach((t, i) => { if (!t) return; const [c, r] = hucreXY(i); if (!hedefVar(m, t, c, r)) yanlis.push({ t, c, r, i }); });
  durum.deneme++; durum.isaret = {};
  if (!yanlis.length) {
    durum.yer.forEach((t, i) => { if (t) durum.isaret[i] = 'dogru'; });
    durum.kilit = true; kurCiz(); durum.kilit = false;
    dogruGeldi(document.getElementById('oda')); return;
  }
  if (!durum.ilkYanilgi) { const et = yanlis.map(y => kurYanilgi(m, y.t, y.c, y.r)); durum.ilkYanilgi = et.find(e => e !== 'yer-iliskisi') || et[0]; }
  if (durum.deneme >= 2) {
    durum.yer.fill(null); durum.isaret = {};
    m.parcalar.forEach(p => p.hedef.slice(0, p.n).forEach(([c, r]) => { const i = r * m.cols + c; durum.yer[i] = p.t; durum.isaret[i] = 'dogru'; }));
    durum.secili = null; cal('tik'); sonuclar[idx] = 'ogrendi';
    bitir(true, 'dusun', null, '📘 Doğru krokiye birlikte bakalım: ' + m.why); return;
  }
  yanlis.forEach(y => { durum.isaret[y.i] = 'yanlis'; });
  kurCiz(); cal('yanlis');
  ruh('uzgun', 'salla', '🤔 Henüz değil: ' + yanlis.length + ' parça yanlış yerde (✖ işaretli). Onları taşı, sonra yeniden kontrol et. İstersen 💡 ipucu al.');
}

function bitir(cozumGoruldu, mod, hareket, mesaj) {
  durum.kilit = true;
  const ilkDogru = durum.deneme === 1 && !cozumGoruldu;
  durum.x.ilkDogru = ilkDogru;
  RaporMotoru.kaydet({ kazanim: OYUN.kazanimlar[0].kod, madde: durum.m.id, yanilgi: durum.ilkYanilgi,
    ilkDenemeDogru: ilkDogru, deneme: durum.deneme, ipucu: durum.ipucu, cozumGoruldu, sureMs: Date.now() - durum.t0, tekrar: durum.x.tekrar });
  ruh(mod, hareket, mesaj);
  app.querySelectorAll('.sec button, .dokun, #ip').forEach(b => { b.disabled = true; });
  if (durum.m.tur === 'kur') kurCiz();
  const yol = app.querySelector('.yol'); if (yol) yol.outerHTML = yolCiz();
  const dev = document.createElement('button'); dev.className = 'buyuk'; dev.id = 'dev';
  dev.textContent = idx + 1 < sira.length || !tekrarEklendi ? 'Devam →' : T.sonSimge + ' Karnemi gör!';
  dev.onclick = () => { idx++; soru(); window.scrollTo(0, 0); };
  document.getElementById('devamYer').appendChild(dev); dev.focus({ preventScroll: true });
}

function yildizYol(cx0, cy0, R, r) { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, u = i % 2 ? r : R;
  d += (i ? 'L' : 'M') + (cx0 + Math.cos(a) * u).toFixed(1) + ' ' + (cy0 + Math.sin(a) * u).toFixed(1); } return d + 'Z'; }
function bitisEkrani() {
  durum = null;
  const ilkSonuc = sonuclar.slice(0, ilkTur), yildiz = ilkSonuc.filter(x => x === 'yildiz').length, oran = yildiz / ilkTur;
  const [rozetAd, rozetRenk] = oran >= 0.85 ? ['Altın Kroki Ustası', '#f4b400'] : oran >= 0.6 ? ['Gümüş Kroki Ustası', '#9aa5b1'] : ['Cesur Kroki Çırağı', '#cd7f32'];
  app.innerHTML = ustCiz() + '<div class="kart gir bitis"><h1>🎉 ' + esc(T.bitisBaslik) + '</h1>' +
    '<svg viewBox="0 0 120 150" class="rozet" role="img" aria-label="' + rozetAd + ' rozeti">' +
    '<path d="M40 92 L26 146 L45 137 L56 150 L60 98Z" fill="#ef476f"/><path d="M80 92 L94 146 L75 137 L64 150 L60 98Z" fill="#118ab2"/>' +
    '<circle cx="60" cy="60" r="46" fill="' + rozetRenk + '"/><circle cx="60" cy="60" r="36" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4"/>' +
    '<path d="' + yildizYol(60, 60, 24, 10) + '" fill="#fff"/></svg><div class="rozet-ad">' + rozetAd + '</div>' +
    '<div class="yildizlar" aria-label="' + yildiz + ' yıldız">' + ilkSonuc.map(x => x === 'yildiz' ? '⭐' : x === 'yarim' ? '✨' : '📘').join('') + '</div>' +
    '<div class="karakter-satir"><div id="krk" class="krk kucuk">' + karakterSVG() + '</div><div id="balon" class="balon mutlu">Tebrikler! ' + yildiz + ' yıldız ve ' + puan + ' ' + esc(T.odulAd) +
    ' topladın. Şimdi sıra sende: evdeki odanın krokisini çiz!</div></div>' +
    '<div class="unutma"><b>📌 Unutma: İyi bir kroki</b><ol><li>kuşbakışı (yukarıdan) çizilir,</li><li>ölçü kullanılmaz ama yerler doğru olur,</li><li>kuzeyi gösteren yön oku taşır,</li><li>simgeleri anlatan açıklama kutusu (lejant) taşır.</li></ol></div>' +
    '<div id="karne"></div><button class="buyuk" id="yeniden">↻ Yeniden oyna</button></div>';
  sesBagla();
  RaporMotoru.ekranCiz(document.getElementById('karne'));   // karne + sonucu portala gönderir (oyun başına bir kez)
  const eski = parseInt(depo.oku(DEPO_REKOR), 10) || 0;
  if (yildiz > eski) depo.yaz(DEPO_REKOR, String(yildiz));
  document.getElementById('yeniden').onclick = baslangic;
  cal('kutlama'); ruh('mutlu', 'zipla', document.getElementById('balon').textContent);
  konfeti(60); setTimeout(() => konfeti(40, innerWidth * 0.25, innerHeight * 0.3), 350);
}

document.addEventListener('keydown', e => {   // klavye: 1-4 seçenek, Esc seçimi bırak, Enter devam
  const odak = document.activeElement, dugmede = odak && odak.tagName === 'BUTTON';
  if (e.key >= '1' && e.key <= '4' && durum && !durum.kilit && document.querySelector('.sec')) sec_(+e.key - 1);
  else if (e.key === 'Escape' && durum && durum.secili) { durum.secili = null; kurCiz(); }
  else if (e.key === 'Enter' && !dugmede) { const d = document.getElementById('dev'); if (d) { e.preventDefault(); d.click(); } }
});
baslangic();
