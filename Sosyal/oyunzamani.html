const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const DATA=[
{type:'choice',title:'İki Zaman, Bir Oyun',q:'Dedesi “Ben de küçükken sokakta seksek oynardım.” diyor. Ece bugün okul bahçesinde seksek oynuyor. Bu durum neyi gösterir?',opts:[['a','Bazı oyunlar kuşaklar boyunca devam eder.'],['b','Bütün oyunlar tamamen ortadan kalkmıştır.'],['c','Seksek yalnızca ekranda oynanır.']],ans:'a',why:'Sekseğin hem geçmişte hem bugün oynanması sürekliliğe örnektir.'},
{type:'match',title:'Oyun İzleri',q:'Oyun özelliklerini doğru örneklerle eşleştir.',left:[['a','Fiziksel hareket'],['b','Dijital ortam'],['c','Kuşaklar arası süreklilik']],right:[['x','Bahçede ip atlamak'],['y','Tablette bulmaca oynamak'],['z','Anneyle birlikte beştaş oynamak']],ans:{a:'x',b:'y',c:'z'},why:'Ortam ve oynanış farklı olabilir; bir oyunun yeni kuşaklarca sürdürülmesi sürekliliktir.'},

{type:'multi',title:'Değişmeyen Ne?',q:'Geçmişte ve günümüzde oynanan oyunlarda ortak olabilecek özellikleri seç. (İki doğru cevap)',opts:[['a','Eğlenme ve vakit geçirme'],['b','Birlikte oynama ve iletişim'],['c','Her oyunda tablet bulunması'],['d','Bütün oyunlarda aynı malzeme kullanılması']],ans:['a','b'],why:'Eğlenmek ve arkadaşlarla iletişim kurmak her iki dönemde de mümkündür.'},
{type:'fill',title:'Anahtar Sözcük',q:'Bir geleneğin veya oyunun geçmişten bugüne yaşamasına ne denir? Tek sözcük yaz.',ans:['süreklilik'],why:'Süreklilik, bir özelliğin ya da uygulamanın zaman içinde devam etmesidir.'},
{type:'detect',title:'Yanlış Bilgi Alarmı',q:'Hangi ifade düzeltilmelidir?',opts:[['a','Geleneksel oyunlar bugün de oynanabilir.'],['b','Dijital oyunlar her zaman tek kişiyle oynanır.'],['c','Oyunların araçları ve oynandıkları yerler değişebilir.']],ans:'b',why:'Dijital oyunların bazıları birlikte veya takım hâlinde de oynanır.'},
{type:'choice',title:'Oyun Alanı Değişti',q:'Önceden mahallede oynanan saklambaç bugün okul bahçesinde oynanıyor. Değişen özellik hangisidir?',opts:[['a','Oyunun oynandığı yer'],['b','Oyunun bütünüyle yok olması'],['c','Oyuncuların mutlaka yalnız olması']],ans:'a',why:'Saklambaç devam ediyor; burada değişen şey oyun alanıdır.'},
{type:'match',title:'Geçmiş ve Bugün',q:'Gözlemleri uygun kavramlarla eşleştir.',left:[['a','Beştaş hâlâ oynanıyor.'],['b','Topaç artık farklı malzemeden üretilebiliyor.'],['c','Aynı oyun yeni bir okul bahçesine taşınmış.']],right:[['x','Süreklilik'],['y','Malzemede değişim'],['z','Mekânda değişim']],ans:{a:'x',b:'y',c:'z'},why:'Oyun sürebilirken malzemesi veya oynandığı yer değişebilir.'},
{type:'drag',title:'İpucu Sandıkları',q:'Kartları doğru sandıklara yerleştir. Sürükleyebilir veya karta, sonra sandığa dokunabilirsin.',groups:[['change','Değişim'],['continuity','Süreklilik']],items:[['a','Sekseğin bugün de oynanması','continuity'],['b','Bir oyunun telefona uyarlanması','change'],['c','Körebenin farklı kuşaklarda oynanması','continuity'],['d','Topaçta kullanılan malzemenin değişmesi','change']],why:'Devam eden oyun sürekliliği; araç ve ortam farkları değişimi gösterir.'},
{type:'multi',title:'Mahalle Röportajı',q:'Dedenin oynadığı saklambaç ile bugünkü saklambacı karşılaştırmak için hangi sorular uygundur? (Üç doğru cevap)',opts:[['a','Nerede oynardınız?'],['b','Kaç kişi oynardınız?'],['c','Kuralları nasıldı?'],['d','En sevdiğiniz çorba hangisiydi?']],ans:['a','b','c'],why:'Oyun yeri, oyuncu sayısı ve kuralları karşılaştırma için anlamlı verilerdir.'},
{type:'fill',title:'Kayıp Kavram',q:'Topacın eskiden ahşaptan, bugün bazı örneklerinin plastikten yapılması malzemede hangi kavramın örneğidir?',ans:['değişim','değişimin'],why:'Malzemede farklılaşma değişim örneğidir.'},
{type:'detect',title:'Kaynak Kontrolü',q:'Bir öğrenci “Dedem hiçbir zaman dijital oyun oynamamış; demek ki eskiden çocuklar hiç oyun oynamazmış.” diyor. Hangi düşüncesi hatalı?',opts:[['a','Dedesinin dijital oyun oynamamış olabileceği'],['b','Dijital oyun yoksa geçmişte de oyun olmadığı sonucu'],['c','Oyun araçlarının zamanla değiştiği']],ans:'b',why:'Geçmişte dijital araçlar yaygın olmasa da birçok geleneksel oyun vardı.'},
{type:'match',title:'Oyun Dedektifi Arşivi',q:'Her kanıtı doğru çıkarımla eşleştir.',left:[['a','Nine ile torun aynı mendil kapmacayı oynuyor.'],['b','Aynı oyuna yeni bir güvenlik kuralı ekleniyor.'],['c','Arkadaşlar uzaktan çevrim içi oyun oynuyor.']],right:[['x','Kuşaklar arasında devamlılık'],['y','Kurallarda değişiklik'],['z','Teknolojinin sağladığı yeni ortam']],ans:{a:'x',b:'y',c:'z'},why:'Kanıtı oyun süresi, kuralları ve oynama ortamı bakımından ayrı değerlendir.'},
{type:'sort',title:'Karşılaştırma Dosyası',q:'Geçmiş-bugün karşılaştırmasını araştırma basamaklarına göre sırala.',items:[['a','Büyüklerden eskiden oynadıkları oyunları öğren'],['b','Bugün aynı veya benzer oyunları gözlemle'],['c','Benzerlikleri ve farklılıkları kaydet'],['d','Değişim ve süreklilik sonucu çıkar']],ans:['a','b','c','d'],why:'Önce iki dönemin verileri toplanır, sonra karşılaştırılır ve sonuç çıkarılır.'},
{type:'choice',title:'İddia İncelemesi',q:'“Günümüzde bütün çocuklar sadece ekran oyunlarını sever.” iddiasına en güçlü yanıt hangisidir?',opts:[['a','Bu iddia bütün çocukları kapsadığı için gözlem ve kanıtla sınanmalıdır.'],['b','Kesinlikle doğrudur; kanıta gerek yoktur.'],['c','Eskiden hiçbir çocuk oyun oynamazdı.']],ans:'a',why:'Herkes için geçerli olduğu söylenen iddialar kanıt gerektirir; geleneksel oyunlar bugün de oynanabilir.'},
{type:'drag',title:'Kültür Haritası',q:'Dört bilgiyi “ortak kalan” ve “farklılaşan” kutularına taşı.',groups:[['same','Ortak kalan'],['different','Farklılaşan']],items:[['a','Arkadaşlarla eğlenme isteği','same'],['b','Oyun konsolunun kullanılması','different'],['c','Birlikte kurallara uyma','same'],['d','Bazı oyunların ekran ortamına taşınması','different']],why:'Eğlenme ve kurala uyma geçmişte de bugün de olabilir; teknolojik ortamlar değişebilir.'},
{type:'multi',title:'Müze Etiketi',q:'Bir geleneksel oyun müzesinde doğru bilgi olarak hangi ifadeler sergilenebilir? (Üç doğru cevap)',opts:[['a','Oyunlar kültürün kuşaklar arasında aktarılmasına katkı sağlar.'],['b','Oyunun oynanma yeri zamanla değişebilir.'],['c','Geleneksel oyunların bir kısmı bugün de yaşar.'],['d','Geleneksel oyunların hepsi yasaklanmıştır.']],ans:['a','b','c'],why:'Geleneksel oyunlar kültürel aktarımın parçasıdır; bazı özellikleri değişerek sürebilir.'},
{type:'boss',title:'BÜYÜK FİNAL • Zaman Müzesi',q:'Müze için doğru sergi etiketini oluştur. Geçmişte çocuklar mahallede ahşap topaç çeviriyordu. Bugün bir grup çocuk parkta plastik topaç çeviriyor. İki ayrı kararı da doğru ver.',left:[['a','Topacın bugün de çevrilmesi'],['b','Topacın yapıldığı malzeme ve yer']],right:[['x','Süreklilik'],['y','Değişim']],ans:{a:'x',b:'y'},why:'Topaç oyununun sürmesi sürekliliktir. Ahşaptan plastiğe geçiş ve mahalleden parka taşınma değişim örnekleridir.'}
];
const fresh=()=>({currentIndex:0,score:0,wrongCount:0,skippedCount:0,start:Date.now(),ended:null,tasks:DATA.map(t=>({...t,opts:t.opts?shuffle(t.opts):null,right:t.right?shuffle(t.right):null,items:t.type==='sort'?shuffle(t.items):t.type==='drag'?shuffle(t.items):t.items})),results:DATA.map(()=>({status:'pending',attempts:0,firstTry:false,answer:'',lastWrong:'',feedback:'',success:false})),drafts:DATA.map((t,i)=>({selected:[],text:'',matches:{},left:null,order:t.type==='sort'?null:null,placements:{},dragPick:null})),reviewOpen:false});
let state=fresh();const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const task=()=>state.tasks[state.currentIndex],res=()=>state.results[state.currentIndex],draft=()=>state.drafts[state.currentIndex];const label=(t,id)=>[...(t.opts||[]),...(t.items||[]),...(t.left||[]),...(t.right||[])].find(x=>x[0]===id)?.[1]||id;const completed=()=>state.results.filter(x=>x.status!=='pending').length;const elapsed=()=>Math.floor(((state.ended||Date.now())-state.start)/1000);const duration=()=>`${Math.floor(elapsed()/60)} dk ${elapsed()%60} sn`;
function currentAnswer(t,d){if(t.type==='choice'||t.type==='detect')return d.selected[0]||null;if(t.type==='multi')return d.selected.length?d.selected:null;if(t.type==='fill')return d.text.trim()||null;if(t.type==='match'||t.type==='boss')return Object.keys(d.matches).length===t.left.length?d.matches:null;if(t.type==='sort')return d.order||t.items.map(x=>x[0]);if(t.type==='drag')return Object.keys(d.placements).length===t.items.length?d.placements:null;return null}
const norm=s=>String(s).toLocaleLowerCase('tr-TR').normalize('NFC').replace(/[.!?,]/g,'').trim().replace(/\s+/g,' ');
function correct(t,a){if(a===null)return false;if(['choice','detect'].includes(t.type))return a===t.ans;if(t.type==='fill')return t.ans.some(x=>norm(x)===norm(a));if(t.type==='multi')return a.length===t.ans.length&&t.ans.every(x=>a.includes(x));if(t.type==='sort')return JSON.stringify(a)===JSON.stringify(t.ans);if(['match','boss'].includes(t.type))return Object.keys(t.ans).every(k=>a[k]===t.ans[k]);if(t.type==='drag')return t.items.every(x=>a[x[0]]===x[2]);return false}
function stringify(t,a){if(!a)return 'Yanıt verilmedi';if(typeof a==='string')return ['fill'].includes(t.type)?a:label(t,a);if(Array.isArray(a))return a.map(x=>label(t,x)).join(' → ');return Object.entries(a).map(([k,v])=>label(t,k)+' → '+(t.type==='drag'?t.groups.find(x=>x[0]===v)?.[1]:label(t,v))).join('; ')}
function answerKey(t){if(['choice','detect'].includes(t.type))return label(t,t.ans);if(t.type==='fill')return t.ans[0];if(t.type==='multi'||t.type==='sort')return t.ans.map(id=>label(t,id)).join(t.type==='sort'?' → ':', ');return Object.entries(t.ans||Object.fromEntries(t.items.map(x=>[x[0],x[2]]))).map(([k,v])=>label(t,k)+' → '+(t.type==='drag'?t.groups.find(x=>x[0]===v)?.[1]:label(t,v))).join('; ')}
function resetAttempt(t,d){d.selected=[];d.matches={};d.left=null;d.placements={};d.dragPick=null;if(t.type==='sort')d.order=shuffle(t.items.map(x=>x[0]));}
function check(){const t=task(),r=res(),d=draft();if(r.status!=='pending')return;const a=currentAnswer(t,d);if(!a){r.feedback='Önce yanıtını tamamla. Her kart ve eşleştirme için bir seçim yap.';render();return}r.attempts++;const response=stringify(t,a);if(correct(t,a)){r.status='done';r.success=true;r.answer=response;r.firstTry=r.attempts===1;state.score+=r.firstTry?100:70;r.feedback='Harika! '+t.why;if(state.results.every(x=>x.status!=='pending'))state.ended=Date.now()}else{state.wrongCount++;r.lastWrong=response;r.feedback='Henüz değil. İpucu: '+t.why+' Aynı görevi yeniden dene.';resetAttempt(t,d)}render()}
function skip(){const r=res();if(r.status==='pending'){r.status='skipped';r.answer='Geçildi';r.feedback='Bu görev geçildi; puan veya yanlış eklenmedi.';state.skippedCount++;if(state.results.every(x=>x.status!=='pending'))state.ended=Date.now()}next()}
function next(){if(res().status==='pending')return;if(state.currentIndex<DATA.length-1)state.currentIndex++;else if(completed()===DATA.length)state.reviewOpen=true;render()}
function navigate(i){if(i>=0&&i<DATA.length){state.currentIndex=i;state.reviewOpen=false;render()}}
function taskMarkup(t,d,r){if(t.type==='choice'||t.type==='detect'||t.type==='multi')return `<div class="options">${t.opts.map(([id,txt])=>`<button class="opt ${d.selected.includes(id)?'selected':''}" data-choice="${esc(id)}" ${r.status!=='pending'?'disabled':''}>${t.type==='multi'?(d.selected.includes(id)?'☑':'☐'):'◉'} ${esc(txt)}</button>`).join('')}</div>${t.type==='multi'?'<p class="small">Birden fazla doğru yanıt bulunur. İşaretlediklerini kontrol et.</p>':''}`;
if(t.type==='fill')return `<label class="subheading" for="written">Yanıtım</label><div><input id="written" class="inputanswer" maxlength="45" autocomplete="off" placeholder="Yanıtını yaz" value="${esc(d.text)}" ${r.status!=='pending'?'disabled':''}></div>`;
if(t.type==='match'||t.type==='boss')return `<p class="small">Soldan bir kart, sonra sağdan karşılığını seç. Eşleştirdiğin kart tekrar seçilirse bağ kaldırılır.</p><div class="pairs"><div class="paircol"><div class="pairtitle">KANIT</div>${t.left.map(([id,txt])=>`<button class="pairrow ${d.left===id?'selected':''} ${d.matches[id]?'linked':''}" data-left="${id}" ${r.status!=='pending'?'disabled':''}>${esc(txt)} <span>${d.matches[id]?'✓':'+'}</span></button>`).join('')}</div><div class="paircol"><div class="pairtitle">KARŞILIĞI</div>${t.right.map(([id,txt])=>`<button class="pairrow" data-right="${id}" ${r.status!=='pending'?'disabled':''}>${esc(txt)}</button>`).join('')}</div></div><p class="small">${Object.keys(d.matches).length}/${t.left.length} eşleştirme yapıldı.</p>`;
if(t.type==='sort'){const order=d.order||t.items.map(x=>x[0]);return `<div class="sortlist">${order.map((id,i)=>`<div class="order"><span><b>${i+1}.</b> ${esc(label(t,id))}</span><span class="moves"><button aria-label="Yukarı taşı" class="mini" data-move="${i}:-1" ${i===0||r.status!=='pending'?'disabled':''}>↑</button><button aria-label="Aşağı taşı" class="mini" data-move="${i}:1" ${i===order.length-1||r.status!=='pending'?'disabled':''}>↓</button></span></div>`).join('')}</div>`}
if(t.type==='drag'){const remaining=t.items.filter(x=>!d.placements[x[0]]);return `<p class="small">Bir karta dokun, sonra doğru kutuya dokun. İstersen sürükle-bırak da kullanabilirsin.</p><div class="tokens">${remaining.map(([id,txt])=>`<button draggable="true" data-token="${id}" class="tile ${d.dragPick===id?'selected':''}" ${r.status!=='pending'?'disabled':''}>${esc(txt)}</button>`).join('')}</div><div class="dropgrid" style="margin-top:12px">${t.groups.map(([gid,name])=>`<div class="dropzone" data-zone="${gid}" role="button" tabindex="0"><strong>📦 ${esc(name)}</strong>${Object.keys(d.placements).filter(k=>d.placements[k]===gid).map(k=>`<button class="placed" data-unplace="${k}" title="Kartı geri al">${esc(label(t,k))} ×</button>`).join('')}</div>`).join('')}</div>`}
return ''}
function render(){const app=$('#app');const t=task(),r=res(),d=draft(),done=completed(),index=state.currentIndex;const sections=['🏡','🪀','🎮','🏆'],names=['Eski Mahalle','Oyun Atölyesi','Bugünün Dünyası','Zaman Müzesi'];let markup=`<header class="mast"><div class="eyebrow">SOSYAL BİLGİLER • SB.4.2.3</div><h1>🕵️ Oyun Zamanı Dedektifleri</h1><p>Geçmiş ve bugünün oyunlarını karşılaştır, dört bölgenin anı sandıklarını aç!</p><div class="hud"><span class="chip">⭐ ${state.score} puan</span><span class="chip">🧩 ${done}/18 görev</span><span class="chip">🔁 ${state.wrongCount} yanlış deneme</span><span class="chip">⏭ ${state.skippedCount} geçilen</span><span class="chip">⏱ ${duration()}</span></div></header><div class="map">${names.map((n,i)=>{const start=[0,5,10,15][i],count=[5,5,5,3][i],complete=state.results.slice(start,start+count).every(x=>x.status!=='pending'),unlocked=i===0||state.results.slice(0,start).every(x=>x.status!=='pending');return `<div class="island ${complete?'complete':unlocked?'active':'locked'}"><div class="symbol">${unlocked?sections[i]:'🔒'}</div><strong>${n}</strong><small>${complete?'Sandık açıldı ✓':unlocked?'Keşfediliyor':'Kilitli'}</small></div>`}).join('')}</div>`;
if(state.reviewOpen){markup+=report();app.innerHTML=markup;return}
markup+=`<main class="board"><div class="progress" aria-label="Oyun ilerlemesi"><div style="width:${done/18*100}%"></div></div><div class="topline"><span class="tag">GÖREV ${index+1}/18 · ${esc(t.title)}</span><span class="mission">${index===17?'👑 FİNAL':index<5?'BÖLÜM 1':index<10?'BÖLÜM 2':index<15?'BÖLÜM 3':'BÖLÜM 4'}</span></div><div class="prompt">${esc(t.q)}</div>${taskMarkup(t,d,r)}${r.feedback?`<div role="status" class="feedback ${r.status==='done'?'good':r.status==='skipped'?'':'bad'}">${esc(r.feedback)}</div>`:''}${r.status==='done'?'<div class="reveal">🔓 Sandığa bir oyun anısı eklendi! '+(r.firstTry?'İlk denemede doğru: +100':'Düzeltip başardın: +70')+'</div>':''}<div class="actions">${r.status==='pending'?'<button class="btn primary" id="check">✓ Yanıtı Kontrol Et</button>':''}<button class="btn secondary" id="prev" ${index===0?'disabled':''}>← Önceki</button><button class="btn secondary" id="next" ${r.status==='pending'?'disabled':''}>${index===17?'Raporu Gör 🏁':'Sonraki →'}</button><button class="btn warning" id="skip" ${r.status!=='pending'?'disabled':''}>Soruyu Geç ⏭</button></div><div class="footer">Yanlış yanıtta görev açık kalır; ipucuyla yeniden deneyebilirsin. Geçilen görev puan kazandırmaz.</div></main>`;app.innerHTML=markup;}
function report(){const good=state.results.filter(r=>r.firstTry).length;const solved=state.results.filter(r=>r.status==='done').length;const reviewed=state.results.map((r,i)=>({r,i})).filter(({r})=>r.attempts>1||r.status==='skipped');return `<main class="board"><h2>🏆 Zaman Müzesi Raporu</h2><p>Gözlem, karşılaştırma ve çıkarım görevlerinin tamamı değerlendirildi.</p><div class="stats"><div class="stat"><b>${DATA.length}</b>Toplam görev</div><div class="stat"><b>${good}</b>İlk denemede doğru</div><div class="stat"><b>${solved}</b>Çözülen</div><div class="stat"><b>${state.wrongCount}</b>Yanlış deneme</div><div class="stat"><b>${state.skippedCount}</b>Geçilen</div><div class="stat"><b>${state.score}</b>Puan</div></div><p><strong>⏱ Geçen süre:</strong> ${duration()}</p><h3>🔎 Yanlış/Geçilen Görevleri İncele (${reviewed.length})</h3>${reviewed.length?reviewed.map(({r,i})=>{const t=state.tasks[i];return `<details><summary>${i+1}. ${esc(t.title)} · ${r.status==='skipped'?'Geçildi':'Tekrar denendi'}</summary><div class="review"><b>Soru:</b> ${esc(t.q)}<br><b>Öğrencinin cevabı:</b> ${esc(r.status==='skipped'?'Yanıt verilmedi':r.lastWrong||r.answer)}<br><b>Doğru cevap:</b> ${esc(answerKey(t))}<br><b>Açıklama:</b> ${esc(t.why)}</div></details>`}).join(''):'<p>Harika! Hiç hata veya geçilen görev yok.</p>'}<div class="actions"><button class="btn primary" id="replay">↻ Yeniden Oyna</button><button class="btn secondary" id="backtasks">← Görevleri Gör</button></div><p class="footer">Kazanım: Geleneksel çocuk oyunlarını değişim ve süreklilik açısından günümüzdeki oyunlarla karşılaştırır.</p></main>`}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=task(),d=draft(),r=res();if(b.id==='check')return check();if(b.id==='prev')return navigate(state.currentIndex-1);if(b.id==='next')return next();if(b.id==='skip')return skip();if(b.id==='replay'){state=fresh();return render()}if(b.id==='backtasks'){state.reviewOpen=false;return render()}if(r.status!=='pending')return;if(b.dataset.choice){const id=b.dataset.choice;if(t.type==='multi')d.selected=d.selected.includes(id)?d.selected.filter(x=>x!==id):[...d.selected,id];else d.selected=[id];r.feedback='';render()}else if(b.dataset.left){const id=b.dataset.left;if(d.matches[id])delete d.matches[id];d.left=id;r.feedback='';render()}else if(b.dataset.right){if(!d.left)return;const id=b.dataset.right;Object.keys(d.matches).forEach(k=>{if(d.matches[k]===id)delete d.matches[k]});d.matches[d.left]=id;d.left=null;r.feedback='';render()}else if(b.dataset.move){const [i,delta]=b.dataset.move.split(':').map(Number);if(!d.order)d.order=t.items.map(x=>x[0]);[d.order[i],d.order[i+delta]]=[d.order[i+delta],d.order[i]];r.feedback='';render()}else if(b.dataset.token){d.dragPick=b.dataset.token;render()}else if(b.dataset.unplace){delete d.placements[b.dataset.unplace];r.feedback='';render()}});
$('#app').addEventListener('input',e=>{if(e.target.id==='written'){draft().text=e.target.value;res().feedback=''}});
function put(zone,id){const d=draft();if(res().status!=='pending'||!id)return;d.placements[id]=zone;d.dragPick=null;res().feedback='';render()}
$('#app').addEventListener('click',e=>{const zone=e.target.closest('[data-zone]');if(zone&&!e.target.closest('[data-unplace]'))put(zone.dataset.zone,draft().dragPick)});
$('#app').addEventListener('keydown',e=>{const zone=e.target.closest('[data-zone]');if(zone&&(e.key==='Enter'||e.key===' ')){e.preventDefault();put(zone.dataset.zone,draft().dragPick)}if(e.key==='Enter'&&e.target.id==='written')check()});
$('#app').addEventListener('dragstart',e=>{const x=e.target.closest('[data-token]');if(x&&e.dataTransfer)e.dataTransfer.setData('text/plain',x.dataset.token)});
$('#app').addEventListener('dragover',e=>{if(e.target.closest('[data-zone]'))e.preventDefault()});
$('#app').addEventListener('drop',e=>{const z=e.target.closest('[data-zone]');if(z){e.preventDefault();put(z.dataset.zone,e.dataTransfer?.getData('text/plain'))}});
render();
</script></body></html>
