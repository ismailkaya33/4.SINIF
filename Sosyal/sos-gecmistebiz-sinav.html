<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ünite Değerlendirme: Geçmişte Biz</title>
<style>
:root{--bg1:#fff1d6;--bg2:#e2efff;--kart:#fffdf8;--yazi:#2a2118;--cizgi:#e6d5b8;--ana:#b5562b;--ana-koyu:#8a3f1d;--ana-acik:#fde6d6;--gri:#6b5e50}
@media (prefers-color-scheme:dark){:root{--bg1:#1d1812;--bg2:#141c27;--kart:#231d17;--yazi:#f3ece2;--cizgi:#4a3d2e;--ana:#e0844c;--ana-koyu:#f3b386;--ana-acik:#3d2a1d;--gri:#c7b8a5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--yazi);font:19px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;background-image:radial-gradient(circle at 1px 1px,rgba(140,90,40,.22) 1px,transparent 0);background-size:22px 22px}
#app{position:relative;max-width:860px;margin:0 auto;padding:16px}
.kart{background:var(--kart);border:2px solid var(--cizgi);border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 18px rgba(90,60,20,.12)}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 6px;color:var(--ana-koyu)}
.soru{font-size:1.28rem;font-weight:650;margin:16px 0;line-height:1.5;white-space:pre-line}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.sec{grid-template-columns:1fr}}
button{font:inherit;min-height:56px;border-radius:16px;border:2px solid var(--cizgi);background:var(--kart);color:var(--yazi);cursor:pointer;padding:8px 14px;text-align:left}
.sec button{display:flex;gap:10px;align-items:center;border-width:3px;box-shadow:0 3px 0 var(--cizgi)}
.sec button .h{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ana-acik);color:var(--ana-koyu);font-weight:800}
.sec button.secili{background:var(--ana);border-color:var(--ana-koyu);color:#fff;box-shadow:0 3px 0 var(--ana-koyu)}
.sec button.secili .h{background:#fff;color:#8a3f1d}
button:focus-visible{outline:3px solid var(--ana);outline-offset:3px}
button.dolu{background:var(--ana);border-color:var(--ana-koyu);color:#fff;text-align:center;font-weight:700;box-shadow:0 4px 0 var(--ana-koyu)}
button.ikincil{text-align:center}
button:disabled{opacity:.45;cursor:default}
.ust{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem;color:var(--gri);padding-right:52px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;color:#fff;font-weight:700}
.ilerle{height:14px;border-radius:8px;background:var(--cizgi);overflow:hidden;margin:10px 0 4px}
.ilerle i{display:block;height:100%;background:linear-gradient(90deg,#f2c14e,var(--ana));border-radius:8px}
.gezgin{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gezgin button{min-height:44px;min-width:44px;padding:0;text-align:center;font-size:.95rem;border-width:3px;font-weight:700}
.gezgin button.cevapli{background:var(--ana-acik)}
.gezgin button.simdi{outline:3px solid var(--yazi);outline-offset:1px}
.alt{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.alt button{min-width:130px}
.uyari{background:var(--ana-acik);border-radius:14px;padding:12px;margin:12px 0}
.bolumler{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.bolumler div{border-radius:16px;padding:10px 12px;color:#fff;font-weight:700;line-height:1.3}
.bolumler span{display:block;font-size:1.8rem}
.sahne svg{display:block;width:100%;max-height:190px}
.tiktak{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
.tiktak svg{width:54px;flex:none}
.tiktak.buyuk svg{width:90px}
.balon{background:var(--ana-acik);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:.98rem}
#sesbtn{position:fixed;top:12px;right:12px;z-index:5;min-height:46px;width:46px;border-radius:50%;padding:0;text-align:center;font-size:1.3rem;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.rozet{display:flex;justify-content:center;margin:6px 0}
.rozet svg{width:150px}
/* ---- soru görselleri (her temada açık "kâğıt" zemin) ---- */
.gv{margin:0;background:#fffaf0;color:#2a2118;border:2px dashed #d9b98a;border-radius:18px;padding:14px}
.gv figcaption{font-weight:800;color:#8a3f1d;margin-bottom:10px;font-size:1.05rem}
.gv svg{display:block;width:100%;height:auto}
.g-paneller{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.g-panel{flex:1 1 200px;background:#fff;border:2px solid #ecdcc0;border-radius:14px;padding:10px;text-align:center}
.g-etk{font-size:.85rem;font-weight:700;color:#6b5e50;background:#fdf0dc;border-radius:999px;display:inline-block;padding:2px 10px}
.g-e{font-size:2.6rem;line-height:1.25;margin:6px 0}
.g-balon{background:#e9f3ff;border:2px solid #9cc3f0;border-radius:14px;padding:6px 10px;font-size:.95rem;margin-top:4px}
.g-kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.g-kart{background:#fff;border:2px solid #ecdcc0;border-radius:14px;padding:10px;text-align:center}
.g-kart b{display:block}
.g-kart small{display:block;color:#5b4f42;font-size:.9rem;line-height:1.35;margin-top:4px}
.g-tablo{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:12px;overflow:hidden;border:2px solid #ecdcc0;font-size:1rem}
.g-tablo th{background:#b5562b;color:#fff;padding:8px 10px;text-align:left}
.g-tablo td{padding:8px 10px;border-top:1px solid #f0e4cf}
.g-tablo tr:nth-child(even) td{background:#fff7ea}
.g-tablo .o{text-align:center;font-size:1.25rem}
.g-serit{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:.9rem;color:#6b5e50}
.g-serit i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#d9b98a,#b5562b)}
.g-akis{display:flex;align-items:stretch;gap:6px;justify-content:center}
.g-adim{flex:1 1 0;max-width:200px;background:#fff;border:2px solid #ecdcc0;border-radius:14px;padding:8px;text-align:center;font-size:.98rem;line-height:1.3}
.g-adim .no{display:inline-block;width:26px;height:26px;border-radius:50%;background:#f2c14e;font-weight:800;font-size:.85rem;line-height:26px}
.g-adim .g-e{font-size:2.2rem;margin:4px 0}
.g-ok{align-self:center;font-size:1.6rem;color:#b5562b;font-weight:800}
@media (max-width:560px){.g-akis{flex-direction:column;align-items:center}.g-adim{max-width:none;width:100%}.g-ok{transform:rotate(90deg)}}
.g-agac{display:flex;flex-direction:column;align-items:center}
.g-kusak{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.g-uye{background:#fff;border:2px solid #9ccf9c;border-radius:14px;padding:6px 12px;text-align:center;min-width:100px;line-height:1.3}
.g-uye .g-e{font-size:2rem;margin:0}
.g-uye .yil{font-weight:800;color:#2f7d32}
.g-uye .yil.bos{color:#b3261e;font-size:1.2rem}
.g-bag{width:4px;height:20px;background:#9ccf9c}
.g-kimlik{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid #ecdcc0;border-radius:14px;padding:12px;flex-wrap:wrap}
.g-sil{width:84px;height:84px;border-radius:50%;background:#e9e2d6;display:grid;place-items:center;flex:none;font-size:2.6rem;font-weight:800;color:#8a7a66}
.g-kimlik dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;flex:1 1 240px}
.g-kimlik dt{font-weight:700;color:#6b5e50}
.g-kimlik dd{margin:0}
.g-harita{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:center}
.g-merkez{grid-column:1/-1;justify-self:center;background:#b5562b;color:#fff;border-radius:999px;padding:8px 22px;font-weight:800}
.g-dal{background:#fff;border:2px solid #ecdcc0;border-radius:12px;padding:6px;text-align:center;font-weight:700;font-size:.95rem}
.g-dal span{display:block;font-size:1.8rem}
.g-zaman{display:flex;position:relative}
.g-zaman::before{content:"";position:absolute;left:4%;right:4%;top:58px;height:6px;background:linear-gradient(90deg,#d9b98a,#b5562b);border-radius:3px}
.g-nokta{position:relative;flex:1;text-align:center;padding:0 4px;font-size:.95rem;line-height:1.3}
.g-nokta .g-e{font-size:2rem;height:44px;margin:0}
.g-nokta .d{width:20px;height:20px;border-radius:50%;background:#b5562b;border:4px solid #fff;margin:4px auto 6px;box-shadow:0 0 0 2px #b5562b}
.g-nokta b{display:block;color:#8a3f1d}
.g-venn-dar{display:none}
@media (max-width:560px){.gv svg[aria-label^="İki küme"]{display:none}.g-venn-dar{display:grid;gap:8px}
 .g-venn-dar div{border-radius:14px;padding:8px 12px;font-weight:800}.g-venn-dar small{display:block;font-weight:400;font-size:1rem}
 .g-venn-dar .orta{background:#fff;border:3px dashed #b5562b;color:#b5562b;text-align:center}}
.konfeti{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:9;pointer-events:none;animation:dus 1s ease-in forwards}
@keyframes dus{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:no-preference){.ilerle i{transition:width .3s}.sec button{transition:background .15s,transform .1s}.sec button:active{transform:translateY(2px)}}
@media (prefers-reduced-motion:reduce){.konfeti{display:none}}
</style>

<button id="sesbtn" class="ikincil" aria-label="Sesi kapat" title="Ses">🔊</button>
<div id="app"></div>
<script>
/* RaporMotoru v2 — 4/D portalına bağlı (her etkinliğin içine gömülür; tek dosya, çevrimdışı).
 *
 * Akış:
 *   RaporMotoru.init({oyunId, oyunAdi, kazanimlar:[{kod, ad}]})   oyun başında (ve "yeniden oyna"da)
 *   RaporMotoru.kaydet({...})                                       her maddeden sonra
 *   RaporMotoru.ekranCiz(el)                                        oyun sonunda: öğrenciye "Kazanım Karnem"
 *
 * Portal bağlantısı (öğrenci kodla giriş yaptıysa etkinlik portalın içinde açılır):
 *   - Her madde: {type:'4d:item-result'} mesajı (madde bazlı kazanım/yanılgı verisi)
 *   - Oyun sonu: {type:'4d:activity-finished'} mesajı, oyun başına BİR kez (mevcut sonuç kaydı)
 *   Sayfa portal dışında (kodsuz) açıldıysa mesajlar gitmez; karne yine gösterilir.
 *   Mesajı yalnızca portal kayıt listesinde (portal/etkinlik-kayitlari.json) olan etkinlikler için
 *   sunucu kaydeder; oyunId bu listedeki "id" ile aynı olmalı.
 *
 * Seviye eşikleri öğretmen panelindekiyle AYNI olmalı (ESIK, seviye).
 */
const RaporMotoru = (() => {
  const SURUM = 2;
  const ESIK = { ustalik: 0.85, gelisiyor: 0.6, ipucuUst: 0.25, minMadde: 3 };
  let meta = null, kayit = [], t0 = Date.now(), denemeKimligi = '', bitisGonderildi = false;

  function yeniKimlik() {
    let r = '';
    try { const a = new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b => { r += b.toString(16).padStart(2, '0'); }); }
    catch (e) { r = Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    return 'rm_' + r;
  }
  function portalaGonder(mesaj) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(mesaj, '*'); } catch (e) { /* portal yok */ }
  }

  /** m = {oyunId, oyunAdi, kazanimlar:[{kod, ad}]}  (kod = MEB kazanım kodu, ör. "M.4.1.2.3") */
  function init(m) {
    meta = { oyunId: String(m.oyunId), oyunAdi: String(m.oyunAdi), kazanimlar: m.kazanimlar.map(k => ({ kod: String(k.kod), ad: String(k.ad) })) };
    kayit = []; t0 = Date.now(); denemeKimligi = yeniKimlik(); bitisGonderildi = false;
  }

  /** r = {kazanim:kod, madde:id, yanilgi:'etiket'|'', ilkDenemeDogru:bool, deneme:n, ipucu:0-3,
   *       cozumGoruldu:bool, sureMs:n, tekrar:bool}   tekrar=true → seviye hesabına katılmaz */
  function kaydet(r) {
    const i = meta ? meta.kazanimlar.findIndex(k => k.kod === r.kazanim) : -1;
    if (i < 0) { console.warn('RaporMotoru: bilinmeyen kazanım', r.kazanim); return false; }
    const x = {
      k: i, m: String(r.madde || '').slice(0, 40), y: String(r.yanilgi || '').slice(0, 40),
      i: r.ilkDenemeDogru ? 1 : 0, d: Math.max(1, r.deneme | 0), h: Math.max(0, Math.min(3, r.ipucu | 0)),
      c: r.cozumGoruldu ? 1 : 0, s: Math.max(0, Math.round((r.sureMs || 0) / 1000)), r: r.tekrar ? 1 : 0
    };
    kayit.push(x);
    portalaGonder({ type: '4d:item-result', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      kazanim: meta.kazanimlar[i].kod, madde: x.m, yanilgi: x.y, ilkDogru: x.i, deneme: x.d, ipucu: x.h,
      cozum: x.c, sureSn: x.s, tekrar: x.r });
    return true;
  }

  function seviye(a) {            // a: ilk kez sorulan madde kayıtları
    const n = a.length;
    if (n < ESIK.minMadde) return 'veri-az';
    const p = a.filter(x => x.i).length / n, h = a.filter(x => x.h > 0).length / n;
    if (p >= ESIK.ustalik && h <= ESIK.ipucuUst) return 'ustalasti';
    if (p >= ESIK.gelisiyor) return 'gelisiyor';
    return 'destek';
  }

  function ozet() {
    return meta.kazanimlar.map((k, idx) => {
      const hepsi = kayit.filter(x => x.k === idx), a = hepsi.filter(x => !x.r);
      const yan = {};
      hepsi.forEach(x => { if (x.y) yan[x.y] = (yan[x.y] || 0) + 1; });
      return {
        kod: k.kod, ad: k.ad, n: a.length, dogru: a.filter(x => x.i).length,
        p: a.length ? a.filter(x => x.i).length / a.length : null,
        ipucuOran: a.length ? a.filter(x => x.h > 0).length / a.length : 0,
        seviye: seviye(a), yanilgilar: yan
      };
    });
  }

  /** Oyun sonu: portaldaki mevcut sonuç kaydı için tek mesaj (çift gönderim yok). */
  function bitir() {
    if (!meta || bitisGonderildi) return;
    const a = kayit.filter(x => !x.r);
    if (!a.length) return;
    bitisGonderildi = true;
    const toplam = a.length, ilk = a.filter(x => x.i).length, cozulen = a.filter(x => !x.c).length;
    portalaGonder({ type: '4d:activity-finished', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      correct: cozulen, wrong: toplam - cozulen, total: toplam,
      wrongAttempts: a.reduce((t, x) => t + (x.d - 1), 0), firstTry: Math.min(ilk, cozulen),
      durationSeconds: Math.min(86400, Math.round((Date.now() - t0) / 1000)) });
  }

  const ETIKET = {
    ustalasti: ['Harika! Bu konuyu iyi biliyorsun.', '#1b7f4b'],
    gelisiyor: ['Gelişiyorsun. Biraz daha tekrar iyi gelir.', '#b26a00'],
    destek: ['Bu konuyu birlikte tekrar edelim.', '#b3261e'],
    'veri-az': ['Bu konuda daha fazla soru çözmen gerek.', '#5b6470']
  };

  /** Öğrenciye olumlu dilli "Kazanım Karnem" ekranı; sonucu portala da gönderir. */
  function ekranCiz(el) {
    bitir();
    if (!document.getElementById('rm-css')) {
      const st = document.createElement('style'); st.id = 'rm-css';
      st.textContent = '.rm{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;max-width:720px;margin:0 auto;padding:16px;color:inherit}' +
        '.rm h2{margin:0 0 4px;font-size:1.5rem}.rm p{margin:4px 0 12px;opacity:.85}' +
        '.rm-k{border:1px solid #c9d1dc;border-radius:14px;padding:12px 14px;margin:10px 0}' +
        '.rm-k b{display:block;font-size:1.05rem}.rm-bar{height:14px;background:#e8ebf0;border-radius:8px;overflow:hidden;margin:8px 0}' +
        '.rm-bar i{display:block;height:100%;border-radius:8px}.rm-m{font-size:.95rem;font-weight:700}.rm-d{font-size:.9rem;opacity:.8}';
      document.head.appendChild(st);
    }
    const o = ozet();
    const guclu = o.filter(x => x.seviye === 'ustalasti').length, tekrar = o.filter(x => x.seviye === 'destek' || x.seviye === 'gelisiyor').length;
    let h = '<div class="rm"><h2>Kazanım Karnem</h2><p>' + esc(meta.oyunAdi) + '</p><p>' + guclu + ' konuda güçlüsün' +
      (tekrar ? ', ' + tekrar + ' konuyu tekrar edeceksin.' : '.') + '</p>';
    o.forEach(x => {
      const e = ETIKET[x.seviye], yuzde = x.p === null ? 0 : Math.round(x.p * 100);
      h += '<div class="rm-k"><b>' + esc(x.ad) + '</b><div class="rm-bar" role="img" aria-label="ilk denemede doğru: %' + yuzde + '"><i style="width:' + yuzde + '%;background:' + e[1] + '"></i></div>' +
        '<span class="rm-m" style="color:' + e[1] + '">' + e[0] + '</span> <span class="rm-d">(' + x.dogru + '/' + x.n + ' ilk denemede doğru)</span></div>';
    });
    h += '<p class="rm-d">' + (window.parent !== window ? 'Sonucun öğretmenine gönderildi.' : 'Sonucunun öğretmenine gitmesi için etkinliği öğrenci portalından aç.') + '</p></div>';
    el.innerHTML = h;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

  return { init, kaydet, ozet, bitir, ekranCiz, seviye, ESIK, SURUM };
})();

</script>
<script>
'use strict';
/* ===== VERİ (öğretmen yalnızca burayı düzenler) =====
 * Her maddede "gorsel" soru kartının üstünde çizilir. Türler:
 *   paneller {paneller:[{etiket, e, balon}]}            resimli sahne / konuşma balonu
 *   kartlar  {kartlar:[{e, ad, alt}]}                     simgeli kartlar
 *   tablo    {basliklar:[...], satirlar:[[...]], serit}  tablo (serit: true → altta "geçmiş → bugün" şeridi)
 *   akis     {adimlar:[{e, ad}]}                          oklu akış şeması
 *   agac     {kusaklar:[[{e, ad, yil}]]}                  aile ağacı (yil "?" → kırmızı)
 *   venn     {sol:{ad, satir:[]}, sag:{ad, satir:[]}}     iki küme şeması, ortası "?"
 *   yol      {bas, son, not}                              kroki (yol haritası)
 *   kimlik   {satirlar:[[simge, etiket, değer]]}         kahraman kimlik kartı (adı "?")
 *   harita   {merkez, dallar:[{e, ad}]}                   kavram haritası (6 dal)
 *   zaman    {noktalar:[{e, yil, ad}]}                    zaman şeridi
 */
const OYUN = {
 "id": "sos-gecmistebiz-sinav",
 "ad": "Ünite Değerlendirme: Geçmişte Biz",
 "tema": {
  "baslik": "Zaman Sandığı",
  "hikaye": "Büyükannenin eski sandığı açıldı! İçinden mektuplar, fotoğraflar, oyuncaklar ve madalyalar çıktı. Her eşya bir soru saklıyor. Görsellere dikkatle bak, soruları cevapla.",
  "karakter": "Tiktak"
 },
 "kazanimlar": [
  { "kod": "SB.4.2.1", "ad": "Sözlü, yazılı, görsel kaynaklar ve nesnelerden yararlanarak aile tarihi çalışması yapar.", "kisa": "Aile Tarihi", "e": "🌳", "renk": "#2f7d32" },
  { "kod": "SB.4.2.2", "ad": "Ailesi ve çevresindeki millî kültürü yansıtan ögeleri araştırarak örnekler verir.", "kisa": "Millî Kültür", "e": "🎭", "renk": "#7b3fa0" },
  { "kod": "SB.4.2.3", "ad": "Geleneksel çocuk oyunlarını değişim ve süreklilik açısından günümüzdeki oyunlarla karşılaştırır.", "kisa": "Çocuk Oyunları", "e": "🪀", "renk": "#c96a00" },

const app = document.getElementById('app');
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const depo = (() => { const mem = {}; return {
  oku(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; } catch (e) { return mem[k] ?? null; } },
  yaz(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* depolama kapalı */ } },
  sil(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { /* depolama kapalı */ } } }; })();

/* ---- ses (Web Audio; köşedeki düğmeyle kapanır) ---- */
const SES = (() => {
  let ctx = null, acik = depo.oku('4d-ses') !== '0';
  function ton(f, d, gecik) {
    if (!acik) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const t = ctx.currentTime + (gecik || 0), o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + d);
    } catch (e) { /* ses yok */ }
  }
  return {
    tik() { ton(660, 0.09); },
    sayfa() { ton(520, 0.06); },
    kutla() { [523, 659, 784, 1047].forEach((f, i) => ton(f, 0.25, i * 0.12)); },
    acik: () => acik,
    degis() { acik = !acik; depo.yaz('4d-ses', acik ? '1' : '0'); return acik; }
  };
})();
const sesBtn = document.getElementById('sesbtn');
function sesDugme() { sesBtn.textContent = SES.acik() ? '🔊' : '🔇'; sesBtn.setAttribute('aria-label', SES.acik() ? 'Sesi kapat' : 'Sesi aç'); }
sesBtn.onclick = () => { SES.degis(); sesDugme(); };
sesDugme();

function tiktakSVG(hal) {   /* hal: mutlu | dusun */
  const agiz = hal === 'mutlu' ? '<path d="M42 38 Q50 47 58 38" fill="none" stroke="#3a2a1a" stroke-width="3" stroke-linecap="round"/>'
                               : '<path d="M44 41 Q50 39 56 41" fill="none" stroke="#3a2a1a" stroke-width="3" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 100 124" aria-hidden="true">' +
    '<rect x="14" y="4" width="72" height="11" rx="5" fill="#8a5a2b"/><rect x="14" y="109" width="72" height="11" rx="5" fill="#8a5a2b"/>' +
    '<path d="M24 15 H76 Q76 46 52 62 Q76 78 76 109 H24 Q24 78 48 62 Q24 46 24 15Z" fill="#eef7ff" stroke="#8a5a2b" stroke-width="4"/>' +
    '<path d="M50 72 Q66 86 68 104 H32 Q34 86 50 72Z" fill="#f2c14e"/><rect x="48.5" y="56" width="3" height="18" fill="#f2c14e"/>' +
    '<circle cx="42" cy="29" r="4" fill="#3a2a1a"/><circle cx="58" cy="29" r="4" fill="#3a2a1a"/><circle cx="43.5" cy="27.5" r="1.3" fill="#fff"/><circle cx="59.5" cy="27.5" r="1.3" fill="#fff"/>' +
    '<circle cx="35" cy="38" r="4" fill="#f6a5a5" opacity=".7"/><circle cx="65" cy="38" r="4" fill="#f6a5a5" opacity=".7"/>' + agiz + '</svg>';
}
function rozetSVG() {
  return '<svg viewBox="0 0 160 170" role="img" aria-label="Zaman Yolcusu rozeti">' +
    '<path d="M50 96 L36 160 L60 148 L72 166 L80 110Z" fill="#b3261e"/><path d="M110 96 L124 160 L100 148 L88 166 L80 110Z" fill="#2b6cb0"/>' +
    '<circle cx="80" cy="72" r="62" fill="#f2c14e" stroke="#b5862b" stroke-width="6"/><circle cx="80" cy="72" r="48" fill="#ffe08a" stroke="#fff" stroke-width="3" stroke-dasharray="6 5"/>' +
    '<text x="80" y="70" text-anchor="middle" font-size="38">⏳</text>' +
    '<text x="80" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#8a3f1d">ZAMAN YOLCUSU</text></svg>';
}

const CIZ = {
  paneller: g => '<div class="g-paneller">' + g.paneller.map(p => '<div class="g-panel"><span class="g-etk">' + esc(p.etiket) + '</span><div class="g-e" aria-hidden="true">' + esc(p.e) + '</div>' +
    (p.balon ? '<div class="g-balon">💬 ' + esc(p.balon) + '</div>' : '') + '</div>').join('') + '</div>',
  kartlar: g => '<div class="g-kartlar">' + g.kartlar.map(k => '<div class="g-kart"><div class="g-e" aria-hidden="true">' + esc(k.e) + '</div><b>' + esc(k.ad) + '</b>' +
    (k.alt ? '<small>' + esc(k.alt) + '</small>' : '') + '</div>').join('') + '</div>',
  tablo: g => '<table class="g-tablo"><thead><tr>' + g.basliklar.map(b => '<th scope="col">' + esc(b) + '</th>').join('') + '</tr></thead><tbody>' +
    g.satirlar.map(s => '<tr>' + s.map((h, i) => '<td' + (i && /^[✅❌]$/.test(h) ? ' class="o"' : '') + '>' + esc(h) + '</td>').join('') + '</tr>').join('') + '</tbody></table>' +
    (g.serit ? '<div class="g-serit" aria-hidden="true"><span>⏪ Geçmiş</span><i></i><span>Bugün ⏩</span></div>' : ''),
  akis: g => '<div class="g-akis">' + g.adimlar.map((a, i) => '<div class="g-adim"><span class="no">' + (i + 1) + '</span><div class="g-e" aria-hidden="true">' + esc(a.e) + '</div>' + esc(a.ad) + '</div>')
    .join('<div class="g-ok" aria-hidden="true">➜</div>') + '</div>',
  agac: g => '<div class="g-agac">' + g.kusaklar.map(k => '<div class="g-kusak">' + k.map(u => '<div class="g-uye"><div class="g-e" aria-hidden="true">' + esc(u.e) + '</div>' + esc(u.ad) +
    '<div class="yil' + (u.yil === '?' ? ' bos' : '') + '">' + (u.yil === '?' ? '❓' : esc(u.yil)) + '</div></div>').join('') + '</div>').join('<div class="g-bag" aria-hidden="true"></div>') + '</div>',
  venn: g => {
    const sat = (a, x) => a.map((l, i) => '<text x="' + x + '" y="' + (112 + i * 24) + '" text-anchor="middle" font-size="16" fill="#2a2118"' + (i % 2 ? '' : ' font-weight="700"') + '>' + esc(l) + '</text>').join('');
    return '<svg viewBox="0 0 560 290" role="img" aria-label="İki küme şeması: ' + esc(g.sol.ad) + ' ve ' + esc(g.sag.ad) + ', ortası soru işareti">' +
      '<circle cx="205" cy="148" r="128" fill="#f2c14e" fill-opacity=".35" stroke="#b5862b" stroke-width="3"/>' +
      '<circle cx="355" cy="148" r="128" fill="#6aa9e9" fill-opacity=".3" stroke="#2b6cb0" stroke-width="3"/>' +
      '<text x="150" y="72" text-anchor="middle" font-size="19" font-weight="800" fill="#8a5a1a">' + esc(g.sol.ad) + '</text>' +
      '<text x="410" y="72" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4f86">' + esc(g.sag.ad) + '</text>' +
      sat(g.sol.satir, 145) + sat(g.sag.satir, 415) +
      '<circle cx="280" cy="150" r="28" fill="#fff" stroke="#b5562b" stroke-width="4"/><text x="280" y="162" text-anchor="middle" font-size="32" font-weight="800" fill="#b5562b">?</text>' +
      '<text x="280" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#5b4f42">İkisinde</text><text x="280" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#5b4f42">de var</text></svg>' +
      /* dar ekran (telefon) için aynı şemanın okunaklı üç kutulu hâli */
      '<div class="g-venn-dar" aria-hidden="true"><div style="background:#fbe7b5">' + esc(g.sol.ad) + '<small>' + esc(g.sol.satir.join(' ')) + '</small></div>' +
      '<div class="orta">❓ İkisinde de var</div><div style="background:#d3e5f8">' + esc(g.sag.ad) + '<small>' + esc(g.sag.satir.join(' ')) + '</small></div></div>';
  },
  yol: g => '<svg viewBox="0 0 560 210" role="img" aria-label="' + esc(g.bas) + ' ile ' + esc(g.son) + ' arasındaki karlı yol krokisi">' +
    '<rect width="560" height="210" rx="14" fill="#eef6ff"/>' +
    '<path d="M0 196 Q140 170 280 186 T560 172 V210 H0Z" fill="#fff"/>' +
    ['30,40', '120,28', '210,52', '330,30', '420,44', '520,120', '150,150', '380,160'].map(p => { const [x, y] = p.split(','); return '<text x="' + x + '" y="' + y + '" font-size="20">❄️</text>'; }).join('') +
    '<path d="M70 150 C 170 60, 320 190, 480 82" fill="none" stroke="#8a5a2b" stroke-width="6" stroke-dasharray="14 9" stroke-linecap="round"/>' +
    '<circle cx="70" cy="150" r="13" fill="#2b6cb0" stroke="#fff" stroke-width="3"/><circle cx="480" cy="82" r="13" fill="#b5562b" stroke="#fff" stroke-width="3"/>' +
    '<text x="72" y="186" text-anchor="middle" font-size="18" font-weight="800" fill="#1f3550">' + esc(g.bas) + '</text>' +
    '<text x="470" y="58" text-anchor="middle" font-size="18" font-weight="800" fill="#6b2a10">' + esc(g.son) + '</text>' +
    '<text x="232" y="128" font-size="38">🐂</text><text x="272" y="128" font-size="30">📦</text>' +
    '<text x="280" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#3a2a1a">' + esc(g.not) + '</text></svg>',
  kimlik: g => '<div class="g-kimlik"><div class="g-sil" aria-label="Adı gizli">?</div><dl>' +
    g.satirlar.map(s => '<dt>' + esc(s[0]) + ' ' + esc(s[1]) + '</dt><dd>' + esc(s[2]) + '</dd>').join('') + '<dt>👤 Adı</dt><dd><b>?</b></dd></dl></div>',
  harita: g => { const d = x => '<div class="g-dal"><span aria-hidden="true">' + esc(x.e) + '</span>' + esc(x.ad) + '</div>';
    return '<div class="g-harita">' + g.dallar.slice(0, 3).map(d).join('') + '<div class="g-merkez">' + esc(g.merkez) + '</div>' + g.dallar.slice(3).map(d).join('') + '</div>'; },
  zaman: g => '<div class="g-zaman">' + g.noktalar.map(n => '<div class="g-nokta"><div class="g-e" aria-hidden="true">' + esc(n.e) + '</div><div class="d"></div><b>' + esc(n.yil) + '</b>' + esc(n.ad) + '</div>').join('') + '</div>'
};
function gorselHtml(g) {
  if (!g || !CIZ[g.tur]) return '';
  return '<figure class="gv">' + (g.baslik ? '<figcaption>🔎 ' + esc(g.baslik) + '</figcaption>' : '') + CIZ[g.tur](g) + '</figure>';
}
function kazBul(kod) { return OYUN.kazanimlar.find(k => k.kod === kod); }
function tiktakHtml(hal, metin, buyuk) {
  return '<div class="tiktak' + (buyuk ? ' buyuk' : '') + '">' + tiktakSVG(hal) + '<div class="balon" id="balon" aria-live="polite"><b>' + esc(OYUN.tema.karakter) + ':</b> ' + esc(metin) + '</div></div>';
}
function konfeti() {
  if (hareketAz) return;
  const renk = ['#f2c14e', '#b5562b', '#2f7d32', '#7b3fa0', '#2b6cb0', '#c96a00'];
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('div'); p.className = 'konfeti';
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = renk[i % renk.length];
    p.style.animationDelay = (Math.random() * 0.25) + 's'; p.style.animationDuration = (0.7 + Math.random() * 0.3) + 's';
    document.body.appendChild(p); setTimeout(() => p.remove(), 1400);
  }
}

let S = null;   /* {sira:[madde...], sec:{id:[[metin,yanilgi]...]}, cevap:{id:secilenMetin}, sure:{id:ms}, i:0, t:Date.now()} */

function yeniSinav() {
  const sira = OYUN.maddeler.slice();   /* soru sırası sabit: kolaydan zora, bölüm bölüm */
  const sec = {};
  sira.forEach(m => { sec[m.id] = shuffle([[m.dogru, '']].concat(m.yanlislar)); });
  S = { sira, sec, cevap: {}, sure: {}, i: 0, t: Date.now() };
}
function kaydetDevam() {
  if (!S) return;
  depo.yaz(DEVAM, JSON.stringify({ sec: S.sec, cevap: S.cevap, sure: S.sure, i: S.i }));
}
function devamYukle() {
  try {
    const v = JSON.parse(depo.oku(DEVAM) || 'null');
    if (!v || !v.sec) return false;
    const ok = OYUN.maddeler.every(m => {   /* kayıtlı seçenekler bugünkü sorularla aynı mı? */
      const s = v.sec[m.id], izin = [m.dogru].concat(m.yanlislar.map(y => y[0]));
      return Array.isArray(s) && s.length === 4 && s.every(x => Array.isArray(x) && izin.includes(x[0]));
    });
    if (!ok) return false;
    S = { sira: OYUN.maddeler.slice(), sec: v.sec, cevap: v.cevap || {}, sure: v.sure || {}, i: Math.min(+v.i || 0, OYUN.maddeler.length - 1), t: Date.now() };
    return true;
  } catch (e) { return false; }
}
function sureTopla() {   /* şu anki sorada geçen süreyi biriktir */
  const m = S.sira[S.i]; if (!m) return;
  S.sure[m.id] = (S.sure[m.id] || 0) + (Date.now() - S.t); S.t = Date.now();
}

function bolumlerHtml() {
  return '<div class="bolumler">' + OYUN.kazanimlar.map(k => {
    const n = OYUN.maddeler.filter(m => m.kaz === k.kod).length;
    return '<div style="background:' + k.renk + '"><span aria-hidden="true">' + k.e + '</span>' + esc(k.kisa) + '<br><small>' + n + ' soru</small></div>';
  }).join('') + '</div>';
}

function baslangic() {
  const var_ = (() => { try { const v = JSON.parse(depo.oku(DEVAM) || 'null'); return v && Object.keys(v.cevap || {}).length; } catch (e) { return 0; } })();
  app.innerHTML = '<div class="kart"><div class="sahne">' + sandikSVG() + '</div><h1>' + esc(OYUN.ad) + '</h1>' +
    tiktakHtml('mutlu', OYUN.tema.hikaye, true) + bolumlerHtml() +
    '<p>' + OYUN.maddeler.length + ' soru var. İstediğin soruya dönebilir, cevabını değiştirebilirsin. Acele etme; süre sınırı yok. Sonucunu öğretmenin görecek.</p>' +
    (var_ ? '<div class="uyari">Yarım kalan bir sınavın var (' + var_ + ' soru cevaplı).</div><div class="alt"><button class="dolu" id="devam">Kaldığım yerden devam et</button><button class="ikincil" id="yeni">Baştan başla</button></div>'
          : '<div class="alt"><span></span><button class="dolu" id="basla">Sandığı aç, başla! 🗝️</button></div>') + '</div>';
  const git_ = () => { RaporMotoru.init({ oyunId: OYUN.id, oyunAdi: OYUN.ad, kazanimlar: OYUN.kazanimlar }); SES.sayfa(); soruCiz(); };
  if (var_) {
    document.getElementById('devam').onclick = () => { if (devamYukle()) git_(); else { yeniSinav(); git_(); } };
    document.getElementById('yeni').onclick = () => { depo.sil(DEVAM); yeniSinav(); git_(); };
  } else document.getElementById('basla').onclick = () => { yeniSinav(); git_(); };
}

function gezginHtml() {
  return '<div class="gezgin" role="group" aria-label="Soru listesi">' + S.sira.map((m, k) =>
    '<button data-k="' + k + '" style="border-color:' + kazBul(m.kaz).renk + '" class="' + (S.cevap[m.id] !== undefined ? 'cevapli ' : '') + (k === S.i ? 'simdi' : '') + '" aria-label="Soru ' + (k + 1) + (S.cevap[m.id] !== undefined ? ', cevaplandı' : ', boş') + '"' + (k === S.i ? ' aria-current="true"' : '') + '>' + (k + 1) + '</button>').join('') + '</div>';
}
function ilerlemeYuzde() { return Math.round(Object.keys(S.cevap).length / S.sira.length * 100); }

function soruCiz() {
  const m = S.sira[S.i], sec = S.sec[m.id], son = S.i === S.sira.length - 1, kz = kazBul(m.kaz), n = Object.keys(S.cevap).length;
  S.t = Date.now();
  app.innerHTML = '<div class="ust"><span class="chip" style="background:' + kz.renk + '"><span aria-hidden="true">' + kz.e + '</span>' + esc(kz.kisa) + '</span>' +
    '<span><b>Soru ' + (S.i + 1) + ' / ' + S.sira.length + '</b> · <span id="sayac">' + n + ' soru cevaplı</span></span></div>' +
    '<div class="ilerle" role="progressbar" aria-label="Cevaplanan sorular" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + ilerlemeYuzde() + '"><i id="bar" style="width:' + ilerlemeYuzde() + '%"></i></div>' +
    '<div class="kart">' + gorselHtml(m.gorsel) + '<div class="soru" id="soru">' + esc(m.soru) + '</div>' +
    '<div class="sec" role="radiogroup" aria-labelledby="soru">' + sec.map((s, k) =>
      '<button role="radio" aria-checked="' + (S.cevap[m.id] === s[0]) + '" data-k="' + k + '" class="' + (S.cevap[m.id] === s[0] ? 'secili' : '') + '"><span class="h">' + String.fromCharCode(65 + k) + '</span><span>' + esc(s[0]) + '</span></button>').join('') + '</div>' +
    '<div class="alt"><button class="ikincil" id="onceki"' + (S.i === 0 ? ' disabled' : '') + '>← Önceki</button>' +
    (son ? '<button class="dolu" id="bitir">Sınavı bitir 🏁</button>' : '<button class="dolu" id="sonraki">Sonraki →</button>') + '</div>' +
    tiktakHtml(S.cevap[m.id] !== undefined ? 'mutlu' : 'dusun', S.cevap[m.id] !== undefined ? 'Bu soruyu cevapladın. İstersen değiştirebilirsin.' : 'Önce görseli incele, sonra soruyu dikkatle oku.') + '</div>' + gezginHtml();
  app.querySelectorAll('.sec button').forEach(b => { b.onclick = () => isaretle(+b.dataset.k); });
  app.querySelectorAll('.gezgin button').forEach(b => { b.onclick = () => git(+b.dataset.k); });
  const o = document.getElementById('onceki'); if (o) o.onclick = () => git(S.i - 1);
  const s = document.getElementById('sonraki'); if (s) s.onclick = () => git(S.i + 1);
  const bt = document.getElementById('bitir'); if (bt) bt.onclick = bitisOnayi;
}
function git(k) { if (k < 0 || k >= S.sira.length) return; sureTopla(); S.i = k; kaydetDevam(); SES.sayfa(); soruCiz(); window.scrollTo(0, 0); }
function isaretle(k) {
  const m = S.sira[S.i]; S.cevap[m.id] = S.sec[m.id][k][0]; kaydetDevam(); SES.tik();
  app.querySelectorAll('.sec button').forEach((b, j) => { const a = j === k; b.classList.toggle('secili', a); b.setAttribute('aria-checked', a); });
  const g = app.querySelectorAll('.gezgin button')[S.i]; if (g) { g.classList.add('cevapli'); g.setAttribute('aria-label', 'Soru ' + (S.i + 1) + ', cevaplandı'); }
  const say = document.getElementById('sayac'); if (say) say.textContent = Object.keys(S.cevap).length + ' soru cevaplı';
  const bar = document.getElementById('bar'); if (bar) { bar.style.width = ilerlemeYuzde() + '%'; bar.parentNode.setAttribute('aria-valuenow', ilerlemeYuzde()); }
  const t = app.querySelector('.tiktak'); if (t) t.outerHTML = tiktakHtml('mutlu', 'Cevabın kaydedildi. Hazırsan sonraki soruya geç.');
}

function bitisOnayi() {
  sureTopla();
  const bos = S.sira.filter(m => S.cevap[m.id] === undefined);
  app.innerHTML = '<div class="kart"><h1>Sınavı bitirelim mi?</h1>' +
    (bos.length ? '<div class="uyari">⚠️ ' + bos.length + ' soruyu boş bıraktın: ' + S.sira.map((m, k) => S.cevap[m.id] === undefined ? (k + 1) : null).filter(Boolean).join(', ') + '.</div>'
                : '<p>✅ Bütün soruları cevapladın.</p>') +
    '<p>Bitirdikten sonra cevaplarını değiştiremezsin.</p>' +
    tiktakHtml('dusun', bos.length ? 'Boş soruların var. İstersen dönüp bakabilirsin.' : 'Emin misin? Cevaplarını bir kez daha gözden geçirebilirsin.') +
    '<div class="alt"><button class="ikincil" id="don">Sorulara dön</button><button class="dolu" id="evet">Evet, bitir</button></div></div>';
  document.getElementById('don').onclick = () => { S.i = bos.length ? S.sira.indexOf(bos[0]) : S.i; soruCiz(); };
  document.getElementById('evet').onclick = bitir;
}

function bitir() {
  /* Her soru sonuç olarak gönderilir. Doğru: ilk denemede doğru. Yanlış/boş: ilkDenemeDogru=false, deneme=2, cozumGoruldu=true
     (rapor motorunda "çözemedi" anlamında kullanılır; öğrenciye hiçbir çözüm gösterilmez). */
  S.sira.forEach(m => {
    const c = S.cevap[m.id], dogru = c === m.dogru;
    const yan = c === undefined ? 'bos' : (dogru ? '' : ((m.yanlislar.find(y => y[0] === c) || [0, ''])[1] || 'yanlis'));
    RaporMotoru.kaydet({ kazanim: m.kaz, madde: m.id, yanilgi: yan, ilkDenemeDogru: dogru, deneme: dogru ? 1 : 2, ipucu: 0,
      cozumGoruldu: !dogru, sureMs: S.sure[m.id] || 0 });
  });
  RaporMotoru.bitir();
  depo.sil(DEVAM);
  const portalda = window.parent !== window;
  app.innerHTML = '<div class="kart"><h1>Sınavı tamamladın! 🎉</h1><div class="rozet">' + rozetSVG() + '</div>' +
    tiktakHtml('mutlu', 'Zaman sandığının bütün sırlarını inceledin. Aferin, sonuna kadar emek verdin!', true) +
    '<p>' + (portalda ? '📨 Cevapların öğretmenine gönderildi. Teşekkürler!' : 'Cevapların öğretmenine gitmesi için sınavı öğrenci portalından aç.') + '</p>' +
    '<div class="alt"><span></span><button class="ikincil" id="yeniden">Sınavı yeniden çöz</button></div></div>';
  document.getElementById('yeniden').onclick = () => { S = null; baslangic(); };
  SES.kutla(); konfeti(); window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (!S || !document.querySelector('.sec')) return;
  if (e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  if (e.key >= '1' && e.key <= '4') isaretle(+e.key - 1);
  else if (e.key.toLowerCase() >= 'a' && e.key.toLowerCase() <= 'd' && e.key.length === 1) isaretle(e.key.toLowerCase().charCodeAt(0) - 97);
  else if (e.key === 'ArrowRight') git(S.i + 1);
  else if (e.key === 'ArrowLeft') git(S.i - 1);
});
baslangic();
</script>
</body>
</html>
