<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4. Sınıf Matematik: Toplama, Çıkarma ve Tahmin 2</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#1b2a3a;--mut:#5a6b7d;--line:#d3dce6;--ac:#1f5fbf;--acx:#fff;--ok:#16794a;--okb:#e1f4ea;--no:#b32d2d;--nob:#fbe6e6;--hl:#e8f0fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a24;--card:#1b2634;--ink:#e8eef5;--mut:#9fb0c2;--line:#33445a;--ac:#6ea4f5;--acx:#0d1b30;--ok:#59d08f;--okb:#17382a;--no:#ff8d8d;--nob:#3d2020;--hl:#22344d}}
:root[data-theme="dark"]{--bg:#121a24;--card:#1b2634;--ink:#e8eef5;--mut:#9fb0c2;--line:#33445a;--ac:#6ea4f5;--acx:#0d1b30;--ok:#59d08f;--okb:#17382a;--no:#ff8d8d;--nob:#3d2020;--hl:#22344d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:clamp(16px,1.5vw+9px,21px)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.15em;margin:4px 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;white-space:nowrap}
.tab small{display:block;font-size:.72em;color:var(--mut)}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}.tab.on small{color:var(--acx)}
.bar{font-weight:700;margin:12px 0 6px}
.dots{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dot{min-width:46px;height:40px;border-radius:8px;border:2px solid var(--line);background:var(--card)}
.dot.cur{border-color:var(--ac)}.dot.ok{background:var(--okb);border-color:var(--ok)}.dot.no{background:var(--nob);border-color:var(--no)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.no0{font-weight:700;color:var(--ac);margin-bottom:4px}
.card p{margin:.4em 0}.qq{font-weight:700}
.fg{background:#fff;border-radius:8px;padding:8px;margin:10px 0;text-align:center;color:#111}
.fg img{max-width:100%;height:auto;vertical-align:middle}
.fl{display:flex;gap:14px;align-items:center;text-align:left;flex-wrap:wrap}.fl img.m{max-width:150px}
.ic{height:1.3em;vertical-align:-.3em}.sc{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;margin:0 auto}th,td{border:1px solid var(--line);padding:5px 12px;text-align:center}th{background:var(--hl)}
.fg table{color:#111}.fg th{background:#e4eef9}.fg td,.fg th{border-color:#b8c6d6}
.cards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.cards b{width:2em;height:2.4em;display:grid;place-items:center;border-radius:6px;background:#7fcdbf;color:#111}.cards b:nth-child(3n+2){background:#f5974a}.cards b:nth-child(3n){background:#78c46b}
.ap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}.ap div{font-size:.85em}.ap svg{height:84px;display:block;margin:0 auto 2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);min-height:52px}
.opt:hover{border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}.opt.lk{cursor:default}
.cd{display:grid;grid-template-columns:1fr 1fr;gap:4px;position:relative;padding:12px 8px;border:2px solid #2a8a3e;border-radius:50%;background:#79c66c;width:150px;height:130px;color:#111;font-size:.8em;text-align:center}
.cd i{font-style:normal;background:#fff;border:1px solid #333;padding:1px 2px;align-self:center}
.cd em{font-style:normal;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#29a3e0;color:#fff;border-radius:50%/60%;padding:3px 9px;font-weight:700}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:600}.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--nob);color:var(--no)}
.sol{font-weight:400;color:var(--ink);margin-top:4px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.btn{padding:10px 18px;border-radius:10px;border:2px solid var(--ac);background:var(--card);color:var(--ac);font-weight:700}
.btn.p{background:var(--ac);color:var(--acx)}.btn[disabled]{opacity:.4;cursor:default}
.big{font-size:2.4em;font-weight:800;margin:6px 0}.res li{margin:4px 0}
.wr{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pr{margin:0 auto;display:inline-block;text-align:left;font:1.15em/1.4 ui-monospace,Menlo,Consolas,monospace}
.pl,.ci{display:inline-block;border-radius:14px;padding:3px 14px;font-weight:700;margin:3px}.ci{border-radius:50%;min-width:3.2em;padding:10px 6px;border:1px solid #333}
.bb{display:inline-block;border:2px solid #f0a040;border-radius:12px;padding:6px 12px;margin:4px;vertical-align:top;max-width:14em}
.tree{display:grid;gap:6px;justify-items:center}.tree div{display:flex;gap:40px}.bx{display:inline-block;border:2px solid #5aa05a;background:#c9ecb5;padding:2px 18px;border-radius:4px}
</style>
</head>

  <div class="nav"><button class="btn" onclick="ans.fill(null,${k*5},${k*5+5});go(${k*5})">Bölümü tekrar çöz</button>${k<5?`<button class="btn p" onclick="go(${k*5+5})">${k+2}. bölüme geç</button>`:`<button class="btn p" onclick="fin()">Genel sonuç</button>`}</div>`;
 }else{
  const tot=SEC.reduce((s,_,i)=>s+sc(i),0),w=ans.map((v,i)=>v!==null&&v!==Q[i].a?i:-1).filter(i=>i>=0),n=ans.filter(v=>v!==null).length;
  A.innerHTML=`<article class="card"><div class="bar">Genel sonuç</div><div class="big">${tot} / 30</div><p>${n} soru cevaplandı.</p><ul class="res">${SEC.map((s,i)=>`<li>${i+1}. bölüm, ${s}: <b>${sc(i)} / 5</b></li>`).join('')}</ul>
  ${w.length?`<p>Yanlış yapılan sorular:</p><div class="wr">${w.map(i=>`<button class="dot no" onclick="go(${i})">${i+1}</button>`).join('')}</div>`:''}</article>
  <div class="nav">${w.length?`<button class="btn" onclick="retry()">Yanlışları tekrar dene</button>`:'<span></span>'}<button class="btn p" onclick="reset()">Baştan başla</button></div>`;
 }
}
draw();
</script>
</body>
</html>
