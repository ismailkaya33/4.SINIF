  function render(){const solved=state.results.filter(r=>r.status==='solved').length;if(state.finished){document.body.dataset.realm='treasure';root.innerHTML=`<header class="header"><div class="brand"><div class="brand-mark">🔐</div><div><div class="eyebrow">4. Sınıf • Matematik</div><h1>Gizemli Hazine Kasası</h1></div></div><div class="pill">⏱️ ${timeText()}</div></header>${renderReport()}<div class="footer">Çıkarma işleminde verilmeyen eksilen ve çıkanı bulma becerisi • Çevrimdışı çalışır</div>`;return;}

    root.innerHTML=`<header class="header"><div class="brand"><div class="brand-mark" aria-hidden="true">🗝️</div><div><div class="eyebrow">4. Sınıf • Matematik Macerası</div><h1>Gizemli Hazine Kasası</h1><div class="tag">Eksik sayıyı bul, kasayı aç, hazineyi keşfet.</div></div></div><div class="stat-strip"><div class="pill">🪙 <strong>${state.score}</strong> puan</div><div class="pill">🔓 <strong>${solved}/${state.tasks.length}</strong></div><div class="pill">⏱️ <strong id="time-ticker">${timeText()}</strong></div></div></header><div class="progress-section"><div class="progress-head"><span>HAZİNE YOLU • <b>${state.currentIndex+1}. kasa</b></span><span>${Math.round((solved+state.skippedCount)/state.tasks.length*100)}% tamamlandı</span></div><div class="progress-track"><div class="progress-fill" style="width:${(solved+state.skippedCount)/state.tasks.length*100}%"></div></div><div class="vault-map">${renderMap()}</div></div><main class="layout"><section class="mission"><div class="kicker"><span>✦ KASA ${String(state.currentIndex+1).padStart(2,'0')} / ${state.tasks.length} ${t.kind==='boss'?'👑':''}</span><span class="difficulty">${t.difficulty}</span></div><h2>${t.name}</h2><p class="story">${t.story}</p><div class="equation-card"><div class="eq-label">${t.kind==='boss'?d.bossPhase===0?'Birinci gizli kilit':'İkinci gizli kilit':t.kind==='fragments'?'Kayıp rakamları bul':t.kind==='min'?'Verilmeyen eksileni bul':'Verilmeyen çıkanı bul'}</div><div class="equation">${equation(t,shown)}</div>${scratchHelper(t)}<div class="place-instruction">${r.status==='pending'?`<span>🗝️ Sıradaki kutu:</span><b>${t.kind==='fragments'?holeLabel(t,enteredDigits(t).length):positionName(enteredDigits(t).length).toLocaleUpperCase('tr-TR')}</b><span>← sağdan sola</span>`:'✨ Şifre kutuları tamamlandı'}</div>${phaseDescription}</div><p class="hint-mini">🔢 Şifreyi birler basamağından (en sağdan) başlayarak oluştur. <span class="hint-rule">${t.kind==='fragments'?'Sütun sütun çıkarma · Gerekirse onluk boz':t.kind==='min'?'Eksilen = Çıkan + Fark':t.kind==='out'?'Çıkan = Eksilen − Fark':d.bossPhase===0?'Önce çıkanı hesapla.':'Şimdi eksileni hesapla.'}</span></p><div class="work-area"><div class="work-title">${r.status!=='pending'?'Kasa sonucu':t.mode==='fragments'?'Kayıp rakam şifreleri':t.mode==='drag'?'Rakam kartları':t.mode==='choice'?'Basamak kadranları':t.mode==='inverse'&&d.phase===0?'Doğru yöntemi seç':t.mode==='digits'?'Şifreyi birleştir':'Şifreyi çöz ve gir'}</div>${interactionUI(t)}${fb?`<div class="feedback ${fb.kind}" role="status" aria-live="polite">${fb.kind==='bad'?'⚠️ ':fb.kind==='good'?'✨ ':'💡 '}${fb.text}</div>`:''}</div><nav class="actions" aria-label="Oyun gezinmesi"><button class="secondary-btn" data-action="prev" ${state.currentIndex===0?'disabled':''}>← Önceki</button><button class="secondary-btn dangerless" data-action="skip" ${r.status!=='pending'?'disabled':''}>Soruyu Geç</button><button class="main-btn" data-action="next" ${r.status==='pending'?'disabled':''}>${state.currentIndex===state.tasks.length-1?'Rapor →':'Sonraki →'}</button></nav></section><aside class="vault-panel"><div class="vault-top"><div class="eyebrow">${t.icon} BÖLÜM ${String(state.currentIndex+1).padStart(2,'0')} • ${t.biome}</div><h3>${r.status==='solved'?'KASA AÇILDI ✨':r.status==='skipped'?'GEÇİLEN KASA':'BU BÖLGENİN KİLİDİ'}</h3><p>${r.status==='solved'?'Yeni bir hazine parçası keşfettin!':r.status==='skipped'?'Bu bölgede bir sır çözülmeden kaldı.':'Şifre doğruysa hazinenin izini bulacaksın.'}</p></div><div class="vault-stage">${sceneArt(t)}<div class="scene-sign" aria-hidden="true"><span>${t.icon}</span><span>${t.biome}</span></div><div class="world-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="safe ${r.status==='solved'?'is-open':''} ${fb?.kind==='bad'?'is-error':''}" role="img" aria-label="${r.status==='solved'?'Açılmış hazine kasası':fb?.kind==='bad'?'Yanlış şifrede sarsılan kasa':'Şifresini bekleyen kapalı kasa'}"><div class="safe-inner"><span>${t.loot}</span></div><div class="safe-face"><div class="safe-wheel"><span class="wheel-center"></span></div><div class="bolts"><span class="bolt"></span><span class="bolt"></span><span class="bolt"></span><span class="bolt"></span></div></div></div><div class="scene-floor" aria-hidden="true"></div></div><div class="vault-bottom"><strong>${r.status==='solved'?'🎁 '+t.reward+' bulundu!':r.status==='skipped'?'⏭️ Kasa geçildi':fb?.kind==='bad'?'🚨 Şifre uyuşmadı!':'🔐 '+t.name+' şifresini bekliyor'}</strong><small>${r.status==='solved'?t.mystery:r.status==='skipped'?'Hazine parçası kazanılmadı. Bir sonraki bölgeye geçebilirsin.':'🌠 SIR PERDESİ: '+t.mystery}</small></div><div class="quest-bar"><span>KEŞİF DEFTERİ</span><b>${solved} / ${state.tasks.length} eser</b></div><div class="reward-bits" aria-label="Açılan hazine sembolleri">${['🪙','💎','👑','🏆','🗝️'].map((b,i)=>`<span class="${solved>=((i+1)*3)?'on':''}">${b}</span>`).join('')}</div></aside></main><div class="footer">${state.tasks.length} bağımsız görev • Soru geçme yanlış sayılmaz • Puan her görev için yalnızca bir kez eklenir</div>`;
  }
  root.addEventListener('input',e=>{const box=e.target.closest('[data-scratch]');if(!box||result().status!=='pending')return;
    const cleaned=box.value.replace(/[^0-9]/g,'').slice(0,2);box.value=cleaned===''?'':String(Math.min(19,Number(cleaned)));
    draft().scratch[Number(box.dataset.scratch)]=box.value;
  });
  root.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-key],[data-op],[data-card],[data-tile],[data-go]');if(!el||el.disabled)return;const a=el.dataset;if(a.key!==undefined){pressDigit(a.key);return;}if(a.op){selectOperation(a.op);return;}if(a.tile){selectTile(a.tile);return;}if(a.card){if(Date.now()<state.suppressCardClickBefore)return;selectCard(a.card);return;}if(a.go!==undefined){go(Number(a.go));return;}switch(a.action){case 'check':checkInput();break;case 'prev':previous();break;case 'next':next();break;case 'skip':skip();break;case 'replay':replay();break;case 'reset-digits':draft().digits=[];state.feedback=null;render();break;case 'undo-tile':draft().digits.pop();state.feedback=null;render();break;case 'undo-choice':draft().input=draft().input.slice(0,-1);state.feedback=null;render();break;}});
  window.addEventListener('keydown',e=>{if(state.finished||e.ctrlKey||e.altKey||e.metaKey)return;const t=current(),d=draft();if(result().status!=='pending'||(!['keypad','repair','boss','fragments'].includes(t.mode)&&!(t.mode==='inverse'&&d.phase===1)))return;if(/^\d$/.test(e.key)){e.preventDefault();pressDigit(e.key);}else if(e.key==='Backspace'){e.preventDefault();pressDigit('back');}else if(e.key==='Escape'){e.preventDefault();pressDigit('clear');}else if(e.key==='Enter'){e.preventDefault();checkInput();}});
  // The native drag/drop and pointer-driven drag are both supported; tapping a card is a touch-friendly alternative.
  root.addEventListener('dragstart',e=>{const card=e.target.closest('[data-card]');if(!card||current().mode!=='drag')return;e.dataTransfer.setData('text/plain',card.dataset.card);e.dataTransfer.effectAllowed='move';});
  root.addEventListener('dragover',e=>{if(e.target.closest('#drop-zone')){e.preventDefault();$('drop-zone')?.classList.add('over');}});
  root.addEventListener('dragleave',e=>{if(e.target.closest('#drop-zone'))$('drop-zone')?.classList.remove('over');});
  root.addEventListener('drop',e=>{const zone=e.target.closest('#drop-zone');if(!zone)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');zone.classList.remove('over');selectCard(id);});
  root.addEventListener('pointerdown',e=>{const card=e.target.closest('.drag-card');if(!card||e.button!==0||result().status!=='pending')return;if(e.pointerType==='mouse')return;ghost={id:card.dataset.card,pointer:e.pointerId,startX:e.clientX,startY:e.clientY,el:null,moved:false};card.setPointerCapture?.(e.pointerId);});
  root.addEventListener('pointermove',e=>{if(!ghost||e.pointerId!==ghost.pointer)return;if(!ghost.moved&&Math.hypot(e.clientX-ghost.startX,e.clientY-ghost.startY)<7)return;ghost.moved=true;if(!ghost.el){ghost.el=document.createElement('div');ghost.el.className='drag-ghost';const t=current().tiles.find(x=>x.id===ghost.id);ghost.el.textContent=t?.digit??'';document.body.appendChild(ghost.el);}ghost.el.style.left=`${e.clientX}px`;ghost.el.style.top=`${e.clientY}px`;const z=$('drop-zone');if(z){const b=z.getBoundingClientRect();z.classList.toggle('over',e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom);}});
  function stopDrag(e){if(!ghost||ghost.pointer!==e.pointerId)return;const g=ghost;ghost=null;g.el?.remove();if(g.moved)state.suppressCardClickBefore=Date.now()+500;const zone=$('drop-zone');if(!zone)return;const b=zone.getBoundingClientRect();zone.classList.remove('over');if(g.moved&&e.type==='pointerup'&&e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom){selectCard(g.id);}}
  root.addEventListener('pointerup',stopDrag);root.addEventListener('pointercancel',stopDrag);
  setInterval(()=>{const ticker=$('time-ticker');if(ticker)ticker.textContent=timeText();},1000);
  // Development assertions: every question is exact, no-borrow items really have no borrowing.
  function requiresBorrow(a,b){let x=a,y=b;while(x>0||y>0){if(x%10<y%10)return true;x=Math.floor(x/10);y=Math.floor(y/10);}return false;}
  RAW.forEach((t,i)=>{if(t.a-t.b!==t.d)throw Error('Matematik doğrulama hatası, kasa '+(i+1));if((i<8||i===8)&&requiresBorrow(t.a,t.b))throw Error('İlk kasalarda beklenmeyen onluk bozma '+i);if(i>=9&&!requiresBorrow(t.a,t.b))throw Error('Son kasalarda onluk bozma eksik '+i);});
  if(7142-3277!==3865||5171-1894!==3277)throw Error('Final işlemi hatalı');
  render();
})();
