<div id="app">
 <header><div><h1>Çarpma Atölyesi — Alt Alta Çarpma</h1><div class="ustnot">4. sınıf · Düşün, yerleştir, keşfet.</div></div><button class="yardim" id="yardim" aria-label="Nasıl oynanır?">?</button></header>
 <nav class="sekmeler" role="tablist" aria-label="Atölye bölümleri">

  <button class="sekme" id="tab1" role="tab" aria-controls="bolum" aria-selected="false" tabindex="-1" data-tab="1">2 · Neden kayıyoruz?</button>
  <button class="sekme" id="tab2" role="tab" aria-controls="bolum" aria-selected="false" tabindex="-1" data-tab="2">3 · Alıştırma</button>
  <button class="sekme" id="tab3" role="tab" aria-controls="bolum" aria-selected="false" tabindex="-1" data-tab="3">4 · Hatayı bul</button>
 </nav>
 <div class="seviyeler" role="group" aria-label="Seviye seçimi"></div>
 <main id="bolum" role="tabpanel" aria-labelledby="tab0"></main>
 <div class="rakamlik" aria-label="Rakam araçları"><div class="rakam-aciklama" id="rakamNot">Bir kutu seç, rakama dokun. İstersen rakamı sürükle.</div><div class="rakam-ic" id="rakamlar"></div></div>
 <div id="balon" class="balon" role="status" aria-live="polite" aria-atomic="true"></div>

</div>
<dialog id="bilgiDialog" aria-labelledby="dialogBaslik"><h2 id="dialogBaslik"></h2><div id="dialogIcerik"></div><button class="dugme" id="dialogKapat">Anladım</button></dialog>
<script>
'use strict';
/* HESAP MOTORU: DOM'a, arayüz durumuna veya saklamaya erişmez.
   Seviye 0..3; uret(seviye, onceki, rng), coz(a,b) / coz({a,b}),
   hataliUret(islemVeyaSeviye, onceki, rng). rng testte verilebilir.
   Bütün sütun numaraları sağdan başlar: 0=birler, 1=onlar. */
const BASAMAK=['birler','onlar','yüzler','binler','on binler','yüz binler'];
function rakamlar(n){return String(n).split('').reverse().map(Number)}
function carpSatiri(a,d,unut=-1){
 const ds=rakamlar(a),adimlar=[];let elde=0,deger=0;
 ds.forEach((x,k)=>{const gelen=elde,eklenen=k===unut?0:gelen,ham=x*d,t=ham+eklenen;elde=Math.floor(t/10);deger+=(k===ds.length-1?t:t%10)*10**k;adimlar.push({k,x,d,ham,gelen,eklenen,t,yaz:t%10,elde,son:k===ds.length-1});});
 return {deger,adimlar};
}
function toplaSatirlari(p1,p2,unut=-1){
 const adimlar=[];let elde=0,sonuc=0,k=0;
 while(k<Math.max(String(p1).length,String(p2).length)||elde){const x=Math.floor(p1/10**k)%10,y=Math.floor(p2/10**k)%10,gelen=elde,t=x+y+(k===unut?0:gelen);elde=Math.floor(t/10);sonuc+=(t%10)*10**k;adimlar.push({k,x,y,gelen,t,yaz:t%10,elde});k++;}
 return {sonuc,adimlar};
}
function coz(a,b){
 if(typeof a==='object'){b=a.b;a=a.a}a=Number(a);b=Number(b);
 if(!Number.isInteger(a)||a<10||a>999||!Number.isInteger(b)||b<2||b>99)throw Error('İşlem sınırları: 10–999 ile 2–99.');
 const d=rakamlar(b),satirlar=d.map((x,i)=>({...carpSatiri(a,x),kayma:i})),p1=satirlar[0].deger,p2=satirlar[1]?satirlar[1].deger*10:0,toplama=toplaSatirlari(p1,p2);
 const tablo=d.map((x,i)=>{const carpan=x*10**i;return {carpan,hucreler:String(a).split('').map((v,j)=>({basamak:Number(v)*10**(String(a).length-1-j),carpan,deger:Number(v)*10**(String(a).length-1-j)*carpan})),toplam:satirlar[i].deger*10**i}});
 return {a,b,satirlar,p1,p2,sonuc:a*b,toplama,tablo,sutun:String(a*b).length,carpmaEldesi:satirlar.some(s=>s.adimlar.some(t=>t.elde>0)),toplamaEldesi:toplama.adimlar.some(t=>t.elde>0)};
}
function seviyeCoz(s){if(Array.isArray(s))return s;if(typeof s==='string'&&s.includes('x'))return s.split('x').map(Number);return [[2,1],[3,1],[2,2],[3,2]][Number(s)]||[2,1]}
function uret(seviye=0,onceki=null,rng=Math.random){
 const [n,m]=seviyeCoz(seviye),istek=m===2&&rng()<.7;let aday;
 for(let i=0;i<4000;i++){
  const a=10**(n-1)+Math.floor(rng()*9*10**(n-1)),b=m===1?2+Math.floor(rng()*8):(2+Math.floor(rng()*8))*10+2+Math.floor(rng()*8);aday={a,b};
  if(onceki&&a===onceki.a&&b===onceki.b)continue;
  const c=coz(aday),kullanilan=c.satirlar.some(s=>s.adimlar.some(t=>t.gelen>0));
  if(c.carpmaEldesi&&kullanilan&&(!istek||c.toplamaEldesi||i>2000))return aday;

 if(tab===1){const board=$('#tabloTahta');['r0','r1','t'].forEach((pre,i)=>{const show=i===0?durum.tabloDogru['b0-top']:i===1?durum.tabloDogru['b1-top']:Object.keys(durum.tabloDogru).length===2*(String(durum.c.a).length+1);if(!show)board.querySelectorAll(`[data-cell^="${pre}-"]`).forEach(e=>{e.textContent='';e.setAttribute('aria-label',e.getAttribute('aria-label').replace(/, \d+$/,', henüz bulunmadı'))})});if(durum.tabloDogru['b1-top'])board.querySelector('[data-cell^="r1-"]')?.parentElement.classList.add('dogru-satir')}

function rehber(){
 const s=mevcutAdim();if(!s){durum.tamam=true;secili=null;ciz();soyle('Harika! İşlemi adım adım tamamladın. ✓ Bir tane daha deneyebilirsin.');kutla();return}

function sil(){if(tab===1){if(secili){durum.taslak=durum.taslak.slice(0,-1);durum.tabloGiris[secili]=durum.taslak;delete durum.isaret[secili];ciz()}}else if(tab===2&&secili){delete durum.giris[secili];delete durum.isaret[secili];ciz();$(`[data-cell="${secili}"]`)?.focus({preventScroll:true})}else if(tab===0)soyle('Parlayan kutu sıradaki adımın. Baştan denemek için “Temizle”ye dokun.')}

 if(tab===0){durum.giris={};durum.adim=0;durum.tamam=false;rehber();return}
 if(tab===1){durum.tabloGiris={};durum.tabloDogru={};durum.tabloYanlis={};durum.isaret={};durum.taslak='';secili=null;ciz();soyle('Tablo temizlendi. Bir kutu seç.')}hazirRakam=null;
}
function satirDegeri(pre){let sayi=0;for(const [id,v] of Object.entries(durum.giris)){if(id.startsWith(pre+'-'))sayi+=v*10**Number(id.split('-')[1])}return sayi}
function kontrol(){
 if(tab!==2||durum.tamam)return;durum.kontrol++;const exp=beklenen(durum.c);let ok=true;
 for(const [id,v] of Object.entries(exp)){const dogru=durum.giris[id]===v;durum.isaret[id]=dogru?'dogru':'yanlis';if(!dogru)ok=false}
 if(ok){durum.tamam=true;if(!durum.sayildi&&!durum.gosterildi){basarili++;seri=durum.kontrol===1?seri+1:0;durum.sayildi=true}ciz();soyle('Hepsi doğru! ✓ Sağdan sola, adım adım başardın.');kutla();return}
 durum.yanlis++;seri=0;const c=durum.c,son=satirDegeri('t'),ilk=satirDegeri('r0'),ikinci=satirDegeri('r1');
 const unuttu=c.satirlar.some((s,r)=>s.adimlar.some(t=>t.gelen>0&&durum.giris[`r${r}-${t.k+r}`]!==undefined&&durum.giris[`r${r}-${t.k+r}`]===t.ham%10&&exp[`r${r}-${t.k+r}`]!==t.ham%10));
 let msg='✗ işaretli kutulara yeniden bak. ✓ işaretliler doğru. Yazdıkların silinmedi.';
 if(c.b>=10&&(durum.kaymaDenendi||son===c.p1+c.satirlar[1].deger||ikinci===c.satirlar[1].deger))msg='2. satırı bir basamak sola kaydırmayı unutma! '+msg;
 else if(unuttu||(ilk===c.p1&&c.b>=10&&c.p2-ikinci>=1&&c.p2-ikinci<=8))msg='Eldeyi eklemeyi unutmuş olabilir misin? '+msg;
 ciz();soyle(msg,true);
}
function cevap(){if(tab!==2||durum.yanlis<2||durum.tamam)return;durum.giris={...durum.giris,...beklenen(durum.c)};durum.gosterildi=true;durum.tamam=true;seri=0;durum.isaret={};ciz();soyle('Çözümü açtık. Her satırı sağdan sola incele. Bu işlem sayaca eklenmedi; yeni bir işlemde sen dene.')}
function tabloSec(id){if(durum.tabloDogru[id])return;secili=id;durum.taslak=String(durum.tabloGiris[id]??'');if(hazirRakam!==null){const d=hazirRakam;hazirRakam=null;yaz(d)}else ciz()}
function tabloTamam(){
 if(tab!==1||!secili)return;const [r,col]=secili.slice(1).split('-'),row=durum.c.tablo[Number(r)],top=col==='top',v=top?row.toplam:row.hucreler[Number(col)].deger;
 if(durum.taslak!==''&&Number(durum.taslak)===v){
  durum.tabloDogru[secili]=true;durum.tabloGiris[secili]=String(v);delete durum.isaret[secili];const ikinci=secili==='b1-top';secili=null;durum.taslak='';ciz();
  if(ikinci){soyle(`Bak! ${durum.c.a} × ${row.carpan} = ${v}. Alt alta çarparken ${durum.c.a} × ${row.carpan/10} yazar, satırı bir basamak sola kaydırırız. Kayınca birler basamağına bir 0 gelir; onu yazmayız, boş bırakırız. Sola kaymak, sonuna 0 koymakla aynı şeydir.`);requestAnimationFrame(()=>$('#balon').scrollIntoView({block:'nearest'}))}
  else if(Object.keys(durum.tabloDogru).length===2*(String(durum.c.a).length+1)){soyle(`${durum.c.p1} + ${durum.c.p2} = ${durum.c.sonuc}. İki yöntem aynı sonucu verdi! ✓`);kutla()}
  else soyle(`Doğru! ✓ ${top?'Bu sayı, alt alta işlemin '+(Number(r)+1)+'. satırı.':'Şimdi başka bir kutuyu bul.'}`);
 }else{
  const yanlis=durum.tabloYanlis[secili]=(durum.tabloYanlis[secili]||0)+1;
  durum.isaret[secili]='yanlis';ciz();
  if(top)soyle(`Bu satırdaki sayıları topla: ${row.hucreler.map(h=>h.deger).join(' + ')}${yanlis>=2?` = ${v}`:''}.`,true);
  else soyle(tabloIpucu(row.hucreler[Number(col)],yanlis>=2),true)
 }
}
function tabloIpucu(h,tam=true){
 const a=h.basamak,b=h.carpan;
 if(!tam){
  if(a>=10){const birim=a>=100?100:10,ad=birim===100?'yüzlük':'onluk';return `${a/birim} ${ad} × ${b} kaç ${ad} eder? Sonra ${birim===100?'yüzlüğü':'onluğu'} sayıya çevir.`}
  if(b>=10)return `${a} × ${b/10} kaç onluk eder? Sonra onluğu sayıya çevir.`;
  return `${a} × ${b} kaç eder?`;
 }
 if(a>=10){const birim=a>=100?100:10,ad=birim===100?'yüzlük':'onluk';return `${a/birim} ${ad} × ${b} = ${a/birim*b} ${ad} = ${h.deger}.`}
 if(b>=10)return `${a} × ${b/10} onluk = ${a*b/10} onluk = ${h.deger}.`;
 return `${a} × ${b} = ${h.deger}.`;
}
function ilkHataliKutu(){const h=durum.hata;for(let k=0;k<h.dogru.sutun;k++)if(Math.floor(h.p1/10**k)%10!==Math.floor(h.dogru.p1/10**k)%10)return k;return -1}
function hataKutuSec(k){
 if(tab!==3||durum.hata.b>=10||durum.bulundu)return;
 if(Number(k)===ilkHataliKutu()){durum.bulundu=true;ciz();soyle('Buldun! ✓ '+durum.hata.aciklama);kutla()}
 else soyle(Number(k)<ilkHataliKutu()?'Bu kutu doğru. İlk hata daha solda.':'Bu kutudan önce başka bir hata var. Sağdan başla, her kutuyu kendin hesapla; eldeyi unutma.',true);
}
function hataSec(r){if(tab!==3||durum.bulundu)return;if(Number(r)===durum.hata.hataSatiri){durum.bulundu=true;ciz();soyle('Buldun! ✓ '+durum.hata.aciklama);kutla()}else soyle(Number(r)<durum.hata.hataSatiri?'Bu satır doğru. Sonraki satırlara bak.':'Bundan önce başka bir hata var. İlk hatayı bul: 1. satırdan başla.',true)}
function eylem(a){({elde:()=>dialog('Elde ne işe yarar?',`<p>${ELDE}</p><p>Alıştırmada elde kutularını boş bırakabilirsin. Kontrol edilmez.</p>`),yeni:()=>{if(tab===2&&!durum.tamam){seri=0}baslat()},temizle,sil,kontrol,cevap,tamam:tabloTamam,kay:()=>{if(tab===0&&mevcutAdim()?.tur==='kay')ilerle()}}[a]||(()=>{}))()}
document.addEventListener('click',e=>{
 if(performance.now()<tikEngel)return;const el=e.target.closest('button,[data-error-row]');if(!el)return;
 if(el.dataset.tab!==undefined){tab=Number(el.dataset.tab);baslat(false);return}

$('#yardim').addEventListener('click',()=>dialog('Nasıl oynanır?','<ol><li>Bir bölüm ve seviye seç. Öğren bölümünde parlayan kutuyu izle.</li><li>Kutuya ve rakama dokun; istersen rakamı sürükle. Klavyeyi de kullanabilirsin.</li><li>Alt alta işlemde sağdan sola yaz. 2. satırda bir basamak sola kay. Elde kutuları küçük not yerleridir.</li></ol>'));
$('#dialogKapat').addEventListener('click',()=>$('#bilgiDialog').close());
document.addEventListener('keydown',e=>{
 if($('#bilgiDialog').open)return;
 if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();tab=e.key==='Home'?0:e.key==='End'?3:(tab+(e.key==='ArrowRight'?1:3))%4;baslat(false);$(`#tab${tab}`).focus();return}
 if(e.target.closest('[data-error-row]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();hataSec(e.target.closest('[data-error-row]').dataset.errorRow);return}
 if(/^[0-9]$/.test(e.key)){e.preventDefault();yaz(Number(e.key));return}
 if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();sil();return}
 if(tab===1&&e.key==='Enter'&&!e.target.closest('button')){e.preventDefault();tabloTamam();return}

 if(tab===1&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
  e.preventDefault();const boxes=$$('[data-table]'),w=String(durum.c.a).length+1,i=boxes.findIndex(b=>b.dataset.table===secili),delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-w,ArrowDown:w}[e.key];
  let j=i<0?boxes.findIndex(b=>!b.disabled):i+delta;
  while(j>=0&&j<boxes.length&&boxes[j].disabled)j+=delta;
  if(j>=0&&j<boxes.length&&(!['ArrowLeft','ArrowRight'].includes(e.key)||i<0||Math.floor(i/w)===Math.floor(j/w)))boxes[j].focus();return;
 }
 if((tab===0||tab===2)&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
  e.preventDefault();const cells=$$('[data-cell][data-open="1"]');if(!cells.length)return;let el=$(`[data-cell="${secili}"]`),next;
  if(!el)next=cells[cells.length-1];else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const k=Number(el.dataset.col)+(e.key==='ArrowLeft'?1:-1),pre=secili.split('-')[0];next=cells.find(x=>x.dataset.cell===`${pre}-${k}`)}else{const col=el.dataset.col,list=cells.filter(x=>x.dataset.col===col),idx=list.indexOf(el);next=list[idx+(e.key==='ArrowUp'?-1:1)]}
  if(next){secili=next.dataset.cell;hazirRakam=null;ciz();$(`[data-cell="${secili}"]`).focus({preventScroll:true})}
 }
});
document.addEventListener('focusin',e=>{

 if(tab===1&&e.target.dataset.table&&!e.target.disabled){secili=e.target.dataset.table;durum.taslak=String(durum.tabloGiris[secili]??'');$$('[data-table]').forEach(x=>x.classList.toggle('secili',x===e.target));$('.giris').textContent=durum.taslak||'—';$('[data-action="tamam"]').disabled=false}
});
/* Pointer Events: fare, dokunmatik ekran ve kalem aynı yolu kullanır. */
let tikEngel=0;
document.addEventListener('pointerdown',e=>{
 if(e.button!==0||tab===3||$('#bilgiDialog').open)return;const chip=e.target.closest('[data-digit]'),cell=e.target.closest('[data-cell][data-open="1"]');
 if(!chip&&!cell)return;if(chip?.disabled)return;const id=cell?.dataset.cell,v=chip?Number(chip.dataset.digit):durum.giris[id];if(v===undefined)return;

});
document.addEventListener('pointermove',e=>{
 if(!suruk||e.pointerId!==suruk.pid)return;if(!suruk.moved&&Math.hypot(e.clientX-suruk.x,e.clientY-suruk.y)>7){suruk.moved=true;hayalet=document.createElement('div');hayalet.className='suruklenen';hayalet.textContent=suruk.v;hayalet.setAttribute('aria-hidden','true');document.body.append(hayalet)}
 if(!suruk.moved)return;e.preventDefault();hayalet.style.left=e.clientX+'px';hayalet.style.top=e.clientY+'px';const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-cell],[data-table]');if(vurgulu!==hit){vurgulu?.classList.remove('birak');vurgulu=hit;vurgulu?.classList.add('birak')}
},{passive:false});
function surukBitir(e,iptal=false){
 if(!suruk||e.pointerId!==suruk.pid)return;const s=suruk;suruk=null;hayalet?.remove();hayalet=null;vurgulu?.classList.remove('birak');vurgulu=null;
 if(s.el.hasPointerCapture?.(e.pointerId))s.el.releasePointerCapture(e.pointerId);if(!s.moved||iptal)return;tikEngel=performance.now()+400;
 const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-cell],[data-table]');
 if(hit?.dataset.cell==='kilit'){sec('kilit');return}
 if(hit?.dataset.table&&tab===1){if(!durum.tabloDogru[hit.dataset.table]){tabloSec(hit.dataset.table);yaz(s.v)}return}
 if(hit?.dataset.open==='1'){
  const hedef=hit.dataset.cell;if(s.source===hedef)return;hazirRakam=null;yaz(s.v,hedef);
  if(tab===2&&s.source&&durum.giris[hedef]===s.v){delete durum.giris[s.source];delete durum.isaret[s.source];ciz()}
 }else if(!hit&&s.source&&tab===2){delete durum.giris[s.source];delete durum.isaret[s.source];secili=s.source;ciz();soyle('Rakamı kaldırdın. Yeni bir rakam yerleştirebilirsin.')}
}
document.addEventListener('pointerup',e=>surukBitir(e));document.addEventListener('pointercancel',e=>surukBitir(e,true));
const rakamBoyutu=new ResizeObserver(([entry])=>document.documentElement.style.setProperty('--rakam-yukseklik',`${entry.target.getBoundingClientRect().height}px`));
