<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çarpma Ustaları: Fabrika Görevi</title>
<style>
:root{--ana:#ff8c1a;--ikinci:#1aa6b7;--koyu:#26324d;--gok1:#ffdcae;--gok2:#fff7ec;--kart:#fff;--yazi:#1f2a44;--soluk:#5b6782;--ok:#1b8a4f;--hata:#c0392b;--sari:#ffd166}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--yazi);font:18px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 18px,transparent 18px 36px),linear-gradient(180deg,var(--gok1) 0%,var(--gok2) 75%) fixed;background-color:var(--gok2);overflow-x:hidden}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:12px 14px 110px}
.dekor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dekor svg{position:absolute;opacity:.16}
#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
h1,h2,.baslik{font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:800}
h1{font-size:clamp(1.55rem,4.6vw,2.3rem);margin:6px 0 4px;text-align:center;color:var(--koyu)}
h2{font-size:clamp(1.3rem,4vw,1.7rem);margin:6px 0;text-align:center;color:var(--koyu)}
.kart{background:var(--kart);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 8px 0 rgba(38,50,77,.12),0 14px 30px rgba(38,50,77,.12);border-top:8px solid var(--ana)}
button{font:inherit;cursor:pointer;color:var(--yazi)}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid #3a86ff;outline-offset:3px}
.buyuk{display:block;margin:14px auto 4px;background:var(--ana);color:#1f2a44;border:0;border-radius:18px;padding:14px 30px;min-height:60px;font-size:1.3rem;font-weight:800;box-shadow:0 6px 0 #a34c00}
.buyuk:active{transform:translateY(4px);box-shadow:0 2px 0 #a34c00}
/* Üst çubuk */
.ust{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ust .baslik{flex:1;min-width:0;font-size:1rem;background:#fffc;border-radius:999px;padding:6px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sag{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.puan{background:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
.puan.pop{animation:pop .4s}
.ses{background:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.ilerleme{position:relative;height:26px;margin:10px 0 0;border-radius:13px;background:repeating-linear-gradient(90deg,#3b4866 0 14px,#26324d 14px 28px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);overflow:hidden}
.ilerleme i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffb15c,var(--ana));border-radius:13px}
.ilerleme span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem;text-shadow:0 1px 2px #000}
/* Soru kartı */
.etiket{display:inline-block;background:#0e7480;color:#fff;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.9rem}
.etiket.tekrar{background:#6a4be0}
.yonerge{margin:10px 0 0;background:#fff4d6;border:2px dashed #f4a300;border-radius:14px;padding:6px 12px;font-weight:700;font-size:1rem}
.gorsel{display:flex;justify-content:center;margin:12px 0 4px}
.gorsel svg{max-width:100%;height:auto}
.soru{font-size:clamp(1.2rem,3.8vw,1.6rem);font-weight:800;margin:10px 0 14px;text-align:center}
.soru.uzun{font-size:clamp(1.1rem,3.2vw,1.35rem);text-align:left}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.sec{grid-template-columns:1fr}}
.sec button{position:relative;min-height:64px;border-radius:18px;border:3px solid var(--c);background:var(--z);font-size:1.25rem;font-weight:800;padding:8px 40px 8px 52px;text-align:left;box-shadow:0 5px 0 var(--c)}
.sec button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.sec button:nth-child(1){--c:#ff8a5c;--z:#fff0e9}.sec button:nth-child(2){--c:#1aa6b7;--z:#e2f6f8}
.sec button:nth-child(3){--c:#f4a300;--z:#fff6dc}.sec button:nth-child(4){--c:#7b5cff;--z:#efeaff}
.sec .no{position:absolute;left:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1rem}
.sec button.dogru,.ds.dogru,.hatayok.dogru{--c:var(--ok);--z:#e3f7ec;border-color:var(--ok)!important;background:#e3f7ec!important}
.sec button.dogru::after,.ds.dogru::after,.hatayok.dogru::after{content:"✔";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:1.5rem}
.sec button.yanlis,.ds.yanlis,.hatayok.yanlis{--c:#a7b0c0;--z:#f1f3f7;color:#7a8399;border-color:#c0392b!important;background:#fbeeee!important;opacity:.8}
.sec button.yanlis::after,.ds.yanlis::after,.hatayok.yanlis::after{content:"✖";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--hata);font-size:1.3rem}
.sec button.yanlis{text-decoration:line-through}
.alt{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:14px}
.ipucu-btn,.atla-btn{background:#fff8e1;border:3px solid #ffd166;border-radius:999px;padding:6px 18px;min-height:50px;font-weight:800;box-shadow:0 4px 0 #ffd166}
.atla-btn{background:#eef2fb;border-color:#b9c3d6;box-shadow:0 4px 0 #b9c3d6}
/* Alt alta işlem (hizalı SVG satırları) */
.dikey{display:flex;flex-direction:column;align-items:stretch;width:100%;max-width:380px;margin:0 auto;padding:8px 6px;border-radius:16px;
  background-color:#fbfdff;background-image:linear-gradient(#e2eaf6 1px,transparent 1px),linear-gradient(90deg,#e2eaf6 1px,transparent 1px);background-size:20px 20px;border:2px solid #d5deec}
.ds{position:relative;display:block;width:100%;padding:0 6px;margin:0;border:3px solid transparent;border-radius:12px;background:none;text-align:left}
.ds svg{display:block;width:100%;height:auto}
button.ds{border:3px dashed #9fb3d1;background:#ffffffb0;margin:3px 0;min-height:48px}
button.ds:hover:not(:disabled){border-color:var(--ana);background:#fff4e6}
.hatayok{position:relative;display:block;margin:12px auto 0;min-height:56px;padding:8px 46px;border-radius:18px;border:3px solid var(--ok);background:#effaf3;font-weight:800;font-size:1.2rem;box-shadow:0 5px 0 #9fd8b6}
/* Sayı girişi (tuş takımı) */
.giris{max-width:360px;margin:0 auto}
.ekran{min-height:64px;border-radius:16px;background:#26324d;color:#7cf5ff;font:800 2rem/64px ui-monospace,Consolas,monospace;text-align:center;letter-spacing:2px;box-shadow:inset 0 4px 0 rgba(0,0,0,.3)}
.ekran.bos{color:#7f8db0;font-size:1.1rem;letter-spacing:0;font-family:inherit}
.ekran.yanlis{color:#ff9b8f;text-decoration:line-through}
.ekran.dogru{background:#157a43;color:#fff}
.ekran.cozum{background:#e3f7ec;color:#1b8a4f}
.tuslar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tus{min-height:56px;border-radius:14px;border:0;background:#eef2fb;font-size:1.4rem;font-weight:800;box-shadow:0 4px 0 #b9c3d6}
.tus:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #b9c3d6}
.tus.tamam{background:#157a43;color:#fff;box-shadow:0 4px 0 #116236;font-size:1.1rem}
.tus.sil{background:#ffe3df;box-shadow:0 4px 0 #e5a39a}
/* Bilgi kartları, tablolar */
.bilgi{display:grid;gap:8px;width:100%;max-width:440px}
.bs{display:flex;align-items:center;gap:10px;background:#f4f8ff;border:2px solid #d5deec;border-radius:14px;padding:6px 12px}
.bs .bi{font-size:1.7rem}.bs .ba{flex:1;font-weight:600}.bs b{font-size:1.3rem;color:#a34c00}
table.tb{border-collapse:separate;border-spacing:0;width:100%;max-width:460px;border:2px solid #26324d;border-radius:14px;overflow:hidden;font-size:1.05rem}
.tb th{background:#26324d;color:#fff;padding:6px 8px;font-size:.95rem}
.tb td{padding:8px;text-align:center;border-top:1px solid #d5deec;font-weight:700}
.tb tr:nth-child(odd) td{background:#fff4e6}
.kartlar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.kk{flex:1 1 150px;max-width:240px;border-radius:16px;padding:10px 12px;background:#e2f6f8;border:3px solid var(--ikinci);text-align:center}
.kk:nth-child(2){background:#fff0e9;border-color:#ff8a5c}
.kk .kad{font-weight:800;font-size:1.1rem}.kk .kis{font:700 1.15rem ui-monospace,Consolas,monospace;margin-top:4px}
.ikonlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}
.ik{background:#f4f8ff;border:2px solid #d5deec;border-radius:16px;padding:10px;text-align:center}
.ik .ii{font-size:2rem;display:block}.ik b{display:block;color:#a34c00}.ik span{font-size:.95rem}
.akis{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.akis .ad{background:var(--c);border-radius:14px;padding:8px 12px;font-weight:800;text-align:center;min-width:110px}
.akis .ad small{display:block;font-weight:600}
.akis .ok{font-size:1.4rem;color:var(--soluk)}
.kural{background:#fff8e1;border-left:6px solid var(--sari);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:600}
.asama-simge{font-size:3rem;text-align:center;line-height:1.1}
/* Rehber karakter + konuşma balonu */
.karakter-satir{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.krk{flex:0 0 auto;width:104px}
.krk.kucuk{width:84px}
@media (max-width:420px){.krk{width:70px}.krk.kucuk{width:62px}.balon{padding:10px 12px}}
.krk svg{display:block;width:100%;height:auto;transform-origin:50% 100%}
.krk .goz-mutlu,.krk .kas{display:none}
.krk.mutlu .goz-mutlu{display:inline}.krk.mutlu .goz-acik{display:none}
.krk.dusun .goz-acik{transform:translate(3px,-3px)}
.krk.uzgun .kas{display:inline}.krk.uzgun .goz-acik{transform:translateY(3px)}
.balon{position:relative;flex:1;min-width:0;background:#fff;border-radius:20px;padding:12px 16px;font-weight:600;min-height:3.2em;margin-bottom:22px;box-shadow:0 5px 0 rgba(38,50,77,.10);border:3px solid #fff}
.balon::before{content:"";position:absolute;left:-14px;bottom:16px;border:9px solid transparent;border-right:14px solid #fff;border-left:0}
.balon.mutlu{border-color:#bfead2}.balon.uzgun{border-color:#ffd3cc}.balon.dusun{border-color:#ffe7a3}
.devam-yer{text-align:center}
.bitis{text-align:center}
.rozet{width:130px;height:auto}
.rozet-ad{font-weight:800;font-size:1.25rem;margin-top:-4px}
.yildizlar{font-size:1.6rem;letter-spacing:3px;margin:6px 0;word-break:break-all}
#karne .rm{padding:4px 0;text-align:left}
#karne .rm h2{text-align:center}
#karne .rm-k{border:0;background:#f5f8ff;border-radius:16px}
#karne .rm-bar{height:18px;border-radius:10px}
.unutma{text-align:left}
.unutma ul{margin:6px 0;padding-left:22px}
@media (prefers-reduced-motion:no-preference){
  .krk.zipla svg{animation:zipla .6s}
  .krk.salla svg,.sec button.salla,.ds.salla,.hatayok.salla,.ekran.salla{animation:salla .45s}
  .kart.gir{animation:gir .35s ease-out}
  .sec button,.tus{transition:transform .08s,box-shadow .08s,background .15s}
  .ilerleme i{transition:width .5s}
}
@keyframes zipla{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes salla{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes gir{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.25)}}
</style>

<body>
<div class="dekor" aria-hidden="true" id="dekor"></div>
<canvas id="konfeti" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
/* RaporMotoru v2 — 4/D portalına bağlı (her etkinliğin içine gömülür; tek dosya, çevrimdışı).
 *
 * Akış:
 *   RaporMotoru.init({oyunId, oyunAdi, kazanimlar:[{kod, ad}]})   oyun başında (ve "yeniden oyna"da)
 *   RaporMotoru.kaydet({...})                                       her maddeden sonra
 *   RaporMotoru.ekranCiz(el)                                        oyun sonunda: öğrenciye "Kazanım Karnem"
 *
 * Portal bağlantısı (öğrenci kodla giriş yaptıysa etkinlik portalın içinde açılır):
 *   - Her madde: {type:'4d:item-result'} mesajı (madde bazlı kazanım/yanılgı verisi)
 *   - Oyun sonu: {type:'4d:activity-finished'} mesajı, oyun başına BİR kez (mevcut sonuç kaydı)
 *   Sayfa portal dışında (kodsuz) açıldıysa mesajlar gitmez; karne yine gösterilir.
 *   Mesajı yalnızca portal kayıt listesinde (portal/etkinlik-kayitlari.json) olan etkinlikler için
 *   sunucu kaydeder; oyunId bu listedeki "id" ile aynı olmalı.
 *
 * Seviye eşikleri öğretmen panelindekiyle AYNI olmalı (ESIK, seviye).
 */
const RaporMotoru = (() => {
  const SURUM = 3;
  const ESIK = { ustalik: 0.85, gelisiyor: 0.6, ipucuUst: 0.25, minMadde: 3 };
  let meta = null, kayit = [], t0 = Date.now(), denemeKimligi = '', bitisGonderildi = false;

  function yeniKimlik() {
    let r = '';
    try { const a = new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b => { r += b.toString(16).padStart(2, '0'); }); }
    catch (e) { r = Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    return 'rm_' + r;
  }
  function portalaGonder(mesaj) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(mesaj, '*'); } catch (e) { /* portal yok */ }
  }


  /* --- Cevap defteri (v3, öğretmenin kararı 2026-11-27) ---
   * Her ilk kez çözülen madde portala tek tek gider (4d:answer); portal Google tablosuna yazar, İLK kayıt kilitlidir.
   * Etkinlik açılınca (init) portal kayıtlı cevapları geri verir (4d:saved-answers) → RaporMotoru.kayitli(id).
   * Etkinlik isterse RaporMotoru.onKayitli(fn) ile kayıtlı maddeleri atlar/kilitler. Onay (4d:answer-ack) gelene
   * kadar cevap 5 saniyede bir yeniden gönderilir; portal yoksa hiçbir şey gitmez. */
  let kayitliCevaplar = {}, kayitliDinleyiciler = [], bekleyenCevaplar = {}, cevapZamanlayici = null;
  function hazirGonder() { if (meta) portalaGonder({ type: '4d:ready', schemaVersion: 1, activityId: meta.oyunId }); }
  function bekleyenleriGonder() {
    const k = Object.keys(bekleyenCevaplar);
    k.forEach(q => portalaGonder(bekleyenCevaplar[q]));
    if (!k.length && cevapZamanlayici) { clearInterval(cevapZamanlayici); cevapZamanlayici = null; }
  }
  function cevapGonder(x) {
    if (!meta || x.r || !x.m || kayitliCevaplar[x.m] || bekleyenCevaplar[x.m]) return;
    bekleyenCevaplar[x.m] = { type: '4d:answer', schemaVersion: 1, activityId: meta.oyunId, questionId: x.m,
      correct: !x.c, firstTry: !!x.i && !x.c };
    portalaGonder(bekleyenCevaplar[x.m]);
    if (!cevapZamanlayici && window.parent !== window) cevapZamanlayici = setInterval(bekleyenleriGonder, 5000);
  }
  try {
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (ev.source !== window.parent || !d || typeof d !== 'object' || !meta || d.activityId !== meta.oyunId) return;
      if (d.type === '4d:saved-answers' && Array.isArray(d.answers)) {
        d.answers.forEach(a => { if (a && typeof a.questionId === 'string') kayitliCevaplar[a.questionId] = { correct: !!a.correct, firstTry: !!a.firstTry, answer: String(a.answer || '') }; });
        Object.keys(kayitliCevaplar).forEach(q => { delete bekleyenCevaplar[q]; });
        kayitliDinleyiciler.forEach(fn => { try { fn(Object.assign({}, kayitliCevaplar)); } catch (e) { /* etkinlik hatası */ } });
      } else if (d.type === '4d:answer-ack' && typeof d.questionId === 'string') {
        delete bekleyenCevaplar[d.questionId];
        if (d.saved && typeof d.saved === 'object') kayitliCevaplar[d.questionId] = { correct: !!d.saved.correct, firstTry: !!d.saved.firstTry, answer: String(d.saved.answer || '') };
      }
    });
  } catch (e) { /* tarayıcı mesaj dinleyemiyor */ }
  /** Daha önce kaydedilmiş madde: {correct, firstTry, answer} ya da null. */
  function kayitli(madde) { return kayitliCevaplar[String(madde)] || null; }
  /** Portal kayıtlı cevapları verdiğinde çağrılır: fn({maddeId: {correct, firstTry, answer}}). */
  function onKayitli(fn) { if (typeof fn === 'function') kayitliDinleyiciler.push(fn); }

  /** m = {oyunId, oyunAdi, kazanimlar:[{kod, ad}]}  (kod = MEB kazanım kodu, ör. "M.4.1.2.3") */
  function init(m) {
    meta = { oyunId: String(m.oyunId), oyunAdi: String(m.oyunAdi), kazanimlar: m.kazanimlar.map(k => ({ kod: String(k.kod), ad: String(k.ad) })) };
    kayit = []; t0 = Date.now(); denemeKimligi = yeniKimlik(); bitisGonderildi = false;
    bekleyenCevaplar = {}; hazirGonder();
  }

  /** r = {kazanim:kod, madde:id, yanilgi:'etiket'|'', ilkDenemeDogru:bool, deneme:n, ipucu:0-3,
   *       cozumGoruldu:bool, sureMs:n, tekrar:bool}   tekrar=true → seviye hesabına katılmaz */
  function kaydet(r) {
    const i = meta ? meta.kazanimlar.findIndex(k => k.kod === r.kazanim) : -1;
    if (i < 0) { console.warn('RaporMotoru: bilinmeyen kazanım', r.kazanim); return false; }
    const x = {
      k: i, m: String(r.madde || '').slice(0, 40), y: String(r.yanilgi || '').slice(0, 40),
      i: r.ilkDenemeDogru ? 1 : 0, d: Math.max(1, r.deneme | 0), h: Math.max(0, Math.min(3, r.ipucu | 0)),
      c: r.cozumGoruldu ? 1 : 0, s: Math.max(0, Math.round((r.sureMs || 0) / 1000)), r: r.tekrar ? 1 : 0
    };
    kayit.push(x);
    portalaGonder({ type: '4d:item-result', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      kazanim: meta.kazanimlar[i].kod, madde: x.m, yanilgi: x.y, ilkDogru: x.i, deneme: x.d, ipucu: x.h,
      cozum: x.c, sureSn: x.s, tekrar: x.r });
    cevapGonder(x);
    return true;
  }

  function seviye(a) {            // a: ilk kez sorulan madde kayıtları
    const n = a.length;
    if (n < ESIK.minMadde) return 'veri-az';
    const p = a.filter(x => x.i).length / n, h = a.filter(x => x.h > 0).length / n;
    if (p >= ESIK.ustalik && h <= ESIK.ipucuUst) return 'ustalasti';
    if (p >= ESIK.gelisiyor) return 'gelisiyor';
    return 'destek';
  }

  function ozet() {
    return meta.kazanimlar.map((k, idx) => {
      const hepsi = kayit.filter(x => x.k === idx), a = hepsi.filter(x => !x.r);
      const yan = {};
      hepsi.forEach(x => { if (x.y) yan[x.y] = (yan[x.y] || 0) + 1; });
      return {
        kod: k.kod, ad: k.ad, n: a.length, dogru: a.filter(x => x.i).length,
        p: a.length ? a.filter(x => x.i).length / a.length : null,
        ipucuOran: a.length ? a.filter(x => x.h > 0).length / a.length : 0,
        seviye: seviye(a), yanilgilar: yan
      };
    });
  }

  /** Oyun sonu: portaldaki mevcut sonuç kaydı için tek mesaj (çift gönderim yok). */
  function bitir() {
    if (!meta || bitisGonderildi) return;
    const a = kayit.filter(x => !x.r);
    if (!a.length) return;
    bitisGonderildi = true;
    const toplam = a.length, ilk = a.filter(x => x.i).length, cozulen = a.filter(x => !x.c).length;
    portalaGonder({ type: '4d:activity-finished', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,

const CIZ = {
  /* Hizalı alt alta işlem: her satır aynı genişlikte bir SVG; rakamlar sütunlara oturur.
     satır: {t, isaret, soluk(sağdan kaç rakam soluk), renk, etiket, sec(seçilebilir anahtar)} | {cizgi} | {kutu:n} */
  dikey(g, secilebilir) {
    /* kutu: true → bütün rakam sütunlarını kaplar (genişliği cevabın basamak sayısını ele vermez); sutun = toplam sütun sayısı */
    const S = g.satirlar, C = g.sutun || Math.max(...S.map(r => r.t ? r.t.length : (+r.kutu || 0))) + 1;
    const cw = 30, x0 = 6, etiketli = S.some(r => r.etiket), W = x0 + C * cw + (etiketli ? 140 : 6);
    const X = i => x0 + (C - 1 - i) * cw + cw / 2;   // i = 0 birler basamağı, C-1 işaret sütunu
    const sat = (h, ic) => '<svg viewBox="0 0 ' + W + ' ' + h + '" aria-hidden="true">' + ic + '</svg>';
    const isaret = r => r.isaret ? '<text x="' + X(C - 1) + '" y="30" text-anchor="middle" font-size="28" font-weight="800" fill="#a34c00">' + r.isaret + '</text>' : '';

    let h = '<div class="dikey"' + (secilebilir ? '' : ' role="img"') + ' aria-label="Alt alta çarpma işlemi" style="max-width:' + Math.round(W * 1.3 + 30) + 'px">';
    S.forEach(r => {

      else if (r.kutu) { yuk = 42; const kn = r.kutu === true ? C - 1 : r.kutu, sol = X(kn - 1) - cw / 2 + 2, gen = kn * cw - 4;

  },
  /* Kutu (alan) modeli: a = üç basamaklının parçaları, b = iki basamaklının parçaları, bos = [[satır, sütun]] */

  const eski = parseInt(depo.oku(DEPO_REKOR), 10) || 0;
  if (yildiz > eski) depo.yaz(DEPO_REKOR, String(yildiz));
  document.getElementById('yeniden').onclick = () => { cal('tik'); baslangic(); window.scrollTo(0, 0); };
  cal('kutlama'); ruh('mutlu', 'zipla', document.getElementById('balon').textContent);
  konfeti(60); setTimeout(() => konfeti(40, innerWidth * 0.25, innerHeight * 0.3), 350);
}

/* Klavye: 1-4 seçenek/satır, rakamlar + Backspace giriş, İ/i ipucu, Enter kontrol/devam */
document.addEventListener('keydown', e => {
  const k = e.key;
  if (durum && !durum.kilit && durum.m.tur === 'giris') {
    if (k >= '0' && k <= '9') { tus(k); e.preventDefault(); return; }
    if (k === 'Backspace') { tus('sil'); e.preventDefault(); return; }
  }
  if (k >= '1' && k <= '4' && durum && !durum.kilit) {
    if (durum.m.tur === 'secim') { sec_(+k - 1); return; }
    if (durum.m.tur === 'satir') { const bl = [...app.querySelectorAll('button.ds.sec, #hatayok')]; const b = bl[+k - 1]; if (b) satirSec(b.dataset.k); return; }
  }
  if (k === 'i' || k === 'İ' || k === 'ı') { if (document.getElementById('ip')) ipucuVer(); return; }
  if (k === 'Enter') {
    const d = document.getElementById('dev');
    if (d) { if (document.activeElement !== d) { e.preventDefault(); d.click(); } return; }
    if (durum && !durum.kilit && durum.m.tur === 'giris' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); tus('tamam'); }
  }
});
const CD_SINAV = false;
/* Etkinlik katmanı: gömülü RaporMotoru v3 değiştirilmez. */
const CevapDefteri = (() => {
  let portal = false, basladi = false, gorunuyor = false;
  const yerel = new Map(), kayitlar = new Map(), bekleyen = new Map(), raporBekleyen = new Map();
  const buTur = new Set();
  const gecerli = new Set(OYUN.maddeler.map(m => m.id));
  function kayitli(id) {
    return RaporMotoru.kayitli(id) || kayitlar.get(id) || (portal ? yerel.get(id) : null) || null;
  }
  function ciz() {
    let kutu = document.getElementById('cevapDefteri');
    if (!kutu) {
      kutu = document.createElement('section'); kutu.id = 'cevapDefteri';
      kutu.setAttribute('aria-label', 'Cevap defterim');
      kutu.style.cssText = 'max-width:900px;margin:16px auto;padding:12px;font:inherit';
      app.insertAdjacentElement('afterend', kutu);
    }
    kutu.hidden = !portal && !(basladi && gorunuyor);
    const kayit = OYUN.maddeler.filter(m => kayitli(m.id));
    kutu.innerHTML = portal ? '<h2>Cevap defterim</h2><p>' + kayit.length + ' / ' + OYUN.maddeler.length + ' soru tamamlandı ve kilitli.</p><ol>' +
      kayit.map(m => {
        const a = kayitli(m.id);
        return '<li data-cd-locked data-question-id="' + esc(m.id) + '"><b>' + (a.correct ? '✔ Doğru' : '✖ Yanlış') +
          ' · Tamamlandı 🔒</b> ' + esc(m.soru) + '<br>Cevabın: ' + esc(cevapMetni(m, a.answer) || 'Cevap metni önceki kayıtta bulunmuyor.') + '</li>';
      }).join('') + '</ol>' : '';
    if (basladi && gorunuyor) {
      const b = document.createElement('button'); b.id = 'cdBitir'; b.textContent = 'Bitir / karnemi gör';
      b.onclick = () => { CD_SINAV ? bitisOnayi() : bitisEkrani(); ciz(); };
      kutu.appendChild(b);
    }
  }
  function baslat() {
    buTur.clear();
    if (window.parent === window) yerel.clear();
    if (CD_SINAV && portal && S) Object.keys(S.cevap).forEach(id => { if (!S.canli[id] && !kayitli(id)) delete S.cevap[id]; });
    basladi = true; gorunuyor = true; ciz();
  }
  function cevapMetni(m, answer) {
    if (!answer) return '';
    const ids = answer.slice(2).split(',');
    if (m.tur === 'sirala' && answer.startsWith('s:')) return ids.map(id => (m.kartlar.find(k => k.id === id) || {}).metin || id).join(' → ');
    if (m.tur === 'coklu' && answer.startsWith('c:')) return ids.map(i => (m.secenekler[+i] || [i])[0]).join('; ');
    if (m.tur === 'eslestir' && answer.startsWith('o:')) return ids.map((id, i) => (i + 1) + ': ' + (ORGAN[id] ? ORGAN[id].ad : id)).join('; ');
    if (m.tur === 'kova' && answer.startsWith('k:')) return ids.map((id, i) => { const k = kovalarOf(m).find(k => k.id === id); return (i + 1) + ': ' + (k ? k.ad : id); }).join('; ');
    return answer;
  }
  function atla() {
    sira.forEach((x, i) => {
      const a = kayitli((x.m || x).id); if (!a || x.tekrar) return;
      if (buTur.has((x.m || x).id)) return;
      if (x.m) { x.kayitli = true; x.ilkDogru = a.firstTry; x.sonuc = a.correct ? 'kayitliDogru' : 'kayitliYanlis'; }
      else sonuclar[i] = a.correct ? 'kayitliDogru' : 'kayitliYanlis';
    });
    while (idx < sira.length) {
      const x = sira[idx], m = x.m || x, a = kayitli(m.id);
      if (!a || x.tekrar) break;
      if (!buTur.has(m.id)) {
        if (x.m) { x.kayitli = true; x.ilkDogru = a.firstTry; x.sonuc = a.correct ? 'kayitliDogru' : 'kayitliYanlis'; }
        else sonuclar[idx] = a.correct ? 'kayitliDogru' : 'kayitliYanlis';
      }
      idx++;
    }
    ciz();
  }
  function yenile() {
    ciz();
    if (!basladi || !gorunuyor) return;
    if (CD_SINAV) {
      if (S && document.querySelector('.sec')) {
        Object.keys(S.cevap).forEach(id => { if (!S.canli[id] && !kayitli(id)) delete S.cevap[id]; });
        S.sira.filter(m => Object.hasOwn(S.canli, m.id)).forEach(m => {
          if (!kayitli(m.id)) S.cevap[m.id] = S.canli[m.id];
          soruKaydet(m);
        }); soruCiz();
      }
    } else {
      const x = sira[idx], m = x && (x.m || x);
      if (m && kayitli(m.id) && !x.tekrar) { durum = null; soru(); }
      else if (typeof yolCiz === 'function') {
        sira.forEach((x, i) => { const id = (x.m || x).id, a = kayitli(id); if (a && !buTur.has(id)) sonuclar[i] = a.correct ? 'kayitliDogru' : 'kayitliYanlis'; });
        const yol = app.querySelector('.yol'); if (yol) yol.outerHTML = yolCiz();
      }
    }
  }
  function gonder(a) { if (window.parent !== window) window.parent.postMessage(a, '*'); }
  // v3 answer alanını taşımıyor. Cevaplı zarf anında gönderilir; onaydan
  // sonra motorun rapor kaydı eklenir. Motor kayitli(id)'yi gördüğünden
  // ikinci bir 4d:answer üretmez. Onay gecikirse karne açılırken rapor tamamlanır.
  function raporaYaz(id) {
    const r = raporBekleyen.get(id); if (!r) return;
    raporBekleyen.delete(id); RaporMotoru.kaydet(r);
  }
  function kaydet(r, answer) {
    const id = String(r.madde);
    if (r.tekrar || yerel.has(id) || kayitli(id)) {
      if (r.tekrar) RaporMotoru.kaydet(r);
      return false;
    }
    const a = { correct: !r.cozumGoruldu, firstTry: !!r.ilkDenemeDogru && !r.cozumGoruldu, answer: String(answer || '').slice(0, 80) };
    yerel.set(id, a); buTur.add(id);
    const mesaj = { type: '4d:answer', schemaVersion: 1, activityId: OYUN.id, questionId: id, ...a };
    if (window.parent !== window) {
      raporBekleyen.set(id, r); bekleyen.set(id, { mesaj, sayi: 1 }); gonder(mesaj);
    } else RaporMotoru.kaydet(r);
    ciz(); return true;
  }
  const zamanlayici = window.parent !== window ? setInterval(() => {
    bekleyen.forEach((b, id) => { if (b.sayi >= 10) bekleyen.delete(id); else { b.sayi++; gonder(b.mesaj); } });
  }, 5000) : null;
  window.addEventListener('pagehide', () => clearInterval(zamanlayici));
  RaporMotoru.onKayitli(answers => {
    portal = true;
    Object.entries(answers).forEach(([id, a]) => {
      if (!gecerli.has(id)) return;
      const r = raporBekleyen.get(id);
      if (r) buTur.delete(id);
      // Geç gelen eski cevap, henüz onaylanmamış yerel sonucun önüne geçer.
      if (r && typeof puan !== 'undefined') {
        puan = Math.max(0, puan - (r.ilkDenemeDogru ? 10 : r.cozumGoruldu ? 0 : 5));
        const p = document.getElementById('puanSayi'); if (p) p.textContent = puan;
      }
      raporBekleyen.delete(id); kayitlar.set(id, a); bekleyen.delete(id);
    });
    yenile();
  });
  window.addEventListener('message', ev => {
    const d = ev.data;
    if (ev.source !== window.parent || window.parent === window || !d || d.activityId !== OYUN.id) return;
    if (d.type === '4d:answer-ack' && gecerli.has(d.questionId)) {
      bekleyen.delete(d.questionId);
      if (d.saved && typeof d.saved === 'object') {
        const a = { correct: !!d.saved.correct, firstTry: !!d.saved.firstTry, answer: String(d.saved.answer || '') };
        const ilk = yerel.get(d.questionId);
        kayitlar.set(d.questionId, a);
        if (ilk && ilk.correct === a.correct && ilk.firstTry === a.firstTry && ilk.answer === a.answer) raporaYaz(d.questionId);
        else raporBekleyen.delete(d.questionId);
        if (portal && ilk && (ilk.correct !== a.correct || ilk.firstTry !== a.firstTry || ilk.answer !== a.answer)) yenile();
        else ciz();
      }
    }
  });
  function bitis() { [...raporBekleyen.keys()].forEach(raporaYaz); gorunuyor = false; ciz(); }
  return { kayitli, kaydet, atla, baslat, ciz, bitis, get portal() { return portal; } };
})();

RaporMotoru.init({ oyunId: OYUN.id, oyunAdi: OYUN.ad, kazanimlar: OYUN.kazanimlar });

baslangic();
</script>
