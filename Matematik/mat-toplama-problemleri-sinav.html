<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konu Değerlendirme: Toplama ve Çıkarma Problemleri</title>
<style>
:root{--bg:#f4f6fa;--kart:#fff;--yazi:#1c2430;--cizgi:#c9d1dc;--mavi:#2b5fd9;--mavi-acik:#e6edfc;--gri:#5b6470}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--kart:#1b212a;--yazi:#e8ecf2;--cizgi:#3a4350;--mavi:#7ba2ff;--mavi-acik:#22324f;--gri:#aab3c0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);font:19px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:18px;margin:12px 0}
h1{font-size:1.45rem;margin:0 0 8px}
.soru{font-size:1.3rem;font-weight:600;margin:6px 0 16px;line-height:1.5}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.sec{grid-template-columns:1fr}}
button{font:inherit;min-height:56px;border-radius:14px;border:2px solid var(--mavi);background:var(--kart);color:var(--yazi);cursor:pointer;padding:8px 14px;text-align:left}
button:focus-visible{outline:3px solid var(--mavi);outline-offset:2px}
button.secili{background:var(--mavi);color:#fff}
button.dolu{background:var(--mavi);color:#fff;text-align:center}
button.ikincil{text-align:center;border-color:var(--cizgi)}
button:disabled{opacity:.45;cursor:default}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;color:var(--gri);margin-bottom:6px}
.gezgin{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gezgin button{min-height:44px;min-width:44px;padding:0;text-align:center;font-size:.95rem;border-width:2px}
.gezgin button.cevapli{background:var(--mavi-acik)}
.gezgin button.simdi{border-color:var(--yazi);border-width:3px}
.alt{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.alt button{min-width:130px}
.gorsel{margin:4px 0 14px}.gorsel svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;border-radius:14px}
.uyari{background:var(--mavi-acik);border-radius:12px;padding:12px;margin:12px 0}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* RaporMotoru v2 — 4/D portalına bağlı (her etkinliğin içine gömülür; tek dosya, çevrimdışı).
 *
 * Akış:
 *   RaporMotoru.init({oyunId, oyunAdi, kazanimlar:[{kod, ad}]})   oyun başında (ve "yeniden oyna"da)
 *   RaporMotoru.kaydet({...})                                       her maddeden sonra
 *   RaporMotoru.ekranCiz(el)                                        oyun sonunda: öğrenciye "Kazanım Karnem"
 *
 * Portal bağlantısı (öğrenci kodla giriş yaptıysa etkinlik portalın içinde açılır):
 *   - Her madde: {type:'4d:item-result'} mesajı (madde bazlı kazanım/yanılgı verisi)
 *   - Oyun sonu: {type:'4d:activity-finished'} mesajı, oyun başına BİR kez (mevcut sonuç kaydı)
 *   Sayfa portal dışında (kodsuz) açıldıysa mesajlar gitmez; karne yine gösterilir.
 *   Mesajı yalnızca portal kayıt listesinde (portal/etkinlik-kayitlari.json) olan etkinlikler için
 *   sunucu kaydeder; oyunId bu listedeki "id" ile aynı olmalı.
 *
 * Seviye eşikleri öğretmen panelindekiyle AYNI olmalı (ESIK, seviye).
 */
const RaporMotoru = (() => {
  const SURUM = 2;
  const ESIK = { ustalik: 0.85, gelisiyor: 0.6, ipucuUst: 0.25, minMadde: 3 };
  let meta = null, kayit = [], t0 = Date.now(), denemeKimligi = '', bitisGonderildi = false;

  function yeniKimlik() {
    let r = '';
    try { const a = new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b => { r += b.toString(16).padStart(2, '0'); }); }
    catch (e) { r = Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    return 'rm_' + r;
  }
  function portalaGonder(mesaj) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(mesaj, '*'); } catch (e) { /* portal yok */ }
  }

  /** m = {oyunId, oyunAdi, kazanimlar:[{kod, ad}]}  (kod = MEB kazanım kodu, ör. "M.4.1.2.3") */
  function init(m) {
    meta = { oyunId: String(m.oyunId), oyunAdi: String(m.oyunAdi), kazanimlar: m.kazanimlar.map(k => ({ kod: String(k.kod), ad: String(k.ad) })) };
    kayit = []; t0 = Date.now(); denemeKimligi = yeniKimlik(); bitisGonderildi = false;
  }

  /** r = {kazanim:kod, madde:id, yanilgi:'etiket'|'', ilkDenemeDogru:bool, deneme:n, ipucu:0-3,
   *       cozumGoruldu:bool, sureMs:n, tekrar:bool}   tekrar=true → seviye hesabına katılmaz */
  function kaydet(r) {
    const i = meta ? meta.kazanimlar.findIndex(k => k.kod === r.kazanim) : -1;
    if (i < 0) { console.warn('RaporMotoru: bilinmeyen kazanım', r.kazanim); return false; }
    const x = {
      k: i, m: String(r.madde || '').slice(0, 40), y: String(r.yanilgi || '').slice(0, 40),
      i: r.ilkDenemeDogru ? 1 : 0, d: Math.max(1, r.deneme | 0), h: Math.max(0, Math.min(3, r.ipucu | 0)),
      c: r.cozumGoruldu ? 1 : 0, s: Math.max(0, Math.round((r.sureMs || 0) / 1000)), r: r.tekrar ? 1 : 0
    };
    kayit.push(x);
    portalaGonder({ type: '4d:item-result', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      kazanim: meta.kazanimlar[i].kod, madde: x.m, yanilgi: x.y, ilkDogru: x.i, deneme: x.d, ipucu: x.h,
      cozum: x.c, sureSn: x.s, tekrar: x.r });
    return true;
  }

  function seviye(a) {            // a: ilk kez sorulan madde kayıtları
    const n = a.length;
    if (n < ESIK.minMadde) return 'veri-az';
    const p = a.filter(x => x.i).length / n, h = a.filter(x => x.h > 0).length / n;
    if (p >= ESIK.ustalik && h <= ESIK.ipucuUst) return 'ustalasti';
    if (p >= ESIK.gelisiyor) return 'gelisiyor';
    return 'destek';
  }

  function ozet() {
    return meta.kazanimlar.map((k, idx) => {
      const hepsi = kayit.filter(x => x.k === idx), a = hepsi.filter(x => !x.r);
      const yan = {};
      hepsi.forEach(x => { if (x.y) yan[x.y] = (yan[x.y] || 0) + 1; });
      return {
        kod: k.kod, ad: k.ad, n: a.length, dogru: a.filter(x => x.i).length,
        p: a.length ? a.filter(x => x.i).length / a.length : null,
        ipucuOran: a.length ? a.filter(x => x.h > 0).length / a.length : 0,
        seviye: seviye(a), yanilgilar: yan
      };
    });
  }

  /** Oyun sonu: portaldaki mevcut sonuç kaydı için tek mesaj (çift gönderim yok). */
  function bitir() {
    if (!meta || bitisGonderildi) return;
    const a = kayit.filter(x => !x.r);
    if (!a.length) return;
    bitisGonderildi = true;
    const toplam = a.length, ilk = a.filter(x => x.i).length, cozulen = a.filter(x => !x.c).length;
    portalaGonder({ type: '4d:activity-finished', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      correct: cozulen, wrong: toplam - cozulen, total: toplam,
      wrongAttempts: a.reduce((t, x) => t + (x.d - 1), 0), firstTry: Math.min(ilk, cozulen),
      durationSeconds: Math.min(86400, Math.round((Date.now() - t0) / 1000)) });
  }

  const ETIKET = {
    ustalasti: ['Harika! Bu konuyu iyi biliyorsun.', '#1b7f4b'],
    gelisiyor: ['Gelişiyorsun. Biraz daha tekrar iyi gelir.', '#b26a00'],
    destek: ['Bu konuyu birlikte tekrar edelim.', '#b3261e'],
    'veri-az': ['Bu konuda daha fazla soru çözmen gerek.', '#5b6470']
  };

  /** Öğrenciye olumlu dilli "Kazanım Karnem" ekranı; sonucu portala da gönderir. */
  function ekranCiz(el) {
    bitir();
    if (!document.getElementById('rm-css')) {
      const st = document.createElement('style'); st.id = 'rm-css';
      st.textContent = '.rm{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;max-width:720px;margin:0 auto;padding:16px;color:inherit}' +
        '.rm h2{margin:0 0 4px;font-size:1.5rem}.rm p{margin:4px 0 12px;opacity:.85}' +
        '.rm-k{border:1px solid #c9d1dc;border-radius:14px;padding:12px 14px;margin:10px 0}' +
        '.rm-k b{display:block;font-size:1.05rem}.rm-bar{height:14px;background:#e8ebf0;border-radius:8px;overflow:hidden;margin:8px 0}' +
        '.rm-bar i{display:block;height:100%;border-radius:8px}.rm-m{font-size:.95rem;font-weight:700}.rm-d{font-size:.9rem;opacity:.8}';
      document.head.appendChild(st);
    }
    const o = ozet();
    const guclu = o.filter(x => x.seviye === 'ustalasti').length, tekrar = o.filter(x => x.seviye === 'destek' || x.seviye === 'gelisiyor').length;
    let h = '<div class="rm"><h2>Kazanım Karnem</h2><p>' + esc(meta.oyunAdi) + '</p><p>' + guclu + ' konuda güçlüsün' +
      (tekrar ? ', ' + tekrar + ' konuyu tekrar edeceksin.' : '.') + '</p>';
    o.forEach(x => {
      const e = ETIKET[x.seviye], yuzde = x.p === null ? 0 : Math.round(x.p * 100);
      h += '<div class="rm-k"><b>' + esc(x.ad) + '</b><div class="rm-bar" role="img" aria-label="ilk denemede doğru: %' + yuzde + '"><i style="width:' + yuzde + '%;background:' + e[1] + '"></i></div>' +
        '<span class="rm-m" style="color:' + e[1] + '">' + e[0] + '</span> <span class="rm-d">(' + x.dogru + '/' + x.n + ' ilk denemede doğru)</span></div>';
    });
    h += '<p class="rm-d">' + (window.parent !== window ? 'Sonucun öğretmenine gönderildi.' : 'Sonucunun öğretmenine gitmesi için etkinliği öğrenci portalından aç.') + '</p></div>';
    el.innerHTML = h;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

  return { init, kaydet, ozet, bitir, ekranCiz, seviye, ESIK, SURUM };
})();

</script>
<script>
/* ===== GÖRSELLER (sorulara eşlik eden basit çizimler; fiyatlar soru metninde de yazılı) ===== */

    camasir(248) + etiket(290, 72, '2 379 TL', -6) + ad(290, 216, 'Çamaşır mak.') +

  const koltuk = `<rect x="22" y="112" width="140" height="56" rx="14" fill="#c8323a"/><rect x="34" y="84" width="116" height="44" rx="14" fill="#a8262e"/>` +

/* ===== MOTOR (sınav kipi: ipucu yok, anında doğru/yanlış gösterilmez, istenen soruya dönülür, süre ve deneme sınırı yok) ===== */
const app = document.getElementById('app');
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const depo = (() => { const mem = {}; return {
  oku(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; } catch (e) { return mem[k] ?? null; } },
  yaz(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* depolama kapalı */ } },
  sil(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { /* depolama kapalı */ } } }; })();
const DEVAM = 'sinav-devam-' + OYUN.id;

let S = null;   /* {sira:[madde...], sec:{id:[[metin,yanilgi]...]}, cevap:{id:secilenMetin}, sure:{id:ms}, i:0, t:Date.now()} */

function yeniSinav() {
  const sira = OYUN.maddeler.slice();   /* soru sırası sabit: kolaydan zora */
  const sec = {};
  sira.forEach(m => { sec[m.id] = shuffle([[m.dogru, '']].concat(m.yanlislar)); });
  S = { sira, sec, cevap: {}, sure: {}, i: 0, t: Date.now() };
}
function kaydetDevam() {
  if (!S) return;
  depo.yaz(DEVAM, JSON.stringify({ sec: S.sec, cevap: S.cevap, sure: S.sure, i: S.i }));
}
function devamYukle() {
  try {
    const v = JSON.parse(depo.oku(DEVAM) || 'null');
    if (!v || !v.sec) return false;
    const ok = OYUN.maddeler.every(m => Array.isArray(v.sec[m.id]) && v.sec[m.id].length === 4);
    if (!ok) return false;
    S = { sira: OYUN.maddeler.slice(), sec: v.sec, cevap: v.cevap || {}, sure: v.sure || {}, i: Math.min(+v.i || 0, OYUN.maddeler.length - 1), t: Date.now() };
    return true;
  } catch (e) { return false; }
}
function sureTopla() {   /* şu anki sorada geçen süreyi biriktir */
  const m = S.sira[S.i]; if (!m) return;
  S.sure[m.id] = (S.sure[m.id] || 0) + (Date.now() - S.t); S.t = Date.now();
}

function baslangic() {
  const var_ = (() => { try { const v = JSON.parse(depo.oku(DEVAM) || 'null'); return v && Object.keys(v.cevap || {}).length; } catch (e) { return 0; } })();
  app.innerHTML = '<div class="kart"><h1>' + esc(OYUN.ad) + '</h1>' +
    '<p>' + OYUN.maddeler.length + ' soru var. İstediğin soruya dönebilir, cevabını değiştirebilirsin. Acele etme; süre sınırı yok.</p>' +
    '<p>Sonucunu öğretmenin görecek.</p>' +
    (var_ ? '<div class="uyari">Yarım kalan bir sınavın var (' + var_ + ' soru cevaplı).</div><p><button class="dolu" id="devam">Kaldığım yerden devam et</button> <button class="ikincil" id="yeni">Baştan başla</button></p>'
          : '<p><button class="dolu" id="basla">Başla</button></p>') + '</div>';
  const git = () => { RaporMotoru.init({ oyunId: OYUN.id, oyunAdi: OYUN.ad, kazanimlar: OYUN.kazanimlar }); soruCiz(); };
  if (var_) {
    document.getElementById('devam').onclick = () => { if (devamYukle()) git(); else { yeniSinav(); git(); } };
    document.getElementById('yeni').onclick = () => { depo.sil(DEVAM); yeniSinav(); git(); };
  } else document.getElementById('basla').onclick = () => { yeniSinav(); git(); };
}

function gezginHtml() {
  return '<div class="gezgin" role="group" aria-label="Soru listesi">' + S.sira.map((m, k) =>
    '<button data-k="' + k + '" class="' + (S.cevap[m.id] !== undefined ? 'cevapli ' : '') + (k === S.i ? 'simdi' : '') + '" aria-label="Soru ' + (k + 1) + (S.cevap[m.id] !== undefined ? ', cevaplandı' : ', boş') + '"' + (k === S.i ? ' aria-current="true"' : '') + '>' + (k + 1) + '</button>').join('') + '</div>';
}

function soruCiz() {
  const m = S.sira[S.i], sec = S.sec[m.id], son = S.i === S.sira.length - 1;
  S.t = Date.now();
  app.innerHTML = '<div class="ust"><span>Soru ' + (S.i + 1) + ' / ' + S.sira.length + '</span><span>' + Object.keys(S.cevap).length + ' soru cevaplı</span></div>' +
    '<div class="kart">' + (m.gorsel && GORSEL[m.gorsel] ? '<div class="gorsel">' + GORSEL[m.gorsel] + '</div>' : '') + '<div class="soru" id="soru">' + esc(m.soru) + '</div>' +
    '<div class="sec" role="radiogroup" aria-labelledby="soru">' + sec.map((s, k) =>
      '<button role="radio" aria-checked="' + (S.cevap[m.id] === s[0]) + '" data-k="' + k + '" class="' + (S.cevap[m.id] === s[0] ? 'secili' : '') + '">' + String.fromCharCode(65 + k) + ') ' + esc(s[0]) + '</button>').join('') + '</div>' +
    '<div class="alt"><button class="ikincil" id="onceki"' + (S.i === 0 ? ' disabled' : '') + '>← Önceki</button>' +
    (son ? '<button class="dolu" id="bitir">Sınavı bitir</button>' : '<button class="dolu" id="sonraki">Sonraki →</button>') + '</div></div>' + gezginHtml();
  app.querySelectorAll('.sec button').forEach(b => { b.onclick = () => isaretle(+b.dataset.k); });
  app.querySelectorAll('.gezgin button').forEach(b => { b.onclick = () => git(+b.dataset.k); });
  const o = document.getElementById('onceki'); if (o) o.onclick = () => git(S.i - 1);
  const s = document.getElementById('sonraki'); if (s) s.onclick = () => git(S.i + 1);
  const bt = document.getElementById('bitir'); if (bt) bt.onclick = bitisOnayi;
}
function git(k) { if (k < 0 || k >= S.sira.length) return; sureTopla(); S.i = k; kaydetDevam(); soruCiz(); }
function isaretle(k) {
  const m = S.sira[S.i]; S.cevap[m.id] = S.sec[m.id][k][0]; kaydetDevam();
  app.querySelectorAll('.sec button').forEach((b, j) => { const a = j === k; b.classList.toggle('secili', a); b.setAttribute('aria-checked', a); });
  const g = app.querySelectorAll('.gezgin button')[S.i]; if (g) { g.classList.add('cevapli'); }
  const ust = app.querySelector('.ust span:last-child'); if (ust) ust.textContent = Object.keys(S.cevap).length + ' soru cevaplı';
}

function bitisOnayi() {
  sureTopla();
  const bos = S.sira.filter(m => S.cevap[m.id] === undefined);
  app.innerHTML = '<div class="kart"><h1>Sınavı bitirelim mi?</h1>' +
    (bos.length ? '<div class="uyari">' + bos.length + ' soruyu boş bıraktın: ' + S.sira.map((m, k) => S.cevap[m.id] === undefined ? (k + 1) : null).filter(Boolean).join(', ') + '.</div>'
                : '<p>Bütün soruları cevapladın.</p>') +
    '<p>Bitirdikten sonra cevaplarını değiştiremezsin.</p>' +
    '<div class="alt"><button class="ikincil" id="don">Sorulara dön</button><button class="dolu" id="evet">Evet, bitir</button></div></div>';
  document.getElementById('don').onclick = () => { S.i = bos.length ? S.sira.indexOf(bos[0]) : S.i; soruCiz(); };
  document.getElementById('evet').onclick = bitir;
}

function bitir() {
  /* Her soru sonuç olarak gönderilir. Doğru: ilk denemede doğru. Yanlış/boş: ilkDenemeDogru=false, deneme=2, cozumGoruldu=true
     (rapor motorunda "çözemedi" anlamında kullanılır; öğrenciye hiçbir çözüm gösterilmez). */
  S.sira.forEach(m => {
    const c = S.cevap[m.id], dogru = c === m.dogru;
    const yan = c === undefined ? 'bos' : (dogru ? '' : ((m.yanlislar.find(y => y[0] === c) || [0, ''])[1] || 'yanlis'));
    RaporMotoru.kaydet({ kazanim: m.kaz, madde: m.id, yanilgi: yan, ilkDenemeDogru: dogru, deneme: dogru ? 1 : 2, ipucu: 0,
      cozumGoruldu: !dogru, sureMs: S.sure[m.id] || 0 });
  });
  RaporMotoru.bitir();
  depo.sil(DEVAM);
  const portalda = window.parent !== window;
  app.innerHTML = '<div class="kart"><h1>Sınavı tamamladın</h1>' +
    '<p>' + (portalda ? 'Cevapların öğretmenine gönderildi. Teşekkürler!' : 'Cevapların öğretmenine gitmesi için sınavı öğrenci portalından aç.') + '</p>' +
    '<p><button class="ikincil" id="yeniden">Sınavı yeniden çöz</button></p></div>';
  document.getElementById('yeniden').onclick = () => { S = null; baslangic(); };
}

document.addEventListener('keydown', e => {
  if (!S || !document.querySelector('.sec')) return;
  if (e.key >= '1' && e.key <= '4') isaretle(+e.key - 1);
  else if (e.key.toLowerCase() >= 'a' && e.key.toLowerCase() <= 'd' && e.key.length === 1) isaretle(e.key.toLowerCase().charCodeAt(0) - 97);
  else if (e.key === 'ArrowRight') git(S.i + 1);
  else if (e.key === 'ArrowLeft') git(S.i - 1);
});
baslangic();
</script>
