<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uzay Üssü: Toplama Görevi</title>
<style>
    :root {
        --bg-color: #0b0c10;
        --panel-bg: #1f2833;
        --text-main: #c5c6c7;
        --accent: #66fcf1;
        --accent-dark: #45a29e;
        --success: #28a745;
        --danger: #dc3545;
        --warning: #ffc107;
    }
    
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
        margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
        display: flex; flex-direction: column; min-height: 100vh;
    }

    header {
        background-color: var(--panel-bg); padding: 15px 20px; text-align: center;
        border-bottom: 2px solid var(--accent); box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
    }

    header h1 { margin: 0; color: var(--accent); font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }

    .status-bar {
        display: flex; justify-content: space-between; max-width: 800px; margin: 15px auto;
        padding: 10px 20px; background: rgba(31, 40, 51, 0.8); border-radius: 8px; border: 1px solid var(--accent-dark);
    }

    .progress-container { flex-grow: 1; margin: 0 20px; background: #000; border-radius: 10px; overflow: hidden; position: relative; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s; }

    main { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }

    .game-container {
        background-color: var(--panel-bg); width: 100%; max-width: 800px; border-radius: 12px;
        padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); position: relative;
    }

    .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--accent-dark); padding-bottom: 10px; }
    .task-header h2 { margin: 0; color: var(--accent); }
    .task-type-badge { background: var(--accent-dark); color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 0.9rem; }

    .task-content { font-size: 1.2rem; line-height: 1.6; margin-bottom: 30px; text-align: center; }

    /* Vertical Math Alignment Styles */
    .math-vertical {
        display: inline-block; text-align: right; font-family: 'Courier New', Courier, monospace;
        font-size: 3rem; background: #000; padding: 20px 40px; border-radius: 10px;
        border: 2px solid var(--accent); letter-spacing: 0.5rem; color: #fff; line-height: 1.2;
    }
    .math-line { border-bottom: 4px solid var(--accent); margin: 5px 0; }
    .math-input { width: 150px; font-size: 2.5rem; font-family: 'Courier New', Courier, monospace; text-align: right; background: #111; color: var(--accent); border: 2px solid var(--accent-dark); border-radius: 5px; padding: 5px; letter-spacing: 0.5rem; }

    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .option-btn {
        background: #0b0c10; border: 2px solid var(--accent-dark); color: #fff; font-size: 1.2rem;
        padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .option-btn:hover { background: var(--accent-dark); }
    .option-btn.selected { background: var(--accent); color: #000; font-weight: bold; }
    .option-btn.correct { background: var(--success); border-color: var(--success); color: #fff; }
    .option-btn.wrong { background: var(--danger); border-color: var(--danger); color: #fff; }

    .input-group { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    
    .match-row, .order-row { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--accent-dark); }
    .match-row select, .order-row select { font-size: 1.1rem; padding: 8px; background: #1f2833; color: #fff; border: 1px solid var(--accent); border-radius: 5px; }

    .controls { display: flex; justify-content: space-between; margin-top: 30px; gap: 10px; flex-wrap: wrap; }
    .btn { background: var(--accent-dark); color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn:hover:not(:disabled) { background: var(--accent); color: #000; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-skip { background: #6c757d; }
    .btn-check { background: var(--warning); color: #000; }

    .feedback-box { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.1rem; animation: popIn 0.3s ease-out; }
    .feedback-box.error { background: rgba(220, 53, 69, 0.2); border: 2px solid var(--danger); color: #ff6b6b; }
    .feedback-box.success { background: rgba(40, 167, 69, 0.2); border: 2px solid var(--success); color: #51cf66; }

    #report-screen { display: none; }
    .report-stats { display: flex; justify-content: space-around; flex-wrap: wrap; margin-bottom: 30px; }
    .stat-card { background: #000; border: 1px solid var(--accent); padding: 20px; border-radius: 10px; text-align: center; min-width: 120px; margin: 10px; }
    .stat-card h3 { margin: 0 0 10px 0; font-size: 2rem; color: var(--accent); }
    .stat-card p { margin: 0; font-size: 0.9rem; text-transform: uppercase; color: #aaa; }
    
    .review-item { background: #000; border-left: 5px solid var(--danger); padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0; text-align: left; }
    .review-item.skipped { border-left-color: #6c757d; }
    .review-item h4 { margin: 0 0 10px 0; color: var(--accent); }
    .review-item p { margin: 5px 0; font-size: 1rem; }
    .review-explanation { background: #1f2833; padding: 10px; border-radius: 5px; margin-top: 10px; color: #a6e22e; font-family: monospace; font-size: 1.1rem;}

    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    @media (max-width: 600px) {
        .math-vertical { font-size: 2rem; letter-spacing: 0.3rem; padding: 15px; }
        .math-input { width: 120px; font-size: 1.8rem; }
        .btn { padding: 10px 15px; font-size: 1rem; }
        .controls { flex-direction: column; }
        .controls button { width: 100%; }
    }
</style>
</head>
<body>

<header>
    <h1>Uzay Üssü: Toplama Görevi</h1>
</header>

<div class="status-bar" id="status-bar">
    <div>Sektör: <span id="current-q-disp" style="color:var(--accent); font-weight:bold;">1/16</span></div>
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div>Enerji: <span id="score-disp" style="color:var(--success); font-weight:bold;">0</span> Birim</div>
</div>

<main>
    <div class="game-container" id="game-screen">
        <div class="task-header">
            <h2 id="task-title">Sektör 1: Temel Sistemler</h2>
            <span class="task-type-badge" id="task-type-badge">Çoktan Seçmeli</span>
        </div>
        
        <div class="task-content" id="task-content">
            <!-- Dynamic Content -->
        </div>

        <div class="feedback-box" id="feedback-box"></div>

        <div class="controls">
            <button class="btn" id="btn-prev" onclick="goPrev()" disabled>Önceki Sektör</button>
            <button class="btn btn-skip" id="btn-skip" onclick="skipTask()">Soruyu Geç</button>
            <button class="btn btn-check" id="btn-check" onclick="checkAnswer()">Sistemi Onayla</button>
            <button class="btn" id="btn-next" onclick="goNext()" disabled>Sonraki Sektör</button>
        </div>
    </div>

    <div class="game-container" id="report-screen">
        <div class="task-header">
            <h2>Görev Raporu: Sistem Durumu</h2>
        </div>
        
        <div class="report-stats">
            <div class="stat-card">
                <h3 id="rep-total">16</h3>
                <p>Toplam Görev</p>
            </div>
            <div class="stat-card">
                <h3 id="rep-correct" style="color: var(--success);">0</h3>
                <p>İlk Deneme Doğru</p>
            </div>
            <div class="stat-card">
                <h3 id="rep-wrong" style="color: var(--danger);">0</h3>
                <p>Hatalı İşlem</p>
            </div>
            <div class="stat-card">
                <h3 id="rep-skipped" style="color: #6c757d;">0</h3>
                <p>Geçilen</p>
            </div>
        </div>

        <h3 style="color: var(--accent); border-bottom: 1px solid var(--accent); padding-bottom: 5px;">Gözden Geçirilmesi Gereken Sistemler</h3>
        <div id="review-list">
            <!-- Dynamic Review Items -->
        </div>

        <div class="controls" style="justify-content: center;">
            <button class="btn" onclick="initGame()">Sistemi Yeniden Başlat (Replay)</button>
        </div>
    </div>
</main>

<script>
    const tasks = [
        {
            id: 1, type: 'mc', title: 'Sektör 1', badge: 'Alt Alta Toplama',
            q1: 2456, q2: 1232, answer: 3688,
            choices: [3688, 3588, 3678],
            exp: "Birler basamağı: 6+2=8. Onlar basamağı: 5+3=8. Yüzler basamağı: 4+2=6. Binler basamağı: 2+1=3. Sonuç: 3688"
        },
        {
            id: 2, type: 'mc', title: 'Sektör 2', badge: 'Eldeli Toplama',
            q1: 3548, q2: 2174, answer: 5722,
            choices: [5722, 5612, 5712],
            exp: "Birler: 8+4=12 (Elde var 1). Onlar: 4+7+1(elde)=12 (Elde var 1). Yüzler: 5+1+1(elde)=7. Binler: 3+2=5. Sonuç: 5722"
        },
        {
            id: 3, type: 'mc', title: 'Sektör 3', badge: 'Eldeli Toplama',
            q1: 4685, q2: 2437, answer: 7122,
            choices: [7122, 7012, 7112],
            exp: "Birler: 5+7=12 (Elde var 1). Onlar: 8+3+1=12 (Elde var 1). Yüzler: 6+4+1=11 (Elde var 1). Binler: 4+2+1=7. Sonuç: 7122"
        },
        {
            id: 4, type: 'mc', title: 'Sektör 4', badge: 'Eldeli Toplama',
            q1: 5094, q2: 1986, answer: 7080,
            choices: [7080, 6980, 7180],
            exp: "Birler: 4+6=10 (Elde var 1). Onlar: 9+8+1=18 (Elde var 1). Yüzler: 0+9+1=10 (Elde var 1). Binler: 5+1+1=7. Sonuç: 7080"
        },
        {
            id: 5, type: 'input', title: 'Sektör 5', badge: 'Serbest Giriş',
            q1: 6750, q2: 2450, answer: "9200",
            exp: "Birler: 0+0=0. Onlar: 5+5=10 (Elde var 1). Yüzler: 7+4+1=12 (Elde var 1). Binler: 6+2+1=9. Sonuç: 9200"
        },
        {
            id: 6, type: 'input', title: 'Sektör 6', badge: 'Serbest Giriş',
            q1: 8429, q2: 1375, answer: "9804",
            exp: "Birler: 9+5=14 (Elde var 1). Onlar: 2+7+1=10 (Elde var 1). Yüzler: 4+3+1=8. Binler: 8+1=9. Sonuç: 9804"
        },
        {
            id: 7, type: 'missing_mc', title: 'Sektör 7', badge: 'Kayıp Basamaklar',
            renderStr: "  5A34\n+ 21B2\n------\n  7606",
            answer: "A=4, B=7",
            choices: ["A=4, B=7", "A=5, B=6", "A=4, B=6"],
            exp: "Birler: 4+2=6. Onlar: 3+B=0 olamaz, 10 olmalı. B=7 (Elde var 1). Yüzler: A+1+1(elde)=6 ise A=4. Binler: 5+2=7. Kural sağlandı!"
        },
        {
            id: 8, type: 'missing_mc', title: 'Sektör 8', badge: 'Kayıp Basamaklar',
            renderStr: "  482C\n+ D354\n------\n  8180",
            answer: "C=6, D=3",
            choices: ["C=6, D=3", "C=5, D=4", "C=6, D=4"],
            exp: "Birler: C+4=10 ise C=6 (Elde var 1). Onlar: 2+5+1(elde)=8. Yüzler: 8+3=11 (Elde var 1). Binler: 4+D+1(elde)=8 ise D=3."
        },
        {
            id: 9, type: 'tf', title: 'Sektör 9', badge: 'Doğru/Yanlış',
            text: "3500 ile 4500 sayılarının toplamı 8000'dir.",
            answer: "Doğru",
            exp: "3000 + 4000 = 7000. 500 + 500 = 1000. 7000 + 1000 = 8000. İşlem doğrudur."
        },
        {
            id: 10, type: 'tf', title: 'Sektör 10', badge: 'Doğru/Yanlış',
            text: "6725 + 1275 işleminin sonucu 7900'dür.",
            answer: "Yanlış",
            exp: "Birler ve onlar: 25+75=100. Yüzler ve binler: 6700+1200=7900. Toplam: 7900 + 100 = 8000 olmalıdır."
        },
        {
            id: 11, type: 'word_mc', title: 'Sektör 11', badge: 'Problem Çözme',
            text: "Uzay seramızda 1. gün 2450 gram, 2. gün 1875 gram oksijen üreten bitki tohumu ekildi. Toplam kaç gram tohum ekilmiştir?",
            answer: "4325",
            choices: ["4325", "4225", "4315"],
            exp: "2450 + 1875 işlemini alt alta yazarak topladığımızda: Birler: 0+5=5. Onlar: 5+7=12 (Elde var 1). Yüzler: 4+8+1=13 (Elde var 1). Binler: 2+1+1=4. Sonuç 4325."
        },
        {
            id: 12, type: 'word_input', title: 'Sektör 12', badge: 'Problem Çözme',
            text: "Veri tabanımızda 3458 onarılmış dosya ve 2175 yeni şifrelenmiş dosya bulunmaktadır. Toplam dosya sayısı kaçtır?",
            answer: "5633",
            exp: "3458 ve 2175 sayılarını toplarız. 8+5=13 (Elde 1). 5+7+1=13 (Elde 1). 4+1+1=6. 3+2=5. Sonuç: 5633."
        },
        {
            id: 13, type: 'match', title: 'Sektör 13', badge: 'Eşleştirme',
            text: "Aşağıdaki işlemleri doğru sonuçları ile eşleştirin.",
            items: [
                { q: "1200 + 1300", a: "2500" },
                { q: "1500 + 1500", a: "3000" },
                { q: "2100 + 1400", a: "3500" }
            ],
            options: ["3000", "2500", "3500"],
            exp: "1200+1300=2500. 1500+1500=3000. 2100+1400=3500."
        },
        {
            id: 14, type: 'order', title: 'Sektör 14', badge: 'Sıralama',
            text: "Aşağıdaki toplama işlemlerinin sonuçlarını BÜYÜKTEN KÜÇÜĞE (1 en büyük, 3 en küçük) doğru sıralayın.",
            items: [
                { q: "2000 + 1000", val: 3000, correctPos: "3" },
                { q: "3000 + 2000", val: 5000, correctPos: "1" },
                { q: "1500 + 2500", val: 4000, correctPos: "2" }
            ],
            exp: "Sırasıyla sonuçlar: 3000, 5000, 4000. Büyükten küçüğe sıralama: 5000 (1. sıra), 4000 (2. sıra), 3000 (3. sıra)."
        },
        {
            id: 15, type: 'input', title: 'Sektör 15', badge: 'Çoklu Toplama',
            text: "Ana motor ateşlemesi için üç güç kaynağını birleştirin:",
            renderStr: "  1245\n  2356\n+ 3108\n------",
            answer: "6709",
            exp: "Birler: 5+6+8=19 (Elde var 1). Onlar: 4+5+0+1(elde)=10 (Elde var 1). Yüzler: 2+3+1+1(elde)=7. Binler: 1+2+3=6. Sonuç: 6709."
        },
        {
            id: 16, type: 'word_input', title: 'Final Sektörü', badge: 'Boss Görevi',
            text: "Uzay gemimiz Dünya'dan Ay'a, oradan Mars'a gidiyor. 1. Aşama için 4550 litre, 2. Aşama için 3875 litre yakıt harcandı. Motorların toplam tükettiği yakıt kaç litredir?",
            answer: "8425",
            exp: "4550 + 3875 alt alta toplanır. Birler: 0+5=5. Onlar: 5+7=12 (Elde 1). Yüzler: 5+8+1=14 (Elde 1). Binler: 4+3+1=8. Toplam: 8425 litre."
        }
    ];

    let state = {
        currentIndex: 0,
        score: 0,
        results: [] // store object: { id, status: 'correct|wrong|skipped', firstTry: boolean, studentAnswer, correct, exp }
    };

    let currentSelection = null; // for MC and TF

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function initGame() {
        state = { currentIndex: 0, score: 0, results: [] };
        tasks.forEach(t => {
            state.results[t.id] = { id: t.id, status: 'pending', firstTry: true, attempts: 0 };
        });
        document.getElementById('report-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        renderTask();
    }

    function renderTask() {
        const t = tasks[state.currentIndex];
        const res = state.results[t.id];
        
        document.getElementById('task-title').innerText = t.title;
        document.getElementById('task-type-badge').innerText = t.badge;
        document.getElementById('current-q-disp').innerText = `${state.currentIndex + 1}/${tasks.length}`;
        document.getElementById('progress-bar').style.width = `${((state.currentIndex) / tasks.length) * 100}%`;
        document.getElementById('score-disp').innerText = state.score;

        const content = document.getElementById('task-content');
        const feedback = document.getElementById('feedback-box');
        const btnCheck = document.getElementById('btn-check');
        
        feedback.style.display = 'none';
        feedback.className = 'feedback-box';
        currentSelection = null;

        let html = '';

        if (t.type === 'mc' || t.type === 'missing_mc') {
            let mathDisplay = '';
            if (t.type === 'mc') {
                mathDisplay = `
                <div class="math-vertical">
                  &nbsp;${t.q1}<br>
                  + ${t.q2}<br>
                  <div class="math-line"></div>
                  &nbsp;????
                </div>`;
            } else {
                mathDisplay = `
                <div class="math-vertical" style="white-space: pre;">${t.renderStr}</div>`;
            }

            let shuffledChoices = shuffle([...t.choices]);
            let optionsHtml = '<div class="options-grid">';
            shuffledChoices.forEach(c => {
                optionsHtml += `<button class="option-btn" onclick="selectOption(this, '${c}')">${c}</button>`;
            });
            optionsHtml += '</div>';
            
            html = mathDisplay + optionsHtml;
        } 
        else if (t.type === 'input') {
            let mathDisplay = '';
            if (t.q1 && t.q2) {
                mathDisplay = `
                <div class="math-vertical">
                  &nbsp;${t.q1}<br>
                  + ${t.q2}<br>
                  <div class="math-line"></div>
                  <input type="text" id="ans-input" class="math-input" autocomplete="off" maxlength="4">
                </div>`;
            } else {
                mathDisplay = `
                <div class="math-vertical" style="white-space: pre; text-align: left; padding-left: 60px;">${t.renderStr}
<input type="text" id="ans-input" class="math-input" style="width: 180px;" autocomplete="off" maxlength="5"></div>`;
            }
            html = `<p>${t.text || ''}</p>` + mathDisplay;
        }
        else if (t.type === 'tf' || t.type === 'word_mc') {
            html = `<p style="font-size: 1.5rem;">${t.text}</p>`;
            let choices = t.type === 'tf' ? ['Doğru', 'Yanlış'] : shuffle([...t.choices]);
            html += '<div class="options-grid">';
            choices.forEach(c => {
                html += `<button class="option-btn" onclick="selectOption(this, '${c}')">${c}</button>`;
            });
            html += '</div>';
        }
        else if (t.type === 'word_input') {
            html = `<p style="font-size: 1.5rem;">${t.text}</p>
            <div class="input-group">
                <input type="text" id="ans-input" class="math-input" style="text-align:center; font-family: sans-serif; letter-spacing: normal;" placeholder="Cevap" autocomplete="off">
            </div>`;
        }
        else if (t.type === 'match') {
            html = `<p>${t.text}</p><div style="text-align: left; max-width: 400px; margin: 0 auto;">`;
            t.items.forEach((item, i) => {
                html += `<div class="match-row">
                    <span>${item.q} = </span>
                    <select id="match-${i}">
                        <option value="">Seçiniz...</option>
                        ${t.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                    </select>
                </div>`;
            });
            html += `</div>`;
        }
        else if (t.type === 'order') {
            html = `<p>${t.text}</p><div style="text-align: left; max-width: 400px; margin: 0 auto;">`;
            t.items.forEach((item, i) => {
                html += `<div class="order-row">
                    <span>${item.q}</span>
                    <select id="order-${i}">
                        <option value="">Sıra...</option>
                        <option value="1">1. (En Büyük)</option>
                        <option value="2">2.</option>
                        <option value="3">3. (En Küçük)</option>
                    </select>
                </div>`;
            });
            html += `</div>`;
        }

        content.innerHTML = html;

        // Setup Buttons based on state
        document.getElementById('btn-prev').disabled = state.currentIndex === 0;
        
        if (res.status === 'correct' || res.status === 'skipped') {
            btnCheck.disabled = true;
            document.getElementById('btn-skip').disabled = true;
            document.getElementById('btn-next').disabled = false;
            if (res.status === 'correct') {
                showFeedback(`Bu sektörü zaten onardın. (Cevap: ${t.answer || 'Sıralama'})`, 'success');
            } else {
                showFeedback(`Bu sektörü geçmiştin.`, 'error');
            }
            disableInputs();
        } else {
            btnCheck.disabled = false;
            document.getElementById('btn-skip').disabled = false;
            document.getElementById('btn-next').disabled = true;
        }
    }

    function selectOption(btn, val) {
        const t = tasks[state.currentIndex];
        const res = state.results[t.id];
        if (res.status === 'correct' || res.status === 'skipped') return;

        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentSelection = val;
    }

    function getStudentAnswer(t) {
        if (t.type === 'mc' || t.type === 'missing_mc' || t.type === 'tf' || t.type === 'word_mc') {
            return currentSelection;
        } else if (t.type === 'input' || t.type === 'word_input') {
            let el = document.getElementById('ans-input');
            return el ? el.value.trim() : null;
        } else if (t.type === 'match') {
            let ans = [];
            for (let i=0; i<t.items.length; i++) {
                let val = document.getElementById(`match-${i}`).value;
                if(!val) return null;
                ans.push(val);
            }
            return ans.join(',');
        } else if (t.type === 'order') {
            let ans = [];
            for (let i=0; i<t.items.length; i++) {
                let val = document.getElementById(`order-${i}`).value;
                if(!val) return null;
                ans.push(val);
            }
            return ans.join(',');
        }
        return null;
    }

    function checkCorrectness(t, ans) {
        if (t.type === 'match') {
            let arr = ans.split(',');
            return arr.every((v, i) => v === t.items[i].a);
        } else if (t.type === 'order') {
            let arr = ans.split(',');
            return arr.every((v, i) => v === t.items[i].correctPos);
        } else {
            return ans.toString().toLowerCase() === t.answer.toString().toLowerCase();
        }
    }

    function checkAnswer() {
        const t = tasks[state.currentIndex];
        const res = state.results[t.id];
        
        let stuAns = getStudentAnswer(t);

        if (!stuAns) {
            showFeedback("Lütfen bir cevap girin veya seçin!", "error");
            return;
        }

        res.attempts++;
        let isCorrect = checkCorrectness(t, stuAns);

        if (isCorrect) {
            if (res.status !== 'correct') {
                res.status = 'correct';
                res.studentAnswer = stuAns;
                if (res.firstTry) {
                    state.score += 10;
                }
            }
            document.getElementById('score-disp').innerText = state.score;
            showFeedback("Sistem Başarıyla Onarıldı!", "success");
            document.getElementById('btn-next').disabled = false;
            document.getElementById('btn-skip').disabled = true;
            document.getElementById('btn-check').disabled = true;
            disableInputs();
            
            // Auto advance after short delay if not last
            if (state.currentIndex < tasks.length - 1) {
                setTimeout(goNext, 1500);
            } else {
                setTimeout(finishGame, 1500);
            }

        } else {
            res.firstTry = false;
            res.studentAnswer = stuAns; // store last wrong
            showFeedback(`HATA TESPİT EDİLDİ!<br>${t.exp}<br>Lütfen tekrar deneyin.`, "error");
            
            if (t.type === 'mc' || t.type === 'missing_mc' || t.type === 'tf' || t.type === 'word_mc') {
                let selectedBtn = document.querySelector('.option-btn.selected');
                if(selectedBtn) {
                    selectedBtn.classList.remove('selected');
                    selectedBtn.classList.add('wrong');
                    currentSelection = null;
                }
            }
        }
    }

    function skipTask() {
        const t = tasks[state.currentIndex];
        const res = state.results[t.id];
        
        res.status = 'skipped';
        res.firstTry = false;
        
        goNext();
    }

    function goNext() {
        if (state.currentIndex < tasks.length - 1) {
            state.currentIndex++;
            renderTask();
        } else {
            finishGame();
        }
    }

    function goPrev() {
        if (state.currentIndex > 0) {
            state.currentIndex--;
            renderTask();
        }
    }

    function disableInputs() {
        document.querySelectorAll('input, select, button.option-btn').forEach(el => {
            el.disabled = true;
            if(el.tagName === 'BUTTON' && currentSelection && el.innerText === currentSelection) {
                el.classList.add('correct');
            }
        });
    }

    function showFeedback(msg, type) {
        const fb = document.getElementById('feedback-box');
        fb.innerHTML = msg;
        fb.className = `feedback-box ${type}`;
        fb.style.display = 'block';
    }

    function finishGame() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('report-screen').style.display = 'block';
        
        let correctCount = 0;
        let firstTryCount = 0;
        let wrongCount = 0;
        let skippedCount = 0;
        let reviewHtml = '';

        tasks.forEach(t => {
            const res = state.results[t.id];
            if (res.status === 'correct') {
                correctCount++;
                if (res.firstTry) firstTryCount++;
                else {
                    wrongCount++;
                    reviewHtml += createReviewItem(t, res, false);
                }
            } else if (res.status === 'skipped') {
                skippedCount++;
                reviewHtml += createReviewItem(t, res, true);
            } else {
                // Should not happen, but just in case
                skippedCount++;
                reviewHtml += createReviewItem(t, res, true);
            }
        });

        document.getElementById('rep-correct').innerText = firstTryCount;
        document.getElementById('rep-wrong').innerText = wrongCount;
        document.getElementById('rep-skipped').innerText = skippedCount;
        
        const reviewContainer = document.getElementById('review-list');
        if (reviewHtml === '') {
            reviewContainer.innerHTML = '<p style="text-align:center; color: var(--success); font-size:1.2rem;">Harika iş çıkardın ajan! Tüm sistemler ilk seferde mükemmel şekilde onarıldı.</p>';
        } else {
            reviewContainer.innerHTML = reviewHtml;
        }
        
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('current-q-disp').innerText = 'TAMAMLANDI';
    }

    function createReviewItem(t, res, isSkipped) {
        let title = isSkipped ? 'Geçildi' : 'Yanlış Deneme Yapıldı';
        let cls = isSkipped ? 'skipped' : '';
        let correctAns = t.answer;
        if(t.type === 'match' || t.type === 'order') {
            correctAns = "Sıralama/Eşleştirme kurallarına bakınız.";
        }

        return `
        <div class="review-item ${cls}">
            <h4>${t.title} - ${t.badge} (${title})</h4>
            <p><strong>Senin Cevabın:</strong> ${res.studentAnswer || 'Yok'}</p>
            <p><strong>Doğru Cevap:</strong> ${correctAns}</p>
            <div class="review-explanation">${t.exp}</div>
            <button class="btn btn-skip" style="margin-top: 10px; padding: 5px 10px; font-size: 0.9rem;" onclick="revisitTask(${t.id})">Göreve Dön ve İncele</button>
        </div>`;
    }

    function revisitTask(taskId) {
        let index = tasks.findIndex(t => t.id === taskId);
        if(index !== -1) {
            state.currentIndex = index;
            document.getElementById('report-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            renderTask();
        }
    }

    // Initialize the game on load
    window.onload = initGame;

</script>
</body>
</html>
