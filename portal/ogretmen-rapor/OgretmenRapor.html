<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><base target="_top">
<style>body{font:15px Arial;margin:20px;color:#20344b}table{border-collapse:collapse;width:100%;margin:12px 0 26px}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}th{background:#edf3fa}.stats{display:flex;gap:22px;flex-wrap:wrap}section{margin:22px 0}</style></head><body>
<h1>4/D Öğretmen Raporu</h1><p id="status">Yükleniyor...</p>
<div class="stats"><p>Öğrenci: <strong id="count">—</strong></p><p>Geçerli sonuç: <strong id="results">—</strong></p></div>
<section><h2>Kazanımlar</h2><table><thead><tr><th>Etkinlik</th><th>Kazanım</th><th>Katılım</th><th>Deneme</th><th>Doğru oranı</th></tr></thead><tbody id="outcomes"></tbody></table></section>
<section><h2>Öğrenciler</h2><table><thead><tr><th>Öğrenci</th><th>Farklı etkinlik</th><th>Deneme</th><th>Doğru oranı</th></tr></thead><tbody id="students"></tbody></table></section>
<script>
"use strict";
function renderRows(id,items){const target=document.getElementById(id);items.forEach(function(row){const tr=document.createElement('tr');row.forEach(function(v){const td=document.createElement('td');td.textContent=String(v);tr.appendChild(td)});target.appendChild(tr)})}
function ratio(a,b){return b?(100*a/b).toFixed(1)+'%':'—'}
google.script.run.withSuccessHandler(function(r){
 document.getElementById('status').textContent='Rapor güncel. MİSAFİR kayıtları hariç.';
 document.getElementById('count').textContent=r.studentCount;
 document.getElementById('results').textContent=r.recordCount;
 renderRows('outcomes',r.outcomes.map(x=>[x.activityId,x.outcome,x.participantCount,x.attempts,ratio(x.correct,x.total)]));
 renderRows('students',r.students.map(x=>[x.ad,x.activityCount,x.attemptCount,ratio(x.correct,x.total)]));
}).withFailureHandler(function(e){document.getElementById('status').textContent='Rapor hatası: '+(e&&e.message||'Bilinmiyor')}).ogretmenRaporVerisi();
</script></body></html>
