<!DOCTYPE html>
<html lang="tr"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4/D Öğrenci Girişi</title>
<style>
body{font-family:Arial,sans-serif;background:#eef4ff;min-height:100vh;margin:0;display:grid;place-items:center}body.oyunda{display:block;background:#0b172b}
.kutu{background:#fff;width:min(780px,92%);padding:30px;border-radius:18px;text-align:center;box-shadow:0 8px 25px #0002}
input{box-sizing:border-box;width:100%;padding:15px;font-size:22px;text-align:center;text-transform:uppercase;letter-spacing:3px;border:2px solid #b7c8e0;border-radius:10px}
button{margin-top:16px;padding:14px 24px;background:#2459a6;color:#fff;border:0;border-radius:10px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#cikis{background:#5a6b7f}#sonuc{margin-top:18px;line-height:1.5}[hidden]{display:none!important}
a{color:#2459a6}#oyunPanel{position:fixed;inset:0;z-index:50;background:#081427;color:white;display:flex;flex-direction:column}#oyunUst{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 14px;background:#10243d}#oyunCer{display:block;border:0;flex:1;width:100%;min-height:0}#oyunDurum{margin:0;padding:8px 14px;background:#173a52;color:white}#oyunPanel button{margin:0;padding:10px 14px;background:#4a6078}
</style></head><body><main class="kutu">
<h1>🎒 4/D Sınıfı</h1><h2>Öğrenci Girişi</h2>
<div id="girisAlani"><p>6 karakterli kodunu yaz.</p><input id="kod" maxlength="6" autocomplete="off" autocapitalize="characters" aria-label="Öğrenci kodu"><button id="giris" type="button">Giriş Yap</button></div>
<div id="oturumAlani" hidden>
<button id="oyunuAc" type="button">🎮 Matematik Oyununu Aç</button>
<p>Oyun ekranı tam sayfa açılır. Sonuç otomatik kaydedilir.</p>
</div>
<div id="oyunPanel" hidden><div id="oyunUst"><strong>🎮 Matematik • Kayıp Sayılar</strong><button id="oyundanDon" type="button">Portala Dön</button></div><iframe id="oyunCer" title="Matematik oyunu" referrerpolicy="no-referrer"></iframe><p id="oyunDurum" role="status"></p></div>
<button id="cikis" type="button" hidden>Güvenli Çıkış Yap</button>
<p id="sonuc" role="status" aria-live="polite"></p>
</main><script>
"use strict";
const buton=document.getElementById("giris"),cikisButonu=document.getElementById("cikis"),sonuc=document.getElementById("sonuc"),kodAlani=document.getElementById("kod"),girisAlani=document.getElementById("girisAlani"),oturumAlani=document.getElementById("oturumAlani"),anahtarAdi="4d_ogrenci_oturumu";
const tokenFormat=/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}-[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
function ekranGoster(oturumVar){girisAlani.hidden=oturumVar;oturumAlani.hidden=!oturumVar;cikisButonu.hidden=!oturumVar;if(!oturumVar){oyunPanel.hidden=true;document.body.classList.remove("oyunda");oyunCer.removeAttribute("src");}}
function tokenTemizle(){sessionStorage.removeItem(anahtarAdi);ekranGoster(false);kodAlani.value=""}
function girisYap(){
 if(buton.disabled)return;
 const kod=kodAlani.value.trim().toUpperCase();
 if(!/^[A-Z0-9]{6}$/.test(kod)){sonuc.textContent="6 karakterli kodunu yaz.";return}
 buton.disabled=true;sonuc.textContent="Giriş kontrol ediliyor...";
 google.script.run.withSuccessHandler(function(cevap){
  buton.disabled=false;
  if(cevap&&cevap.basarili===true&&typeof cevap.token==="string"&&tokenFormat.test(cevap.token)){
   sessionStorage.setItem(anahtarAdi,cevap.token);kodAlani.value="";ekranGoster(true);
   sonuc.textContent="✅ Hoş geldin, "+(cevap.ogrenciAdi||"öğrenci")+".";
  }else{sonuc.textContent=cevap&&cevap.mesaj?cevap.mesaj:"Giriş doğrulanamadı."}
 }).withFailureHandler(function(){buton.disabled=false;sonuc.textContent="Giriş sırasında hata oluştu. Tekrar dene."}).ogrenciGirisiYap(kod);
}
function cikisYap(){
 const token=sessionStorage.getItem(anahtarAdi);
 if(!token){tokenTemizle();sonuc.textContent="Çıkış yapıldı.";return}
 cikisButonu.disabled=true;sonuc.textContent="Oturum kapatılıyor...";
 google.script.run.withSuccessHandler(function(tamam){
  cikisButonu.disabled=false;
  if(tamam===true){tokenTemizle();sonuc.textContent="✅ Güvenli çıkış yapıldı."}
  else{sonuc.textContent="Çıkış doğrulanamadı. Tekrar dene."}
 }).withFailureHandler(function(){cikisButonu.disabled=false;sonuc.textContent="Sunucuda çıkış doğrulanamadı. Tekrar dene."}).cikisYap(token);
}
buton.addEventListener("click",girisYap);cikisButonu.addEventListener("click",cikisYap);
kodAlani.addEventListener("keydown",function(e){if(e.key==="Enter")girisYap()});
const oyunButonu=document.getElementById("oyunuAc"),oyunCer=document.getElementById("oyunCer"),oyunDurum=document.getElementById("oyunDurum"),oyunPanel=document.getElementById("oyunPanel");
let gonderiliyor=false;
oyunButonu.addEventListener("click",function(){
 if(!sessionStorage.getItem(anahtarAdi)){oyunDurum.textContent="Önce giriş yap.";return}
 oyunPanel.hidden=false;document.body.classList.add("oyunda");oyunButonu.disabled=true;
 oyunDurum.textContent="Oyun açılıyor. Bitirdiğinde sonucun otomatik gönderilecek.";
 oyunCer.src="https://ismailkaya33.github.io/4.SINIF/test/kayipsayilar.html";
});
window.addEventListener("message",function(e){
 if(oturumAlani.hidden||gonderiliyor||e.origin!=="https://ismailkaya33.github.io"||e.source!==oyunCer.contentWindow)return;
 const d=e.data;
 if(!d||d.type!=="4d:activity-finished"||d.schemaVersion!==1||d.activityId!=="mat-kayipsayilar"||typeof d.attemptId!=="string"||!/^[A-Za-z0-9_-]{12,80}$/.test(d.attemptId))return;
 const token=sessionStorage.getItem(anahtarAdi);
 if(!token)return;
 const veri={activityId:d.activityId,attemptId:d.attemptId,correct:d.correct,wrong:d.wrong,total:d.total,wrongAttempts:d.wrongAttempts,firstTry:d.firstTry,durationSeconds:d.durationSeconds};
 gonderiliyor=true;oyunDurum.textContent="Sonuç kaydediliyor...";
 google.script.run.withSuccessHandler(function(r){
  gonderiliyor=false;
  if(r&&r.basarili){oyunDurum.textContent=r.tekrar?"Sonuç zaten kaydedilmiş.":"✅ Etkinlik sonucu öğretmene kaydedildi.";}
  else{oyunDurum.textContent="Sonuç kaydedilemedi. Oturumunu kontrol et.";}
 }).withFailureHandler(function(){gonderiliyor=false;oyunDurum.textContent="Kayıt bağlantısında sorun oldu. Öğretmenine haber ver."}).etkinlikSonucuKaydet(token,veri);
});

document.getElementById("oyundanDon").addEventListener("click",function(){oyunPanel.hidden=true;document.body.classList.remove("oyunda");oyunButonu.disabled=false;oyunCer.removeAttribute("src");});
const mevcutToken=sessionStorage.getItem(anahtarAdi);
if(mevcutToken){
 buton.disabled=true;sonuc.textContent="Oturum kontrol ediliyor...";
 google.script.run.withSuccessHandler(function(cevap){
  buton.disabled=false;
  if(cevap&&cevap.basarili===true){ekranGoster(true);sonuc.textContent="✅ Hoş geldin, "+(cevap.ogrenciAdi||"öğrenci")+"."}
  else{tokenTemizle();sonuc.textContent="Oturum süresi dolmuş. Yeniden giriş yap."}
 }).withFailureHandler(function(){buton.disabled=false;sonuc.textContent="Oturum kontrol edilemedi. Sayfayı yenile."}).oturumBilgisi(mevcutToken);
}
</script></body></html>
