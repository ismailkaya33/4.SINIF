<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Örnek Etkinlik – İskelet</title>
<style>
:root{--bg:#f4f6fa;--kart:#fff;--yazi:#1c2430;--cizgi:#c9d1dc;--mavi:#2b5fd9;--ok:#1b7f4b;--hata:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--kart:#1b212a;--yazi:#e8ecf2;--cizgi:#3a4350;--mavi:#7ba2ff;--ok:#6fdc9f;--hata:#ff9a92}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);font:18px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:16px;margin:12px 0}
h1{font-size:1.5rem;margin:0 0 6px}
.soru{font-size:1.6rem;font-weight:700;margin:8px 0 14px}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.sec{grid-template-columns:1fr}}
button{font:inherit;min-height:56px;border-radius:14px;border:2px solid var(--mavi);background:var(--kart);color:var(--yazi);cursor:pointer;padding:6px 12px}
button.dolu{background:var(--mavi);color:#fff}
button.yanlis{border-color:var(--hata);opacity:.55}
button.dogru{border-color:var(--ok);background:var(--ok);color:#fff}
button:disabled{cursor:default}
.ust{display:flex;justify-content:space-between;font-size:.95rem;opacity:.85}
.gb{min-height:3.2em;margin-top:10px;font-weight:600}
.gb.ok{color:var(--ok)}.gb.hata{color:var(--hata)}
.ipucu{margin-top:8px}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*@@RAPOR_MOTORU@@*/
</script>
<script>
'use strict';
/* ===== VERİ (öğretmen yalnızca burayı düzenler; motor aşağıda) ===== */
const OYUN = {
  /* id: portal kayıt listesindeki (portal/etkinlik-kayitlari.json) kimlikle aynı olmalı, ör. "mat-yuvarlama" */
  id: 'ornek-iskelet', ad: 'Örnek Etkinlik: Toplama ve Yuvarlama',
  /* kod = MEB kazanım kodu. Aşağıdakiler yalnızca örnektir; gerçek kodu programdan al. */
  kazanimlar: [
    { kod: 'ÖRNEK.1', ad: 'Eldeli toplama işlemi yapar' },
    { kod: 'ÖRNEK.2', ad: 'Sayıları en yakın onluğa yuvarlar' }
  ],
  maddeler: [
    { id: 'a1', kaz: 'ÖRNEK.1', soru: '47 + 36 = ?', dogru: '83',
      yanlislar: [['73', 'elde-unuttu'], ['93', 'elde-fazla'], ['82', 'islem-hatasi']],
      ipucu: 'Birler basamağı: 7 + 6 = 13. 3 yaz, 1 elde.', why: '7+6=13 → 3 yazılır, 1 onluk eldedir. 4+3+1=8 onluk → 83.' },
    { id: 'a2', kaz: 'ÖRNEK.1', soru: '58 + 25 = ?', dogru: '83',
      yanlislar: [['73', 'elde-unuttu'], ['93', 'elde-fazla'], ['84', 'islem-hatasi']],
      ipucu: 'Önce birleri topla: 8 + 5.', why: '8+5=13 → 3 yaz, 1 elde; 5+2+1=8 onluk → 83.' },
    { id: 'a3', kaz: 'ÖRNEK.1', soru: '65 + 27 = ?', dogru: '92',
      yanlislar: [['82', 'elde-unuttu'], ['102', 'elde-fazla'], ['91', 'islem-hatasi']],
      ipucu: '5 + 7 = 12 eder. Elde var mı?', why: '5+7=12 → 2 yaz, 1 elde; 6+2+1=9 onluk → 92.' },
    { id: 'a4', kaz: 'ÖRNEK.1', soru: '79 + 14 = ?', dogru: '93',
      yanlislar: [['83', 'elde-unuttu'], ['103', 'elde-fazla'], ['92', 'islem-hatasi']],
      ipucu: '9 + 4 = 13, 1 elde.', why: '9+4=13 → 3 yaz, 1 elde; 7+1+1=9 onluk → 93.' },
    { id: 'b1', kaz: 'ÖRNEK.2', soru: '47 sayısı en yakın hangi onluğa yuvarlanır?', dogru: '50',
      yanlislar: [['40', 'hep-asagi'], ['60', 'islem-hatasi'], ['45', 'yuvarlamadi']],
      ipucu: 'Birler basamağına bak: 7, 5\'ten büyük mü?', why: 'Birler 5 veya daha büyükse onluk bir yukarı çıkar: 47 → 50.' },
    { id: 'b2', kaz: 'ÖRNEK.2', soru: '83 sayısı en yakın hangi onluğa yuvarlanır?', dogru: '80',
      yanlislar: [['90', 'hep-yukari'], ['70', 'islem-hatasi'], ['85', 'yuvarlamadi']],
      ipucu: 'Birler basamağı 3, 5\'ten küçük.', why: 'Birler 5\'ten küçükse onluk aynı kalır: 83 → 80.' },
    { id: 'b3', kaz: 'ÖRNEK.2', soru: '65 sayısı en yakın hangi onluğa yuvarlanır?', dogru: '70',
      yanlislar: [['60', 'bes-asagi'], ['65', 'yuvarlamadi'], ['75', 'islem-hatasi']],
      ipucu: 'Birler basamağı tam 5.', why: 'Birler basamağı 5 ise yukarı yuvarlanır: 65 → 70.' },
    { id: 'b4', kaz: 'ÖRNEK.2', soru: '92 sayısı en yakın hangi onluğa yuvarlanır?', dogru: '90',
      yanlislar: [['100', 'hep-yukari'], ['80', 'islem-hatasi'], ['95', 'yuvarlamadi']],
      ipucu: 'Birler basamağı 2.', why: 'Birler 5\'ten küçük: 92 → 90.' }
  ]
};

/* ===== MOTOR ===== */
const app = document.getElementById('app');
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
let sira = [], idx = 0, durum = null;
/* Güvenli depolama: kapalıysa bellekte çalışır, oyun bozulmaz */
const depo = (() => { const mem = {}; return {
  oku(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; } catch (e) { return mem[k] ?? null; } },
  yaz(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* depolama kapalı */ } } }; })();
const DEPO_REKOR = 'rekor-' + OYUN.id;

function baslangic() {
  const rekor = depo.oku(DEPO_REKOR);
  app.innerHTML = '<div class="kart"><h1>' + esc(OYUN.ad) + '</h1><p>' + OYUN.maddeler.length + ' soru. Yanlış yaparsan ipucu alıp yeniden deneyebilirsin.</p>' +
    (rekor ? '<p>Önceki en iyi sonucun: ' + esc(rekor) + ' ilk denemede doğru.</p>' : '') +
    '<p><button class="dolu" id="basla">Başla</button></p></div>';
  document.getElementById('basla').onclick = () => {
    RaporMotoru.init({ oyunId: OYUN.id, oyunAdi: OYUN.ad, kazanimlar: OYUN.kazanimlar });
    sira = shuffle(OYUN.maddeler); idx = 0; soru();
  };
}

function soru() {
  if (idx >= sira.length) {
    RaporMotoru.ekranCiz(app);
    const ilk = RaporMotoru.ozet().reduce((t, x) => t + x.dogru, 0), eski = parseInt(depo.oku(DEPO_REKOR), 10) || 0;
    if (ilk > eski) depo.yaz(DEPO_REKOR, String(ilk));
    const yeniden = document.createElement('button'); yeniden.className = 'dolu'; yeniden.textContent = '↻ Yeniden oyna';
    yeniden.onclick = baslangic; app.appendChild(yeniden);
    return;
  }
  const m = sira[idx];
  const sec = shuffle([[m.dogru, '']].concat(m.yanlislar));          // seçenekler HER SORUDA karışır
  durum = { m, sec, deneme: 0, ipucu: 0, ilkYanilgi: '', kilit: false, t0: Date.now() };
  app.innerHTML = '<div class="ust"><span>Soru ' + (idx + 1) + ' / ' + sira.length + '</span></div><div class="kart"><div class="soru">' + esc(m.soru) + '</div><div class="sec">' +
    sec.map((s, i) => '<button data-i="' + i + '" aria-label="Seçenek ' + (i + 1) + ': ' + esc(s[0]) + '">' + (i + 1) + ') ' + esc(s[0]) + '</button>').join('') +
    '</div><div class="ipucu"><button id="ip">💡 İpucu</button></div><div class="gb" id="gb" aria-live="polite"></div></div>';
  app.querySelectorAll('.sec button').forEach(b => { b.onclick = () => sec_(+b.dataset.i); });
  document.getElementById('ip').onclick = ipucuVer;
}

function ipucuVer() {
  if (!durum || durum.kilit) return;
  durum.ipucu = Math.min(1, durum.ipucu + 1);                    // bu örnekte tek kademe; gerçek oyunda ≤3
  const gb = document.getElementById('gb'); gb.className = 'gb'; gb.textContent = '💡 ' + durum.m.ipucu;
}

function sec_(i) {
  if (!durum || durum.kilit) return;                              // çift tıklama kilidi
  const [metin, yan] = durum.sec[i], btn = app.querySelectorAll('.sec button')[i], gb = document.getElementById('gb');
  durum.deneme++;
  if (metin === durum.m.dogru) { btn.classList.add('dogru'); bitir(false, 'ok', '✅ Doğru! ' + durum.m.why); return; }
  btn.classList.add('yanlis'); btn.disabled = true;
  if (!durum.ilkYanilgi) durum.ilkYanilgi = yan;
  if (durum.deneme >= 2) {                                        // 2. yanlış → çözümü göster
    app.querySelectorAll('.sec button').forEach((b, k) => { if (durum.sec[k][0] === durum.m.dogru) b.classList.add('dogru'); });
    bitir(true, 'hata', 'Çözüme bakalım: ' + durum.m.why); return;
  }
  gb.className = 'gb hata'; gb.textContent = 'Henüz değil. Bir daha dene; istersen ipucu al.';   // cevabı gösterme
}

function bitir(cozumGoruldu, sinif, mesaj) {
  durum.kilit = true;
  RaporMotoru.kaydet({ kazanim: durum.m.kaz, madde: durum.m.id, yanilgi: durum.ilkYanilgi,
    ilkDenemeDogru: durum.deneme === 1 && !cozumGoruldu, deneme: durum.deneme, ipucu: durum.ipucu,
    cozumGoruldu, sureMs: Date.now() - durum.t0 });
  const gb = document.getElementById('gb'); gb.className = 'gb ' + sinif; gb.textContent = mesaj;
  app.querySelectorAll('.sec button').forEach(b => { b.disabled = true; });
  const dev = document.createElement('button'); dev.className = 'dolu'; dev.textContent = idx + 1 < sira.length ? 'Devam →' : 'Karnemi gör';
  dev.id = 'dev'; dev.onclick = () => { idx++; soru(); }; gb.after(dev); dev.focus();
}

document.addEventListener('keydown', e => {                       // klavye: 1-4 seçenek, Enter devam
  if (e.key >= '1' && e.key <= '4' && durum && !durum.kilit && document.querySelector('.sec')) sec_(+e.key - 1);
  else if (e.key === 'Enter') { const d = document.getElementById('dev'); if (d) d.click(); }
});
baslangic();
</script>
</body>
</html>
