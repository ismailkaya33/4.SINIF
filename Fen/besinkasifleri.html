<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Besin Kaşifleri: Görev Haritası</title>
<style>
:root{--mint:#2bb673;--mint-dark:#1d8f58;--orange:#ff9a3c;--orange-dark:#d9771a;--sky:#4aa8e0;--sky-dark:#2b83b8;--ink:#23332b;--paper:#fff;--bg:#eefaf3;--line:#cfe6d8;--bad:#e5533d;--gold:#ffc83d;--soft:#fff6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf6ee;--paper:#1f2d26;--bg:#14201a;--line:#35503f;--soft:#2c2a1f}}
:root[data-theme="dark"]{--ink:#eaf6ee;--paper:#1f2d26;--bg:#14201a;--line:#35503f;--soft:#2c2a1f}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font:600 19px/1.55 Nunito,Quicksand,"Trebuchet MS",system-ui,sans-serif;min-height:100vh}
body.presenting{font-size:24px}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px clamp(12px,3vw,32px);background:var(--paper);border-bottom:3px solid var(--line)}
.topbar h1{font-size:1.3rem;margin:0;flex:1 1 220px}.hud{font-weight:800;background:var(--soft);border-radius:999px;padding:6px 16px}
.btn{min-height:52px;padding:10px 20px;border:2px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 5px 0 var(--line);font-weight:800;text-align:left;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}.btn:disabled{cursor:default}
.btn.go{background:var(--mint);border-color:var(--mint-dark);box-shadow:0 5px 0 var(--mint-dark);color:#fff}
.btn.sun{background:var(--orange);border-color:var(--orange-dark);box-shadow:0 5px 0 var(--orange-dark);color:#1c1405}
.btn.good{background:#d4f5e2;border-color:var(--mint);box-shadow:0 5px 0 var(--mint-dark);color:#0f4a2c}
.btn.bad{background:#fde1dc;border-color:var(--bad);box-shadow:0 5px 0 var(--bad);color:#6d160a;animation:shake .4s}
main{max-width:1040px;margin:0 auto;padding:22px clamp(12px,3vw,32px) 60px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 6px 0 var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px;margin:24px 0;padding:24px;border-radius:32px;background:radial-gradient(circle at 20% 10%,#c9f1dc,transparent 40%),radial-gradient(circle at 90% 90%,#ffe8c4,transparent 40%),var(--paper);border:3px dashed var(--line)}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:3px solid var(--line);border-radius:28px;background:var(--paper);padding:16px 10px;box-shadow:0 7px 0 var(--line);min-height:150px}
.node:nth-child(even){transform:translateY(16px)}.node:hover{border-color:var(--mint)}.node.done{border-color:var(--mint);background:#e6f9ee;color:#0f4a2c}
.stars{color:var(--gold);letter-spacing:2px;text-shadow:0 1px 0 #a67c00}
.tag{background:var(--soft);border-radius:16px;padding:10px 16px}
.feedback{min-height:1.6em;font-weight:800}
.options{display:grid;gap:12px;margin:14px 0}.options .btn{width:100%}
.progress{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 14px}.progress i{display:block;height:100%;background:var(--mint);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:12px;min-height:70px;padding:12px;border-radius:20px;background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:56px;padding:8px 16px;border-radius:18px;border:2px solid var(--orange-dark);background:#fff3dc;color:#3a2606;box-shadow:0 5px 0 var(--orange-dark);font-weight:800;touch-action:none;user-select:none;cursor:grab}
.chip.selected{outline:4px solid var(--sky)}.chip.lifting{opacity:.35}.chip.placed{background:#d4f5e2;border-color:var(--mint-dark);box-shadow:0 3px 0 var(--mint-dark);cursor:default;color:#0f4a2c}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(-4deg) scale(1.08);box-shadow:0 14px 24px #0005}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.zone{min-height:130px;padding:10px;border:3px dashed var(--sky-dark);border-radius:22px;background:color-mix(in srgb,var(--sky) 12%,var(--paper));display:flex;flex-direction:column;gap:8px}
.zone.over{background:color-mix(in srgb,var(--gold) 40%,var(--paper));border-style:solid}.zone.shake{animation:shake .4s}.zone b{font-size:1.05rem}
.plate{width:min(100%,260px);aspect-ratio:1;border-radius:50%;border:10px solid #fff;box-shadow:0 0 0 4px var(--line),0 8px 0 4px var(--line);align-self:center;justify-content:center;align-items:center;text-align:center;font-size:.9rem}
.plate .chip{min-height:40px;padding:4px 10px}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
table{border-collapse:collapse;width:100%}td,th{border:2px solid var(--line);padding:8px 12px;text-align:left}
.spark{position:fixed;z-index:60;pointer-events:none;color:var(--gold);font-size:28px;animation:burst .9s ease-out forwards}
.badge{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#0008}.badge .card{text-align:center;max-width:420px;animation:pop .5s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){.node:nth-child(even){transform:none}}
#print-area{display:none}
@page{size:A4 portrait;margin:12mm}@page landscape{size:A4 landscape;margin:10mm}
@media print{body>*:not(#print-area){display:none!important}body{background:#fff;color:#000;font:12pt/1.5 Arial,sans-serif}
#print-area{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}#print-area.landscape{page:landscape}
.sheet{break-after:page;break-inside:avoid;max-height:270mm;overflow:hidden}.sheet:last-child{break-after:auto}
.sheet h2{font-size:15pt;margin:0 0 4mm;border-bottom:2px solid #000}
.lined{line-height:8mm;background:repeating-linear-gradient(transparent,transparent calc(8mm - 1px),#8fb6dd calc(8mm - 1px),#8fb6dd 8mm);padding-left:4mm;border-left:2px solid #e06a6a}
.lined p,.lined ul,.lined table{margin:0}.lined td,.lined th{border:1px solid #000;padding:0 2mm;line-height:8mm}
.mindmap{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm;margin-top:6mm}.mindmap .core{grid-column:2/4;text-align:center;font-weight:700;font-size:16pt;border:3px solid #000;border-radius:8mm;padding:4mm}
.mindmap div{border:2px solid #000;border-radius:5mm;padding:3mm;break-inside:avoid;font-size:10.5pt;line-height:1.35}.mindmap i{display:block;font-size:9pt}}
</style></head><body>

ate(-35 14 15)\"/>","muz":"<ellipse cx=\"20\" cy=\"37.5\" rx=\"12\" ry=\"2\" fill=\"#0002\"/><path d=\"M6 12q10 24 30 16-2 6-10 8Q8 38 6 12z\" fill=\"#ffd35c\" stroke=\"#c9a021\" stroke-width=\"2\"/><ellipse cx=\"14\" cy=\"15\" rx=\"5\" ry=\"2.5\" fill=\"#fff\" opacity=\".35\" transform=\"rotate(-35 14 15)\"/>","ispanak":"<ellipse cx=\"20\" cy=\"37.5\" rx=\"12\" ry=\"2\" fill=\"#0002\"/><path d=\"M6 34Q6 6 34 6q0 28-28 28z\" fill=\"#4b9a4c\"/><path d=\"M6 34L26 14\" stroke=\"#2f7d4f\" stroke-width=\"2\"/><ellipse cx=\"14\" cy=\"15\" rx=\"5\" ry=\"2.5\" fill=\"#fff\" opacity=\".35\" transform=\"rotate(-35 14 15)\"/>"},"iconNames":{"yumurta":"Yumurta","mercimek":"Mercimek","yogurt":"Yoğurt","ekmek":"Ekmek","zeytinyagi":"Zeytinyağı","ceviz":"Ceviz","elma":"Elma","havuc":"Havuç","domates":"Domates","su":"Su damlası","sut":"Süt","muz":"Muz","ispanak":"Ispanak"},"outcomes":{"1":"F.4.2.1.1 Besin içerikleri","2":"F.4.2.1.2 Su ve mineraller","3":"F.4.2.1.3 Tazelik ve güvenlik","4":"F.4.2.1.4 Dengeli beslenme ve israf","5":"F.4.2.1.5 Sigara ve alkol","6":"F.4.2.1.6 Çevrede sorumluluk"},"groups":["Süt ve yoğurt","Et, yumurta, baklagil","Ekmek ve tahıl","Sebze","Meyve"],"preQuestions":[{"question":"Yediğimiz besinler vücudumuzda ne işe yarar?","options":["Büyümemize ve enerji kazanmamıza yardım eder","Sadece karnımızı doldurur","Hiçbir işe yaramaz"],"answerIndex":0,"explanation":"Besinler büyüme, gelişme, enerji ve sağlıklı çalışma için gerekir.","outcome":0},{"question":"Paketli bir besin her zaman zararlı mıdır?","options":["Evet, hepsi zararlıdır","Hayır; etiket, tarih, ambalaj ve saklama koşuluna bakmak gerekir","Hayır, hiç kontrol etmeye gerek yoktur"],"answerIndex":1,"explanation":"Paketli besinler uygun koşullarda ve etiketine uyularak güvenli olabilir.","outcome":0},{"question":"Sigara dumanı çevredeki insanları da etkiler mi?","options":["Evet, dumanı soluyanlara da zarar verebilir","Hayır, sadece içene zarar verir","Sadece dışarıdaysa verir"],"answerIndex":0,"explanation":"Dumanı solumak (pasif içicilik) sigara içmeyenlere de zarar verir.","outcome":0}],"allQuestions":[{"question":"Büyümeye ve yıpranan yerlerin onarılmasına yardım eden içerik hangisidir?","options":["Protein","Su","Karbonhidrat"],"answerIndex":0,"explanation":"Protein büyüme, gelişme ve onarım için gereklidir.","outcome":1},{"question":"Koşarken harcadığımız enerjiye en çok katkı sağlayan içerik hangisidir?","options":["Mineral","Karbonhidrat","Vitamin"],"answerIndex":1,"explanation":"Karbonhidrat enerji sağlar.","outcome":1},{"question":"Enerji sağlayan ve vücudu koruyan, zeytinyağında bol bulunan içerik hangisidir?","options":["Su","Mineral","Yağ"],"answerIndex":2,"explanation":"Zeytinyağı özellikle yağ bakımından zengindir.","outcome":1},{"question":"Sebze ve meyveler özellikle hangi içerik bakımından zengindir?","options":["Yağ","Vitamin","Protein"],"answerIndex":1,"explanation":"Sebze ve meyveler vitamin bakımından zengindir.","outcome":1},{"question":"Su ile ilgili hangisi doğrudur?","options":["Sadece içeceklerde bulunur","Besinlerde hiç yoktur","Vücut için gereklidir ve besinlerde de bulunur"],"answerIndex":2,"explanation":"Su yaşamsal faaliyetler için gereklidir ve bütün besinlerde bulunur.","outcome":2},{"question":"Kemik ve dişlerin gelişimine katkı sağlayan içerik hangisidir?","options":["Yağ","Mineral","Karbonhidrat"],"answerIndex":1,"explanation":"Mineraller kemik ve dişlerin gelişimine katkı sağlar.","outcome":1},{"question":"İncelediğin altı besinin hepsinde hangi iki içerik ortaktır?","options":["Yağ ve vitamin","Su ve mineral","Yalnızca protein"],"answerIndex":1,"explanation":"Su ve mineral incelediğimiz bütün besinlerde vardır.","outcome":2},{"question":"Ceviz ile elmayı karşılaştır. Hangi çıkarım doğrudur?","options":["Cevizde hiç su yoktur","İkisinde de su vardır ama miktarı aynı değildir","İkisinde de su miktarı aynıdır"],"answerIndex":1,"explanation":"Su her besinde vardır; miktarı besine göre değişir.","outcome":2},{"question":"Ekmeğin bir yerinde yeşil küf var. Ne yapmalıyız?","options":["Küfü ayıklayıp kalanını yeriz","Yemeyip bir yetişkine haber veririz","Tostta pişirirsek sorun olmaz"],"answerIndex":1,"explanation":"Küf görünmeyen kısımlara da yayılmış olabilir; küflü besin tüketilmez.","outcome":3},{"question":"Ambalajı sağlam bir yoğurdun son kullanma tarihi geçmiş. Ne yapılır?","options":["Tüketmeyiz","Kokusuna bakıp yeriz","Sadece biraz yeriz"],"answerIndex":0,"explanation":"Ambalaj sağlam olsa da tarihi geçen ürün tüketilmez.","outcome":3},{"question":"Dondurulmuş sebze paketinin ambalajı sağlam ve hep dondurucuda saklanmış. Güvenli midir?","options":["Paketli ve dondurulmuş her besin zararlıdır","Uygun koşullarda saklandıysa güvenli olabilir; etiketteki talimata uyulur","Çözüp tekrar tekrar dondurmak en iyisidir"],"answerIndex":1,"explanation":"Dondurma, uygun saklanırsa besini korur. Paketli ya da dondurulmuş olmak tek başına zararlı yapmaz.","outcome":3},{"question":"Süt, sıcak arabada saatlerce kaldı. Kokusu normal. Ne yapmalıyız?","options":["Koku normalse içeriz","Güvenli olmayabilir; bir yetişkine danışıp kullanmayız","Üzerine su ekleriz"],"answerIndex":1,"explanation":"Soğukta saklanması gereken ürün uzun süre sıcakta kalırsa mikroplar çoğalabilir. Görünüş ve koku tek başına yeterli değildir.","outcome":3},{"question":"Tezgâhtan aldığın meyveyi yemeden önce ne yaparsın?","options":["Elbiseme silerim","Akan suyun altında yıkarım","Hiçbir şey yapmam"],"answerIndex":1,"explanation":"Yıkamak kir ve mikropları azaltır. Ellerimizi de yıkarız.","outcome":3},{"question":"Konserve kutusu şişmiş ve ezilmiş. Ne yapmalıyız?","options":["Açıp kokusuna bakarız","Isıtırsak olur","Tüketmeyip bir yetişkine gösteririz"],"answerIndex":2,"explanation":"Ambalaj bütünlüğü bozulmuş ürün riskli olabilir. Tarihin yanında ambalajı da kontrol ederiz.","outcome":3},{"question":"Dengeli beslenme nedir?","options":["Hep aynı besini bolca yemek","Farklı besin gruplarından uygun miktarlarda yemek","Sadece tatlı ye const queryOne=selector=>document.querySelector(selector);
const createNode=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
const shuffle=list=>list.map(value=>({value,order:Math.random()})).sort((first,second)=>first.order-second.order).map(entry=>entry.value);
const FACE='<circle cx="16" cy="25" r="1.6" fill="#23332b"/><circle cx="24" cy="25" r="1.6" fill="#23332b"/><path d="M17 28.5q3 3 6 0" stroke="#23332b" stroke-width="1.4" fill="none" stroke-linecap="round"/>';
const iconSvg=(key,size=48)=>`<svg viewBox="0 0 40 40" width="${size}" height="${size}" role="img" aria-label="${CONTENT.iconNames[key]}">${CONTENT.icons[key]}${FACE}</svg>`;
const labelWithIcon=(key,text,size=36)=>{const node=createNode('span');node.innerHTML=iconSvg(key,size)+' ';node.append(text);node.style.display='inline-flex';node.style.alignItems='center';node.style.gap='6px';return node};
const starText=count=>'★'.repeat(count)+'☆'.repeat(3-count);

function celebrate(anchor){const box=anchor.getBoundingClientRect();for(let index=0;index<7;index++){const star=createNode('span','spark','★');star.style.left=box.left+box.width/2+'px';star.style.top=box.top+box.height/2+'px';star.style.setProperty('--dx',Math.cos(index*.9)*80+'px');star.style.setProperty('--dy',Math.sin(index*.9)*80-30+'px');document.body.append(star);setTimeout(()=>star.remove(),900)}}
function progressBar(container,done,total){let bar=container.querySelector('.progress');if(!bar){bar=createNode('div','progress');bar.append(createNode('i'));container.prepend(bar)}bar.firstChild.style.width=Math.round(100*done/total)+'%';bar.setAttribute('role','img');bar.setAttribute('aria-label','İlerleme '+done+'/'+total)}

/* ---------- Sürükle-bırak (fare, dokunmatik, kalem) + dokun-seç-dokun alternatifi ---------- */
let selectedChip=null;
const zoneAtPoint=pointerEvent=>{const target=document.elementFromPoint(pointerEvent.clientX,pointerEvent.clientY);return target?target.closest('.zone'):null};
const clearHighlights=()=>document.querySelectorAll('.zone.over').forEach(zone=>zone.classList.remove('over'));
function makeDraggable(chip,handleDrop){
  chip.addEventListener('pointerdown',startEvent=>{
    if(chip.dataset.locked)return;
    let ghost=null;
    const onMove=moveEvent=>{
      if(!ghost){if(Math.hypot(moveEvent.clientX-startEvent.clientX,moveEvent.clientY-startEvent.clientY)<8)return;ghost=chip.cloneNode(true);ghost.classList.add('ghost');document.body.append(ghost);chip.classList.add('lifting')}
      ghost.style.left=moveEvent.clientX-ghost.offsetWidth/2+'px';ghost.style.top=moveEvent.clientY-ghost.offsetHeight/2+'px';
      clearHighlights();const zone=zoneAtPoint(moveEvent);if(zone)zone.classList.add('over')};
    const onUp=upEvent=>{
      removeEventListener('pointermove',onMove);removeEventListener('pointerup',onUp);removeEventListener('pointercancel',onUp);
      if(ghost){ghost.remove();chip.classList.remove('lifting');clearHighlights();const zone=zoneAtPoint(upEvent);if(zone)handleDrop(chip,zone)}
      else{if(selectedChip)selectedChip.classList.remove('selected');selectedChip=selectedChip===chip?null:chip;if(selectedChip)chip.classList.add('selected')}};
    addEventListener('pointermove',onMove);addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp)})}
function makeDropZone(zone,handleDrop){zone.classList.add('zone');zone.addEventListener('click',()=>{if(selectedChip){const chip=selectedChip;selectedChip=null;chip.classList.remove('selected');handleDrop(chip,zone)}})}

/* ---------- Çoktan seçmeli soru motoru (kimlik tabanlı kontrol, karışık şıklar) ---------- */
function runQuiz(container,questions,onFinish){
  let position=0;const results=[];
  const showQuestion=()=>{
    container.innerHTML='';
    if(position>=questions.length){onFinish(results);return}
    const question=questions[position],card=createNode('div','card'),feedback=createNode('p','feedback');let attempts=0;feedback.setAttribute('role','status');
    progressBar(container,position,questions.length);
    card.append(createNode('p','tag','Soru '+(position+1)+'/'+questions.length),createNode('h2','',question.question));
    if(question.rows){const table=createNode('table');question.rows.forEach(([heading,value])=>{const row=createNode('tr');row.append(createNode('th','',heading),createNode('td','',value));table.append(row)});card.append(table)}
    const nextButton=createNode('button','btn go',position+1<questions.length?'Sonraki soru ➜':'Bitir ✔');nextButton.hidden=true;
    nextButton.onclick=()=>{position++;showQuestion()};
    const optionBox=createNode('div','options'),buttons=shuffle(question.options.map((text,originalIndex)=>({text,originalIndex}))).map((option,shownIndex)=>{
      const button=createNode('button','btn',String.fromCharCode(65+shownIndex)+') '+option.text);
      button.onclick=()=>{attempts++;
        if(option.originalIndex===question.answerIndex){buttons.forEach(other=>other.disabled=true);button.classList.add('good');button.textContent='✔ '+option.text;results.push({outcome:question.outcome,question:question.question,firstTry:attempts===1});feedback.textContent=(attempts===1?'Harika, ilk denemede bildin! ★ ':'Doğru! ')+question.explanation;celebrate(button);nextButton.hidden=false;nextButton.focus()}
        else{button.classList.add('bad');button.disabled=true;feedback.textContent='Henüz değil. Soruyu yeniden oku ve başka bir şık dene.'}};
      optionBox.append(button);return button});
    card.append(optionBox,feedback,nextButton);container.append(card)};
  showQuestion()}
const starsFromResults=results=>{const ratio=results.filter(result=>result.firstTry).length/results.length;return ratio>=.8?3:ratio>=.5?2:1};

/* ---------- Sürükle-bırak sınıflandırma ---------- */
function runSorter(container,{items,bins,finishNote},onFinish){
  const pool=createNode('div','chips'),zones=createNode('div','zones'),feedback=createNode('p','feedback');let remaining=items.length,firstTryCount=0;const wrongCounts={};feedback.setAttribute('role','status');
  const dropOnZone=(chip,zone)=>{const item=items[chip.dataset.index],binIndex=Number(zone.dataset.bin);
    if(item.bin===binIndex){chip.dataset.locked='1';chip.classList.add('placed');zone.append(chip);if(!wrongCounts[item.label])firstTryCount++;feedback.textContent='Doğru! '+(item.tip||'“'+item.label+'” bu kutuya uygun.');celebrate(chip);progressBar(container,items.length-remaining+1,items.length);
      if(!--remaining){feedback.textContent='Bitti! İlk denemede '+firstTryCount+'/'+items.length+' doğru. '+(finishNote||'');onFinish(firstTryCount/items.length>=.8?3:firstTryCount/items.length>=.5?2:1)}}
    else{wrongCounts[item.label]=(wrongCounts[item.label]||0)+1;zone.classList.add('shake');setTimeout(()=>zone.classList.remove('shake'),450);feedback.textContent=wrongCounts[item.label]>1?'Bu kutu olmadı. Doğru kutu: “'+bins[item.bin]+'”. '+(item.tip||''):'Bu kutu uygun değil. Düşün ve başka bir kutu dene.'}};
  shuffle(items.map((item,index)=>({item,index}))).forEach(({item,index})=>{const chip=createNode('button','chip');chip.dataset.index=index;chip.append(item.icon?labelWithIcon(item.icon,item.label,32):item.label);makeDraggable(chip,dropOnZone);pool.append(chip)});
  bins.forEach((name,binIndex)=>{const zone=createNode('div');zone.dataset.bin=binIndex;zone.append(createNode('b','',name));makeDropZone(zone,dropOnZone);zones.append(zone)});
  container.append(createNode('p','tag','Kartı sürükleyip doğru kutuya bırak. Sürüklemek zorsa karta dokun, sonra kutuya dokun.'),pool,zones,feedback);progressBar(container,0,items.length)}

/* ---------- Dengeli Tabak ---------- */
function runPlate(container,onFinish){
  const colors=['#4aa8e0','#e8833a','#e0a458','#4b9a4c','#e9604f'],placed=[],pool=createNode('div','chips'),plate=createNode('div','plate'),legend=createNode('div'),feedback=createNode('p','feedback'),check=createNode('button','btn go','Tabağımı değerlendir');
  feedback.setAttribute('role','status');
  const coveredGroups=()=>CONTENT.groups.map((name,group)=>placed.some(foodIndex=>CONTENT.plateFoods[foodIndex].group===group));
  const redraw=()=>{const covered=coveredGroups();plate.style.background='conic-gradient('+covered.map((isCovered,group)=>(isCovered?colors[group]:'#e6e6e6')+' '+group*20+'% '+(group+1)*20+'%').join(',');
    plate.innerHTML='';placed.forEach((foodIndex,position)=>{const chip=createNode('button','chip placed');chip.append(labelWithIcon(CONTENT.plateFoods[foodIndex].icon,CONTENT.plateFoods[foodIndex].label,26));chip.title='Çıkarmak için dokun';chip.onclick=clickEvent=>{clickEvent.stopPropagation();placed.splice(position,1);redraw()};plate.append(chip)});
    legend.innerHTML=CONTENT.groups.map((name,group)=>`<span style="color:${colors[group]}">■</span> ${name} ${covered[group]?'✔':'—'}`).join('<br>')};
  CONTENT.plateFoods.forEach((food,foodIndex)=>{const chip=createNode('button','chip');chip.append(labelWithIcon(food.icon,food.label,32));makeDraggable(chip,()=>{placed.push(foodIndex);redraw()});pool.append(chip)});
  makeDropZone(plate,chipOrNothing=>{placed.push(Number(chipOrNothing.dataset.plateIndex));redraw()});
  pool.querySelectorAll('.chip').forEach((chip,foodIndex)=>{chip.dataset.plateIndex=foodIndex});
  check.onclick=()=>{const covered=coveredGroups(),count=covered.filter(Boolean).length,missing=CONTENT.groups.filter((name,group)=>!covered[group]);
    if(count>=4){feedback.textContent=count===5?'Harika! Tabağın çok çeşitli.':'Çok iyi! Eksik grup: '+missing.join(', ')+'.';celebrate(check);onFinish(count===5?3:2)}
    else feedback.textContent='Çeşitlilik: '+count+'/5 grup. Eksik gruplar: '+missing.join(', ')+'. Bu gruplardan besin sürükle.'};
  container.append(createNode('p','tag','Besinleri tabağa sürükle. Tabağın dilimleri besin gruplarını gösterir. Çıkarmak için tabaktaki besine dokun. Su içmeyi de unutma!'),pool,plate,legend,feedback,check);redraw()}

/* ---------- Diğer istasyonlar ---------- */
function runContentCards(container,onFinish){
  let position=0;const show=()=>{container.innerHTML='';const item=CONTENT.contents[position],card=createNode('div','card');card.style.borderColor=item.color;progressBar(container,position,CONTENT.contents.length);
    const foods=item.foods.map(([key,name])=>`<span style="display:inline-block;text-align:center;margin-right:12px">${iconSvg(key,56)}<br><small>${name}</small></span>`).join('');
    card.innerHTML=`<h2 style="color:${item.color}">${item.name}</h2><p><b>Görevi:</b> ${item.task}. ${item.description}</p><div>${foods}</div><p><b>Günlük hayat:</b> ${item.daily}</p><p class="tag"><b>Hatırla!</b> ${item.remember}</p>`;
    const next=createNode('button','btn go',position+1<CONTENT.contents.length?'Sonraki kart ➜':'Kartları bitirdim ✔');next.onclick=()=>{position++;position<CONTENT.contents.length?show():onFinish(3)};card.append(next);container.append(card)};show()}
function runLab(container,onFinish){
  const seen=new Set(),grid=createNode('div','lab-grid'),detail=createNode('div','card','Bir besine dokunarak incele.');detail.setAttribute('aria-live','polite');
  CONTENT.labFoods.forEach((food,index)=>{const button=createNode('button','btn');button.append(labelWithIcon(food.icon,food.name,44));button.onclick=()=>{detail.innerHTML='';detail.append(createNode('h3','',food.name),createNode('p','','Öne çıkan içerikler: '+food.contents.join(', ')+'.'),createNode('p','','Su miktarı (kabaca): '+food.water+'. Su ve mineral her besinde vardır ama miktarları aynı değildir.'));seen.add(index);progressBar(container,seen.size,CONTENT.labFoods.length);if(seen.size===CONTENT.labFoods.length)onFinish(3)};grid.append(button)});
  container.append(createNode('p','tag','Önce tahmin et: Bu besinlerin hepsinde ortak olan bir şey olabilir mi? Hepsini incele.'),grid,detail);progressBar(container,0,CONTENT.labFoods.length)}
function runFinalTest(container,onFinish){
  const pool=shuffle(CONTENT.allQuestions).slice(0,18);
  runQuiz(container,pool,results=>{container.innerHTML='';const correct=results.filter(result=>result.firstTry).length,percent=Math.round(100*correct/results.length),card=createNode('div','card'),rows=[];
    for(let outcome=1;outcome<=6;outcome++){const group=results.filter(result=>result.outcome===outcome);if(group.length){const good=group.filter(result=>result.firstTry).length;rows.push([CONTENT.outcomes[outcome],good+'/'+group.length+(good/group.length>=.7?' ✔':' → tekrar')])}}
    card.append(createNode('h2','','Ünite Sonucu: %'+percent+' ('+correct+'/'+results.length+' ilk denemede doğru)'));
    const table=createNode('table');rows.forEach(([name,value])=>{const row=createNode('tr');row.append(createNode('td','',name),createNode('td','',value));table.append(row)});card.append(table);
    const again=createNode('button','btn go','Yeni soru setiyle dene');again.onclick=()=>{container.innerHTML='';runFinalTest(container,onFinish)};card.append(again);container.append(card);onFinish(percent>=85?3:percent>=60?2:1)})}

 {title:'4. Dengeli Beslenme',icon:'elma',goal:CONTENT.outcomes[4],stations:[{id:'m4-groups',title:'Besin gruplarını sınıfla',run:(container,finish)=>runSorter(container,{items:CONTENT.groupItems,bins:CONTENT.groups},finish)},{id:'m4-plate',title:'Dengeli tabağını hazırla',run:runPlate},quizStation('m4-quiz','Beslenme ve israf soruları',questionsFor(4))]},
 {title:'5. Sigara ve Alkol',icon:'havuc',goal:CONTENT.outcomes[5],stations:[quizStation('m5-tf','Doğru mu, yanlış mı?',CONTENT.trueFalseQuestions),quizStation('m5-quiz','Kaşif soruları',questionsFor(5))]},
 {title:'6. Çevrede Sorumluluk',icon:'ceviz',goal:CONTENT.outcomes[6],stations:[quizStation('m6-quiz','Güvenli davranış soruları',questionsFor(6))]},
 {title:'Büyük Final',icon:'muz',goal:'Bütün kazanımlardan karışık görev!',stations:[{id:'final',title:'Ünite değerlendirmesi (18 soru)',run:runFinalTest}]}];
const missionStars=mission=>mission.stations.reduce((total,station)=>total+(progress.stars[station.id]||0),0);
const missionDone=mission=>mission.stations.every(station=>progress.stars[station.id]);

function updateHud(){const total=MISSIONS.reduce((sum,mission)=>sum+missionStars(mission),0),done=MISSIONS.filter(missionDone).length;queryOne('#hud').textContent='★ '+total+' · Rozet '+done+'/'+MISSIONS.length}
function showMap(){const view=queryOne('#view');view.innerHTML='';view.append(createNode('h2','','Görev Haritası'),createNode('p','','Bir görev seç ve besin kaşifi ol! Görevleri istediğin sırayla yapabilirsin.'));
  const map=createNode('div','map');MISSIONS.forEach(mission=>{const node=createNode('button','node'+(missionDone(mission)?' done':''));node.append(labelWithIcon(mission.icon,'',64),createNode('b','',mission.title),createNode('span','stars',missionDone(mission)?'🏅 '+starText(Math.min(3,Math.round(missionStars(mission)/mission.stations.length))):'Görev'));node.onclick=()=>showMission(mission);map.append(node)});view.append(map);updateHud();scrollTo(0,0)}
function showMission(mission){const view=queryOne('#view');view.innerHTML='';const back=createNode('button','btn','⬅ Haritaya dön');back.onclick=showMap;view.append(back,createNode('h2','',mission.title),createNode('p','tag',mission.goal));
  mission.stations.forEach(station=>{const stars=progress.stars[station.id]||0,button=createNode('button','btn'+(stars?' good':''),(stars?'✔ ':'▶ ')+station.title+'  '+starText(stars));button.style.cssText='display:block;width:100%;margin:12px 0';button.onclick=()=>showStation(mission,station);view.append(button)});updateHud()}
function showStation(mission,station){const view=queryOne('#view');view.innerHTML='';const back=createNode('button','btn','⬅ '+mission.title),stage=createNode('div');back.onclick=()=>showMission(mission);view.append(back,createNode('h2','',station.title),stage);
  station.run(stage,stars=>{const wasDone=missionDone(mission);progress.stars[station.id]=Math.max(progress.stars[station.id]||0,stars);saveProgress();updateHud();
    const next=createNode('button','btn go','Görev tamamlandı! Devam ➜');next.onclick=()=>{if(!wasDone&&missionDone(mission))showBadge(mission);else showMission(mission)};stage.append(next);next.scrollIntoView({block:'center'})});scrollTo(0,0)}
function showBadge(mission){const overlay=createNode('div','badge'),card=createNode('div','card');card.innerHTML=`<div style="font-size:72px">🏅</div><h2>Rozet kazandın!</h2><p><b>${mission.title}</b> görevini tamamladın.</p>`;const close=createNode('button','btn go','Harika!');close.onclick=()=>{overlay.remove();showMission(mission)};card.append(close);overlay.append(card);document.body.append(overlay);celebrate(close);close.focus()}

/* ---------- Sunum modu, yazdırma, sıfırlama ---------- */
queryOne('#presentButton').onclick=()=>{const isOn=document.body.classList.toggle('presenting');try{if(isOn)document.documentElement.requestFullscreen();else if(document.fullscreenElement)document.exitFullscreen()}catch(error){}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('presenting')});
function printSheet(html,landscape){const area=queryOne('#print-area');area.className=landscape?'landscape':'';area.innerHTML=html;print()}
queryOne('#notesButton').onclick=()=>printSheet(CONTENT.notes.map((note,index)=>`<section class="sheet"><h2>Not ${index+1}: ${note.title}</h2><div class="lined">${note.html}<p><b>Önemli kavramlar:</b> ${note.concepts}</p><p><b>Özet şema:</b> ${note.schema}</p><p><b>Kontrol sorusu:</b> ${note.check}</p></div></section>`).join(''));
queryOne('#mapButton').onclick=()=>printSheet('<section class="sheet"><h2>Besinler ve Özellikleri: Kavram Haritası</h2><div class="mindmap"><div class="core">Besinler ve Özellikleri</div>'+CONTENT.conceptMap.map(branch=>`<div><b>${branch.title}</b><i>(${branch.relation})</i>${branch.terms.join(' · ')}</div>`).join('')+'</div></section>',true);
queryOne('#resetButton').onclick=()=>{if(confirm('Tüm yıldızlar ve rozetler silinecek. Emin misin?')){progress={stars:{}};saveProgress();showMap()}};
document.addEventListener('keydown',keyEvent=>{if(keyEvent.key==='Escape')document.body.classList.remove('presenting')});
showMap();
</script></body></html>
