<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fen 4. Sınıf F.4.1 Ünite Değerlendirme</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#22252a; --muted:#5c6470;
  --accent:#3d6b52; --accent-ink:#ffffff; --good:#2e7d46; --bad:#b3413a;
  --line:#e2ddd2; --chip:#eef0e6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1e22; --card:#26292f; --ink:#eceff1; --muted:#a3abb5;
    --accent:#7fbf9d; --accent-ink:#12241b; --good:#7fbf9d; --bad:#e08a83;
    --line:#3a3e46; --chip:#31353c;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1e22; --card:#26292f; --ink:#eceff1; --muted:#a3abb5;
  --accent:#7fbf9d; --accent-ink:#12241b; --good:#7fbf9d; --bad:#e08a83;
  --line:#3a3e46; --chip:#31353c;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100vh;
}
#app{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.badge{display:inline-block;background:var(--chip);color:var(--muted);font-size:.72rem;padding:3px 9px;border-radius:99px;margin-bottom:10px}
.prompt{font-size:1.05rem;line-height:1.5;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px}
button.opt{
  text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:.98rem;cursor:pointer;
}
button.opt:active{transform:scale(.99)}
button.opt.sel{border-color:var(--accent)}
button.opt.correct{background:var(--good);border-color:var(--good);color:#fff}
button.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.92rem}
.msg.bad{background:rgba(179,65,58,.12);color:var(--bad)}
.msg.good{background:rgba(46,125,70,.12);color:var(--good)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1;min-width:130px;display:flex;flex-direction:column;gap:8px}
.chipbtn{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:.9rem;cursor:pointer;text-align:left}
.chipbtn.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chipbtn.locked{background:var(--good);color:#fff;border-color:var(--good);opacity:.9}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.catbtn{flex:1;min-width:100px;padding:10px;border-radius:10px;border:1px dashed var(--muted);background:transparent;color:var(--ink);cursor:pointer;text-align:center;font-size:.88rem}
.catbtn.active{border-color:var(--accent);background:var(--chip)}
textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font-size:.95rem;font-family:inherit}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.navbtn{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:.9rem;cursor:pointer}
.navbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.navbtn:disabled{opacity:.4;cursor:not-allowed}
.progress{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress > div{height:100%;background:var(--accent)}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--chip);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem}
.stat span{color:var(--muted);font-size:.78rem}
.reviewitem{border-top:1px solid var(--line);padding:10px 0;font-size:.9rem}
.reviewitem b{display:block}
pre{white-space:pre-wrap;background:var(--chip);border-radius:10px;padding:12px;font-size:.82rem;font-family:inherit}

:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff7e6;--card:#fff;--ink:#2b2a4c;--muted:#66658a;--accent:#7c4dff;--accent-ink:#fff;--good:#1f9d55;--bad:#e5484d;--line:#eadfca;--chip:#f3ecff}
body{background:linear-gradient(#fff7e6,#ffeaf1);font-size:17px}
#app{padding-top:48px}
h1{font-size:1.5rem;color:var(--accent)}
.card{border-radius:20px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
button.opt,.chipbtn,.catbtn,.navbtn{border-radius:14px;border-width:2px;transition:transform .1s}
button.opt:hover,.chipbtn:hover{transform:translateY(-2px);border-color:var(--accent)}
.navbtn{font-weight:600}.navbtn.primary{box-shadow:0 3px 0 #5a35c9}
.progress{height:12px}.progress>div{background:linear-gradient(90deg,#ff6b8b,#7c4dff);transition:width .4s}
.mbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mbar svg{width:54px;height:50px;flex:none}
.bubble{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-size:.92rem}
.mbar.good svg{animation:bounce .6s}.mbar.bad svg{animation:shake .4s}
.msg.good,button.opt.correct{animation:pop .35s}
.msg.bad,button.opt.wrong{animation:shake .4s}
.intro{text-align:center}.intro svg{width:120px;height:110px;animation:bob 2s ease-in-out infinite}
#sndBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:9;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:.8rem;cursor:pointer}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA=(function(){
const L='abcd';
function M(id,p,c,w,e){return{id,type:'mc',prompt:p,opts:[c,...w].map((t,i)=>({id:L[i],t})),correct:'a',explain:e};}
function F(id,p,c,e){return{id,type:'tf',prompt:p,correct:c,explain:e};}
function P(id,p,a){return{id,type:'match',prompt:p,pairs:a.map((x,i)=>({id:id+'_'+i,l:x[0],r:x[1]}))};}
function C(id,p,cats,a){return{id,type:'classify',prompt:p,cats,items:a.map((x,i)=>({id:id+'_'+i,t:x[0],cat:x[1]}))};}
function O(id,p,a,e){return{id,type:'order',prompt:p,items:a.map((x,i)=>({id:id+'_'+i,t:x})),explain:e};}
function X(id,p,ans,e,h){return{id,type:'text',prompt:p,answers:ans,explain:e,hint:h};}
const K=(k,o)=>Object.assign(o,{k});
const SVG='<svg viewBox="0 0 320 150" width="100%" style="max-width:340px;display:block;margin:8px auto" role="img" aria-label="Güneş ışığı Dünya’nın sol yarısını aydınlatıyor. K ve L şehirleri aydınlık yarıda, M ve N şehirleri karanlık yarıdadır."><circle cx="40" cy="70" r="30" fill="#ffc83d"/><path d="M80 70h30M76 47l24-10M76 93l24 10" stroke="#ffc83d" stroke-width="3"/><circle cx="230" cy="75" r="62" fill="#34396b"/><path d="M230 13A62 62 0 0 0 230 137Z" fill="#ffe9a0"/><g font-size="15" font-weight="700"><circle cx="200" cy="40" r="4" fill="#d6336c"/><text x="188" y="34" fill="#222">K</text><circle cx="185" cy="95" r="4" fill="#d6336c"/><text x="171" y="115" fill="#222">L</text><circle cx="265" cy="55" r="4" fill="#ffc83d"/><text x="272" y="52" fill="#fff">M</text><circle cx="270" cy="100" r="4" fill="#ffc83d"/><text x="277" y="108" fill="#fff">N</text></g><text x="22" y="120" font-size="13" fill="#555">Güneş</text></svg>';
return[
K('A',M('q1','Yer kabuğunun kara tabakası neyden oluşur?','Kayaçlardan',['Yalnızca topraktan','Yalnızca sudan','Yalnızca fosillerden'],'Yer kabuğunun kara kısmı kayaçlardan oluşur. Canlılar bu kabuğun üzerinde yaşar.')),
K('A',F('q2','Okyanus tabanında da kaya ve taşlar bulunur.',true,'Yer kabuğu okyanus tabanlarında da vardır; orada da kaya ve taşlar bulunur.')),
K('B',C('q3','Kartları doğru kutuya koy: hangisi maden, hangisi fosil?',['Maden','Fosil'],[['Altın','Maden'],['Bor','Maden'],['Bakır','Maden'],['Taşlaşmış deniz kabuğu','Fosil'],['Taşlaşmış balık kalıntısı','Fosil'],['Taşlaşmış yaprak izi','Fosil']])),
K('B',P('q4','Her madeni ya da kayacı kullanım alanıyla eşleştir.',[['Bor','Isıya dayanıklı cam yapımı'],['Bakır','Elektrik teli yapımı'],['Demir','Tren rayı yapımı'],['Mermer','Heykel ve süs eşyası yapımı']])),
K('B',M('q5','Ece: “Bor madeni evleri ısıtmak için yakılır.” diyor. Ece’nin hatası nedir?','Isınmada taş kömürü ve linyit kullanılır; bor ise cam ve seramik gibi ürünlerde kullanılır',['Hata yok, bor en iyi yakacaktır','Bor yalnızca mücevher yapımında kullanılır','Isınma için yalnızca altın kullanılır'],'Taş kömürü ve linyit doğal yakacaklardır. Bor; ısıya dayanıklı cam, seramik, deterjan gibi ürünlerde kullanılır.')),
K('A',M('q6','Elif aynı kıyıdan iki taş topladı: biri beyaz, diğeri kırmızımsı. İkisi de aynı koşullarda durmuş. Renk farkının temel nedeni nedir?','Taşların yapısındaki minerallerin farklı olması',['Birinin daha çok yağmur görmesi','Birinin güneşte daha çok kalması','Birinin daha ağır olması'],'Aynı koşullarda bile taşların rengini yapılarındaki mineraller belirler.')),
K('C',O('q7','Fosilleşme aşamalarını doğru sıraya diz.',['Ölmüş hayvanlar deniz dibine batar, kalıntıları tortul tabakalarıyla örtülür.','Altta kalan tortul tabakalar taşlaşır, kalıntılar sertleşip fosili oluşturur.','Kayalar kıvrımlanır ve aşınır.','Fosiller yüzeyde açığa çıkar.'],'Önce kalıntılar örtülür, sonra taşlaşır; kayalar aşınınca fosiller yüzeyde açığa çıkar.')),
K('C',M('q8','“Milyonlarca yıl önce yaşamış canlıların taşlaşmış kalıntılarına ……… denir.” Boşluğa ne gelmelidir?','Fosil',['Maden','Mineral','Kayaç'],'Taşlaşmış canlı kalıntılarına fosil denir. Fosilleri inceleyen bilim dalı paleontolojidir.')),
K('C',F('q9','Ölen her canlı fosilleşir.',false,'Fosilleşme rastlantılar sonucu ve çok uzun sürede olur. Havayla temasın hemen kesilmesi ve tortullarla örtülmesi gerekir.')),
K('C',M('q10','Dört canlı kalıntısından hangisinin fosilleşme olasılığı en yüksektir?','Göl dibinde çamurla hemen örtülen balık kemiği',['Toprak yüzeyinde açıkta kalan yaprak','Tarlada havayla temas eden ağaç dalı','Yolun kenarında duran kuş tüyü'],'Fosilleşmesi için kalıntının havayla teması hemen kesilmeli ve tortulla örtülmelidir.')),
K('C',C('q11','Canlı kısımlarını doğru kutuya yerleştir.',['Fosilleşmesi daha olası','Fosilleşmesi daha az olası'],[['Kemik','Fosilleşmesi daha olası'],['Diş','Fosilleşmesi daha olası'],['Deniz kabuğu','Fosilleşmesi daha olası'],['Kas','Fosilleşmesi daha az olası'],['Deri','Fosilleşmesi daha az olası']])),
K('C',P('q12','Kavramları açıklamalarıyla eşleştir.',[['Fosil','Taşlaşmış canlı kalıntısı'],['Paleontoloji','Fosilleri inceleyen bilim dalı'],['Paleontolog','Fosillerle ilgilenen bilim insanı'],['Tortul','Kalıntıyı örten kum, kil gibi maddeler']])),
K('D',M('q13','Aşağıdaki günlük hayat örneklerinden hangisi, Dünya’nın Güneş etrafındaki dolanma hareketine benzer?','Bir koşucunun stadyum pistinde bir tur atması',['Topacın kendi etrafında dönmesi','Vantilatör kanatlarının dönmesi','Çamaşır makinesi kazanının dönmesi'],'Dolanma, bir cismin başka bir cismin çevresinde tur atmasıdır. Diğer örnekler kendi etrafında dönmedir.')),
K('D',M('q14','Dünya, Güneş’in etrafında bir kez dolandığında kendi etrafında yaklaşık kaç tam dönüş yapar? (1 gün = 24 saat, 1 yıl = 365 gün 6 saat)','365',['24','30','52'],'Dünya her gün bir tam dönüş yapar. Bir yıl yaklaşık 365 gün sürdüğü için yaklaşık 365 dönüş yapar.')),
K('D',X('q15','Dünya’nın Güneş’in çevresinde bir tam tur atma hareketine ne denir? (tek sözcük yaz)',['dolanma','dolanma hareketi','dolanım'],'Güneş etrafındaki hareket dolanmadır; bir tam turu 1 yıl sürer.','Kendi etrafında olan harekete “dönme” denir. Güneş’in etrafında olanın adı başka.')),
K('E',M('q16','Ayşe bahçedeki direğin gölgesine saat saat bakıyor: sabah gölge uzun, öğle çok kısa. Öğle gölge neden kısadır?','Öğle saatlerinde Güneş gökyüzünde en yüksekte, tepede görünür',['Öğle saatlerinde Güneş yok olur','Direk öğleyin küçülür','Dünya öğleyin durur'],'Dünya döndükçe Güneş’in gökyüzündeki konumu değişir. Öğle Güneş tepede göründüğü için gölge en kısa olur.')),
K('E',M('q17','Şekilde Dünya, Güneş’ten ışık alıyor. Şekle bakarak doğru ifadeyi seç.\n'+SVG,'L şehrinde gündüz, M şehrinde gece yaşanır',['K şehrinde gece, L şehrinde gündüz yaşanır','M ve N şehirlerinde gündüz yaşanır','N şehrinde gündüz, L şehrinde gece yaşanır'],'Dünya’nın Güneş’e dönük yarısında gündüz, dönük olmayan yarısında gece yaşanır. K ve L aydınlıkta, M ve N karanlıktadır.')),
K('E',C('q18','Olayları, hangi hareketin sonucu olduğuna göre yerleştir.',['Dönme sonucu','Dolanma sonucu'],[['Gece ve gündüz','Dönme sonucu'],['Gölge boyunun gün içinde değişmesi','Dönme sonucu'],['Bir günün 24 saat olması','Dönme sonucu'],['Mevsimlerin oluşması','Dolanma sonucu'],['Bir yılın 365 gün 6 saat sürmesi','Dolanma sonucu']])),
K('E',O('q19','Zaman birimlerini küçükten büyüğe doğru sırala.',['Saniye','Dakika','Saat','Gün','Yıl'],'Saniye, dakika, saat, gün, yıl. Bir gün 24 saat, bir yıl 365 gün 6 saattir.')),
K('E',F('q20','En uzun gölge boyu öğle saatlerinde oluşur.',false,'Gölge öğle saatinde en kısadır; sabah ve akşam uzundur.')),
K('E',X('q21','Güneş sabahları hangi yönden doğuyormuş gibi görünür? (yön adı yaz)',['doğu','doğudan','doğu yönü','doğu yönünden'],'Dünya batıdan doğuya döndüğü için Güneş doğudan doğuyormuş gibi görünür.','Gün doğumunu hiç izledin mi? Güneş hangi yönden yükselir?')),
K('E',F('q22','Van’da Güneş, Sakarya’dan daha önce doğar; çünkü Van daha doğudadır.',true,'Dünya batıdan doğuya döndüğü için doğudaki yerler Güneş’i daha önce görür.')),
K('E',M('q23','Mert: “Mevsimler, Dünya kendi etrafında döndüğü için oluşur.” Elif: “Mevsimler, Dünya Güneş’in etrafında dolandığı için oluşur.” Kim doğru söylüyor?','Elif; mevsimler dolanma hareketinin sonucudur',['Mert; dönme hareketi mevsimleri oluşturur','İkisi de doğru söylüyor','İkisi de yanlış söylüyor'],'Kendi etrafında dönme gece ve gündüzü, Güneş etrafında dolanma mevsimleri oluşturur.')),
K('C',M('q24','Bir paleontolog, yüksek bir dağın yamacındaki kayanın içinde deniz kabuğu fosili buldu. Bu durumdan hangi sonuca ulaşılır?','Bölge çok eskiden deniz altındaydı; kalıntılar tortulla örtülüp taşlaştı, sonra yer kabuğunun hareketiyle yüzeye çıktı',['Fosiller birkaç günde oluşmuştur','Deniz kabukları dağa yürüyerek gelmiştir','Fosiller yalnızca dağlarda oluşur'],'Fosiller, bölgenin geçmişteki koşulları hakkında bilgi verir. Yer kabuğundaki hareketler fosilleri yüzeye çıkarabilir.')),
{id:'r1',type:'reflect',prompt:'Bu ünitede en iyi öğrendiğin konu hangisi? En çok zorlandığın konu hangisiydi? Birkaç cümleyle yaz.'},
{id:'r2',type:'reflect',prompt:'Dünya’nın dönme ve dolanma hareketini günlük hayattan bir örnekle arkadaşına nasıl anlatırdın?'}
];})();
const KLAB={A:'Yer kabuğu ve kayaçlar (F.4.1.1.1)',B:'Kayaç, maden ve kullanım alanları (F.4.1.1.2)',C:'Fosillerin oluşumu (F.4.1.1.3)',D:'Dönme ve dolanma farkı (F.4.1.2.1)',E:'Hareketlerin sonuçları: gece-gündüz, gün-yıl (F.4.1.2.2)'};

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let ST;
function shufOrd(d){const ids=d.items.map(i=>i.id);let q=shuffle(ids),n=0;if(d.type==='order'){while(q.join()===ids.join()&&n++<30)q=shuffle(ids);}return q;}
const norm=x=>String(x).toLocaleLowerCase('tr-TR').replace(/[’'“”".,!?;:()]/g,'').replace(/\s+/g,' ').trim();
function freshState(){
 return{idx:0,name:'',started:false,start:null,end:null,
  tasks:DATA.map(d=>({id:d.id,status:'pending',attempts:0,wrong:0,firstTry:null,skipped:false,answer:null,text:'',
    order: d.type==='mc'?shuffle(d.opts.map(o=>o.id)):null,
    left: d.type==='match'?shuffle(d.pairs.map(p=>({id:p.id,txt:p.l}))):null,
    right: d.type==='match'?shuffle(d.pairs.map(p=>({id:p.id,txt:p.r}))):null,
    matched: d.type==='match'?new Set():null, sel:null,
    pool:(d.type==='classify'||d.type==='order')?shufOrd(d):null, seq:[],
    placed: d.type==='classify'?{}:null, selItem:null}))};
}
ST=freshState();
function T(i){return ST.tasks[i];}
function D(i){return DATA[i];}
function el(html){const d=document.createElement('div');d.innerHTML=html;return d;}
function render(){
 const app=document.getElementById('app');
 if(!ST.started){app.innerHTML=intro();bind();return;}
 if(ST.idx>=DATA.length){app.innerHTML=report();bind();return;}
 app.innerHTML=taskView();bind();
}
function intro(){
 return `<div class="intro">${HEART}<h1>Dünya Kâşifi: Ünite Değerlendirme!</h1>
 <div class="sub">Fen Bilimleri 4. Sınıf — Yer Kabuğu ve Dünya’mızın Hareketleri</div>
 <div class="card"><div class="prompt">Merhaba, ben Kalpik! Bu ünitede kayaçları, madenleri, fosilleri ve Dünya’nın hareketlerini öğrendin. Şimdi oynayarak kendini değerlendirme zamanı! Sonunda hangi konuda güçlüsün, hangisini tekrar etmelisin, birlikte göreceğiz. Yaklaşık 20-25 dakika sürer.</div>
 <button class="navbtn primary" id="startBtn" style="font-size:1.1rem;padding:12px 28px">Başla!</button></div></div>`;
}
function progressBar(){
 const pct=Math.round((ST.idx)/DATA.length*100);
 return `<div class="progress"><div style="width:${pct}%"></div></div><div class="sub">Görev ${ST.idx+1} / ${DATA.length}</div>`;
}
function taskView(){
 const d=D(ST.idx),t=T(ST.idx);
 let body='';
 if(d.type==='mc') body=mcView(d,t);
 else if(d.type==='tf') body=tfView(d,t);
 else if(d.type==='match') body=matchView(d,t);
 else if(d.type==='classify') body=classifyView(d,t);
 else if(d.type==='reflect') body=reflectView(d,t);
 else if(d.type==='order') body=orderView(d,t);
 else if(d.type==='text') body=textView(d,t);
 const canNext = t.status==='correct'||t.status==='skipped'||(d.type==='reflect'&&t.text.trim().length>0);
 const isLast = ST.idx===DATA.length-1;
 const showSkip = t.status==='pending'||t.status==='retry';
 return `${progressBar()}${mascotBar(t,d)}
 <div class="card">${body}</div>
 <div class="nav">
  <button class="navbtn" id="prevBtn" ${ST.idx===0?'disabled':''}>← Önceki</button>
  <div style="display:flex;gap:8px">
   ${showSkip?`<button class="navbtn" id="skipBtn">Soruyu Geç</button>`:''}
   <button class="navbtn primary" id="nextBtn" ${canNext?'':'disabled'}>${isLast?'Bitir ve Raporu Gör':'Sonraki →'}</button>
  </div>
 </div>`;
}
function mcView(d,t){
 const opts=t.order.map(id=>d.opts.find(o=>o.id===id));
 const rows=opts.map(o=>{
   let cls='opt';
   if(t.status==='correct'){ if(o.id===d.correct) cls+=' correct'; }
   else if(t.answer===o.id && t.status==='retry') cls+=' wrong';
   return `<button class="${cls}" data-opt="${o.id}" ${t.status==='correct'?'disabled':''}>${o.t}</button>`;
 }).join('');
 let msg='';
 if(t.status==='correct') msg=`<div class="msg good">Doğru! ${d.explain}</div>`;
 else if(t.status==='retry') msg=`<div class="msg bad">Yanlış, tekrar dene.</div>`;
 return `<div class="prompt" style="white-space:pre-line">${d.prompt}</div><div class="opts">${rows}</div>${msg}`;
}
function tfView(d,t){
 const opts=[{id:'true',t:'Doğru'},{id:'false',t:'Yanlış'}];
 const rows=opts.map(o=>{
  let cls='opt';
  const isCorrectOpt=(o.id==='true')===d.correct;
  if(t.status==='correct'){ if(isCorrectOpt) cls+=' correct'; }
  else if(t.answer===o.id && t.status==='retry') cls+=' wrong';
  return `<button class="${cls}" data-opt="${o.id}" ${t.status==='correct'?'disabled':''}>${o.t}</button>`;
 }).join('');
 let msg='';
 if(t.status==='correct') msg=`<div class="msg good">Doğru! ${d.explain}</div>`;
 else if(t.status==='retry') msg=`<div class="msg bad">Yanlış, tekrar dene.</div>`;
 return `<div class="prompt" style="white-space:pre-line">${d.prompt}</div><div class="opts">${rows}</div>${msg}`;
}
function matchView(d,t){
 const L=t.left.map(x=>`<button class="chipbtn ${t.matched.has(x.id)?'locked':(t.sel===x.id?'sel':'')}" data-l="${x.id}" ${t.matched.has(x.id)?'disabled':''}>${x.txt}</button>`).join('');
 const R=t.right.map(x=>`<button class="chipbtn ${t.matched.has(x.id)?'locked':''}" data-r="${x.id}" ${t.matched.has(x.id)?'disabled':''}>${x.txt}</button>`).join('');
 let msg = t.status==='correct'?`<div class="msg good">Tüm eşleştirmeler doğru!</div>`
   : (t.lastWrong?`<div class="msg bad">Yanlış eşleştirme, tekrar dene.</div>`:'');
 return `<div class="prompt">${d.prompt}</div><div class="row"><div class="col">${L}</div><div class="col">${R}</div></div>${msg}`;
}
function classifyView(d,t){
 const pool=t.pool.map(id=>d.items.find(i=>i.id===id));
 const poolHtml=pool.map(i=>`<button class="chipbtn ${t.selItem===i.id?'sel':''}" data-item="${i.id}">${i.t}</button>`).join('')||'<span class="sub">Havuz boş — tüm kartlar yerleşti.</span>';
 const placedHtml=d.cats.map(cat=>{
   const items=(t.placed[cat]||[]).map(id=>d.items.find(i=>i.id===id).t);
   return `<div class="catbtn ${t.selItem?'active':''}" data-cat="${cat}"><b>${cat}</b><br>${items.join(', ')||'—'}</div>`;
 }).join('');
 let msg = t.status==='correct'?`<div class="msg good">Tüm kartlar doğru yerleştirildi!</div>`
   : (t.lastWrong?`<div class="msg bad">Yanlış yerleştirme, kart havuza döndü. Tekrar dene.</div>`:'');
 return `<div class="prompt">${d.prompt}</div><div>${poolHtml}</div><div class="cats">${placedHtml}</div>${msg}`;
}
function reflectView(d,t){
 return `<div class="prompt">${d.prompt}</div><textarea id="reflectBox" placeholder="Buraya yaz...">${t.text}</textarea>
 <div class="sub" style="margin-top:8px">Bu görev puanlanmaz; öğretmenin görebilmesi için raporun sonunda yer alır.</div>`;
}
function orderView(d,t){
 const by=id=>d.items.find(i=>i.id===id), ok=t.status==='correct';
 const pool=t.pool.map(id=>`<button class="chipbtn" data-op="${id}">${by(id).t}</button>`).join('')||'<span class="sub">Tüm kartlar sıraya girdi.</span>';
 const seq=t.seq.map((id,i)=>`<button class="chipbtn ${ok?'locked':'sel'}" data-os="${id}" ${ok?'disabled':''}>${i+1}. ${by(id).t}</button>`).join('')||'<span class="sub">—</span>';
 const msg=ok?`<div class="msg good">Sıralama doğru! ${d.explain||''}</div>`:(t.lastWrong?'<div class="msg bad">Sıra henüz doğru değil, kartlar karıştı. Tekrar dene.</div>':'');
 const chk=(!ok&&t.pool.length===0)?'<button class="navbtn primary" id="chkBtn" style="margin-top:10px">Kontrol Et</button>':'';
 return `<div class="prompt">${d.prompt}</div><div class="sub">Kartlara sırayla dokun (yanlış kartı çıkarmak için sıradaki karta dokun):</div><div class="opts">${pool}</div><div class="sub" style="margin-top:10px">Senin sıran:</div><div class="opts">${seq}</div>${chk}${msg}`;
}
function textView(d,t){
 const done=t.status==='correct';
 const msg=done?`<div class="msg good">Doğru! ${d.explain}</div>`:(t.lastWrong?`<div class="msg bad">Tam olmadı, tekrar dene. İpucu: ${d.hint||'Soruyu bir daha oku.'}</div>`:'');
 return `<div class="prompt">${d.prompt}</div><input type="text" id="txtIn" placeholder="Cevabını yaz" value="${String(t.text||'').replace(/"/g,'&quot;')}" ${done?'disabled':''}><button class="navbtn primary" id="txtBtn" style="margin-top:10px" ${done?'disabled':''}>Kontrol Et</button>${msg}`;
}
function report(){
 const graded=ST.tasks.filter((t,i)=>D(i).type!=='reflect');
 const total=graded.length;
 const correct=graded.filter(t=>t.status==='correct').length;
 const firstTry=graded.filter(t=>t.status==='correct'&&t.firstTry).length;
 const wrongAttempts=graded.reduce((s,t)=>s+t.wrong,0);
 const skipped=graded.filter(t=>t.status==='skipped').length;
 const dur=ST.end-ST.start; const mm=Math.floor(dur/60000),ss=Math.floor((dur%60000)/1000);
 const wrongList=ST.tasks.map((t,i)=>({t,d:D(i)})).filter(x=>x.d.type!=='reflect'&&x.t.status!=='correct');
 const reflects=ST.tasks.map((t,i)=>({t,d:D(i)})).filter(x=>x.d.type==='reflect');
 const reviewHtml=wrongList.length?wrongList.map(x=>`<div class="reviewitem"><b>${x.t.status==='skipped'?'Geçildi':'Yanlış kaldı'}:</b> ${String(x.d.prompt).replace(/<svg[\s\S]*?<\/svg>/g,'')}${x.d.explain?` — <i>${x.d.explain}</i>`:''}</div>`).join(''):'<div class="sub">Yanlış kalan veya geçilen görev yok.</div>';
 const reflectHtml=reflects.map(x=>`<div class="reviewitem"><b>${x.d.prompt}</b><br>${x.t.text.trim()||'(boş bırakıldı)'}</div>`).join('');
 const reflectSection = reflects.length ? `<h3>Yansıtma Cevapların</h3>${reflectHtml}` : '';
 const reflectSummary = reflects.length ? `\n\nYansıtma cevapları:\n${reflects.map(x=>`- ${x.d.prompt}\n  ${x.t.text.trim()||'(boş)'}`).join('\n')}` : '';
 let kHtml='',kTxt='';
 if(DATA.some(x=>x.k)){
  const rows=Object.keys(KLAB).map(k=>{const g=ST.tasks.map((t,i)=>({t,d:D(i)})).filter(x=>x.d.k===k&&x.d.type!=='reflect');if(!g.length)return null;
   const c=g.filter(x=>x.t.status==='correct'&&x.t.firstTry).length,p=Math.round(c/g.length*100);
   return{k,n:g.length,c,p,lv:p>=80?'🌟 Çok iyi':p>=50?'👍 Gelişiyor':'📚 Tekrar et'};}).filter(Boolean);
  kHtml=`<h3>Kendini Değerlendir</h3><div class="sub">İlk denemede doğru yaptığın görevlere göre:</div>${rows.map(r=>`<div class="reviewitem"><b>${KLAB[r.k]}</b>${r.lv} — ilk denemede ${r.c}/${r.n}<div class="progress" style="margin:6px 0 0"><div style="width:${r.p}%"></div></div></div>`).join('')}`;
  kTxt=`\n\nKazanım özeti:\n${rows.map(r=>`- ${KLAB[r.k]}: ${r.c}/${r.n} ilk denemede (${r.lv})`).join('\n')}`;
 }
 const mk=(nm)=>`Fen Bilimleri 4. Sınıf F.4.1 Ünite Değerlendirme Raporu\nÖğrenci: ${nm||'(isimsiz)'}\nDoğru: ${correct}/${total} (İlk denemede: ${firstTry})\nYanlış deneme sayısı: ${wrongAttempts}\nGeçilen: ${skipped}\nSüre: ${mm} dk ${ss} sn${kTxt}${reflectSummary}`;window.mkSum=mk;const summary=mk(ST.name);
 return `<h1>Rapor</h1>
 <div class="card">
  <div class="statgrid">
   <div class="stat"><b>${correct}/${total}</b><span>Doğru</span></div>
   <div class="stat"><b>${firstTry}</b><span>İlk denemede doğru</span></div>
   <div class="stat"><b>${wrongAttempts}</b><span>Yanlış deneme</span></div>
   <div class="stat"><b>${skipped}</b><span>Geçilen</span></div>
   <div class="stat"><b>${mm}:${String(ss).padStart(2,'0')}</b><span>Süre</span></div>
   <div class="stat"><b>🏅</b><span>Tebrikler!</span></div>
  </div>
  ${kHtml}${reflectSection}
  <h3>Yanlış / Geçilen Görevleri İncele</h3>
  ${reviewHtml}
  <h3>Adını Yaz</h3><input type="text" id="nameInput2" placeholder="Adın Soyadın"><h3>Öğretmenine Gönder</h3>
  <div class="sub">Aşağıdaki metni kopyala ve WhatsApp'tan öğretmenine gönder.</div>
  <pre id="summaryText">${summary}</pre>
  <div class="nav"><button class="navbtn" id="copyBtn">Panoya Kopyala</button><button class="navbtn primary" id="replayBtn">Baştan Başla</button></div>
 </div>`;
}
function bind(){
 const startBtn=document.getElementById('startBtn');
 if(startBtn) startBtn.onclick=()=>{
    ST.started=true; ST.start=Date.now(); render();
 };
 const prevBtn=document.getElementById('prevBtn');
 if(prevBtn) prevBtn.onclick=()=>{ if(ST.idx>0){ST.idx--; render();} };
 const nextBtn=document.getElementById('nextBtn');
 if(nextBtn) nextBtn.onclick=()=>{ ST.idx++; if(ST.idx>=DATA.length) ST.end=Date.now(); render(); };
 const skipBtn=document.getElementById('skipBtn');
 if(skipBtn) skipBtn.onclick=()=>{ const t=T(ST.idx); t.status='skipped'; t.skipped=true; ST.idx++; if(ST.idx>=DATA.length) ST.end=Date.now(); render(); };
 document.querySelectorAll('button[data-opt]').forEach(b=>b.onclick=()=>{
  const d=D(ST.idx),t=T(ST.idx); if(t.status==='correct') return;
  const val=b.getAttribute('data-opt'); t.answer=val; t.attempts++;
  const isCorrect = d.type==='tf' ? ((val==='true')===d.correct) : (val===d.correct);
  if(isCorrect){ t.status='correct'; if(t.firstTry===null) t.firstTry=true; }
  else{ t.status='retry'; t.wrong++; if(t.firstTry===null) t.firstTry=false; }
  render();
 });
 document.querySelectorAll('button[data-l]').forEach(b=>b.onclick=()=>{
  const t=T(ST.idx); const id=b.getAttribute('data-l'); if(t.matched.has(id)) return; t.sel=id; render();
 });
 document.querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>{
  const t=T(ST.idx); const id=b.getAttribute('data-r'); if(t.matched.has(id)||!t.sel) return;
  t.attempts++;
  if(t.sel===id){ t.matched.add(id); t.sel=null; t.lastWrong=false;
    if(t.matched.size===D(ST.idx).pairs.length){ t.status='correct'; t.firstTry=t.wrong===0; }
  } else { t.wrong++; t.sel=null; t.lastWrong=true; }
  render();
 });
 document.querySelectorAll('button[data-item]').forEach(b=>b.onclick=()=>{
  const t=T(ST.idx); t.selItem=b.getAttribute('data-item'); render();
 });
 document.querySelectorAll('.catbtn').forEach(b=>b.onclick=()=>{
  const d=D(ST.idx),t=T(ST.idx); if(!t.selItem) return;
  const cat=b.getAttribute('data-cat'); const item=d.items.find(i=>i.id===t.selItem);
  t.attempts++;
  if(item.cat===cat){
   t.placed[cat]=t.placed[cat]||[]; t.placed[cat].push(item.id);
   t.pool=t.pool.filter(x=>x!==item.id); t.selItem=null; t.lastWrong=false;
   if(t.pool.length===0){ t.status='correct'; t.firstTry=t.wrong===0; }
  } else { t.wrong++; t.selItem=null; t.lastWrong=true; }
  render();
 });
 const rb=document.getElementById('reflectBox');
 if(rb) rb.oninput=(e)=>{ T(ST.idx).text=e.target.value; document.getElementById('nextBtn').disabled = e.target.value.trim().length===0; };
 const copyBtn=document.getElementById('copyBtn');
 if(copyBtn) copyBtn.onclick=()=>{
   const txt=document.getElementById('summaryText').textContent;
   navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>{copyBtn.textContent='Kopyalandı ✓';}).catch(()=>{});
 };
 const n2=document.getElementById('nameInput2');
 if(n2){n2.value=ST.name;n2.oninput=()=>{ST.name=n2.value.trim();document.getElementById('summaryText').textContent=window.mkSum(ST.name);};}
 document.querySelectorAll('button[data-op]').forEach(b=>b.onclick=()=>{const t=T(ST.idx);if(t.status==='correct')return;const id=b.getAttribute('data-op');t.pool=t.pool.filter(x=>x!==id);t.seq.push(id);t.lastWrong=false;render();});
 document.querySelectorAll('button[data-os]').forEach(b=>b.onclick=()=>{const t=T(ST.idx);if(t.status==='correct')return;const id=b.getAttribute('data-os');t.seq=t.seq.filter(x=>x!==id);t.pool.push(id);render();});
 const ck=document.getElementById('chkBtn');
 if(ck) ck.onclick=()=>{const d=D(ST.idx),t=T(ST.idx);if(t.status==='correct')return;t.attempts++;
  if(t.seq.join()===d.items.map(i=>i.id).join()){t.status='correct';t.firstTry=t.wrong===0;t.lastWrong=false;}
  else{t.wrong++;t.lastWrong=true;t.seq=[];t.pool=shufOrd(d);}
  render();};
 const tb=document.getElementById('txtBtn');
 if(tb){const go=()=>{const d=D(ST.idx),t=T(ST.idx);if(t.status==='correct')return;const v=document.getElementById('txtIn').value;t.text=v;if(!norm(v))return;t.attempts++;t.answer=v;
   if(d.answers.map(norm).includes(norm(v))){t.status='correct';if(t.firstTry===null)t.firstTry=true;t.lastWrong=false;}
   else{t.wrong++;t.lastWrong=true;t.status='retry';if(t.firstTry===null)t.firstTry=false;}
   render();};
  tb.onclick=go;const ti=document.getElementById('txtIn');ti.onkeydown=e=>{if(e.key==='Enter')go();};}
 const replayBtn=document.getElementById('replayBtn');
 if(replayBtn) replayBtn.onclick=()=>{ ST=freshState(); render(); };
}
const HEART='<svg viewBox="-2 0 68 60"><path d="M32 56C4 36-2 18 12 8 22 2 30 8 32 14 34 8 42 2 52 8 66 18 60 36 32 56Z" fill="#ff6b8b"/><circle cx="23" cy="26" r="3.5" fill="#2b2a4c"/><circle cx="41" cy="26" r="3.5" fill="#2b2a4c"/><path d="M24 35q8 8 16 0" stroke="#2b2a4c" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="17" cy="32" r="3" fill="#ff9db3"/><circle cx="47" cy="32" r="3" fill="#ff9db3"/></svg>';
function mascotBar(t,d){
 let c='',m='Dikkatle dinle, sen yaparsın!';
 if(d.type==='reflect') m='Burada doğru ya da yanlış yok. Kendi düşünceni yaz!';
 else if(t.status==='correct'){c='good';m='Harika, doğru yaptın!';}
 else if(t.status==='retry'||t.lastWrong){c='bad';m='Olsun, bir daha dene!';}
 else if(t.status==='skipped') m='Geçtin. İstersen sonra geri dönebilirsin.';
 const L=(d.listen&&('speechSynthesis' in window))?'<button class="navbtn" id="listenBtn">🎧 Dinle</button>':'';
 return `<div class="mbar ${c}">${HEART}<div class="bubble">${m}</div>${L}</div>`;
}
let AC=null,SND=false,LK=null,LW=0;
function beep(k){ if(!AC)return; const n=AC.currentTime; (k==='good'?[660,880]:[220,180]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==='good'?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.15,n+i*.12);g.gain.exponentialRampToValueAtTime(.001,n+i*.12+.2);o.connect(g);g.connect(AC.destination);o.start(n+i*.12);o.stop(n+i*.12+.22);}); }
function sfxCheck(){
 if(!SND||!ST.started||ST.idx>=DATA.length) return;
 const t=T(ST.idx), st=t.status+'|'+t.wrong+'|'+ST.idx;
 if(LK===null){LK=st;LW=t.wrong;return;}
 if(st===LK) return;
 const same=LK.split('|')[2]===String(ST.idx); LK=st;
 if(same){ if(t.wrong>LW) beep('bad'); else if(t.status==='correct') beep('good'); }
 LW=t.wrong;
}
let LI=-1;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#listenBtn');if(!b)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(D(ST.idx).listen);u.lang='tr-TR';u.rate=.85;speechSynthesis.speak(u);});
const _r=render; render=function(){_r();sfxCheck();if('speechSynthesis' in window&&LI!==ST.idx){speechSynthesis.cancel();LI=ST.idx;}};
const sb=document.createElement('button'); sb.id='sndBtn'; sb.textContent='🔊 Ses: Kapalı';
sb.onclick=()=>{ SND=!SND; if(SND&&!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){SND=false;}} LK=null; sb.textContent=SND?'🔊 Ses: Açık':'🔊 Ses: Kapalı'; if(SND) beep('good'); };
document.body.appendChild(sb);

render();
</script>
