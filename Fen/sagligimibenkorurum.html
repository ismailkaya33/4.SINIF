<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sağlığımı Ben Korurum – Sigara ve Alkolün Zararları</title>
<style>
/* Renkler JS ile OYUN.tema'dan gelir (--ana, --ikinci, --gok1, --gok2). Buradakiler yedek değerdir. */
:root{--ana:#1f8a70;--ikinci:#e76f51;--gok1:#b8f2e6;--gok2:#f1fff9;--kart:#fff;--yazi:#1f2a44;--soluk:#5b6782;--ok:#1f9d5c;--hata:#c0392b}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--yazi);font:18px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,var(--gok1) 0%,var(--gok2) 70%) fixed;background-color:var(--gok2);overflow-x:hidden}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:12px 14px 110px}
.dekor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dekor svg{position:absolute}
#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
h1,.baslik,h2{font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
h1{font-size:clamp(1.55rem,4.5vw,2.3rem);margin:6px 0 4px;text-align:center;color:var(--yazi)}
h2{font-size:clamp(1.25rem,3.6vw,1.6rem);margin:4px 0 8px;text-align:center}
.kart{background:var(--kart);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 8px 0 rgba(31,42,68,.10),0 14px 30px rgba(31,42,68,.12)}
button{font:inherit;cursor:pointer;color:var(--yazi)}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid #ffd166;outline-offset:3px}
.buyuk{display:block;margin:14px auto 4px;background:var(--ana);color:#fff;border:0;border-radius:18px;padding:14px 30px;min-height:60px;
  font-size:1.25rem;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.buyuk:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.buyuk:disabled{opacity:.45}
/* Üst çubuk + yol haritası */
.ust{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ust .baslik{font-size:1rem;color:var(--yazi);background:#fffe;border-radius:999px;padding:4px 12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sag{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.puan{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
.puan.pop{animation:pop .4s}
.ses{background:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.yol{display:flex;align-items:center;flex-wrap:wrap;gap:3px;margin:10px 0 0;padding:8px 10px;background:#ffffffe6;border-radius:18px}
.durak{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:#fff;color:var(--soluk);border:3px dashed #b9c3d6}
.durak.simdi{border:3px solid var(--ana);color:var(--ana);transform:scale(1.15)}
.durak.yildiz,.durak.yarim,.durak.ogrendi{border:3px solid transparent;font-size:.95rem}
.durak.yildiz{background:#fff3c4}.durak.yarim{background:#e2f7f4}.durak.ogrendi{background:#e8ecff}
.cizgi{flex:1 1 4px;min-width:4px;max-width:16px;height:4px;border-radius:2px;background:#b9c3d6}
.durak.son{width:38px;height:38px;font-size:1.3rem;border:3px solid #ffd166;background:#fff8e1}
/* Soru kartı */
.etiket{display:inline-block;background:var(--ikinci);color:#fff;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.88rem}
.bolum-et{display:inline-block;margin-left:6px;background:#e7f6f1;color:#155e4c;font-weight:800;border-radius:999px;padding:2px 10px;font-size:.85rem}
.gorsel{display:flex;justify-content:center;margin:10px 0 2px}
.gorsel svg{max-width:100%;height:auto}
.soru{font-size:clamp(1.2rem,3.6vw,1.55rem);font-weight:800;margin:10px 0 14px;text-align:center}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec.uzun{grid-template-columns:1fr}
@media (max-width:460px){.sec{grid-template-columns:1fr}}
.sec button{position:relative;min-height:62px;border-radius:18px;border:3px solid var(--c);background:var(--z);font-size:1.12rem;font-weight:700;
  padding:10px 44px 10px 52px;text-align:left;box-shadow:0 5px 0 var(--c);line-height:1.3}
.sec button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.sec button:nth-child(1){--c:#2a9d8f;--z:#e6f6f3}.sec button:nth-child(2){--c:#e76f51;--z:#fdeee9}
.sec button:nth-child(3){--c:#e9a400;--z:#fff6dc}.sec button:nth-child(4){--c:#7b5cff;--z:#efeaff}
.sec .no{position:absolute;left:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1rem}
.sec button.dogru{--c:var(--ok);--z:#e3f7ec}
.sec button.dogru::after{content:"✔";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:1.5rem}
.sec button.yanlis{--c:#a7b0c0;--z:#f1f3f7;color:#6b7489;text-decoration:line-through}
.sec button.yanlis::after{content:"✖";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--hata);font-size:1.3rem;text-decoration:none}
.alt{display:flex;justify-content:center;margin-top:14px}
.ipucu-btn{background:#fff8e1;border:3px solid #ffd166;border-radius:999px;padding:6px 20px;min-height:50px;font-weight:800;box-shadow:0 4px 0 #ffd166}
/* Konuşma görseli */
.konus{display:flex;align-items:flex-end;gap:10px;max-width:560px;width:100%}
.konus .avatar{flex:0 0 auto;width:86px}
.konus .avatar svg{display:block;width:100%;height:auto}
.konus .soz{position:relative;flex:1;background:#fff7e6;border:3px solid #f4c27a;border-radius:20px;padding:10px 14px;margin-bottom:18px;font-weight:700;font-size:1.1rem}
.konus .soz::before{content:"";position:absolute;left:-15px;bottom:14px;border:9px solid transparent;border-right:14px solid #f4c27a;border-left:0}
.konus .kim{display:block;font-size:.82rem;font-weight:800;color:#9a5b00;margin-bottom:2px}
/* Eşleştirme */
.esl{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:12px;align-items:start}
.esl .govde{display:flex;justify-content:center;position:sticky;top:8px}
@media (max-width:640px){.esl{grid-template-columns:1fr}.esl .govde{position:static}}
.esl .govde svg{width:100%;max-width:340px;height:auto}
.ekart{list-style:none;border:3px solid #cfe9e1;background:#f6fcfa;border-radius:18px;padding:10px 12px;margin:0 0 10px}
.ekart p{margin:0 0 8px;font-weight:700}
.ekart .kno{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ikinci);color:#fff;font-weight:800;margin-right:6px;font-size:.95rem}
.ekart.dogru{border-color:var(--ok);background:#e3f7ec}
.ekart.yanlis{border-color:var(--hata);background:#fff0ee}
.ekart .durumyazi{font-weight:800;font-size:.95rem;margin-top:6px}
.ekart.dogru .durumyazi{color:var(--ok)}.ekart.yanlis .durumyazi{color:var(--hata)}
.orgsec{display:flex;flex-wrap:wrap;gap:6px}
.orgsec button{min-height:44px;border-radius:999px;border:2px solid #b9c3d6;background:#fff;padding:4px 12px 4px 8px;font-size:.98rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.orgsec button i{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #0003}
.orgsec button[aria-pressed="true"]{border-color:var(--ana);background:#dff5ee;box-shadow:0 0 0 3px #1f8a7033}
.orgsec button[aria-pressed="true"]::after{content:"✓";font-weight:800;color:var(--ana)}
.ols{padding:0;margin:0}
/* Bölüm girişi ve bilgi kartları */
.bgiris{text-align:center}
.bgiris .ikon{font-size:3.2rem;line-height:1.1}
.bgiris p{font-size:1.12rem;margin:8px auto;max-width:600px}
.sefkat{background:#eef7ff;border:3px dashed #8ec5ff;border-radius:18px;padding:10px 14px;text-align:left;max-width:600px;margin:10px auto}
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
@media (max-width:560px){.ozet{grid-template-columns:1fr}}
.ozet div{border-radius:16px;padding:10px;background:#f2fbf7;border:2px solid #bfe6d7;text-align:center;font-weight:700}
.ozet b{display:block;font-size:1.8rem}
.ozet.dort{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.ozet.dort{grid-template-columns:1fr 1fr}}
.alter{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.alter span{background:#fff8e1;border:2px solid #ffd166;border-radius:999px;padding:4px 12px;font-weight:700}
/* Rehber karakter + konuşma balonu */
.karakter-satir{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.krk{flex:0 0 auto;width:104px}
.krk.kucuk{width:84px}
.krk svg{display:block;width:100%;height:auto;transform-origin:50% 100%}
.krk .goz-mutlu,.krk .kas{display:none}
.krk.mutlu .goz-mutlu{display:inline}.krk.mutlu .goz-acik{display:none}
.krk.dusun .goz-acik{transform:translate(3px,-3px)}
.krk.uzgun .kas{display:inline}.krk.uzgun .goz-acik{transform:translateY(3px)}
.balon{position:relative;flex:1;min-width:0;background:#fff;border-radius:20px;padding:12px 16px;font-weight:600;min-height:3.2em;margin-bottom:26px;
  box-shadow:0 5px 0 rgba(31,42,68,.10);border:3px solid #fff}
.balon::before{content:"";position:absolute;left:-14px;bottom:16px;border:9px solid transparent;border-right:14px solid #fff;border-left:0}
.balon.mutlu{border-color:#bfead2}.balon.uzgun{border-color:#ffd3cc}.balon.dusun{border-color:#ffe7a3}
.devam-yer{text-align:center}
.kazanim-kod{font-size:.78rem;color:var(--soluk);text-align:center;margin:2px 0 0}
/* Bitiş */
.bitis{text-align:center}
.rozet{width:130px;height:auto}
.rozet-ad{font-weight:800;font-size:1.25rem;margin-top:-4px}
.yildizlar{font-size:1.5rem;letter-spacing:3px;margin:6px 0;word-break:break-all}
#karne .rm{padding:4px 0;text-align:left}
#karne .rm h2{font-family:"Trebuchet MS",system-ui,sans-serif;text-align:center}
#karne .rm-k{border:0;background:#f5f8ff;border-radius:16px}
#karne .rm-bar{height:18px;border-radius:10px}
/* Vücut şemasında vurgulanan organ */
.org{transition:opacity .2s}
.org.soluk{opacity:.28}
.org.parla > :first-child{stroke:#ffb703;stroke-width:4}
@media (prefers-reduced-motion:no-preference){
  .org.parla{animation:nabiz 1.4s ease-in-out 2}
  .krk.zipla svg{animation:zipla .6s}
  .krk.salla svg,.sec button.salla,.ekart.salla{animation:salla .45s}
  .kart.gir{animation:gir .35s ease-out}
  .sec button{transition:transform .08s,box-shadow .08s,background .15s}
  .durak{transition:transform .2s}
}
@keyframes nabiz{50%{opacity:.75}}
@keyframes zipla{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes salla{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes gir{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.25)}}
</style>
</head>
<body>
<div class="dekor" aria-hidden="true">
  <svg style="top:3%;left:-2%;width:170px" viewBox="0 0 170 60"><g fill="#fff"><ellipse cx="50" cy="38" rx="45" ry="20"/><ellipse cx="90" cy="28" rx="40" ry="26"/><ellipse cx="128" cy="40" rx="38" ry="18"/></g></svg>
  <svg style="top:14%;right:-3%;width:130px" viewBox="0 0 170 60"><g fill="#fff"><ellipse cx="50" cy="38" rx="45" ry="20"/><ellipse cx="90" cy="28" rx="40" ry="26"/><ellipse cx="128" cy="40" rx="38" ry="18"/></g></svg>
  <svg style="left:0;bottom:0;width:100%;height:90px" viewBox="0 0 1200 90" preserveAspectRatio="none"><path d="M0 50 Q200 10 400 45 T800 40 T1200 45 V90 H0Z" fill="#7fd1a8" opacity=".45"/><path d="M0 68 Q220 40 450 66 T900 62 T1200 64 V90 H0Z" fill="#52b788" opacity=".45"/></svg>
</div>
<canvas id="konfeti" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
/* RaporMotoru v2 — 4/D portalına bağlı (her etkinliğin içine gömülür; tek dosya, çevrimdışı).
 *
 * Akış:
 *   RaporMotoru.init({oyunId, oyunAdi, kazanimlar:[{kod, ad}]})   oyun başında (ve "yeniden oyna"da)
 *   RaporMotoru.kaydet({...})                                       her maddeden sonra
 *   RaporMotoru.ekranCiz(el)                                        oyun sonunda: öğrenciye "Kazanım Karnem"
 *
 * Portal bağlantısı (öğrenci kodla giriş yaptıysa etkinlik portalın içinde açılır):
 *   - Her madde: {type:'4d:item-result'} mesajı (madde bazlı kazanım/yanılgı verisi)
 *   - Oyun sonu: {type:'4d:activity-finished'} mesajı, oyun başına BİR kez (mevcut sonuç kaydı)
 *   Sayfa portal dışında (kodsuz) açıldıysa mesajlar gitmez; karne yine gösterilir.
 *   Mesajı yalnızca portal kayıt listesinde (portal/etkinlik-kayitlari.json) olan etkinlikler için
 *   sunucu kaydeder; oyunId bu listedeki "id" ile aynı olmalı.
 *
 * Seviye eşikleri öğretmen panelindekiyle AYNI olmalı (ESIK, seviye).
 */
const RaporMotoru = (() => {
  const SURUM = 3;
  const ESIK = { ustalik: 0.85, gelisiyor: 0.6, ipucuUst: 0.25, minMadde: 3 };
  let meta = null, kayit = [], t0 = Date.now(), denemeKimligi = '', bitisGonderildi = false;

  function yeniKimlik() {
    let r = '';
    try { const a = new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b => { r += b.toString(16).padStart(2, '0'); }); }
    catch (e) { r = Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    return 'rm_' + r;
  }
  function portalaGonder(mesaj) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(mesaj, '*'); } catch (e) { /* portal yok */ }
  }


  /* --- Cevap defteri (v3, öğretmenin kararı 2026-11-27) ---
   * Her ilk kez çözülen madde portala tek tek gider (4d:answer); portal Google tablosuna yazar, İLK kayıt kilitlidir.
   * Etkinlik açılınca (init) portal kayıtlı cevapları geri verir (4d:saved-answers) → RaporMotoru.kayitli(id).
   * Etkinlik isterse RaporMotoru.onKayitli(fn) ile kayıtlı maddeleri atlar/kilitler. Onay (4d:answer-ack) gelene
   * kadar cevap 5 saniyede bir yeniden gönderilir; portal yoksa hiçbir şey gitmez. */
  let kayitliCevaplar = {}, kayitliDinleyiciler = [], bekleyenCevaplar = {}, cevapZamanlayici = null;
  function hazirGonder() { if (meta) portalaGonder({ type: '4d:ready', schemaVersion: 1, activityId: meta.oyunId }); }
  function bekleyenleriGonder() {
    const k = Object.keys(bekleyenCevaplar);
    k.forEach(q => portalaGonder(bekleyenCevaplar[q]));
    if (!k.length && cevapZamanlayici) { clearInterval(cevapZamanlayici); cevapZamanlayici = null; }
  }
  function cevapGonder(x) {
    if (!meta || x.r || !x.m || kayitliCevaplar[x.m] || bekleyenCevaplar[x.m]) return;
    bekleyenCevaplar[x.m] = { type: '4d:answer', schemaVersion: 1, activityId: meta.oyunId, questionId: x.m,
      correct: !x.c, firstTry: !!x.i && !x.c };
    portalaGonder(bekleyenCevaplar[x.m]);
    if (!cevapZamanlayici && window.parent !== window) cevapZamanlayici = setInterval(bekleyenleriGonder, 5000);
  }
  try {
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (ev.source !== window.parent || !d || typeof d !== 'object' || !meta || d.activityId !== meta.oyunId) return;
      if (d.type === '4d:saved-answers' && Array.isArray(d.answers)) {
        d.answers.forEach(a => { if (a && typeof a.questionId === 'string') kayitliCevaplar[a.questionId] = { correct: !!a.correct, firstTry: !!a.firstTry, answer: String(a.answer || '') }; });
        Object.keys(kayitliCevaplar).forEach(q => { delete bekleyenCevaplar[q]; });
        kayitliDinleyiciler.forEach(fn => { try { fn(Object.assign({}, kayitliCevaplar)); } catch (e) { /* etkinlik hatası */ } });
      } else if (d.type === '4d:answer-ack' && typeof d.questionId === 'string') {
        delete bekleyenCevaplar[d.questionId];
        if (d.saved && typeof d.saved === 'object') kayitliCevaplar[d.questionId] = { correct: !!d.saved.correct, firstTry: !!d.saved.firstTry, answer: String(d.saved.answer || '') };
      }
    });
  } catch (e) { /* tarayıcı mesaj dinleyemiyor */ }
  /** Daha önce kaydedilmiş madde: {correct, firstTry, answer} ya da null. */
  function kayitli(madde) { return kayitliCevaplar[String(madde)] || null; }
  /** Portal kayıtlı cevapları verdiğinde çağrılır: fn({maddeId: {correct, firstTry, answer}}). */
  function onKayitli(fn) { if (typeof fn === 'function') kayitliDinleyiciler.push(fn); }

  /** m = {oyunId, oyunAdi, kazanimlar:[{kod, ad}]}  (kod = MEB kazanım kodu, ör. "M.4.1.2.3") */
  function init(m) {
    meta = { oyunId: String(m.oyunId), oyunAdi: String(m.oyunAdi), kazanimlar: m.kazanimlar.map(k => ({ kod: String(k.kod), ad: String(k.ad) })) };
    kayit = []; t0 = Date.now(); denemeKimligi = yeniKimlik(); bitisGonderildi = false;
    bekleyenCevaplar = {}; hazirGonder();
  }

  /** r = {kazanim:kod, madde:id, yanilgi:'etiket'|'', ilkDenemeDogru:bool, deneme:n, ipucu:0-3,
   *       cozumGoruldu:bool, sureMs:n, tekrar:bool}   tekrar=true → seviye hesabına katılmaz */
  function kaydet(r) {
    const i = meta ? meta.kazanimlar.findIndex(k => k.kod === r.kazanim) : -1;
    if (i < 0) { console.warn('RaporMotoru: bilinmeyen kazanım', r.kazanim); return false; }
    const x = {
      k: i, m: String(r.madde || '').slice(0, 40), y: String(r.yanilgi || '').slice(0, 40),
      i: r.ilkDenemeDogru ? 1 : 0, d: Math.max(1, r.deneme | 0), h: Math.max(0, Math.min(3, r.ipucu | 0)),
      c: r.cozumGoruldu ? 1 : 0, s: Math.max(0, Math.round((r.sureMs || 0) / 1000)), r: r.tekrar ? 1 : 0
    };
    kayit.push(x);
    portalaGonder({ type: '4d:item-result', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      kazanim: meta.kazanimlar[i].kod, madde: x.m, yanilgi: x.y, ilkDogru: x.i, deneme: x.d, ipucu: x.h,
      cozum: x.c, sureSn: x.s, tekrar: x.r });
    cevapGonder(x);
    return true;
  }

  function seviye(a) {            // a: ilk kez sorulan madde kayıtları
    const n = a.length;
    if (n < ESIK.minMadde) return 'veri-az';
    const p = a.filter(x => x.i).length / n, h = a.filter(x => x.h > 0).length / n;
    if (p >= ESIK.ustalik && h <= ESIK.ipucuUst) return 'ustalasti';
    if (p >= ESIK.gelisiyor) return 'gelisiyor';
    return 'destek';
  }

  function ozet() {
    return meta.kazanimlar.map((k, idx) => {
      const hepsi = kayit.filter(x => x.k === idx), a = hepsi.filter(x => !x.r);
      const yan = {};
      hepsi.forEach(x => { if (x.y) yan[x.y] = (yan[x.y] || 0) + 1; });
      return {
        kod: k.kod, ad: k.ad, n: a.length, dogru: a.filter(x => x.i).length,
        p: a.length ? a.filter(x => x.i).length / a.length : null,
        ipucuOran: a.length ? a.filter(x => x.h > 0).length / a.length : 0,
        seviye: seviye(a), yanilgilar: yan
      };
    });
  }

  /** Oyun sonu: portaldaki mevcut sonuç kaydı için tek mesaj (çift gönderim yok). */
  function bitir() {
    if (!meta || bitisGonderildi) return;
    const a = kayit.filter(x => !x.r);
    if (!a.length) return;
    bitisGonderildi = true;

  sesBagla();

  const eski = parseInt(depo.oku(DEPO_REKOR), 10) || 0;
  if (yildiz > eski) depo.yaz(DEPO_REKOR, String(yildiz));
  document.getElementById('yeniden').onclick = () => { durum = null; baslangic(); };
  cal('kutlama'); ruh('mutlu', 'zipla', document.getElementById('balon').textContent);
  konfeti(60); setTimeout(() => konfeti(40, innerWidth * 0.25, innerHeight * 0.3), 350);
}

document.addEventListener('keydown', e => {   // klavye: 1-4 seçenek, İ/i ipucu, Enter devam
  if (e.key >= '1' && e.key <= '4' && durum && durum.sec && !durum.kilit && document.querySelector('.sec')) sec_(+e.key - 1);
  else if ((e.key === 'i' || e.key === 'İ' || e.key === 'ı') && document.getElementById('ip')) ipucuVer();
  else if (e.key === 'Enter') { const d = document.getElementById('dev'); if (d && document.activeElement !== d) { e.preventDefault(); d.click(); } }
});
baslangic();
</script>
