<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Besinler ve Özellikleri – Değerlendirme</title>
<style>
:root{--bg:#f2f6f7;--fg:#1c2b33;--card:#fff;--mut:#58707c;--ac:#0f7b6c;--ln:#cfdce1;--ok:#c8ecd6;--bad:#f8d1d1;--key:#f6c75a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a1f;--fg:#e6eff2;--card:#18262d;--mut:#9ab2bd;--ac:#4fd0b8;--ln:#2f444e;--ok:#1d5a3b;--bad:#6b2b2b;--key:#8a6a12}}
:root[data-theme=dark]{--bg:#101a1f;--fg:#e6eff2;--card:#18262d;--mut:#9ab2bd;--ac:#4fd0b8;--ln:#2f444e;--ok:#1d5a3b;--bad:#6b2b2b;--key:#8a6a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Trebuchet MS","Segoe UI",Verdana,sans-serif}
main{max-width:820px;margin:auto;padding:18px 14px 60px}h1{font-size:1.7rem;margin:.2em 0}.sub{color:var(--mut);margin:0 0 18px}
section{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;margin:0 0 18px}
h2{font-size:1.15rem;margin:0 0 4px}.k{color:var(--mut);font-size:.85rem;margin:0 0 12px}
.q{padding:10px 0;border-top:1px solid var(--ln)}.q>p{margin:0 0 6px;font-weight:600}
label.o{display:block;padding:5px 10px;margin:3px 0;border:1px solid var(--ln);border-radius:6px;cursor:pointer}label.o.ok{background:var(--ok)}label.o.bad{background:var(--bad)}
.tf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tf>span{flex:1 1 300px}.tf label{margin:0}
img.f{max-width:100%;display:block;margin:6px auto;border-radius:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;margin:8px 0;border:2px dashed var(--ln);border-radius:8px;min-height:48px}
.chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:5px 10px;background:var(--ac);color:#fff;border-radius:6px;cursor:grab;user-select:none;font-size:.95rem}
.chip img{height:54px;background:#fff;border-radius:4px;padding:2px}.chip.sel{outline:3px solid var(--key)}.chip.ok{background:#1e8a4c}.chip.bad{background:#b33a3a}
.slot{display:inline-flex;min-width:130px;min-height:36px;vertical-align:middle;border:2px dashed var(--mut);border-radius:6px;padding:2px;margin:2px;justify-content:center;align-items:center}.slot.bad{border-color:#b33a3a;background:var(--bad)}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln);flex-wrap:wrap}.row>span:first-child{flex:1 1 300px}
.cm{text-align:center}.root{display:inline-block;background:var(--ac);color:#fff;padding:8px 18px;border-radius:8px;font-weight:700}
.br{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}.br>div{flex:1 1 170px;border:1px solid var(--ln);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid var(--ln);padding:6px;vertical-align:top}th{background:var(--ac);color:#fff;font-size:.9rem}td.bin{min-height:80px;height:90px}td.bin.bad{background:var(--bad)}td.bin .chip{margin:2px}
.cw{overflow-x:auto}.cr{display:flex;align-items:center;margin:3px 0;width:max-content}.cr b{width:24px;color:var(--mut)}.cr i,.cr input{width:32px;height:34px;margin:1px;font-style:normal}
.cr input{text-align:center;font:700 1rem inherit;border:1px solid var(--mut);border-radius:4px;background:var(--card);color:var(--fg);padding:0}.cr input.key{background:var(--key);color:#1c2b33}.cr input.ok{background:var(--ok)}.cr input.bad{background:var(--bad)}
ol.cl{margin:10px 0 0;padding-left:20px}button{font:inherit;padding:7px 16px;border:0;border-radius:6px;background:var(--ac);color:#fff;cursor:pointer;margin-top:10px}.rs{margin-left:10px;font-weight:700}
#tot{position:sticky;bottom:0;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;font-weight:700}
</style></head><body><main><h1>Besinler ve Özellikleri</h1><p class="sub">4. sınıf Fen Bilimleri değerlendirmesi. Her bölümün sonunda “Kontrol et” düğmesine bas. Sürükle-bırak etkinliklerinde bir kutuya dokunup ardından yerine dokunarak da yerleştirebilirsin.</p><div id="app"></div><div id="tot">Toplam: 0 / 0</div></main>

const CW=[["NİKOTİN",4,"Sigarada bulunan, bağımlılık yapan madde."],["AMBALAJ",3,"Paketli besinlerde sağlam olmasına dikkat ettiğimiz kısım."],["PROTEİN",5,"Yaraların ve kırık kemiklerin onarımında gereken besin içeriği."],["TUZLAMA",3,"Peynir ve balığı uzun süre saklamak için uygulanan yöntem."],["VİTAMİN",2,"Vücudun direncini artırarak hastalıklardan korur."],["KURUTMA",5,"Besinlerin suyunu uzaklaştırarak saklama yöntemi."],["MİNERAL",4,"Kemik ve diş sağlığı için gerekli, düzenleyici besin içeriği."]];
MC.forEach(q=>{const c=q[1][q[2]];q[1].sort(()=>Math.random()-.5);q[2]=q[1].indexOf(c)});
const mc=MC.map((q,i)=>`<div class="q"><p>${i+1}. ${q[0]}</p>${q[3]?`<img class="f" id="im_${q[3]}" alt="Besin piramidi" style="max-width:260px">`:''}${rad('m'+i,q[1])}</div>`).join('');
const tf=`<img class="f" id="im_plate" alt="Mete ve Melih’in öğle yemeği" style="max-width:520px"><p class="k">İlk beş ifade görsele göredir.</p>`+TF.map((t,i)=>`<div class="q tf"><span>${t[0]}</span>${rad('t'+i,['Doğru','Yanlış'])}</div>`).join('');
const mt=`<div class="bank" id="b1">${MT.map(m=>chip(m[1],m[1],'b1')).join('')}</div>`+MT.map(m=>`<div class="row"><span>${m[0]}</span><span class="slot" data-a="${m[1]}"></span></div>`).join('');
const ws=["haşlayarak","mevsiminde","tarihine","pasif içici","Yeşilay","çözüldükten","su","yağa","trafik kazalarına","nikotin"];
const fl=`<div class="bank" id="b2">${ws.map(w=>chip(w,w,'b2')).join('')}</div>`+FL.map(f=>`<div class="row"><span>${f[0].replace(/\{(.+?)\}/,(m,a)=>`<span class="slot" data-a="${a}"></span>`)}</span></div>`).join('');
const cm=`<div class="bank" id="b3">${[["Karbonhidratlar","E"],["Yağlar","E"],["Proteinler","Y"],["Vitaminler","D"],["Su ve mineraller","D"]].map(c=>chip(c[0],c[1],'b3')).join('')}</div><div class="cm"><span class="root">Besin içerikleri</span><div class="br"><div><b>Enerji verici</b><span class="slot" data-a="E"></span><span class="slot" data-a="E"></span></div><div><b>Yapıcı ve onarıcı</b><span class="slot" data-a="Y"></span></div><div><b>Düzenleyici</b><span class="slot" data-a="D"></span><span class="slot" data-a="D"></span></div></div></div>`;
const tb=`<div class="bank" id="b4">${TB.map(t=>chip(t[0],t[1],'b4',t[2])).join('')}</div><table><tr><th>Karbonhidrat</th><th>Protein</th><th>Yağ</th><th>Vitamin ve mineral</th></tr><tr>${['K','P','Y','V'].map(a=>`<td class="bin" data-a="${a}"></td>`).join('')}</tr></table>`;

const cw=`<p class="k">Sarı kutuları yukarıdan aşağıya okuyunca gizli kelimeyi bulursun: obezite.</p><div class="cw">${CW.map((w,r)=>`<div class="cr"><b>${r+1}</b>${'<i></i>'.repeat(L-(w[1]-1))}${[...w[0]].map((c,j)=>`<input maxlength="1" data-a="${c}"${j==w[1]-1?' class="key"':''}>`).join('')}</div>`).join('')}</div><ol class="cl">${CW.map(w=>`<li>${w[2]}</li>`).join('')}</ol>`;
const M2=[["Besinlerin üretiminden sofraya gelene kadar her aşamasında görev alır.","Gıda mühendisi"],["Beslenme listesi hazırlayarak obezite ile mücadelede yardımcı olur.","Diyetisyen"],["Sigara içmediği hâlde dumandan etkilenen kişidir.","Pasif içici"],["Bağımlılık yapan maddelerle ilgili toplumu bilgilendirir.","Yeşilay"],["Hareketsizlik ve dengesiz beslenme sonucu kilonun normalin çok üstüne çıkmasıdır.","Obezite"]];
const m2=`<div class="bank" id="b5">${M2.map(m=>chip(m[1],m[1],'b5')).join('')}</div>`+M2.map(m=>`<div class="row"><span>${m[0]}</span><span class="slot" data-a="${m[1]}"></span></div>`).join('');
const HS=[["Sebze ve meyve tüketmek","H"],["Son kullanma tarihine bakmak","H"],["Düzenli spor yapmak","H"],["Sigara ve alkolden uzak durmak","H"],["Yemeği haşlayarak pişirmek","H"],["Günde tek öğün yemek","S"],["Çözülen besini tekrar dondurmak","S"],["Her gün gazlı içecek ve kızartma yemek","S"],["Tabağa yiyebileceğinden fazla koymak","S"],["Ambalajı yırtık ürün almak","S"]];
const hs=`<div class="bank" id="b6">${HS.map(h=>chip(h[0],h[1],'b6')).join('')}</div><table><tr><th>Sağlıklı yaşam için yapılır</th><th>Sağlığa zarar verir</th></tr><tr><td class="bin" data-a="H"></td><td class="bin" data-a="S"></td></tr></table>`;
$('#app').innerHTML=sec('s1','1. Çoktan seçmeli','Besin içerikleri, saklama, dengeli beslenme, alkol ve sigara','<div>'+mc+'</div>','chkR')+sec('s2','2. Doğru – Yanlış','Beslenme tarzlarını değerlendirme, sağlık ve zararlı alışkanlıklar',tf,'chkR')+sec('s3','3. Eşleştirme','Besin içeriklerinin görevleri: ifadeye uygun besin içeriğini sürükle',mt,'chkD')+sec('s4','4. Boşluk doldurma','Tazelik, doğallık, saklama koşulları, zararlı alışkanlıklar',fl,'chkD')+sec('s5','5. Kavram haritası','Besin içerikleri görevlerine göre gruplanır',cm,'chkD')+sec('s6','6. Tablo doldurma','Görselleri içerdikleri başlıca besin içeriğine göre yerleştir',tb,'chkD')+sec('s8','7. Eşleştirme: kişi, kuruluş ve kavramlar','Meslekler, Yeşilay, pasif içicilik ve obezite',m2,'chkD')+sec('s9','8. Sağlıklı mı, sağlıksız mı?','Sağlıklı yaşam alışkanlıkları ve zararlı davranışlar',hs,'chkD')+sec('s7','9. Çengel bulmaca','Besin ve sağlıklı yaşam kavramları',cw,'chkC');
document.querySelectorAll('.bank').forEach(b=>[...b.children].sort(()=>Math.random()-.5).forEach(c=>b.appendChild(c)));
for(const k of['pyr','plate']){const e=$('#im_'+k);if(e)e.src=IMG[k]}
const home=c=>{$('#'+c.dataset.b).appendChild(c);c.classList.remove('ok','bad')};
function put(c,t){if(!t.classList.contains('bin')&&t.firstElementChild)home(t.firstElementChild);t.appendChild(c);c.classList.remove('ok','bad','sel');sel=null}
document.addEventListener('dragstart',e=>{drag=e.target.closest('.chip')});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const t=e.target.closest('.slot,.bin,.bank');if(!drag||!t)return;t.classList.contains('bank')?home(drag):put(drag,t);drag=null});
document.addEventListener('click',e=>{const c=e.target.closest('.chip'),t=e.target.closest('.slot,.bin');
if(c){if(!c.parentElement.classList.contains('bank')){home(c);return}sel&&sel.classList.remove('sel');sel=sel===c?null:c;sel&&sel.classList.add('sel')}else if(t&&sel)put(sel,t)});

/* 4/D soru bazlı ölçme verisi: öğrenci kimliği yalnızca portal oturumunda eşleştirilir.
   GitHub sayfası öğrenci adı, kodu veya oturum anahtarı saklamaz. */
const DORTD_TRACK_VERSION=1;
const DORTD_ACTIVITY='Fen/besinlerdegerlendirme.html';
const DORTD_SECTION_NAMES={s1:'Çoktan seçmeli',s2:'Doğru-yanlış',s3:'Eşleştirme: besin içerikleri',s4:'Boşluk doldurma',s5:'Kavram haritası',s6:'Besin tablosu',s8:'Kişi/kuruluş/kavram',s9:'Sağlıklı yaşam',s7:'Bulmaca'};
const DORTD_CHECKED={};
Object.keys(DORTD_SECTION_NAMES).forEach(id=>{
  document.querySelectorAll('#'+id+' .chip, #'+id+' .cr input').forEach((el,i)=>el.dataset.trackItem=String(i+1));
});
function dortdRecord(id,answers){
  const items=answers.map((a,i)=>({id:id+'-q'+(i+1),correct:a.correct===true,answered:a.answered===true}));
  DORTD_CHECKED[id]={id,title:DORTD_SECTION_NAMES[id],items,correct:items.filter(x=>x.correct).length,total:items.length};
  const sections=Object.values(DORTD_CHECKED);
  const report={type:'DORTD_QUESTION_RESULTS',version:DORTD_TRACK_VERSION,activityId:DORTD_ACTIVITY,
    section:DORTD_CHECKED[id],sections,finished:sections.length===Object.keys(DORTD_SECTION_NAMES).length,
    checkedAt:new Date().toISOString()};
  // Hem portalın iframe dinleyicisine hem sayfa içindeki olası adaptörlere ilet.
  window.dispatchEvent(new CustomEvent('dortd-question-results',{detail:report}));
  if(window.parent!==window)window.parent.postMessage(report,'*');
}
function dortdRadioAnswers(id){
  const s=document.getElementById(id),key=id==='s1'?MC.map(q=>q[2]):TF.map(t=>t[1]?0:1);
  return key.map((correct,i)=>{
    const name=(id==='s1'?'m':'t')+i;
    const chosen=s.querySelector('input[name="'+name+'"]:checked');
    return {answered:!!chosen,correct:!!chosen&&Number(chosen.value)===correct};
  });
}
function dortdDragAnswers(id){
  const s=document.getElementById(id);
  const cs=[...s.querySelectorAll('.chip')].sort((a,b)=>Number(a.dataset.trackItem)-Number(b.dataset.trackItem));
  return cs.map(c=>({answered:!c.parentElement.classList.contains('bank'),correct:c.classList.contains('ok')}));
}
function dortdCrosswordAnswers(id){
  return [...document.querySelectorAll('#'+id+' .cr input')].map(i=>({answered:!!i.value,correct:i.value===i.dataset.a}));
}

function done(id,ok,n){const s=$('#'+id);s.querySelector('.rs').textContent=`${ok} / ${n}`;R[id]=[ok,n];let a=0,b=0;for(const k in R){a+=R[k][0];b+=R[k][1]}$('#tot').textContent=`Toplam: ${a} / ${b}`}
function chkR(id){const s=$('#'+id);let ok=0,n=0;const A=id=='s1'?MC.map(q=>q[2]):TF.map(t=>t[1]?0:1);A.forEach((a,i)=>{const nm=(id=='s1'?'m':'t')+i;n++;s.querySelectorAll(`input[name=${nm}]`).forEach((r,j)=>{r.parentElement.classList.remove('ok','bad');if(r.checked)r.parentElement.classList.add(j==a?'ok':'bad');if(r.checked&&j==a)ok++})});done(id,ok,n);dortdRecord(id,dortdRadioAnswers(id))}
function chkD(id){const s=$('#'+id);let ok=0;const n=s.querySelectorAll('.chip').length;s.querySelectorAll('.slot,.bin').forEach(t=>{t.classList.remove('bad');const cs=[...t.querySelectorAll('.chip')];if(!t.classList.contains('bin')&&!cs.length)t.classList.add('bad');cs.forEach(c=>{const g=c.dataset.g==t.dataset.a;c.classList.remove('ok','bad');c.classList.add(g?'ok':'bad');if(g)ok++})});done(id,ok,n);dortdRecord(id,dortdDragAnswers(id))}
document.querySelectorAll('.cr input').forEach(i=>i.addEventListener('input',()=>{i.value=i.value.toLocaleUpperCase('tr');if(i.value)i.nextElementSibling?.focus()}));
function chkC(id){let ok=0,n=0;$('#'+id).querySelectorAll('.cr input').forEach(i=>{n++;const g=i.value==i.dataset.a;i.classList.remove('ok','bad');i.classList.add(g?'ok':'bad');if(g)ok++});done(id,ok,n);dortdRecord(id,dortdCrosswordAnswers(id))}
</script></body></html>
