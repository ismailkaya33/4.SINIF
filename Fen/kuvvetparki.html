<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuvvet Parkı: Kuvvetin Etkileri</title>
<style>
:root{--ana:#7048e8;--gok1:#c5f6fa;--gok2:#f3fbff;--kart:#fff;--yazi:#1f2a44;--soluk:#5b6782;--ok:#1f9d5c;--hata:#c0392b;--ist:#7048e8}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--yazi);font:18px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,var(--gok1) 0%,var(--gok2) 60%,#e9fbe9 100%) fixed;background-color:var(--gok2);overflow-x:hidden}
#app{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:12px 16px 110px}
.dekor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.28;font-size:44px}
.dekor span{position:absolute;font-weight:900;font-family:"Trebuchet MS",sans-serif;color:#7048e8}
#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
h1,h2,.baslik{font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:800}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);margin:6px 0 4px;text-align:center}
h2{font-size:clamp(1.3rem,3.6vw,1.7rem);margin:4px 0 8px;text-align:center}
.kart{background:var(--kart);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 8px 0 rgba(31,42,68,.10),0 14px 30px rgba(31,42,68,.12)}
button{font:inherit;cursor:pointer;color:var(--yazi)}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid #4dabf7;outline-offset:3px}
.buyuk{display:block;margin:14px auto 4px;background:var(--ist);color:#fff;border:0;border-radius:18px;padding:14px 30px;min-height:60px;
  font-size:1.3rem;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.buyuk:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.ikincil{display:block;margin:10px auto 0;background:#fff;border:3px solid var(--ist);border-radius:16px;padding:8px 22px;min-height:52px;font-weight:800;box-shadow:0 4px 0 var(--ist)}
.ust{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ust .baslik{font-size:1.05rem;background:#fff9;border-radius:999px;padding:4px 14px}
.sag{display:flex;gap:8px;align-items:center}
.puan{background:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:1.15rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.puan.pop{animation:pop .4s}
.ses,.ev{background:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
/* Harita */
.harita{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.ev-kart{position:relative;text-align:left;border:0;border-radius:20px;padding:12px 14px 12px 74px;min-height:92px;background:#fff;
  box-shadow:0 6px 0 var(--r),0 10px 20px rgba(31,42,68,.12);border-left:8px solid var(--r)}
.ev-kart:active{transform:translateY(3px);box-shadow:0 3px 0 var(--r)}
.ev-kart .ikon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:14px;background:var(--r);display:grid;place-items:center;font-size:1.6rem}
.ev-kart b{display:block;font-size:1.05rem;line-height:1.2}
.ev-kart small{display:block;color:var(--soluk);font-size:.9rem;margin-top:2px}
.ev-kart .durum{display:block;margin-top:4px;font-size:1rem;letter-spacing:1px}
.ev-kart.bitti::after{content:"✅";position:absolute;right:10px;top:8px}
/* Hatırla kartı */
.hatirla{background:#fffbe6;border:3px dashed #fab005;border-radius:18px;padding:12px 16px;margin:10px 0}
.hatirla ul{margin:6px 0;padding-left:22px}.hatirla li{margin:4px 0}
.hatirla b{color:#c2255c}
.cip-satir{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.cip{background:#e7f5ff;border:3px solid #74c0fc;border-radius:14px;padding:6px 12px;font-weight:700}
.cip.y{background:#fff3bf;border-color:#fcc419}.cip.p{background:#ffe3ec;border-color:#f783ac}.cip.g{background:#d3f9d8;border-color:#69db7c}
.ok-isaret{font-weight:800;color:#1971c2;align-self:center;font-size:1.3rem}
table.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;margin:8px 0}
.tbl th{font-size:.95rem;text-align:left;padding:4px 8px;color:var(--soluk)}
.tbl td{background:#fff;padding:6px 10px;border-top:2px solid #eee;border-bottom:2px solid #eee}
.tbl td:first-child{border-left:2px solid #eee;border-radius:12px 0 0 12px;font-weight:800}
.tbl td:last-child{border-right:2px solid #eee;border-radius:0 12px 12px 0}
/* Soru */
.etiket{display:inline-block;background:var(--ist);color:#fff;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.9rem}
.sahne{text-align:center;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.2;margin:8px 0 0}
.yonerge{font-size:clamp(1.15rem,3.4vw,1.35rem);font-weight:700;text-align:center;margin:10px 0 6px;color:#343a40}
.serit{position:relative;background:repeating-linear-gradient(#fff 0 38px,#d0ebff 38px 40px);border:3px solid #a5d8ff;border-left:10px solid #ff8787;border-radius:14px;
  padding:6px 16px 8px;margin:8px 0 14px;font:800 clamp(1.3rem,4.2vw,1.75rem)/40px "Trebuchet MS",system-ui,sans-serif;text-align:center}
.serit .bosluk{display:inline-block;min-width:44px;border-bottom:4px solid var(--ist);color:var(--ist)}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec.tek{grid-template-columns:1fr}
.sec.uc{grid-template-columns:repeat(3,1fr)}
@media (max-width:460px){.sec{grid-template-columns:1fr}.sec.uc{grid-template-columns:repeat(3,1fr)}}
.sec button{position:relative;min-height:64px;border-radius:18px;border:3px solid var(--c);background:var(--z);font-size:1.25rem;font-weight:800;
  padding:8px 40px 8px 52px;text-align:left;box-shadow:0 5px 0 var(--c)}
.sec.uc button{font-size:2.2rem;text-align:center;padding:6px 8px 6px 40px}
.sec button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.sec button:nth-child(4n+1){--c:#ff8a5c;--z:#fff0e9}.sec button:nth-child(4n+2){--c:#2ec4b6;--z:#e4f8f6}
.sec button:nth-child(4n+3){--c:#f4a300;--z:#fff6dc}.sec button:nth-child(4n+4){--c:#7b5cff;--z:#efeaff}
.sec .no{position:absolute;left:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1rem}
.sec button.dogru{--c:var(--ok);--z:#e3f7ec}
.sec button.dogru::after{content:"✔";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:1.5rem}
.sec button.yanlis{--c:#a7b0c0;--z:#f1f3f7;color:#6b7489;text-decoration:line-through}
.sec button.yanlis::after{content:"✖";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--hata);font-size:1.3rem}
/* Sözcük seçme */
.kelimeler{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0 6px}
.kelimeler button{min-height:60px;border-radius:16px;border:3px solid #91a7ff;background:#edf2ff;font-size:1.35rem;font-weight:800;padding:6px 16px;box-shadow:0 5px 0 #91a7ff}
.kelimeler button.dogru{background:#fff3bf;border-color:#f08c00;box-shadow:0 5px 0 #f08c00;color:#c2410c}
.kelimeler button{position:relative}.kelimeler button.dogru::after{content:" ✔";color:var(--ok)}.kelimeler button.yanlis::after{content:" ✖";color:var(--hata);display:inline-block}
.kelimeler button.yanlis{background:#f1f3f7;border-color:#ced4da;box-shadow:0 5px 0 #ced4da;color:#868e96;text-decoration:line-through}
/* Adımlı karar */
.adimlar{list-style:none;padding:0;margin:8px 0}
.adimlar li{display:flex;gap:10px;align-items:center;background:#f8f9fa;border-radius:14px;padding:8px 12px;margin:6px 0;border:3px solid #e9ecef;font-weight:700}
.adimlar li.simdi{border-color:var(--ist);background:#f3f0ff}
.adimlar li .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--ist);color:#fff;display:grid;place-items:center}
.adimlar li .c{margin-left:auto;font-weight:800;white-space:nowrap}
.tur-sonuc{display:inline-block;font-size:1.4rem;font-weight:800;background:#fff3bf;border:3px solid #fcc419;border-radius:14px;padding:4px 16px;margin-top:6px}
.sec button.secili{--z:#fff3bf;outline:4px solid #fcc419;outline-offset:2px}
.sec.coklu button.secili::before{content:"☑ "}
.deney{background:#e7f5ff;border-radius:18px;padding:8px;margin:8px 0}.deney svg{display:block;width:100%;height:auto}
.deney-durum{text-align:center;font-weight:800;font-size:1.15rem;margin:4px 0 2px}
.sahne.gorsel-svg svg{width:100%;max-width:460px;height:auto}
.alt{display:flex;justify-content:center;margin-top:14px}
.ipucu-btn{background:#fff8e1;border:3px solid #ffd166;border-radius:999px;padding:6px 20px;min-height:50px;font-weight:800;box-shadow:0 4px 0 #ffd166}
/* Karakter */
.karakter-satir{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.krk{flex:0 0 auto;width:84px}
.krk svg{display:block;width:100%;height:auto;transform-origin:50% 100%}
.krk .goz-mutlu,.krk .kas{display:none}
.krk.mutlu .goz-mutlu{display:inline}.krk.mutlu .goz-acik{display:none}
.krk.dusun .goz-acik{transform:translate(2px,-3px)}
.krk.uzgun .kas{display:inline}
.balon{position:relative;flex:1;background:#fff;border-radius:20px;padding:12px 16px;font-weight:600;min-height:3.2em;margin-bottom:22px;box-shadow:0 5px 0 rgba(31,42,68,.10);border:3px solid #fff}
.balon::before{content:"";position:absolute;left:-14px;bottom:16px;border:9px solid transparent;border-right:14px solid #fff;border-left:0}
.balon.mutlu{border-color:#bfead2}.balon.uzgun{border-color:#ffd3cc}.balon.dusun{border-color:#ffe7a3}
.devam-yer{text-align:center}
.yol{display:flex;gap:6px;justify-content:center;margin:8px 0 0}
.yol span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px dashed #c9cfdb;font-size:.85rem;font-weight:800;color:var(--soluk)}
.yol span.simdi{border:3px solid var(--ist);color:var(--ist)}
.yol span.ok{border:3px solid transparent;background:#fff3c4}
.bitis{text-align:center}
.rozet{width:130px;height:auto}
.rozet-ad{font-weight:800;font-size:1.25rem;margin-top:-4px}
#karne .rm{padding:4px 0;text-align:left}
#karne .rm-k{border:0;background:#f5f8ff;border-radius:16px}
@media (prefers-reduced-motion:no-preference){
  .krk.zipla svg{animation:zipla .6s}
  .krk.salla svg,.sec button.salla,.kelimeler button.salla{animation:salla .45s}
  .kart.gir{animation:gir .35s ease-out}
}
@keyframes zipla{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes salla{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes gir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.25)}}
</style>
</head>
<body>
<div class="dekor" aria-hidden="true"><span style="top:6%;left:3%">➡️</span><span style="top:30%;right:4%">⬅️</span><span style="bottom:14%;left:6%">⚡</span><span style="top:62%;right:12%">🎡</span></div>
<canvas id="konfeti" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
/* RaporMotoru v2 — 4/D portalına bağlı (her etkinliğin içine gömülür; tek dosya, çevrimdışı).
 *
 * Akış:
 *   RaporMotoru.init({oyunId, oyunAdi, kazanimlar:[{kod, ad}]})   oyun başında (ve "yeniden oyna"da)
 *   RaporMotoru.kaydet({...})                                       her maddeden sonra
 *   RaporMotoru.ekranCiz(el)                                        oyun sonunda: öğrenciye "Kazanım Karnem"
 *
 * Portal bağlantısı (öğrenci kodla giriş yaptıysa etkinlik portalın içinde açılır):
 *   - Her madde: {type:'4d:item-result'} mesajı (madde bazlı kazanım/yanılgı verisi)
 *   - Oyun sonu: {type:'4d:activity-finished'} mesajı, oyun başına BİR kez (mevcut sonuç kaydı)
 *   Sayfa portal dışında (kodsuz) açıldıysa mesajlar gitmez; karne yine gösterilir.
 *   Mesajı yalnızca portal kayıt listesinde (portal/etkinlik-kayitlari.json) olan etkinlikler için
 *   sunucu kaydeder; oyunId bu listedeki "id" ile aynı olmalı.
 *
 * Seviye eşikleri öğretmen panelindekiyle AYNI olmalı (ESIK, seviye).
 */
const RaporMotoru = (() => {
  const SURUM = 3;
  const ESIK = { ustalik: 0.85, gelisiyor: 0.6, ipucuUst: 0.25, minMadde: 3 };
  let meta = null, kayit = [], t0 = Date.now(), denemeKimligi = '', bitisGonderildi = false;

  function yeniKimlik() {
    let r = '';
    try { const a = new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b => { r += b.toString(16).padStart(2, '0'); }); }
    catch (e) { r = Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    return 'rm_' + r;
  }
  function portalaGonder(mesaj) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(mesaj, '*'); } catch (e) { /* portal yok */ }
  }


  /* --- Cevap defteri (v3, öğretmenin kararı 2026-11-27) ---
   * Her ilk kez çözülen madde portala tek tek gider (4d:answer); portal Google tablosuna yazar, İLK kayıt kilitlidir.
   * Etkinlik açılınca (init) portal kayıtlı cevapları geri verir (4d:saved-answers) → RaporMotoru.kayitli(id).
   * Etkinlik isterse RaporMotoru.onKayitli(fn) ile kayıtlı maddeleri atlar/kilitler. Onay (4d:answer-ack) gelene
   * kadar cevap 5 saniyede bir yeniden gönderilir; portal yoksa hiçbir şey gitmez. */
  let kayitliCevaplar = {}, kayitliDinleyiciler = [], bekleyenCevaplar = {}, cevapZamanlayici = null;
  function hazirGonder() { if (meta) portalaGonder({ type: '4d:ready', schemaVersion: 1, activityId: meta.oyunId }); }
  function bekleyenleriGonder() {
    const k = Object.keys(bekleyenCevaplar);
    k.forEach(q => portalaGonder(bekleyenCevaplar[q]));
    if (!k.length && cevapZamanlayici) { clearInterval(cevapZamanlayici); cevapZamanlayici = null; }
  }
  function cevapGonder(x) {
    if (!meta || x.r || !x.m || kayitliCevaplar[x.m] || bekleyenCevaplar[x.m]) return;
    bekleyenCevaplar[x.m] = { type: '4d:answer', schemaVersion: 1, activityId: meta.oyunId, questionId: x.m,
      correct: !x.c, firstTry: !!x.i && !x.c };
    portalaGonder(bekleyenCevaplar[x.m]);
    if (!cevapZamanlayici && window.parent !== window) cevapZamanlayici = setInterval(bekleyenleriGonder, 5000);
  }
  try {
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (ev.source !== window.parent || !d || typeof d !== 'object' || !meta || d.activityId !== meta.oyunId) return;
      if (d.type === '4d:saved-answers' && Array.isArray(d.answers)) {
        d.answers.forEach(a => { if (a && typeof a.questionId === 'string') kayitliCevaplar[a.questionId] = { correct: !!a.correct, firstTry: !!a.firstTry, answer: String(a.answer || '') }; });
        Object.keys(kayitliCevaplar).forEach(q => { delete bekleyenCevaplar[q]; });
        kayitliDinleyiciler.forEach(fn => { try { fn(Object.assign({}, kayitliCevaplar)); } catch (e) { /* etkinlik hatası */ } });
      } else if (d.type === '4d:answer-ack' && typeof d.questionId === 'string') {
        delete bekleyenCevaplar[d.questionId];
        if (d.saved && typeof d.saved === 'object') kayitliCevaplar[d.questionId] = { correct: !!d.saved.correct, firstTry: !!d.saved.firstTry, answer: String(d.saved.answer || '') };
      }
    });
  } catch (e) { /* tarayıcı mesaj dinleyemiyor */ }
  /** Daha önce kaydedilmiş madde: {correct, firstTry, answer} ya da null. */
  function kayitli(madde) { return kayitliCevaplar[String(madde)] || null; }
  /** Portal kayıtlı cevapları verdiğinde çağrılır: fn({maddeId: {correct, firstTry, answer}}). */
  function onKayitli(fn) { if (typeof fn === 'function') kayitliDinleyiciler.push(fn); }

  /** m = {oyunId, oyunAdi, kazanimlar:[{kod, ad}]}  (kod = MEB kazanım kodu, ör. "M.4.1.2.3") */
  function init(m) {
    meta = { oyunId: String(m.oyunId), oyunAdi: String(m.oyunAdi), kazanimlar: m.kazanimlar.map(k => ({ kod: String(k.kod), ad: String(k.ad) })) };
    kayit = []; t0 = Date.now(); denemeKimligi = yeniKimlik(); bitisGonderildi = false;
    bekleyenCevaplar = {}; hazirGonder();
  }

  /** r = {kazanim:kod, madde:id, yanilgi:'etiket'|'', ilkDenemeDogru:bool, deneme:n, ipucu:0-3,
   *       cozumGoruldu:bool, sureMs:n, tekrar:bool}   tekrar=true → seviye hesabına katılmaz */
  function kaydet(r) {
    const i = meta ? meta.kazanimlar.findIndex(k => k.kod === r.kazanim) : -1;
    if (i < 0) { console.warn('RaporMotoru: bilinmeyen kazanım', r.kazanim); return false; }
    const x = {
      k: i, m: String(r.madde || '').slice(0, 40), y: String(r.yanilgi || '').slice(0, 40),
      i: r.ilkDenemeDogru ? 1 : 0, d: Math.max(1, r.deneme | 0), h: Math.max(0, Math.min(3, r.ipucu | 0)),
      c: r.cozumGoruldu ? 1 : 0, s: Math.max(0, Math.round((r.sureMs || 0) / 1000)), r: r.tekrar ? 1 : 0
    };
    kayit.push(x);
    portalaGonder({ type: '4d:item-result', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      kazanim: meta.kazanimlar[i].kod, madde: x.m, yanilgi: x.y, ilkDogru: x.i, deneme: x.d, ipucu: x.h,
      cozum: x.c, sureSn: x.s, tekrar: x.r });
    cevapGonder(x);
    return true;
  }

  function seviye(a) {            // a: ilk kez sorulan madde kayıtları
    const n = a.length;
    if (n < ESIK.minMadde) return 'veri-az';
    const p = a.filter(x => x.i).length / n, h = a.filter(x => x.h > 0).length / n;
    if (p >= ESIK.ustalik && h <= ESIK.ipucuUst) return 'ustalasti';
    if (p >= ESIK.gelisiyor) return 'gelisiyor';
    return 'destek';
  }

  function ozet() {
    return meta.kazanimlar.map((k, idx) => {
      const hepsi = kayit.filter(x => x.k === idx), a = hepsi.filter(x => !x.r);
      const yan = {};
      hepsi.forEach(x => { if (x.y) yan[x.y] = (yan[x.y] || 0) + 1; });
      return {
        kod: k.kod, ad: k.ad, n: a.length, dogru: a.filter(x => x.i).length,
        p: a.length ? a.filter(x => x.i).length / a.length : null,
        ipucuOran: a.length ? a.filter(x => x.h > 0).length / a.length : 0,
        seviye: seviye(a), yanilgilar: yan
      };
    });
  }

  /** Oyun sonu: portaldaki mevcut sonuç kaydı için tek mesaj (çift gönderim yok). */
  function bitir() {
    if (!meta || bitisGonderildi) return;
    const a = kayit.filter(x => !x.r);
    if (!a.length) return;
    bitisGonderildi = true;
    const toplam = a.length, ilk = a.filter(x => x.i).length, cozulen = a.filter(x => !x.c).length;
    portalaGonder({ type: '4d:activity-finished', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      correct: cozulen, wrong: toplam - cozulen, total: toplam,
      wrongAttempts: a.reduce((t, x) => t + (x.d - 1), 0), firstTry: Math.min(ilk, cozulen),
      durationSeconds: Math.min(86400, Math.round((Date.now() - t0) / 1000)) });
  }

  const ETIKET = {
    ustalasti: ['Harika! Bu konuyu iyi biliyorsun.', '#1b7f4b'],
    gelisiyor: ['Gelişiyorsun. Biraz daha tekrar iyi gelir.', '#b26a00'],
    destek: ['Bu konuyu birlikte tekrar edelim.', '#b3261e'],
    'veri-az': ['Bu konuda daha fazla soru çözmen gerek.', '#5b6470']
  };

/* --- Çoklu seçim: doğru olanların HEPSİNİ seç, sonra kontrol et --- */
function cokluGorev(g) {
  durum.sec = shuffle(g.dogrular.map(t => [t, '']).concat(g.yanlislar)); durum.secili = new Set();
  gorevKabuk(g, g.yonerge, '<div class="sec tek sec-kap coklu">' + durum.sec.map((s, i) => '<button data-i="' + i + '" aria-pressed="false" aria-label="Seçenek ' + (i + 1) + ': ' + esc(s[0]) + '"><span class="no">' + (i + 1) + '</span>' + esc(s[0]) + '</button>').join('') + '</div>',
    '<div class="alt" style="gap:10px;flex-wrap:wrap"><button class="ipucu-btn" id="ip">💡 İpucu</button><button class="ipucu-btn kontrol" id="kontrol">✔ Kontrol et</button></div>');
  document.getElementById('kontrol').onclick = cokluKontrol;
}
function cokluSec(i) {
  const d = durum, b = app.querySelectorAll('.sec-kap button')[i]; if (!b || d.kilit) return;
  if (d.secili.has(i)) d.secili.delete(i); else d.secili.add(i);
  b.classList.toggle('secili', d.secili.has(i)); b.setAttribute('aria-pressed', d.secili.has(i)); cal('tik');
}
function cokluKontrol() {
  const d = durum; if (!d || d.kilit) return;
  if (!d.secili.size) { ruh('dusun', null, 'Önce doğru bulduğun seçeneklere dokun, sonra "Kontrol et"e bas.'); return; }
  d.deneme++;
  const btns = app.querySelectorAll('.sec-kap button');
  const yanlisSecilen = [...d.secili].filter(i => d.sec[i][1]), eksik = d.sec.map((s, i) => i).filter(i => !d.sec[i][1] && !d.secili.has(i));
  if (!yanlisSecilen.length && !eksik.length) {
    btns.forEach((b, i) => { if (d.secili.has(i)) b.classList.add('dogru'); });
    app.querySelectorAll('#kontrol').forEach(b => { b.disabled = true; });
    return basari(document.getElementById('kontrol'));
  }
  if (!d.ilkYanilgi) d.ilkYanilgi = yanlisSecilen.length ? d.sec[yanlisSecilen[0]][1] : 'eksik-secti';
  if (d.deneme >= 2) {
    btns.forEach((b, i) => { b.classList.remove('secili'); if (!d.sec[i][1]) b.classList.add('dogru'); else if (d.secili.has(i)) b.classList.add('yanlis'); });
    document.getElementById('kontrol').disabled = true;
    cal('tik'); return gorevBitti('ogrendi', true, 'dusun', null, '📘 Birlikte bakalım: ' + d.g.why);
  }
  d.ipucu = 1; cal('yanlis');
  const t = yanlisSecilen.length && eksik.length ? 'Bir yanlış seçtin, bir doğruyu da atladın.' : yanlisSecilen.length ? (yanlisSecilen.length > 1 ? 'Bazı seçimlerin yanlış.' : 'Seçimlerinden biri yanlış.') : 'Seçtiklerin doğru ama eksik var.';
  ruh('uzgun', 'salla', '🤔 Henüz değil. ' + t + (d.g.ipucu ? ' 💡 ' + d.g.ipucu : ''));
}

/* --- Deney: oyuncak arabaya kuvvet uygula, sonucu gör --- */
function arabaSVG() {
  return '<g id="araba"><rect x="0" y="-34" width="76" height="26" rx="8" fill="var(--ist)"/><path d="M14 -34 L24 -52 L54 -52 L64 -34Z" fill="var(--ist)" opacity=".85"/>' +
    '<rect x="28" y="-49" width="11" height="12" rx="2" fill="#e7f5ff"/><rect x="42" y="-49" width="11" height="12" rx="2" fill="#e7f5ff"/>' +
    '<circle cx="18" cy="-6" r="9" fill="#343a40"/><circle cx="58" cy="-6" r="9" fill="#343a40"/><circle cx="18" cy="-6" r="3" fill="#ced4da"/><circle cx="58" cy="-6" r="3" fill="#ced4da"/>' +
    '<circle cx="72" cy="-26" r="3" fill="#ffd43b"/><text id="kuvvetIsaret" x="38" y="-62" text-anchor="middle" font-size="30"></text></g>';
}
function deneyGorev(g) {
  durum.sec = shuffle(g.secenekler.map(o => [o.t, o.dogru ? '' : o.yan, o]));
  gorevKabuk(g, g.yonerge,
    '<div class="deney"><svg viewBox="0 0 600 130" role="img" aria-label="Oyuncak araba deneyi"><rect x="0" y="96" width="600" height="34" fill="#868e96"/>' +
    '<path d="M0 113 H600" stroke="#fff" stroke-width="4" stroke-dasharray="26 18"/><g id="arabaKap" transform="translate(' + (g.x0 || 40) + ' 96)">' + arabaSVG() + '</g></svg>' +
    '<div class="deney-durum" id="deneyDurum">' + esc(g.durumMetni) + '</div></div>' +
    '<div class="sec tek sec-kap">' + durum.sec.map((s, i) => '<button data-i="' + i + '" aria-label="Seçenek ' + (i + 1) + ': ' + esc(s[0]) + '"><span class="no">' + (i + 1) + '</span>' + esc(s[0]) + '</button>').join('') + '</div>',
    '<div class="alt"><button class="ipucu-btn" id="ip">💡 İpucu</button></div>');
  durum.x = g.x0 || 40; deneyHaraket(g.v0, 700);
}
function arabaKonum(x) { const k = document.getElementById('arabaKap'); if (k) k.setAttribute('transform', 'translate(' + x.toFixed(1) + ' 96)'); }
function deneyHaraket(v, ms, sonra) {   // v: saniyede birim (sağa +, sola -)
  const d = durum, bas = performance.now(), x0 = d.x;
  if (azHareket() || !v) { d.x = Math.max(0, Math.min(520, x0 + v * ms / 1000)); arabaKonum(d.x); if (sonra) setTimeout(sonra, azHareket() ? 200 : ms); return; }
  const adimF = t => { if (durum !== d) return; const p = Math.min(1, (t - bas) / ms); d.x = Math.max(0, Math.min(520, x0 + v * p * ms / 1000)); arabaKonum(d.x);
    if (p < 1) requestAnimationFrame(adimF); else if (sonra) sonra(); };
  requestAnimationFrame(adimF);
}
function deneySec(i) {
  const d = durum; if (!d || d.kilit || d.oynuyor) return;
  const btns = app.querySelectorAll('.sec-kap button'), btn = btns[i]; if (!btn || btn.disabled) return;
  const [, yan, o] = d.sec[i], g = d.g; d.deneme++; d.oynuyor = true;
  btns.forEach(b => { b.disabled = true; }); cal('tik');
  const isaret = document.getElementById('kuvvetIsaret'); if (isaret) isaret.textContent = o.isaret || '';
  document.getElementById('deneyDurum').textContent = '⏳ Bakalım ne olacak…';
  deneyHaraket(g.v0, 350, () => {
    if (isaret) isaret.textContent = '';
    deneyHaraket(o.v1, 1100, () => {
      d.oynuyor = false;
      document.getElementById('deneyDurum').textContent = '👀 ' + o.sonuc;
      if (o.dogru) { btn.disabled = false; btn.classList.add('dogru'); btns.forEach(b => { b.disabled = true; }); return basari(btn); }
      btn.classList.add('yanlis');
      if (!d.ilkYanilgi) d.ilkYanilgi = yan;
      if (d.deneme >= 2) {
        btns.forEach((b, k) => { if (d.sec[k][2].dogru) b.classList.add('dogru'); });
        cal('tik'); return gorevBitti('ogrendi', true, 'dusun', null, '📘 ' + o.sonuc + '. Doğrusu: "' + g.secenekler.find(x => x.dogru).t + '". ' + g.why);
      }
      cal('yanlis'); d.ipucu = 1;
      ruh('uzgun', 'salla', '🤔 ' + o.sonuc + '. Görev bu değildi! Araba başa döndü, bir daha dene. 💡 ' + g.ipucu);
      setTimeout(() => { if (durum !== d) return; d.x = g.x0 || 40; arabaKonum(d.x); document.getElementById('deneyDurum').textContent = g.durumMetni;
        btns.forEach((b, k) => { if (!b.classList.contains('yanlis')) b.disabled = false; }); deneyHaraket(g.v0, 500); }, 1300);
    });
  });
}

/* --- Adımlı karar: iş / hareket / oluş / durum --- */
const KARAR = [
  { s: '"Neyi? Kimi?" diye sor. Cevap var mı?', evet: 'iş' },
  { s: 'Yer değiştiriyor ya da kıpırdıyor mu?', evet: 'hareket' },
  { s: 'Zamanla kendiliğinden mi değişiyor?', evet: 'oluş', hayir: 'durum' }
];
function adimliGorev(g) {
  const yol = { 'iş': [true], 'hareket': [false, true], 'oluş': [false, false, true], 'durum': [false, false, false] }[g.tur];
  Object.assign(durum, { yol, adim: 0, hata: false, cevaplar: [] });
  app.innerHTML = ustCiz(true) + '<div class="kart gir"><span class="etiket">' + ist.ikon + ' ' + esc(ist.ad) + ' · Görev ' + (gi + 1) + ' / ' + ist.gorevler.length + '</span>' + yolCiz() +
    gorselHTML(g) + '<div class="yonerge">Yükleme soruları sırayla sor ve cümlenin türünü bul.</div>' +
    '<div class="serit">' + esc(g.cumle) + '</div><ul class="adimlar" id="adimlar"></ul><div id="karar"></div><div id="turYer" style="text-align:center"></div></div>' +
    karakterSatir('', 'Yüklemi bul, sonra 1. sorudan başla. "Evet" dediğin yerde durursun!') + '<div class="devam-yer" id="devamYer"></div>';
  sesBagla(); adimliCiz();
}
function adimliCiz() {
  const d = durum;
  document.getElementById('adimlar').innerHTML = KARAR.slice(0, d.adim + 1).map((k, i) =>
    '<li class="' + (i === d.adim && !d.kilit ? 'simdi' : '') + '"><span class="n">' + (i + 1) + '</span><span>' + esc(k.s) + '</span><span class="c">' +
    (i < d.cevaplar.length ? (d.cevaplar[i] ? '✔ Evet' : '✖ Hayır') : '') + '</span></li>').join('');
  const kr = document.getElementById('karar');
  if (d.kilit) { kr.innerHTML = ''; return; }
  kr.innerHTML = '<div class="sec karar sec-kap"><button data-v="1"><span class="no">1</span>Evet</button><button data-v="0"><span class="no">2</span>Hayır</button></div>';
  kr.querySelectorAll('button').forEach(b => { b.onclick = () => adimliCevap(b.dataset.v === '1'); });
}
function adimliCevap(v) {
  const d = durum; if (!d || d.kilit || d.g.tip !== 'adimli') return;
  const dogruV = d.yol[d.adim]; d.deneme++;
  if (v !== dogruV) {
    d.hata = true; if (!d.ilkYanilgi) d.ilkYanilgi = ['nesne-' + (dogruV ? 'gormedi' : 'uydurdu'), 'hareket-' + (dogruV ? 'gormedi' : 'karisti'), 'olus-durum-karisti'][d.adim];
    cal('yanlis');
    const acik = d.adim === 0 ? (dogruV ? 'Cevap var: ' + (d.g.nesne || '') : '"Neyi? Kimi?" sorusunun bu cümlede cevabı yok.')
      : d.adim === 1 ? (dogruV ? 'Evet, yer değiştiriyor.' : 'Hayır, burada yer değiştirme yok.') : (dogruV ? 'Evet, zamanla kendiliğinden değişiyor.' : 'Hayır, değişmiyor; bir hâlde kalıyor.');
    ruh('uzgun', 'salla', '🤔 Dikkat! ' + acik + ' Doğru cevabı işaretledim, devam edelim.');
  } else { cal('tik'); if (d.adim === 0 && v && d.g.nesne) ruh('mutlu', null, '👍 ' + d.g.nesne); else ruh('mutlu', null, '👍 Doğru! ' + (d.adim + 1 < d.yol.length ? 'Sonraki soruya geçelim.' : '')); }
  d.cevaplar.push(dogruV);
  if (d.adim + 1 < d.yol.length) { d.adim++; adimliCiz(); return; }
  d.kilit = true; adimliCiz();
  const ilk = !d.hata;
  document.getElementById('turYer').innerHTML = 'Bu cümle <span class="tur-sonuc">' + esc(d.g.tur.toLocaleUpperCase('tr')) + '</span> bildirir.';
  if (ilk) { cal('dogru'); konfeti(45); if (!d.tekrar) puanEkle(10); } else cal('tik');
  d.deneme = ilk ? 1 : 2;
  gorevBitti(ilk ? 'yildiz' : 'ogrendi', !ilk, ilk ? 'mutlu' : 'dusun', ilk ? 'zipla' : null, (ilk ? '⭐ Tüm soruları doğru sordun! ' : '📘 ') + d.g.why);
}

/* --- Bitiş --- */
function yildizYol(cx0, cy0, R, r) { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, u = i % 2 ? r : R;
  d += (i ? 'L' : 'M') + (cx0 + Math.cos(a) * u).toFixed(1) + ' ' + (cy0 + Math.sin(a) * u).toFixed(1); } return d + 'Z'; }
function bitisEkrani() {
  renkAyarla(); durum = null;
  const degerler = Object.values(sonuc), yildiz = degerler.filter(x => x === 'yildiz').length, oran = yildiz / TOPLAM;
  const hepsi = degerler.length === TOPLAM;
  const [rozetAd, rozetRenk] = hepsi && oran >= 0.85 ? ['Altın ' + T.rozet, '#f4b400'] : hepsi && oran >= 0.6 ? ['Gümüş ' + T.rozet, '#9aa5b1'] : hepsi ? ['Bronz ' + T.rozet, '#cd7f32'] : ['Cesur Kaşif', '#74c0fc'];
  app.innerHTML = ustCiz(false) + '<div class="kart gir bitis"><h1>🎉 ' + (hepsi ? 'Bütün ' + T.yer + 'ları tamamladın!' : 'Bugünlük bu kadar!') + '</h1>' +
    '<svg viewBox="0 0 120 150" class="rozet" role="img" aria-label="' + rozetAd + ' rozeti"><path d="M40 92 L26 146 L45 137 L56 150 L60 98Z" fill="#e03131"/><path d="M80 92 L94 146 L75 137 L64 150 L60 98Z" fill="#1c7ed6"/>' +
    '<circle cx="60" cy="60" r="46" fill="' + rozetRenk + '"/><circle cx="60" cy="60" r="36" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4"/><path d="' + yildizYol(60, 60, 24, 10) + '" fill="#fff"/></svg>' +
    '<div class="rozet-ad">' + rozetAd + '</div>' +
    '<table class="tbl">' + OYUN.istasyonlar.map((s, i) => '<tr><td>' + s.ikon + ' ' + (i + 1) + '</td><td>' + esc(s.ad) + '</td><td>' + s.gorevler.map(g => sembol(sonuc[g.id]) || '◯').join(' ') + '</td></tr>').join('') + '</table>' +
    karakterSatir('mutlu', 'Tebrikler! ' + degerler.length + ' görevden ' + yildiz + ' tanesini ilk denemede çözdün ve ' + puan + ' ' + esc(T.odulAd) + ' topladın.') +
    '<div id="karne"></div>' + (hepsi ? '' : '<button class="ikincil" id="geri">🗺️ Haritaya dön (sonuç gönderildi)</button>') + '<button class="buyuk" id="yeniden">↻ Baştan oyna</button></div>';
  sesBagla();
  if (!bitti) { RaporMotoru.ekranCiz(document.getElementById('karne')); bitti = true; }   // sonuç portala bir kez gider
  else document.getElementById('karne').innerHTML = '<p style="color:var(--soluk)">Karnen bu oyunda bir kez gönderildi.</p>';
  const eski = parseInt(depo.oku(DEPO_REKOR), 10) || 0; if (hepsi && yildiz > eski) depo.yaz(DEPO_REKOR, String(yildiz));
  document.getElementById('yeniden').onclick = baslangic;
  const gr = document.getElementById('geri'); if (gr) gr.onclick = harita;
  cal('kutlama'); konfeti(60); setTimeout(() => konfeti(40, innerWidth * 0.25, innerHeight * 0.3), 350);
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {   // 1-9 seçenek, İ ipucu, Enter devam
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && durum && !durum.kilit) {
    if (durum.g.tip === 'adimli') { if (n <= 2) adimliCevap(n === 1); } else cevap(n - 1);
  } else if ((e.key === 'i' || e.key === 'İ' || e.key === 'ı') && document.getElementById('ip')) ipucuVer();
  else if (e.key === 'Enter' && !document.getElementById('dev') && document.getElementById('kontrol') && !document.getElementById('kontrol').disabled) { e.preventDefault(); cokluKontrol(); }
  else if (e.key === 'Enter') { const d = document.getElementById('dev'); if (d && document.activeElement !== d) { e.preventDefault(); d.click(); } }
});
baslangic();
</script>
