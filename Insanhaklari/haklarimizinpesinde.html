<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haklarımızın Peşinde</title>
<style>
/* Renkler JS ile OYUN.tema'dan gelir. Buradakiler yedek değerdir. */
:root{--ana:#3a6fe0;--ikinci:#ff7b54;--gok1:#bfe3ff;--gok2:#fff5e8;--kart:#fff;--yazi:#1f2a44;--soluk:#5b6782;--ok:#1f9d5c;--hata:#c0392b;--sari:#fff4cf}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--yazi);font:18px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,var(--gok1) 0%,var(--gok2) 65%) fixed;background-color:var(--gok2);overflow-x:hidden}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:12px 14px 110px}
.dekor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dekor svg{position:absolute}
#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
h1,h2,.baslik{font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:800}
h1{font-size:clamp(1.6rem,4.6vw,2.3rem);margin:6px 0 4px;text-align:center}
h2{font-size:1.3rem;margin:4px 0 8px}
.kart{background:var(--kart);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 8px 0 rgba(31,42,68,.10),0 14px 30px rgba(31,42,68,.12)}
button{font:inherit;cursor:pointer;color:var(--yazi)}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid #ffb703;outline-offset:3px}
.buyuk{display:block;margin:14px auto 4px;background:var(--ana);color:#fff;border:0;border-radius:18px;padding:12px 28px;min-height:58px;
  font-size:1.25rem;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.buyuk:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
/* Üst çubuk + mahalle yolu */
.ust{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ust .baslik{font-size:1rem;background:#fff;border-radius:999px;padding:4px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sag{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.puan{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
.puan.pop{animation:pop .4s}
.ses{background:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.yol{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:10px 0 0;padding:8px 10px;background:#fff;border-radius:18px}
.durak{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;background:#fff;border:3px dashed #b9c3d6}
.durak.simdi{border:3px solid var(--ana);transform:scale(1.15);background:#eaf1ff}
.durak.bitti{border:3px solid var(--ok);background:#e3f7ec}
.cizgi{flex:1 1 4px;min-width:4px;max-width:20px;height:4px;border-radius:2px;background:#b9c3d6}
.sayac{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--soluk);white-space:nowrap}
/* Vaka kartı */
.vbas{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;justify-content:space-between}
.yer{font-weight:800;color:var(--ana)}
.etiket{display:inline-block;color:#fff;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.85rem;background:var(--ikinci)}
.etiket.puansiz{background:#7b5cff}.etiket.tekrar{background:#f4a300}
.adimlar{display:flex;gap:4px;margin:10px 0 4px;flex-wrap:wrap}
.adim{flex:1 1 0;min-width:0;text-align:center;font-size:.82rem;font-weight:700;padding:5px 4px;border-radius:12px;background:#f1f4fa;color:#7a8399;border:2px solid transparent}
.adim.aktif{background:#eaf1ff;color:var(--ana);border-color:var(--ana)}
.adim.gecti{background:#e3f7ec;color:var(--ok)}
.gorsel{display:flex;justify-content:center;margin:8px 0 4px}
.gorsel svg{width:100%;max-width:520px;height:auto;border-radius:16px}
.durum{background:var(--sari);border-left:6px solid #f4a300;border-radius:14px;padding:10px 14px;margin:8px 0 6px;font-size:1.05rem}
.soru{font-size:clamp(1.2rem,3.6vw,1.5rem);font-weight:800;margin:10px 0 12px;text-align:center}
.sec{display:grid;grid-template-columns:1fr;gap:10px}
.sec button{position:relative;min-height:60px;border-radius:18px;border:3px solid var(--c);background:var(--z);font-size:1.08rem;font-weight:700;
  padding:8px 40px 8px 52px;text-align:left;box-shadow:0 5px 0 var(--c)}
.sec button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.sec button:nth-child(1){--c:#ff8a5c;--z:#fff0e9}.sec button:nth-child(2){--c:#2ec4b6;--z:#e4f8f6}
.sec button:nth-child(3){--c:#f4a300;--z:#fff6dc}.sec button:nth-child(4){--c:#7b5cff;--z:#efeaff}
.sec .no{position:absolute;left:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1rem}
.sec button.dogru{--c:var(--ok);--z:#e3f7ec}
.sec button.dogru::after{content:"✔";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:1.5rem}
.sec button.yanlis{--c:#a7b0c0;--z:#f1f3f7;color:#6f788c;text-decoration:line-through}
.sec button.yanlis::after{content:"✖";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--hata);font-size:1.3rem}
.alt{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.kucuk-btn{background:#fff8e1;border:3px solid #ffd166;border-radius:999px;padding:6px 18px;min-height:50px;font-weight:800;box-shadow:0 4px 0 #ffd166}
.kucuk-btn.mavi{background:#eaf1ff;border-color:#9db8f5;box-shadow:0 4px 0 #9db8f5}
.kucuk-btn.yesil{background:#e3f7ec;border-color:#7fd3a5;box-shadow:0 4px 0 #7fd3a5}
/* Duygu kartları (puansız) */
.duygular{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.duygular{grid-template-columns:repeat(2,1fr)}}
.duygu{border:3px solid #d9def0;background:#fff;border-radius:18px;padding:8px 6px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:1rem;box-shadow:0 4px 0 #d9def0}
.duygu .e{font-size:2.2rem;line-height:1.1}
.duygu[aria-pressed="true"]{border-color:#7b5cff;background:#efeaff;box-shadow:0 4px 0 #7b5cff}
.not{font-size:.92rem;color:var(--soluk);text-align:center;margin:8px 0 0}
/* Sıralama */
.yuvalar{display:grid;gap:8px;margin:6px 0 12px}
.yuva{display:flex;align-items:center;gap:10px;min-height:58px;border:3px dashed #b9c3d6;border-radius:16px;padding:6px 12px;background:#f7f9fd;font-weight:700}
.yuva b{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--ana);color:#fff;display:grid;place-items:center}
.yuva.dolu{border-style:solid;border-color:var(--ana);background:#eaf1ff}
.yuva.dogru{border-color:var(--ok);background:#e3f7ec}
.skartlar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.skartlar{grid-template-columns:1fr}}
.skart{min-height:60px;border-radius:16px;border:3px solid #ffb38f;background:#fff3ec;font-weight:700;font-size:1.02rem;padding:8px 12px;text-align:left;box-shadow:0 4px 0 #ffb38f}
.skart:disabled{opacity:.4;box-shadow:none}
/* Rehber karakter + konuşma balonu */
.karakter-satir{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.krk{flex:0 0 auto;width:104px}
.krk.kucuk{width:84px}
.krk svg{display:block;width:100%;height:auto;transform-origin:50% 100%}
.krk .goz-mutlu,.krk .kas{display:none}
.krk.mutlu .goz-mutlu{display:inline}.krk.mutlu .goz-acik{display:none}
.krk.dusun .goz-acik{transform:translate(2px,-3px)}
.krk.uzgun .kas{display:inline}.krk.uzgun .goz-acik{transform:translateY(2px)}
.balon{position:relative;flex:1;min-width:0;background:#fff;border-radius:20px;padding:12px 16px;font-weight:600;min-height:3.2em;margin-bottom:22px;
  box-shadow:0 5px 0 rgba(31,42,68,.10);border:3px solid #fff}
.balon::before{content:"";position:absolute;left:-14px;bottom:16px;border:9px solid transparent;border-right:14px solid #fff;border-left:0}
.balon.mutlu{border-color:#bfead2}.balon.uzgun{border-color:#ffd3cc}.balon.dusun{border-color:#ffe7a3}.balon.mor{border-color:#d6ccff}
.devam-yer{text-align:center}
@media (max-width:460px){.krk{width:72px}.krk.kucuk{width:64px}.balon{padding:10px 12px}.adim{font-size:.8rem;padding:4px 2px}.ust .baslik{font-size:.9rem}}
/* Başlık ekranı: 3 adım şeması */
.akis{display:flex;align-items:stretch;gap:6px;margin:12px 0 6px}
.akis .k{flex:1 1 0;min-width:0;border-radius:16px;padding:10px 8px;text-align:center;font-size:.92rem}
.akis .k .s{font-size:1.8rem;display:block}
.akis .k b{display:block;font-size:1.02rem;margin:2px 0}
.akis .ok{align-self:center;font-size:1.4rem;color:var(--soluk)}
.k1{background:#eaf1ff;border:3px solid #9db8f5}.k2{background:#efeaff;border:3px solid #c3b4ff}.k3{background:#e3f7ec;border:3px solid #8fd8ae}
@media (max-width:520px){.akis{flex-direction:column}.akis .ok{transform:rotate(90deg)}}
.formul{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 2px}
.formul span{border-radius:12px;padding:4px 10px;font-weight:700;font-size:.95rem}
.formul .f1{background:#ffe08a}.formul .f2{background:#ffc8dd}.formul .f3{background:#bde0fe}
/* Bitiş */
.bitis{text-align:center}
.rozet{width:124px;height:auto}
.rozet-ad{font-weight:800;font-size:1.2rem;margin-top:-4px}
.yildizlar{font-size:1.6rem;letter-spacing:3px;margin:6px 0;word-break:break-all}
.duygu-ozet{background:#f6f3ff;border-radius:16px;padding:10px 14px;margin:10px 0;text-align:left}
.pano{width:100%;border-collapse:separate;border-spacing:0 6px;text-align:left;font-size:.98rem}
.pano th{font-size:1.02rem;padding:6px 10px;color:#fff}
.pano th:first-child{background:var(--ana);border-radius:12px 0 0 12px}.pano th:last-child{background:var(--ok);border-radius:0 12px 12px 0}
.pano td{padding:8px 10px;vertical-align:top}
.pano td:first-child{background:#eaf1ff;border-radius:12px 0 0 12px;font-weight:700}.pano td:last-child{background:#e3f7ec;border-radius:0 12px 12px 0}
#karne .rm{padding:4px 0;text-align:left}
#karne .rm h2{font-family:"Trebuchet MS",system-ui,sans-serif;text-align:center}
#karne .rm-k{border:0;background:#f5f8ff;border-radius:16px}
#karne .rm-bar{height:18px;border-radius:10px}
@media (prefers-reduced-motion:no-preference){
  .krk.zipla svg{animation:zipla .6s}
  .krk.salla svg,.sec button.salla,.yuvalar.salla{animation:salla .45s}
  .kart.gir{animation:gir .35s ease-out}
  .sec button,.duygu,.skart{transition:transform .08s,box-shadow .08s,background .15s}
  .durak{transition:transform .2s}
}
@keyframes zipla{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes salla{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes gir{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.25)}}
</style>
</head>
<body>
<div class="dekor" aria-hidden="true">
  <svg style="top:3%;left:-3%;width:170px" viewBox="0 0 170 60"><g fill="#fff"><ellipse cx="50" cy="38" rx="45" ry="20"/><ellipse cx="90" cy="28" rx="40" ry="26"/><ellipse cx="128" cy="40" rx="38" ry="18"/></g></svg>
  <svg style="top:14%;right:-3%;width:140px" viewBox="0 0 170 60"><g fill="#fff"><ellipse cx="50" cy="38" rx="45" ry="20"/><ellipse cx="90" cy="28" rx="40" ry="26"/><ellipse cx="128" cy="40" rx="38" ry="18"/></g></svg>
  <svg style="bottom:0;left:0;width:100%;height:80px" viewBox="0 0 1200 80" preserveAspectRatio="none"><path d="M0 40 Q150 10 300 40 T600 40 T900 40 T1200 40 V80 H0Z" fill="#9be08a" opacity=".45"/><path d="M0 58 Q150 34 300 58 T600 58 T900 58 T1200 58 V80 H0Z" fill="#6cc46a" opacity=".45"/></svg>
</div>
<canvas id="konfeti" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
/* RaporMotoru v2 — 4/D portalına bağlı (her etkinliğin içine gömülür; tek dosya, çevrimdışı).
 *
 * Akış:
 *   RaporMotoru.init({oyunId, oyunAdi, kazanimlar:[{kod, ad}]})   oyun başında (ve "yeniden oyna"da)
 *   RaporMotoru.kaydet({...})                                       her maddeden sonra
 *   RaporMotoru.ekranCiz(el)                                        oyun sonunda: öğrenciye "Kazanım Karnem"
 *
 * Portal bağlantısı (öğrenci kodla giriş yaptıysa etkinlik portalın içinde açılır):
 *   - Her madde: {type:'4d:item-result'} mesajı (madde bazlı kazanım/yanılgı verisi)
 *   - Oyun sonu: {type:'4d:activity-finished'} mesajı, oyun başına BİR kez (mevcut sonuç kaydı)
 *   Sayfa portal dışında (kodsuz) açıldıysa mesajlar gitmez; karne yine gösterilir.
 *   Mesajı yalnızca portal kayıt listesinde (portal/etkinlik-kayitlari.json) olan etkinlikler için
 *   sunucu kaydeder; oyunId bu listedeki "id" ile aynı olmalı.
 *
 * Seviye eşikleri öğretmen panelindekiyle AYNI olmalı (ESIK, seviye).
 */
const RaporMotoru = (() => {
  const SURUM = 3;
  const ESIK = { ustalik: 0.85, gelisiyor: 0.6, ipucuUst: 0.25, minMadde: 3 };
  let meta = null, kayit = [], t0 = Date.now(), denemeKimligi = '', bitisGonderildi = false;

  function yeniKimlik() {
    let r = '';
    try { const a = new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b => { r += b.toString(16).padStart(2, '0'); }); }
    catch (e) { r = Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    return 'rm_' + r;
  }
  function portalaGonder(mesaj) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(mesaj, '*'); } catch (e) { /* portal yok */ }
  }


  /* --- Cevap defteri (v3, öğretmenin kararı 2026-11-27) ---
   * Her ilk kez çözülen madde portala tek tek gider (4d:answer); portal Google tablosuna yazar, İLK kayıt kilitlidir.
   * Etkinlik açılınca (init) portal kayıtlı cevapları geri verir (4d:saved-answers) → RaporMotoru.kayitli(id).
   * Etkinlik isterse RaporMotoru.onKayitli(fn) ile kayıtlı maddeleri atlar/kilitler. Onay (4d:answer-ack) gelene
   * kadar cevap 5 saniyede bir yeniden gönderilir; portal yoksa hiçbir şey gitmez. */
  let kayitliCevaplar = {}, kayitliDinleyiciler = [], bekleyenCevaplar = {}, cevapZamanlayici = null;
  function hazirGonder() { if (meta) portalaGonder({ type: '4d:ready', schemaVersion: 1, activityId: meta.oyunId }); }
  function bekleyenleriGonder() {
    const k = Object.keys(bekleyenCevaplar);
    k.forEach(q => portalaGonder(bekleyenCevaplar[q]));
    if (!k.length && cevapZamanlayici) { clearInterval(cevapZamanlayici); cevapZamanlayici = null; }
  }
  function cevapGonder(x) {
    if (!meta || x.r || !x.m || kayitliCevaplar[x.m] || bekleyenCevaplar[x.m]) return;
    bekleyenCevaplar[x.m] = { type: '4d:answer', schemaVersion: 1, activityId: meta.oyunId, questionId: x.m,
      correct: !x.c, firstTry: !!x.i && !x.c };
    portalaGonder(bekleyenCevaplar[x.m]);
    if (!cevapZamanlayici && window.parent !== window) cevapZamanlayici = setInterval(bekleyenleriGonder, 5000);
  }
  try {
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (ev.source !== window.parent || !d || typeof d !== 'object' || !meta || d.activityId !== meta.oyunId) return;
      if (d.type === '4d:saved-answers' && Array.isArray(d.answers)) {
        d.answers.forEach(a => { if (a && typeof a.questionId === 'string') kayitliCevaplar[a.questionId] = { correct: !!a.correct, firstTry: !!a.firstTry, answer: String(a.answer || '') }; });
        Object.keys(kayitliCevaplar).forEach(q => { delete bekleyenCevaplar[q]; });
        kayitliDinleyiciler.forEach(fn => { try { fn(Object.assign({}, kayitliCevaplar)); } catch (e) { /* etkinlik hatası */ } });
      } else if (d.type === '4d:answer-ack' && typeof d.questionId === 'string') {
        delete bekleyenCevaplar[d.questionId];
        if (d.saved && typeof d.saved === 'object') kayitliCevaplar[d.questionId] = { correct: !!d.saved.correct, firstTry: !!d.saved.firstTry, answer: String(d.saved.answer || '') };
      }
    });
  } catch (e) { /* tarayıcı mesaj dinleyemiyor */ }
  /** Daha önce kaydedilmiş madde: {correct, firstTry, answer} ya da null. */
  function kayitli(madde) { return kayitliCevaplar[String(madde)] || null; }
  /** Portal kayıtlı cevapları verdiğinde çağrılır: fn({maddeId: {correct, firstTry, answer}}). */
  function onKayitli(fn) { if (typeof fn === 'function') kayitliDinleyiciler.push(fn); }

  /** m = {oyunId, oyunAdi, kazanimlar:[{kod, ad}]}  (kod = MEB kazanım kodu, ör. "M.4.1.2.3") */
  function init(m) {
    meta = { oyunId: String(m.oyunId), oyunAdi: String(m.oyunAdi), kazanimlar: m.kazanimlar.map(k => ({ kod: String(k.kod), ad: String(k.ad) })) };
    kayit = []; t0 = Date.now(); denemeKimligi = yeniKimlik(); bitisGonderildi = false;
    bekleyenCevaplar = {}; hazirGonder();
  }

  /** r = {kazanim:kod, madde:id, yanilgi:'etiket'|'', ilkDenemeDogru:bool, deneme:n, ipucu:0-3,
   *       cozumGoruldu:bool, sureMs:n, tekrar:bool}   tekrar=true → seviye hesabına katılmaz */
  function kaydet(r) {
    const i = meta ? meta.kazanimlar.findIndex(k => k.kod === r.kazanim) : -1;
    if (i < 0) { console.warn('RaporMotoru: bilinmeyen kazanım', r.kazanim); return false; }
    const x = {
      k: i, m: String(r.madde || '').slice(0, 40), y: String(r.yanilgi || '').slice(0, 40),
      i: r.ilkDenemeDogru ? 1 : 0, d: Math.max(1, r.deneme | 0), h: Math.max(0, Math.min(3, r.ipucu | 0)),
      c: r.cozumGoruldu ? 1 : 0, s: Math.max(0, Math.round((r.sureMs || 0) / 1000)), r: r.tekrar ? 1 : 0
    };
    kayit.push(x);
    portalaGonder({ type: '4d:item-result', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      kazanim: meta.kazanimlar[i].kod, madde: x.m, yanilgi: x.y, ilkDogru: x.i, deneme: x.d, ipucu: x.h,
      cozum: x.c, sureSn: x.s, tekrar: x.r });
    cevapGonder(x);
    return true;
  }

  function seviye(a) {            // a: ilk kez sorulan madde kayıtları
    const n = a.length;
    if (n < ESIK.minMadde) return 'veri-az';
    const p = a.filter(x => x.i).length / n, h = a.filter(x => x.h > 0).length / n;
    if (p >= ESIK.ustalik && h <= ESIK.ipucuUst) return 'ustalasti';
    if (p >= ESIK.gelisiyor) return 'gelisiyor';
    return 'destek';
  }

  function ozet() {
    return meta.kazanimlar.map((k, idx) => {
      const hepsi = kayit.filter(x => x.k === idx), a = hepsi.filter(x => !x.r);
      const yan = {};
      hepsi.forEach(x => { if (x.y) yan[x.y] = (yan[x.y] || 0) + 1; });
      return {
        kod: k.kod, ad: k.ad, n: a.length, dogru: a.filter(x => x.i).length,
        p: a.length ? a.filter(x => x.i).length / a.length : null,
        ipucuOran: a.length ? a.filter(x => x.h > 0).length / a.length : 0,
        seviye: seviye(a), yanilgilar: yan
      };
    });
  }

  /** Oyun sonu: portaldaki mevcut sonuç kaydı için tek mesaj (çift gönderim yok). */
  function bitir() {
    if (!meta || bitisGonderildi) return;

function cal(tur) {

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();

    const N = (f, s, d, tip) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = tip || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + s); g.gain.exponentialRampToValueAtTime(0.16, t + s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
      o.connect(g); g.connect(actx.destination); o.start(t + s); o.stop(t + s + d + 0.05); };
    if (tur === 'dogru') { N(660, 0, 0.14); N(990, 0.11, 0.25); }
    else if (tur === 'yanlis') { N(260, 0, 0.18, 'triangle'); N(200, 0.14, 0.22, 'triangle'); }

/* --- Konfeti (en fazla 60 parça, ~1 sn) --- */
const cv = document.getElementById('konfeti'), cx = cv.getContext('2d');
let parca = [], kosuyor = false;
function konfeti(n, x, y) {
  if (azHareket()) return;
  const dpr = window.devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  x = x ?? innerWidth / 2; y = y ?? innerHeight / 3;
  const renk = [T.renkAna, T.renkIkinci, '#ffd166', '#ef476f', '#06d6a0', '#7b5cff'];
  for (let i = 0; i < n && parca.length < 60; i++) { const a = Math.random() * Math.PI * 2, h = 3 + Math.random() * 7;
    parca.push({ x, y, vx: Math.cos(a) * h, vy: Math.sin(a) * h - 5, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.4, w: 7 + Math.random() * 6, c: renk[i % renk.length], t: 0 }); }
  if (!kosuyor) { kosuyor = true; requestAnimationFrame(adimKonfeti); }
}
function adimKonfeti() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parca.forEach(p => { p.t++; p.vy += 0.35; p.vx *= 0.98; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(0, 1 - p.t / 60); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); cx.restore(); });
  parca = parca.filter(p => p.t < 60);
  if (parca.length) requestAnimationFrame(adimKonfeti); else { kosuyor = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}

function ruh(mod, hareket, metin) {

function puanEkle(n) {

  const kos = t => { const p = Math.min(1, (t - t0) / 450); el.textContent = Math.round(bas + (puan - bas) * p); if (p < 1) requestAnimationFrame(kos); };

}

  app.querySelectorAll('.skart').forEach(b => { b.onclick = () => kartSec(+b.dataset.i); });
  document.getElementById('geri').onclick = geriAl;
  document.getElementById('kontrol').onclick = siraKontrol;
  document.getElementById('ip').onclick = ipucuVer;
}
function yuvaCiz(cozum) {
  const y = document.getElementById('yuvalar'); if (!y) return;
  const liste = cozum ? [1, 2, 3].map(n => durum.kartlar.findIndex(k => k[1] === n)) : durum.secilen;
  y.innerHTML = [0, 1, 2].map(i => { const k = liste[i];
    return '<div class="yuva ' + (k === undefined ? '' : cozum ? 'dogru' : 'dolu') + '"><b>' + (i + 1) + '</b>' + (k === undefined ? '<span style="color:#8a94a6">' + (i + 1) + '. adım için bir karta dokun</span>' : esc(durum.kartlar[k][0])) + '</div>'; }).join('');
  app.querySelectorAll('.skart').forEach((b, i) => { b.disabled = durum.kilit || durum.secilen.includes(i) || durum.secilen.length >= 3; });
}
function kartSec(i) {
  if (!durum || durum.kilit || durum.m.tur !== 'sirala' || durum.secilen.includes(i) || durum.secilen.length >= 3) return;
  durum.secilen.push(i); cal('tik'); yuvaCiz();
}
function geriAl() { if (!durum || durum.kilit || durum.m.tur !== 'sirala') return; durum.secilen.pop(); yuvaCiz(); }
function siraKontrol() {
  defterYanit();
  if (!durum || durum.kilit || durum.m.tur !== 'sirala') return;
  if (durum.secilen.length < 3) { ruh('dusun', null, 'Önce üç adımı da seç.'); return; }
  durum.deneme++;
  const secK = durum.secilen.map(i => durum.kartlar[i]);
  if (secK.every((k, i) => k[1] === i + 1)) {
    yuvaCiz(true); const r = document.getElementById('yuvalar').getBoundingClientRect();
    dogruBitir(r.left + r.width / 2, r.top + r.height / 2); return;
  }
  const tuzak = secK.find(k => k[1] === 0);
  if (!durum.ilkYanilgi) durum.ilkYanilgi = tuzak ? tuzak[2] : 'adim-sirasi';
  if (durum.deneme >= 2) { yuvaCiz(true); cozumBitir(); return; }
  cal('yanlis');
  const y = document.getElementById('yuvalar'); if (!azHareket()) { y.classList.remove('salla'); void y.offsetWidth; y.classList.add('salla'); }
  durum.secilen = []; yuvaCiz();
  ruh('uzgun', 'salla', '🤔 Henüz değil. ' + (tuzak ? 'Seçtiğin kartlardan biri tuzaktı! ' : 'Kartlar doğru ama sıra karışık. ') + 'Yeniden dene; istersen 💡 ipucu al.');
}

/* --- Bitiş --- */
function yildizYol(cx0, cy0, R, r) { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, u = i % 2 ? r : R;
  d += (i ? 'L' : 'M') + (cx0 + Math.cos(a) * u).toFixed(1) + ' ' + (cy0 + Math.sin(a) * u).toFixed(1); } return d + 'Z'; }
function bitisEkrani() {
  durum = null;
  const puanli = sira.filter(x => !x.tekrar && x.m.tur !== 'duygu');
  const yildiz = puanli.filter(x => x.sonuc === 'yildiz').length, oran = yildiz / puanli.length;
  const [rozetAd, rozetRenk] = oran >= 0.85 ? ['Altın Hak Savunucusu', '#f4b400'] : oran >= 0.6 ? ['Gümüş Hak Savunucusu', '#9aa5b1'] : ['Cesur Hak Savunucusu', '#cd7f32'];
  const duyguYazi = secilenDuygular.length ? secilenDuygular.map(d => d[0] + ' ' + d[1]).join(' · ') : '';
  app.innerHTML = ustCiz() + '<div class="kart gir bitis"><h1>🎉 ' + esc(T.bitisBaslik) + '</h1>' +
    '<svg viewBox="0 0 120 150" class="rozet" role="img" aria-label="' + rozetAd + ' rozeti">' +
    '<path d="M40 92 L26 146 L45 137 L56 150 L60 98Z" fill="#ef476f"/><path d="M80 92 L94 146 L75 137 L64 150 L60 98Z" fill="#118ab2"/>' +
    '<circle cx="60" cy="60" r="46" fill="' + rozetRenk + '"/><circle cx="60" cy="60" r="36" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4"/>' +
    '<path d="' + yildizYol(60, 60, 24, 10) + '" fill="#fff"/></svg><div class="rozet-ad">' + rozetAd + '</div>' +
    '<div class="yildizlar" aria-label="' + yildiz + ' yıldız">' + puanli.map(x => x.sonuc === 'yildiz' ? '⭐' : x.sonuc === 'yarim' ? '✨' : '📘').join('') + '</div>' +
    '<div class="karakter-satir"><div id="krk" class="krk kucuk">' + karakterSVG() + '</div><div id="balon" class="balon mutlu">Tebrikler! ' + yildiz + ' adımı ilk denemede doğru yaptın ve ' + puan + ' ' + esc(T.odulAd) +
    ' topladın. Unutma: Hakkın kısıtlanınca susma; Ben diliyle anlat ve çözüm için sorumluluk al!</div></div>' +
    (duyguYazi ? '<div class="duygu-ozet"><b>💜 Yolculukta seçtiğin duygular:</b><br>' + esc(duyguYazi) + '<br><span class="not" style="text-align:left;display:block">Bu duygular yalnızca senin ekranında görünür, kaydedilmez.</span></div>' : '') +
    '<div id="karne"></div>' +
    '<div class="kart" style="text-align:left;background:#fffdf6"><h2>📌 Sınıf panosu fikri: Haklarım ve Sorumluluklarım</h2>' +
    '<p style="margin:4px 0 8px">Sınıfça büyük bir kartona iki sütun çizin. Her öğrenci bir hak ve ona uygun bir sorumluluk yazıp yapıştırsın. Örnekler:</p>' +
    '<table class="pano"><thead><tr><th scope="col">Haklarım</th><th scope="col">Sorumluluklarım</th></tr></thead><tbody>' +
    OYUN.pano.map(p => '<tr><td>' + esc(p[0]) + '</td><td>' + esc(p[1]) + '</td></tr>').join('') + '</tbody></table></div>' +
    '<button class="buyuk" id="yeniden">↻ Yeniden oyna</button></div>';
  sesBagla();
  RaporMotoru.ekranCiz(document.getElementById('karne'));            // karne + sonucu portala gönderir (oyun başına bir kez)
  const eski = parseInt(depo.oku(DEPO_REKOR), 10) || 0;
  if (yildiz > eski) depo.yaz(DEPO_REKOR, String(yildiz));
  document.getElementById('yeniden').onclick = baslangic;
  cal('kutlama'); ruh('mutlu', 'zipla', document.getElementById('balon').textContent);
  konfeti(60); setTimeout(() => konfeti(40, innerWidth * 0.25, innerHeight * 0.3), 350);
}

document.addEventListener('keydown', e => {                       // klavye: 1-4 seçenek, İ/i ipucu, Enter devam
  if (e.key === 'Enter') { const d = document.getElementById('dev'); if (d && document.activeElement !== d) { e.preventDefault(); d.click(); } return; }
  if (!durum || durum.kilit) return;
  const n = +e.key;
  if (n >= 1 && n <= 8) {
    if (durum.sec && n <= 4) secimYap(n - 1);
    else if (durum.m.tur === 'duygu') duyguSec(n - 1);
    else if (durum.m.tur === 'sirala' && n <= 4) kartSec(n - 1);
  } else if ((e.key === 'i' || e.key === 'İ' || e.key === 'ı') && document.getElementById('ip')) ipucuVer();
});

/* Cevap defteri: etkinlik katmanı. Gömülü RaporMotoru değiştirilmez. */
const defterPortal = window.parent !== window;
const defterMaddeler = OYUN.maddeler || OYUN.vakalar.flatMap(v => v.adimlar).filter(m => m.tur !== 'duygu');
const defterIlk = new Map(), defterBekleyen = new Map();
let defterBasladi = false, defterBitti = false;
function defterKayit(id) { return RaporMotoru.kayitli(id) || defterIlk.get(id) || null; }
function defterGonder(m) { if (defterPortal) window.parent.postMessage(m, '*'); }
function defterMetin(v) { return typeof v === 'object' && v ? (v.ad || v.t || JSON.stringify(v)) : String(v ?? ''); }
// Kontrolden önce alınır: çözüm gösteren kod öğrencinin yerleşimini değiştirebilir.
function defterYanit(i) {
  if (!durum || durum.kilit) return;
  const d = durum, m = d.m;
  let a = '';
  if (m.tur === 'secim' || d.sec && m.tur !== 'coklu') a = defterMetin(d.sec?.[i]?.[0]);
  else if (m.tur === 'harita') a = yapiAdi(i);
  else if (m.tur === 'dokun') a = String(i);
  else if (m.tur === 'coklu') a = [...d.secili].map(j => defterMetin(d.sec[j][0])).join(' | ');
  else if (m.tur === 'sirala') a = d.secilen.map(j => d.kartlar[j][0]).join(' → ');
  else if (m.tur === 'siralama') a = d.yuva.map(j => j === null ? 'boş' : m.dogruSira[j].t).join(' → ');
  else if (m.tur === 'siniflama') a = d.yer.map((v,j) => defterMetin(m.kartlar[j].t || m.kartlar[j].ad || j+1) + ':' + (v || 'boş')).join(';');
  else if (m.tur === 'kur') a = d.yer.map((v,j) => v ? (j+1) + ':' + v : '').filter(Boolean).join(';');
  d.defterYanit = a.slice(0, 80);
}
function defterKaydet(r) {
  if (defterPortal) {
    if (defterKayit(r.madde) || r.tekrar) return false;
    const a = { correct: !r.cozumGoruldu, firstTry: !!r.ilkDenemeDogru && !r.cozumGoruldu, answer: durum.defterYanit || '' };
    defterIlk.set(r.madde, a);
    // Motorun answer alanı yoktur. Aynı sabit kimlik için zengin cevap önce gider;
    // motorun mesajı ve tekrarları portalın ilk-kayıt kuralıyla aynı kayda aittir.
    const mesaj = { type:'4d:answer', schemaVersion:1, activityId:OYUN.id, questionId:r.madde, ...a };
    defterBekleyen.set(r.madde, { mesaj, deneme:1 });
    defterGonder(mesaj);
  }
  const sonuc = RaporMotoru.kaydet(r);
  defterCiz();
  return sonuc;
}
function defterCiz() {
  let el = document.getElementById('cevapDefteri');
  if (!el) {
    el = document.createElement('section'); el.id = 'cevapDefteri'; el.className = 'kart';
    el.setAttribute('aria-label', 'Cevap defterim'); app.insertAdjacentElement('afterend', el);
  }
  const kayitlar = defterMaddeler.filter(m => defterKayit(m.id));
  el.hidden = !kayitlar.length && (!defterBasladi || defterBitti);
  el.innerHTML = (kayitlar.length ? '<h2>🔒 Cevap defterim · ' + kayitlar.length + ' / ' + defterMaddeler.length + ' tamamlandı</h2><ul>' + kayitlar.map(m => {
    const a = defterKayit(m.id);
    return '<li data-kilitli="true" data-question-id="' + m.id + '"><b>' + esc(m.soru) + '</b><br>' + (a.correct ? '✅ Doğru' : '❌ Yanlış') + ' · Cevabın: ' + esc(a.answer || 'Cevap metni önceki kayıtta bulunmuyor') + ' · 🔒 Tamamlandı</li>';
  }).join('') + '</ul>' : '') + (defterBasladi && !defterBitti ? '<button id="defterBitir" class="buyuk dolu">Bitir / karnemi gör</button>' : '');
  const b = document.getElementById('defterBitir'); if (b) b.onclick = () => { durum = null; bitisEkrani(); };
}
const defterAsilSoru = soru;
soru = function() {
  // Kayıtlı sorular tekrar listelerine de giremez; soru sayısı ve sıra kimliği değişmez.
  while (defterPortal && idx < sira.length && defterKayit(sira[idx].m.id)) {
    const x = sira[idx], a = defterKayit(x.m.id);
    x.bitti = true; x.ilkDogru = a.firstTry; x.sonuc = a.firstTry ? 'yildiz' : a.correct ? 'yarim' : 'ogrendi';
    idx++;
  }
  defterAsilSoru(); defterCiz();
};
const defterAsilBaslangic = baslangic;
baslangic = function() {
  defterBasladi = false; defterBitti = false; durum = null;
  defterAsilBaslangic();
  const b = document.getElementById('basla'), basla = b.onclick;
  b.onclick = () => { defterBasladi = true; defterBitti = false; basla(); defterCiz(); };
  defterCiz();
};
const defterAsilBitis = bitisEkrani;
bitisEkrani = function() { defterBitti = true; defterAsilBitis(); defterCiz(); };
RaporMotoru.onKayitli(() => {
  if (!defterPortal) return;
  if (defterBasladi && !defterBitti && idx < sira.length && RaporMotoru.kayitli(sira[idx].m.id)) {
    if (durum) durum.kilit = true;
    durum = null; soru();
  }
  defterCiz();
});
window.addEventListener('message', ev => {
  const d = ev.data;
  if (!defterPortal || ev.source !== window.parent || !d || d.activityId !== OYUN.id) return;
  if (d.type === '4d:answer-ack') {
    defterBekleyen.delete(d.questionId);
    if (d.saved && defterMaddeler.some(m => m.id === d.questionId)) {
      defterIlk.set(d.questionId, { correct:!!d.saved.correct, firstTry:!!d.saved.firstTry, answer:String(d.saved.answer || '') });
    }
    defterCiz();
  } else if (d.type === '4d:saved-answers' && Array.isArray(d.answers)) {
    d.answers.forEach(a => defterBekleyen.delete(a.questionId));
  }
});
if (defterPortal) setInterval(() => {
  defterBekleyen.forEach((x,id) => { if (x.deneme >= 10) defterBekleyen.delete(id); else { x.deneme++; defterGonder(x.mesaj); } });
}, 5000);
// Açılışta hazır: portalın cevabı Başla düğmesinden önce de gelebilir.
RaporMotoru.init({ oyunId: OYUN.id, oyunAdi: OYUN.ad, kazanimlar: OYUN.kazanimlar });

baslangic();
</script>
