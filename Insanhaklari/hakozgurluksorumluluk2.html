<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilinçli Vatandaş Kasabası</title>
    <style>
        :root {
            --primary: #2980b9;
            --secondary: #8e44ad;
            --success: #27ae60;
            --danger: #c0392b;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --warning: #f39c12;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #d1d8e0;
            color: var(--dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            min-height: 650px;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #1f6391;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #stats {
            display: flex;
            gap: 20px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* Scene Map */
        #scene-map {
            display: flex;
            justify-content: center;
            padding: 15px;
            background: var(--light);
            border-bottom: 2px solid #bdc3c7;
        }

        .map-node {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #95a5a6;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 8px;
            font-weight: bold;
            color: white;
            transition: all 0.3s;
            font-size: 0.9rem;
            border: 2px solid transparent;
        }

        .map-node.active {
            background: var(--warning);
            transform: scale(1.2);
            border-color: #fff;
            box-shadow: 0 0 10px var(--warning);
        }

        .map-node.completed {
            background: var(--success);
        }

        .map-node.skipped {
            background: #e74c3c;
        }

        /* Game Area */
        #game-area {
            flex-grow: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #f8f9fa;
        }

        /* Question Container */
        #question-container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #question-text {
            width: 100%;
            text-align: center;
        }

        #question-text h3 {
            color: var(--secondary);
            margin-top: 0;
            font-size: 1.5rem;
        }

        #question-text p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Visual Element */
        #visual-element {
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .svg-icon {
            width: 90px;
            height: 90px;
        }

        #interactive-area {
            width: 100%;
            max-width: 700px;
        }

        /* Options (MC & TF) */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px;
            font-size: 1.05rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Free Text */
        .free-text-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid var(--primary);
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        .free-text-input:focus {
            box-shadow: 0 0 8px rgba(41, 128, 185, 0.5);
        }

        /* Touch Friendly Drag & Drop Alternative (Tap to match/classify) */
        .dnd-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
        }

        .dnd-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tap-item {
            background: white;
            border: 2px solid var(--secondary);
            color: var(--secondary);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            user-select: none;
            transition: all 0.2s;
        }
        .tap-item.selected {
            background: var(--secondary);
            color: white;
            transform: scale(1.05);
        }
        .tap-item.matched {
            background: var(--success);
            border-color: var(--success);
            color: white;
            cursor: default;
        }

        .drop-zone {
            border: 2px dashed var(--secondary);
            padding: 15px;
            border-radius: 8px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fdfbfd;
            cursor: pointer;
            gap: 5px;
        }
        .drop-zone.hover-target {
            background: #f3e5f5;
            border-style: solid;
        }
        .drop-zone-title {
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 5px;
            font-size: 1.1rem;
        }
        .placed-item {
            background: var(--success);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            width: 100%;
            text-align: center;
        }

        /* Sorting */
        .sort-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sort-item {
            background: white;
            border: 2px solid var(--primary);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }
        .sort-item.selected {
            background: #d6eaf8;
        }
        .sort-item::before {
            content: "↕";
            margin-right: 15px;
            font-size: 1.2rem;
            color: var(--primary);
        }

        /* Navigation */
        #navigation {
            display: flex;
            justify-content: space-between;
            padding: 20px 25px;
            background: #fff;
            border-top: 2px solid var(--light);
        }

        .nav-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .nav-btn:active { transform: scale(0.95); }

        #btn-prev { background: #95a5a6; color: white; }
        #btn-prev:hover:not(:disabled) { background: #7f8c8d; }
        
        #btn-skip { background: #e67e22; color: white; }
        #btn-skip:hover:not(:disabled) { background: #d35400; }
        
        #btn-next-task { background: var(--primary); color: white; }
        #btn-next-task:hover:not(:disabled) { background: #1f6391; }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Feedback Modal */
        #feedback-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(44, 62, 80, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #feedback-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .fb-icon { font-size: 4rem; margin-bottom: 15px; }
        .fb-title { font-size: 1.8rem; margin-bottom: 10px; font-weight: bold; }
        .fb-desc { font-size: 1.1rem; line-height: 1.5; margin-bottom: 25px; color: #34495e;}

        .action-btn {
            padding: 12px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.95); }
        .btn-continue { background: var(--success); }
        .btn-retry { background: var(--warning); }

        /* Final Report */
        #final-report {
            display: none;
            width: 100%;
        }

        .report-header {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .report-stat {
            background: var(--light);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-bottom: 3px solid var(--primary);
        }
        .report-stat span { display: block; font-size: 1.5rem; font-weight: bold; color: var(--dark); margin-top: 5px;}

        .review-section {
            background: white;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
        }

        .review-item {
            background: #fff9c4;
            border-left: 4px solid #f39c12;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .review-item h4 { margin: 0 0 5px 0; color: #d35400; }
        .review-item p { margin: 0 0 10px 0; font-size: 0.95rem; }
        .review-btn {
            background: #d35400; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
        }

        .btn-center { display: flex; justify-content: center; margin-top: 20px; }

        @media (max-width: 650px) {
            .options-grid { grid-template-columns: 1fr; }
            .dnd-container { flex-direction: column; }
            .report-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1>🏛️ Bilinçli Vatandaş Kasabası</h1>
        <div id="stats">
            <span id="score-display">Puan: 0</span>
            <span id="progress-display">1/16</span>
        </div>
    </header>

    <div id="scene-map">
        <!-- Nodes generated dynamically -->
    </div>

    <div id="game-area">
        <div id="question-container">
            <div id="visual-element"></div>
            <div id="question-text"></div>
            <div id="interactive-area"></div>
        </div>
        
        <div id="final-report">
            <div class="report-header">
                <h2>🎉 Tebrikler! Kasaba Turunu Tamamladın!</h2>
                <p>İşte senin Vatandaşlık Raporun:</p>
            </div>
            <div class="report-grid">
                <div class="report-stat">Toplam Görev<span id="r-total">0</span></div>
                <div class="report-stat">Doğru (İlk)<span id="r-first">0</span></div>
                <div class="report-stat">Yanlış Deneme<span id="r-wrong">0</span></div>
                <div class="report-stat">Geçilen<span id="r-skipped">0</span></div>
                <div class="report-stat">İpuçları<span id="r-hints">0</span></div>
                <div class="report-stat">Toplam Puan<span id="r-score">0</span></div>
            </div>
            <h3>İnceleme Alanı (Hatalı veya Geçilen Görevler)</h3>
            <div class="review-section" id="review-list"></div>
            <div class="btn-center">
                <button class="action-btn btn-continue" onclick="resetGame()">Yeniden Başla</button>
            </div>
        </div>
    </div>

    <div id="navigation">
        <button id="btn-prev" class="nav-btn" onclick="navPrev()">Önceki</button>
        <button id="btn-skip" class="nav-btn" onclick="skipTask()">Geç</button>
        <button id="btn-next-task" class="nav-btn" onclick="navNext()">Sonraki</button>
    </div>

    <div id="feedback-overlay">
        <div id="feedback-box">
            <div id="fb-icon" class="fb-icon"></div>
            <div id="fb-title" class="fb-title"></div>
            <div id="fb-desc" class="fb-desc"></div>
            <button id="fb-action-btn" class="action-btn"></button>
        </div>
    </div>
</div>

    let tasks = [];

    // --- Core Logic ---
    function initGame() {
        // Shuffle multiple choice options specifically to satisfy rules
        tasks = JSON.parse(JSON.stringify(baseTasks)).map(task => {
            if (task.type === "mc") {
                task.options = task.options.sort(() => Math.random() - 0.5);
            }
            if (task.type === "sorting") {
                task.currentOrder = [...task.items].sort(() => Math.random() - 0.5);
            }
            if (task.type === "matching" || task.type === "classify") {
                task.userAnswer = {}; 
            }
            return task;
        });

        state.currentIndex = 0;
        state.score = 0;
        state.wrongCount = 0;
        state.skippedCount = 0;
        state.hintCount = 0;
        state.results = {};
        
        tasks.forEach(t => {
            state.results[t.id] = { status: 'pending', firstTry: true, attempts: 0 };
        });

        document.getElementById('final-report').style.display = 'none';
        document.getElementById('question-container').style.display = 'flex';
        renderMap();
        loadTask(state.currentIndex);
    }

    function renderMap() {
        const map = document.getElementById('scene-map');
        map.innerHTML = '';
        
        let start = Math.max(0, state.currentIndex - 3);
        let end = Math.min(tasks.length - 1, start + 6);
        if (end - start < 6) start = Math.max(0, end - 6);

        for (let i = start; i <= end; i++) {
            const node = document.createElement('div');
            let statusClass = '';
            if (state.results[tasks[i].id].status === 'completed') statusClass = 'completed';
            else if (state.results[tasks[i].id].status === 'skipped') statusClass = 'skipped';
            else if (i === state.currentIndex) statusClass = 'active';

            node.className = `map-node ${statusClass}`;
            node.textContent = i + 1;
            map.appendChild(node);
        }
    }

    function updateStats() {
        document.getElementById('score-display').textContent = `Puan: ${state.score}`;
        document.getElementById('progress-display').textContent = `${state.currentIndex + 1}/${tasks.length}`;
        
        document.getElementById('btn-prev').disabled = state.currentIndex === 0;
        
        const isDone = state.results[tasks[state.currentIndex].id].status !== 'pending';
        document.getElementById('btn-next-task').disabled = !isDone;
    }

    function loadTask(index) {
        state.currentIndex = index;
        const task = tasks[index];
        const res = state.results[task.id];
        
        document.getElementById('question-text').innerHTML = `<h3>${task.title}</h3><p>${task.text}</p>`;
        document.getElementById('visual-element').innerHTML = task.visual;
        
        const ia = document.getElementById('interactive-area');
        ia.innerHTML = '';

        if (task.type === 'mc') renderMC(task, ia, res);
        else if (task.type === 'tf') renderTF(task, ia, res);
        else if (task.type === 'free_text') renderFreeText(task, ia, res);
        else if (task.type === 'matching') renderMatching(task, ia, res);
        else if (task.type === 'classify') renderClassify(task, ia, res);
        else if (task.type === 'sorting') renderSorting(task, ia, res);

        renderMap();
        updateStats();
    }

    // --- Renderers ---
    function renderMC(task, container, res) {
        const grid = document.createElement('div');
        grid.className = 'options-grid';
        
        task.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.text;
            
            if (res.status === 'completed') {
                btn.disabled = true;
                if (opt.isCorrect) btn.style.backgroundColor = 'var(--success)';
                else if (res.lastSelection === opt.id) btn.style.backgroundColor = 'var(--danger)';
            } else {
                btn.onclick = () => {
                    res.lastSelection = opt.id;
                    if (opt.isCorrect) handleCorrect(task);
                    else handleWrong(task);
                };
            }
            grid.appendChild(btn);
        });
        container.appendChild(grid);
    }

    function renderTF(task, container, res) {
        const grid = document.createElement('div');
        grid.className = 'options-grid';
        
        const trueBtn = document.createElement('button');
        trueBtn.className = 'option-btn';
        trueBtn.textContent = "Doğru";
        
        const falseBtn = document.createElement('button');
        falseBtn.className = 'option-btn';
        falseBtn.textContent = "Yanlış";

        if (res.status === 'completed') {
            trueBtn.disabled = true;
            falseBtn.disabled = true;
            if (task.isTrue) trueBtn.style.backgroundColor = 'var(--success)';
            else falseBtn.style.backgroundColor = 'var(--success)';
        } else {
            trueBtn.onclick = () => {
                if (task.isTrue === true) handleCorrect(task);
                else handleWrong(task);
            };
            falseBtn.onclick = () => {
                if (task.isTrue === false) handleCorrect(task);
                else handleWrong(task);
            };
        }

        grid.appendChild(trueBtn);
        grid.appendChild(falseBtn);
        container.appendChild(grid);
    }

    function renderFreeText(task, container, res) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'free-text-input';
        input.placeholder = "Cevabını buraya yaz...";
        
        const btn = document.createElement('button');
        btn.className = 'action-btn btn-continue';
        btn.textContent = "Kontrol Et";
        btn.style.width = "100%";

        if (res.status === 'completed') {
            input.value = res.lastSelection || task.expected[0];
            input.disabled = true;
            btn.style.display = 'none';
        } else {
            btn.onclick = () => {
                res.lastSelection = input.value;
                const normVal = input.value.toLocaleLowerCase('tr').trim();
                const isCorrect = task.expected.some(exp => exp.toLocaleLowerCase('tr') === normVal);
                if (isCorrect) handleCorrect(task);
                else handleWrong(task);
            };
        }

        container.appendChild(input);
        container.appendChild(btn);
    }

    // Touch-friendly Matching
    function renderMatching(task, container, res) {
        const dnd = document.createElement('div');
        dnd.className = 'dnd-container';
        
        const leftCol = document.createElement('div');
        leftCol.className = 'dnd-col';
        const rightCol = document.createElement('div');
        rightCol.className = 'dnd-col';

        let selectedLeft = null;
        let matchedCount = Object.keys(task.userAnswer).length;

        // Shuffle arrays for display if not already done
        if(!task.leftDisp) task.leftDisp = [...task.pairs].sort(()=>Math.random()-0.5);
        if(!task.rightDisp) task.rightDisp = [...task.pairs].sort(()=>Math.random()-0.5);

        task.leftDisp.forEach(p => {
            const btn = document.createElement('div');
            btn.className = 'tap-item';
            btn.textContent = p.left;
            
            if (task.userAnswer[p.id]) {
                btn.classList.add('matched');
            } else if (res.status !== 'completed') {
                btn.onclick = () => {
                    Array.from(leftCol.children).forEach(c => c.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedLeft = p.id;
                };
            }
            leftCol.appendChild(btn);
        });

        task.rightDisp.forEach(p => {
            const btn = document.createElement('div');
            btn.className = 'tap-item';
            btn.textContent = p.right;
            
            if (Object.values(task.userAnswer).includes(p.id)) {
                btn.classList.add('matched');
            } else if (res.status !== 'completed') {
                btn.onclick = () => {
                    if (selectedLeft) {
                        if (selectedLeft === p.id) {
                            task.userAnswer[p.id] = p.id; // Mark as matched
                            matchedCount++;
                            if (matchedCount === task.pairs.length) handleCorrect(task);
                            else loadTask(state.currentIndex);
                        } else {
                            handleWrong(task);
                        }
                    }
                };
            }
            rightCol.appendChild(btn);
        });

        dnd.appendChild(leftCol);
        dnd.appendChild(rightCol);
        container.appendChild(dnd);
    }

    // Touch-friendly Classify
    function renderClassify(task, container, res) {
        const dnd = document.createElement('div');
        dnd.className = 'dnd-container';

        const itemsCol = document.createElement('div');
        itemsCol.className = 'dnd-col';
        const zonesCol = document.createElement('div');
        zonesCol.className = 'dnd-col';

        let selectedItem = null;
        let matchedCount = Object.keys(task.userAnswer).length;

        if(!task.dispItems) task.dispItems = [...task.items].sort(()=>Math.random()-0.5);

        task.dispItems.forEach(item => {
            if (!task.userAnswer[item.id]) {
                const btn = document.createElement('div');
                btn.className = 'tap-item';
                btn.textContent = item.text;
                if (res.status !== 'completed') {
                    btn.onclick = () => {
                        Array.from(itemsCol.children).forEach(c => c.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedItem = item;
                    };
                }
                itemsCol.appendChild(btn);
            }
        });

        task.targets.forEach(t => {
            const zone = document.createElement('div');
            zone.className = 'drop-zone';
            zone.innerHTML = `<div class="drop-zone-title">${t.label}</div>`;
            
            task.items.forEach(item => {
                if (task.userAnswer[item.id] === t.id) {
                    zone.innerHTML += `<div class="placed-item">${item.text}</div>`;
                }
            });

            if (res.status !== 'completed') {
                zone.onclick = () => {
                    if (selectedItem) {
                        if (selectedItem.cat === t.id) {
                            task.userAnswer[selectedItem.id] = t.id;
                            matchedCount++;
                            if (matchedCount === task.items.length) handleCorrect(task);
                            else loadTask(state.currentIndex);
                        } else {
                            handleWrong(task);
                        }
                    }
                };
            }
            zonesCol.appendChild(zone);
        });

        dnd.appendChild(itemsCol);
        dnd.appendChild(zonesCol);
        container.appendChild(dnd);
    }

    // Sorting
    function renderSorting(task, container, res) {
        const list = document.createElement('div');
        list.className = 'sort-list';
        
        let selectedIdx = null;

        task.currentOrder.forEach((item, idx) => {
            const row = document.createElement('div');
            row.className = 'sort-item';
            row.innerHTML = `<span>${item.text}</span>`;
            
            if (res.status !== 'completed') {
                row.onclick = () => {
                    if (selectedIdx === null) {
                        selectedIdx = idx;
                        row.classList.add('selected');
                    } else {
                        // Swap
                        let temp = task.currentOrder[selectedIdx];
                        task.currentOrder[selectedIdx] = task.currentOrder[idx];
                        task.currentOrder[idx] = temp;
                        selectedIdx = null;
                        loadTask(state.currentIndex);
                    }
                };
            }
            list.appendChild(row);
        });
        
        container.appendChild(list);

        if (res.status !== 'completed') {
            const hint = document.createElement('p');
            hint.textContent = "Sırasını değiştirmek için önce bir cümleye, sonra yer değiştirmek istediğin diğer cümleye dokun.";
            hint.style.fontSize = "0.9rem";
            hint.style.color = "#7f8c8d";
            hint.style.marginTop = "10px";
            container.appendChild(hint);
            
            const btn = document.createElement('button');
            btn.className = 'action-btn btn-continue';
            btn.textContent = "Sıralamayı Kontrol Et";
            btn.style.width = "100%";
            btn.style.marginTop = "10px";
            btn.onclick = () => {
                let isCorrect = true;
                for(let i=0; i<task.items.length; i++){
                    if(task.currentOrder[i].id !== task.items[i].id) {
                        isCorrect = false; break;
                    }
                }
                if(isCorrect) handleCorrect(task);
                else handleWrong(task);
            };
            container.appendChild(btn);
        }
    }

    // --- Logic ---
    function handleCorrect(task) {
        const res = state.results[task.id];
        if (res.status === 'completed') return;

        res.status = 'completed';
        
        if (res.firstTry) state.score += 10;
        else state.score += 5;

        showFeedback(true, `Doğru! Puan: ${res.firstTry ? 10 : 5}`, task.explanation + "<br><br><b>" + task.mechanic + "</b>", () => {
            updateStats();
            document.getElementById('btn-next-task').disabled = false;
        });
    }

    function handleWrong(task) {
        const res = state.results[task.id];
        res.attempts++;
        res.firstTry = false;
        state.wrongCount++;

        let msg = task.wrongMsg;
        if (res.attempts > 1) {
            msg += "<br><br><b>İpucu:</b> " + task.explanation;
            if(res.attempts === 2) state.hintCount++; // Count hint once per task
        }

        showFeedback(false, "Tekrar Düşün!", msg, () => {
            loadTask(state.currentIndex);
        });
    }

    function skipTask() {
        const task = tasks[state.currentIndex];
        const res = state.results[task.id];
        if (res.status === 'completed') return;

        res.status = 'skipped';
        state.skippedCount++;
        navNext();
    }

    // --- Navigation ---
    function navNext() {
        if (state.currentIndex < tasks.length - 1) {
            loadTask(state.currentIndex + 1);
        } else {
            showFinalReport();
        }
    }

    function navPrev() {
        if (state.currentIndex > 0) {
            loadTask(state.currentIndex - 1);
        }
    }

    // --- Feedback Modal ---
    function showFeedback(isSuccess, title, desc, callback) {
        const overlay = document.getElementById('feedback-overlay');
        const btn = document.getElementById('fb-action-btn');
        
        document.getElementById('fb-icon').textContent = isSuccess ? '✅' : '❌';
        document.getElementById('fb-title').textContent = title;
        document.getElementById('fb-title').style.color = isSuccess ? 'var(--success)' : 'var(--danger)';
        document.getElementById('fb-desc').innerHTML = desc;
        
        btn.textContent = isSuccess ? "Devam Et" : "Tekrar Dene";
        btn.className = `action-btn ${isSuccess ? 'btn-continue' : 'btn-retry'}`;
        
        overlay.style.display = 'flex';
        btn.onclick = () => {
            overlay.style.display = 'none';
            if (callback) callback();
        };
    }

    // --- Final Report ---
    function showFinalReport() {
        document.getElementById('question-container').style.display = 'none';
        document.getElementById('navigation').style.display = 'none';
        document.getElementById('scene-map').style.display = 'none';
        const report = document.getElementById('final-report');
        report.style.display = 'block';

        let completed = 0, firstTry = 0;
        const reviewList = document.getElementById('review-list');
        reviewList.innerHTML = '';

        tasks.forEach(t => {
            const res = state.results[t.id];
            if (res.status === 'completed') {
                completed++;
                if (res.firstTry) firstTry++;
            }

            if (!res.firstTry || res.status === 'skipped') {
                const item = document.createElement('div');
                item.className = 'review-item';
                item.innerHTML = `
                    <h4>Görev: ${t.title}</h4>
                    <p><strong>Durum:</strong> ${res.status === 'skipped' ? 'Geçildi' : 'Yanlış deneme yapıldı'}</p>
                    <p><strong>Öğretici Bilgi:</strong> ${t.explanation}</p>
                    <button class="review-btn" onclick="reviewTask('${t.id}')">Bu Görevi Tekrar Çöz</button>
                `;
                reviewList.appendChild(item);
            }
        });

        if(reviewList.innerHTML === '') {
            reviewList.innerHTML = '<p style="text-align:center; font-weight:bold; color:var(--success);">Harika! Tüm görevleri ilk denemede hatasız tamamladın!</p>';
        }

        document.getElementById('r-total').textContent = tasks.length;
        document.getElementById('r-first').textContent = firstTry;
        document.getElementById('r-wrong').textContent = state.wrongCount;
        document.getElementById('r-skipped').textContent = state.skippedCount;
        document.getElementById('r-hints').textContent = state.hintCount;
        document.getElementById('r-score').textContent = state.score;
    }

    function reviewTask(taskId) {
        const idx = tasks.findIndex(t => t.id === taskId);
        if (idx !== -1) {
            document.getElementById('final-report').style.display = 'none';
            document.getElementById('question-container').style.display = 'flex';
            document.getElementById('navigation').style.display = 'flex';
            document.getElementById('scene-map').style.display = 'flex';
            
            // Allow re-attempting if skipped
            if(state.results[taskId].status === 'skipped') {
                state.results[taskId].status = 'pending';
                state.skippedCount--;
            }
            loadTask(idx);
        }
    }

    function resetGame() {
        document.getElementById('final-report').style.display = 'none';
        document.getElementById('question-container').style.display = 'flex';
        document.getElementById('navigation').style.display = 'flex';
        document.getElementById('scene-map').style.display = 'flex';
        initGame();
    }

    // Initialize
    initGame();
</script>

</body>
