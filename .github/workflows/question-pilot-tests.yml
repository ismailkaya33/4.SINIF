name: Question pilot tests
on:
  push:
    branches: ['pilot/soru-takibi-matematik1-20261104']
  pull_request:
    paths: ['portal/**', 'Matematik/toplamacikarmaproblem1.html', '.github/scripts/test-question-pilot.mjs']
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/test-question-pilot.mjs
      - run: node .github/scripts/verify-appsscript-integration.mjs
