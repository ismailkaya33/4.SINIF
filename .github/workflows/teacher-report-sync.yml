name: 4D Teacher report - source sync
on:
  push:
    branches:
      - hazirlik/kazanim-takibi-20261101
    paths:
      - 'portal/ogretmen-rapor/**'
  workflow_dispatch:
jobs:
  teacher-source:
    runs-on: ubuntu-latest
    concurrency:
      group: 4d-teacher-source
      cancel-in-progress: false
    permissions:
      contents: read
    environment: appsscript-sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hazirlik/kazanim-takibi-20261101
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify integration and run local tests before publishing
        run: |
          set -eu
          node .github/scripts/verify-appsscript-integration.mjs
          for f in tests/*.cjs; do echo "== $f"; node "$f"; done
      - name: Prepare private teacher credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          TEACHER_SCRIPT_ID: ${{ secrets.TEACHER_SCRIPT_ID }}
        run: |
          set -eu
          test -n "$CLASPRC_JSON" || exit 1
          test -n "$TEACHER_SCRIPT_ID" || exit 1
          mkdir -p "$RUNNER_TEMP/4d-teacher"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$TEACHER_SCRIPT_ID" > "$RUNNER_TEMP/4d-teacher/.clasp.json"
      - name: Pull current private source
        working-directory: ${{ runner.temp }}/4d-teacher
        run: npx --yes @google/clasp@3.4.1 pull
      - name: Merge reviewed teacher sources
        run: node .github/scripts/prepare-appsscript-sync.mjs teacher "$RUNNER_TEMP/4d-teacher"
      - name: Update private teacher project source only
        working-directory: ${{ runner.temp }}/4d-teacher
        run: npx --yes @google/clasp@3.4.1 push --force
      - name: Update existing private teacher report deployment
        working-directory: ${{ runner.temp }}/4d-teacher
        env:
          EXISTING_DEPLOYMENT_ID: AKfycbzYet4urwswVKhlxobxrH6R0IC_a1e8hUzpj42d_XwqZkA7N0Gwl4epC1P5XvZBt3DcyQ
        run: |
          set -eu
          npx --yes @google/clasp@3.4.1 list-deployments > "$RUNNER_TEMP/4d-teacher-deployments.txt"
          grep -F -- "$EXISTING_DEPLOYMENT_ID" "$RUNNER_TEMP/4d-teacher-deployments.txt" >/dev/null || {
            echo "::error::Existing private teacher deployment not found; no new deployment was created."
            exit 1
          }
          npx --yes @google/clasp@3.4.1 create-deployment --deploymentId "$EXISTING_DEPLOYMENT_ID" --description "4D private teacher report GitHub Actions"
      - name: Delete credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
