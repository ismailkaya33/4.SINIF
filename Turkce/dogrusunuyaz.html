<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yazım Ustası – 120 Sözcük</title>
<style>
:root {
  --purple:#5b3b95; --purple2:#7b5bc0; --teal:#2ea7a7;
  --green:#2e9b57; --red:#d94b4b; --ink:#253047; --soft:#f5f1fb;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink);
  min-height:100vh; background:
  radial-gradient(circle at 15% 10%,#fff 0 2px,transparent 3px) 0 0/18px 18px,
  linear-gradient(135deg,#f9f7ff,#eefafa);
}
.wrap{max-width:1000px;margin:0 auto;padding:22px}
header{
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:white;border-radius:22px;padding:20px 24px;box-shadow:0 8px 24px #0002;
}
h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:.5px}
.sub{margin-top:7px;font-size:18px;opacity:.95}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.stat{background:white;border-radius:16px;padding:10px 16px;box-shadow:0 3px 10px #0001;font-weight:700}
.card{
  background:white;border-radius:26px;padding:28px;margin-top:18px;
  box-shadow:0 10px 30px #0002;text-align:center;
}
.kicker{font-weight:800;color:var(--teal);font-size:18px}
.question{font-size:clamp(28px,5vw,44px);font-weight:800;margin:18px 0 26px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:820px;margin:auto}
.option{
  border:4px solid #d9d2ea;background:#faf9ff;border-radius:20px;
  min-height:110px;padding:18px;font-size:clamp(26px,4vw,38px);font-weight:800;
  cursor:pointer;touch-action:manipulation;transition:.15s;
}
.option:hover{transform:translateY(-2px);border-color:#9c83d1}
.option.correct{background:#eaf8ef;border-color:var(--green);color:#176c38}
.option.wrong{background:#fff0f0;border-color:var(--red);color:#9e2929}
.option:disabled{cursor:default}
.feedback{min-height:48px;margin:20px 0 4px;font-size:24px;font-weight:800}
.good{color:var(--green)} .bad{color:var(--red)}
.next,.reset{
  border:0;border-radius:16px;padding:14px 24px;font-size:20px;font-weight:800;
  cursor:pointer;touch-action:manipulation;
}
.next{background:var(--purple);color:white}
.reset{background:#edf0f7;color:#39445a;margin-left:8px}
.next:disabled{opacity:.45;cursor:not-allowed}
.note{margin-top:18px;color:#657086;font-size:15px}
@media(max-width:650px){
 .wrap{padding:12px} .card{padding:18px} .options{grid-template-columns:1fr}
 .option{min-height:88px} .reset{margin:10px 0 0}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>YAZIM USTASI</h1>
  <div class="sub">4. Sınıf • Yazımı Karıştırılan Sözcükler</div>
</header>

<div class="stats">
  <div class="stat">📚 Kalan: <span id="remaining">120</span></div>
  <div class="stat">⭐ Puan: <span id="score">0</span></div>
  <div class="stat">🔥 Seri: <span id="streak">0</span></div>
</div>

<section class="card">
  <div class="kicker" id="number">1. SÖZCÜK</div>
  <div class="question">Aşağıdaki iki seçenekten <b>doğru yazılanı</b> seç.</div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next" id="next" disabled>SONRAKİ SÖZCÜK ➜</button>
  <button class="reset" id="reset">YENİ TUR</button>
  <div class="note">
    Her sözcük destede yalnızca bir kez gösterilir. Tüm sözcükler bitmeden aynı sözcük tekrar gelmez.
  </div>
</section>
</div>

<script>
const WORDS = [{"correct": "herkes", "wrong": "herkez"}, {"correct": "yalnız", "wrong": "yanlız"}, {"correct": "kibrit", "wrong": "kiprit"}, {"correct": "orijinal", "wrong": "orjinal"}, {"correct": "art arda", "wrong": "ard arda"}, {"correct": "güneydoğu", "wrong": "Güney Doğu"}, {"correct": "kirpik", "wrong": "kiprik"}, {"correct": "birdenbire", "wrong": "birden bire"}, {"correct": "pek çok", "wrong": "pekçok"}, {"correct": "hiçbir şey", "wrong": "hiç bir şey"}, {"correct": "emretmek", "wrong": "emir etmek"}, {"correct": "her ne kadar", "wrong": "hernekadar"}, {"correct": "terk etti", "wrong": "terketti"}, {"correct": "günaydın", "wrong": "gün aydın"}, {"correct": "dil bilimi", "wrong": "dilbilimi"}, {"correct": "yemekhane", "wrong": "yemek hane"}, {"correct": "doğumevi", "wrong": "doğum evi"}, {"correct": "çikolata", "wrong": "çukulata"}, {"correct": "entelektüel", "wrong": "entellektüel"}, {"correct": "kırmızı biber", "wrong": "kırmızıbiber"}, {"correct": "açık göz", "wrong": "açıkgöz"}, {"correct": "grup", "wrong": "gurup"}, {"correct": "vazgeçti", "wrong": "vaz geçti"}, {"correct": "unvan", "wrong": "ünvan"}, {"correct": "anaokulu", "wrong": "ana okulu"}, {"correct": "başsavcı", "wrong": "baş savcı"}, {"correct": "uluslararası", "wrong": "uluslar arası"}, {"correct": "gözyaşı", "wrong": "göz yaşı"}, {"correct": "parşömen", "wrong": "parşümen"}, {"correct": "makine", "wrong": "makina"}, {"correct": "egzoz", "wrong": "egsoz"}, {"correct": "atölye", "wrong": "atelye"}, {"correct": "hafriyat", "wrong": "harfiyat"}, {"correct": "şoför", "wrong": "şöför"}, {"correct": "ateş böceği", "wrong": "ateşböceği"}, {"correct": "yüzükoyun", "wrong": "yüzü koyun"}, {"correct": "köpek balığı", "wrong": "köpekbalığı"}, {"correct": "açık yürekli", "wrong": "açıkyürekli"}, {"correct": "cankurtaran", "wrong": "can kurtaran"}, {"correct": "hafta sonu", "wrong": "haftasonu"}, {"correct": "kuru yemiş", "wrong": "kuruyemiş"}, {"correct": "oysaki", "wrong": "oysa ki"}, {"correct": "her gün", "wrong": "hergün"}, {"correct": "dolma biber", "wrong": "dolmabiber"}, {"correct": "hâlbuki", "wrong": "hâlbu ki"}, {"correct": "peşi sıra", "wrong": "peşisira"}, {"correct": "karakter", "wrong": "karekter"}, {"correct": "konservatuvar", "wrong": "konservatuar"}, {"correct": "müteahhit", "wrong": "mütahit"}, {"correct": "ana düşünce", "wrong": "anadüşünce"}, {"correct": "ara bozucu", "wrong": "arabozucu"}, {"correct": "fark etmek", "wrong": "farketmek"}, {"correct": "iç işleri", "wrong": "içişleri"}, {"correct": "buzdolabı", "wrong": "buz dolabı"}, {"correct": "kurt köpeği", "wrong": "kurtköpeği"}, {"correct": "akşamüstü", "wrong": "akşam üstü"}, {"correct": "affedersin", "wrong": "afedersin"}, {"correct": "affedersiniz", "wrong": "afedersiniz"}, {"correct": "birçok", "wrong": "bir çok"}, {"correct": "birkaç", "wrong": "bir kaç"}, {"correct": "herhangi", "wrong": "her hangi"}, {"correct": "her şey", "wrong": "herşey"}, {"correct": "birtakım", "wrong": "bir takım"}, {"correct": "göz göze", "wrong": "gözgöze"}, {"correct": "başvurmak", "wrong": "baş vurmak"}, {"correct": "gökkuşağı", "wrong": "gök kuşağı"}, {"correct": "yeraltı", "wrong": "yer altı"}, {"correct": "yeryüzü", "wrong": "yer yüzü"}, {"correct": "karasinek", "wrong": "kara sinek"}, {"correct": "gökdelen", "wrong": "gök delen"}, {"correct": "ayaküstü", "wrong": "ayak üstü"}, {"correct": "Türkçeye", "wrong": "Türkçe'ye"}, {"correct": "KKTC'ye", "wrong": "KKTC'na"}, {"correct": "inisiyatif", "wrong": "insiyatif"}, {"correct": "ara söz", "wrong": "arasöz"}, {"correct": "gardırop", "wrong": "gardrop"}, {"correct": "pardösü", "wrong": "pardesü"}, {"correct": "perhiz", "wrong": "pehriz"}, {"correct": "açık görüş", "wrong": "açıkgörüş"}, {"correct": "laboratuvar", "wrong": "labaratuvar"}, {"correct": "poğaça", "wrong": "poaça"}, {"correct": "travma", "wrong": "tıravma"}, {"correct": "Hristiyan", "wrong": "Hıristiyan"}, {"correct": "Azerbaycan", "wrong": "Azarbaycan"}, {"correct": "şefkat", "wrong": "şevkat"}, {"correct": "öz güven", "wrong": "özgüven"}, {"correct": "sıra dışı", "wrong": "sıradışı"}, {"correct": "yanı sıra", "wrong": "yanısıra"}, {"correct": "yurt dışı", "wrong": "yurtdışı"}, {"correct": "yurt içi", "wrong": "yurtiçi"}, {"correct": "peş peşe", "wrong": "peşpeşe"}, {"correct": "üst üste", "wrong": "üstüste"}, {"correct": "yan yana", "wrong": "yanyana"}, {"correct": "baş başa", "wrong": "başbaşa"}, {"correct": "el ele", "wrong": "elele"}, {"correct": "omuz omuza", "wrong": "omuzomuza"}, {"correct": "iç içe", "wrong": "içiçe"}, {"correct": "altüst", "wrong": "alt üst"}, {"correct": "başucu", "wrong": "baş ucu"}, {"correct": "başöğretmen", "wrong": "baş öğretmen"}, {"correct": "başkent", "wrong": "baş kent"}, {"correct": "başhekim", "wrong": "baş hekim"}, {"correct": "başkanlık", "wrong": "baş kanlık"}, {"correct": "çevrim içi", "wrong": "çevrimiçi"}, {"correct": "çevrim dışı", "wrong": "çevrimdışı"}, {"correct": "ön yargı", "wrong": "önyargı"}, {"correct": "önsezi", "wrong": "ön sezi"}, {"correct": "ara sıra", "wrong": "arasıra"}, {"correct": "her zaman", "wrong": "herzaman"}, {"correct": "hiç kimse", "wrong": "hiçkimse"}, {"correct": "hiçbir", "wrong": "hiç bir"}, {"correct": "sürpriz", "wrong": "süpriz"}, {"correct": "şarj", "wrong": "şarz"}, {"correct": "sarımsak", "wrong": "sarmısak"}, {"correct": "bisküvi", "wrong": "biskivi"}, {"correct": "sebze", "wrong": "sepze"}, {"correct": "eğlence", "wrong": "eylence"}, {"correct": "eşek", "wrong": "eşşek"}, {"correct": "naylon", "wrong": "laylon"}, {"correct": "öğretmen", "wrong": "öretmen"}];
let deck=[], index=0, score=0, streak=0, answered=false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function newRound(){
  deck = shuffle(WORDS.map(x=>({...x})));
  index=0; score=0; streak=0; answered=false;
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  ask();
}

function ask(){
  answered=false;
  const item=deck[index];
  document.getElementById('number').textContent=(index+1)+". SÖZCÜK";
  document.getElementById('remaining').textContent=deck.length-index;
  document.getElementById('feedback').textContent="";
  document.getElementById('feedback').className="feedback";
  document.getElementById('next').disabled=true;

  const opts=shuffle([item.correct,item.wrong]);
  const box=document.getElementById('options');
  box.innerHTML="";
  opts.forEach(text=>{
    const b=document.createElement('button');
    b.className="option";
    b.textContent=text;
    b.onclick=()=>choose(b,text,item);
    box.appendChild(b);
  });
}

function choose(button,text,item){
  if(answered) return;
  answered=true;
  const buttons=[...document.querySelectorAll('.option')];
  buttons.forEach(b=>b.disabled=true);

  if(text===item.correct){
    button.classList.add('correct');
    streak++;
    score += 10 + (streak>1 ? 5 : 0);
    document.getElementById('feedback').innerHTML="✓ DOĞRU! Harika! "+item.correct;
    document.getElementById('feedback').className="feedback good";
  }else{
    button.classList.add('wrong');
    streak=0;
    buttons.find(b=>b.textContent===item.correct).classList.add('correct');
    document.getElementById('feedback').innerHTML="✗ Bu seçenek yanlış. Doğrusu: <b>"+item.correct+"</b>";
    document.getElementById('feedback').className="feedback bad";
  }
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('next').disabled=false;
}

document.getElementById('next').onclick=()=>{
  if(!answered) return;
  index++;
  if(index>=deck.length){
    document.getElementById('number').textContent="TUR TAMAMLANDI 🎉";
    document.getElementById('remaining').textContent="0";
    document.getElementById('options').innerHTML="";
    document.getElementById('feedback').innerHTML="Tebrikler! "+deck.length+" sözcüğün tamamını bitirdin. Puanın: <b>"+score+"</b>";
    document.getElementById('feedback').className="feedback good";
    document.getElementById('next').disabled=true;
  }else ask();
};

document.getElementById('reset').onclick=newRound;
newRound();
</script>
</body>
</html>
