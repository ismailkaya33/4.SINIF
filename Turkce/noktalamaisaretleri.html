<!doctype html>
<html lang="tr">
<head>

<title>Yazım Laboratuvarı — T.4.4.10</title>
<style>
:root{--ink:#18324b;--muted:#60758a;--paper:#fff;--bg:#eef5f8;--blue:#3568d4;--cyan:#16a9c7;--green:#159447;--red:#d83a4a;--orange:#e98219;--violet:#7357d8;--line:#d9e3ea;--soft:#f5f9fc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eef8fb,#f5f4ff 55%,#fff8ed);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1050px;margin:auto;padding:14px}.top{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 20px;box-shadow:0 10px 30px #18324b12}.headrow{display:flex;justify-content:space-between;gap:15px;align-items:center}.title{font-size:clamp(25px,4vw,38px);font-weight:900}.sub{color:var(--muted);font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:8px 11px;font-weight:800;color:var(--muted)}.stat b{display:block;color:var(--ink);font-size:20px}.progress{height:10px;background:#e3ebf0;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--green));transition:.25s}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stage{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;font-weight:800}.stage.active{border-color:#91aaf0;background:#eef3ff}.stage.done{background:#eefaf2;border-color:#a9d9ba}.stage small{display:block;color:var(--muted);font-weight:600;margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 14px 38px #18324b12;min-height:430px}.badge{display:inline-block;padding:7px 11px;border-radius:99px;background:#eef3ff;color:#425bc5;font-size:13px;font-weight:900}.card h1{font-size:clamp(22px,3vw,30px);margin:12px 0 7px}.instruction{font-weight:700;color:var(--muted);margin:0 0 15px;line-height:1.5}.story{background:#f7fbfd;border:1px solid #dbe9ef;border-radius:16px;padding:14px;line-height:1.65;font-size:18px;margin:10px 0}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:2px solid var(--line);background:#fff;border-radius:15px;padding:13px 15px;text-align:left;font-weight:800;min-height:56px}.choice.selected{border-color:var(--blue);background:#eef3ff}.choice.correct{border-color:var(--green);background:#effbf4}.choice.wrong{border-color:var(--red);background:#fff1f3}.choice:disabled{cursor:default}.feedback{margin-top:13px;border-radius:14px;padding:12px 14px;line-height:1.5;font-weight:700}.good{background:#effaf3;border:1px solid #bde3c8;color:#166b38}.bad{background:#fff1f3;border:1px solid #f1c0c8;color:#9b2432}.hint{background:#fff8e8;border:1px solid #f1d99b;color:#80580b}.notice{background:#f2f7fb;border:1px solid #dce8ef;border-radius:14px;padding:12px;font-weight:700}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:900}.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:white}.secondary{background:#fff;border:2px solid var(--line);color:var(--ink)}.warn{background:var(--orange);color:#fff}.danger{background:#fff0f2;color:#9b2432;border:2px solid #f3c3ca}.spacer{flex:1}.disabled{opacity:.45;cursor:not-allowed}.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}.matchcol{display:grid;gap:8px}.matchbtn{min-height:62px;text-align:left}.dropgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dropzone{min-height:110px;border:2px dashed #aebdca;border-radius:16px;padding:10px;background:#f9fbfc}.dropzone.over{border-color:var(--blue);background:#eef5ff}.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.token{border:2px solid #cfdbe4;background:#fff;border-radius:12px;padding:10px 12px;font-weight:800}.token.selected{border-color:var(--blue);background:#eef3ff}.token.used{opacity:.45}.sortlist{display:grid;gap:8px;max-width:700px}.sortitem{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:13px;padding:10px;font-weight:800}.sortitem .grow{flex:1}.tiny{padding:7px 9px;border:0;border-radius:8px;background:#edf2f6;font-weight:900}.editor{display:grid;gap:10px}.sentenceparts{display:grid;gap:8px}.part{background:#f8fbfd;border:1px solid var(--line);border-radius:13px;padding:10px}.part label{display:block;font-size:12px;color:var(--muted);font-weight:900;margin-bottom:5px}.part select{width:100%;border:2px solid #cfdbe4;border-radius:11px;padding:10px;background:#fff}.review{display:grid;gap:9px;margin-top:12px}.reviewItem{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.reviewItem h3{margin:0 0 6px;font-size:16px}.reviewItem .answer{font-weight:800}.report{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.reportBox{background:#f8fbfd;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}.reportBox b{display:block;font-size:24px}.hidden{display:none!important}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-4px)}}.shake{animation:shake .25s linear}@media(max-width:720px){.app{padding:8px}.stats,.report{grid-template-columns:repeat(2,1fr)}.map{grid-template-columns:repeat(2,1fr)}.opts,.match,.dropgrid{grid-template-columns:1fr}.card{padding:16px}.spacer{display:none}.controls .spacer{display:block;flex-basis:100%;height:0}.btn{min-height:46px}.headrow{align-items:flex-start}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="headrow"><div><div class="title">📝 Yazım Laboratuvarı</div><div class="sub">4. Sınıf Türkçe • T.4.4.10 • Büyük harfler ve noktalama işaretleri</div></div><div>🔎</div></div><div class="stats"><div class="stat">Görev<b id="statTask">1 / 16</b></div><div class="stat">Puan<b id="statScore">0</b></div><div class="stat">Enerji<b id="statEnergy">100</b></div><div class="stat">Yanlış<b id="statWrong">0</b></div></div><div class="progress"><i id="bar"></i></div></header>
<div class="map" id="map"><div class="stage active" data-stage="0">🚪 Giriş Kapısı<small>Temel işaretler</small></div><div class="stage" data-stage="1">🌉 Yazım Köprüsü<small>Büyük harf ve özel adlar</small></div><div class="stage" data-stage="2">🛠️ Editör Sokağı<small>Kuralları uygula</small></div><div class="stage" data-stage="3">📰 Son Baskı<small>Yeni bağlamda transfer</small></div></div>
<main id="app"></main>
</div>
<script>
'use strict';
const tasks=[
{id:'t01',stage:0,type:'choice',title:'Tabela Dedektifi',instruction:'Cümlenin başındaki kelimeyi doğru biçimde seç.',text:'___roşür, okulun girişindeki panoda öğrencileri bekliyordu.',options:['Broşür','broşür','BROŞÜR','bROŞÜR'],answer:0,why:'Cümleler büyük harfle başlar.',hint:'Boşluk cümlenin en başında.'},
{id:'t02',stage:0,type:'choice',title:'Nokta İzi',instruction:'Cümlenin sonuna uygun işareti seç.',text:'Kütüphaneden üç kitap aldım___',options:['.','?','!','…'],answer:0,why:'Bilgi veren tamamlanmış cümlenin sonunda nokta kullanılır.',hint:'Cümle soru sormuyor ve güçlü bir duygu bildirmiyor.'},
{id:'t03',stage:0,type:'choice',title:'Soru Kapısı',instruction:'Cümleyi uygun noktalama işaretiyle tamamla.',text:'Bugün bizimle parka gelecek misin___',options:['.','?','!','…'],answer:1,why:'Soru cümlesinin sonunda soru işareti kullanılır.',hint:'Cümle bir şey soruyor.'},
{id:'t04',stage:0,type:'choice',title:'Duygu Alarmı',instruction:'Güçlü duyguyu uygun işaretle tamamla.',text:'Eyvah, defterimi evde unutmuşum___',options:['.','?','!','…'],answer:2,why:'Sevinç, korku, şaşkınlık gibi güçlü duygular ünlem işaretiyle gösterilebilir.',hint:'“Eyvah” güçlü bir duygu bildiriyor.'},
{id:'t05',stage:1,type:'match',title:'Virgül Ekipleri',instruction:'Noktalama işaretini kullanım göreviyle eşleştir.',pairs:[[',','Sıralanan eş görevli sözcükleri ayırabilir.'],[':','Açıklama veya örnekten önce kullanılabilir.'],['?','Soru cümlesinin sonunda kullanılır.'],['!','Güçlü duygu bildiren cümlelerde kullanılabilir.']],why:'İşaretin görevi cümlenin yapısına göre belirlenir.',hint:'Önce işaretin görevindeki anahtar sözcüğü bul.'},
{id:'t06',stage:1,type:'choice',title:'İki Nokta İstasyonu',instruction:'Liste başlamadan önce hangi işaret kullanılmalı?',text:'Çantamda üç şey var___ kalem, silgi ve cetvel.',options:[',',';',':','.'],answer:2,why:'Ardından açıklama veya örnek niteliğinde bir liste geldiği için iki nokta kullanılabilir.',hint:'“Üç şey var” ifadesinden sonra liste geliyor.'},
{id:'t07',stage:1,type:'choice',title:'Üç Nokta İzi',instruction:'Söz tamamlanmadan bırakılmışsa uygun işareti seç.',text:'Belki yarın, belki de___',options:['.','?','!','…'],answer:3,why:'Tamamlanmamış veya devamı sezdirilen sözlerde üç nokta kullanılabilir.',hint:'Söz bilinçli olarak yarım bırakılıyor.'},
{id:'t08',stage:1,type:'match',title:'Tırnak Dedektifi',instruction:'İşareti kullanım açıklamasıyla eşleştir.',pairs:[['“ ”','Başkasının sözünü olduğu gibi aktarmada kullanılabilir.'],['( )','Cümle içinde ek bilgi vermek için kullanılabilir.'],['/','Alternatif veya iki seçenek arasındaki ilişkiyi gösterebilir.'],['’','Özel adlara gelen bazı ekleri ayırır.']],why:'Her işaretin cümlede farklı bir görevi vardır.',hint:'“Söz”, “ek bilgi”, “alternatif”, “özel ad + ek” ipuçlarını ayır.'},
{id:'t09',stage:2,type:'choice',title:'Kesme İşareti Sokağı',instruction:'Özel ada gelen eki doğru yazılmış biçimde seç.',text:'Yarın ___ gideceğiz.',options:["Ankara'ya",'Ankaraya','Ankara ya','ankara’ya'],answer:0,why:'Özel ada gelen çekim eki kesme işaretiyle ayrılır.',hint:'“Ankara” özel addır; eki ayır.'},
{id:'t10',stage:2,type:'choice',title:'Parantez Odası',instruction:'Cümle içindeki ek bilgiyi doğru biçimde göster.',text:'Atatürk ___1881-1938___ Türk milletinin lideridir.',options:['(  )','[  ]','—  —','“  ”'],answer:0,why:'Cümle içinde açıklama veya ek bilgi vermek için yay ayraç kullanılabilir.',hint:'Buradaki tarih, cümleye ek bilgi veriyor.'},
{id:'t11',stage:2,type:'choice',title:'Eğik Çizgi Tabelası',instruction:'İki seçenek arasındaki ilişkiyi uygun işaretle göster.',text:'Lütfen veli___öğrenci görüşme formunu doldurunuz.',options:['/','-','…',':'],answer:0,why:'Eğik çizgi bazı kullanımlarda iki kavram arasındaki seçenek/ilişkiyi gösterebilir.',hint:'İki taraf “veli” ve “öğrenci”; aralarında ilişki kuruluyor.'},
{id:'t12',stage:2,type:'choice',title:'Kısa Çizgi Köprüsü',instruction:'İlişki bildiren iki sözcüğü doğru biçimde birleştir.',text:'Bu kitap Türkçe___İngilizce sözlüktür.',options:['-','—','/','…'],answer:0,why:'Kısa çizgi, bazı birleşik kullanımlarda iki sözcük arasındaki ilişkiyi gösterebilir.',hint:'Burada iki dil adı arasında ilişki kuruluyor.'},
{id:'t13',stage:3,type:'sort',title:'Konuşma Çizgisi Sırası',instruction:'Konuşmayı anlamlı ve doğru noktalama düzenine getir. Başlangıç sırası özellikle karışıktır.',items:['— Yarın geziye geliyor musun?','Ayşe sordu:','— Evet, geleceğim.','Mert cevap verdi:'],answer:[1,0,3,2],why:'Konuşmayı tanıtan ifade ile konuşma çizgisiyle verilen söz doğru sırada kurulmalıdır.',hint:'Önce konuşanı tanıtan ifade, sonra konuşma çizgisiyle onun sözü gelir.'},
{id:'t14',stage:3,type:'classify',title:'Editör Kontrolü',instruction:'Kartları “Doğru” veya “Düzelt” kutusuna yerleştir.',cards:[["İstanbul'a yarın gideceğiz.",'Doğru'],['bugün Ayşe kitap okudu.','Düzelt'],['Mars, bir gezegendir.','Doğru'],["ankara'ya uçakla gittik.",'Düzelt']],why:'Cümle başlangıçları ve özel adlar uygun yerde büyük harfle başlamalıdır.',hint:'Önce cümlenin ilk harfine, sonra özel adlara bak.'},
{id:'t15',stage:3,type:'build',title:'Cümle Mimarı',instruction:'Cümleyi verilen parçaları doğru biçimde yapılandırarak tamamla. Tek bir cümleyi ezberden yazmak yerine her bölümün doğru biçimini seç.',parts:[{label:'Kişi adı',options:['Ali','ali'],answer:0},{label:'Aktarma ifadesinin sonu',options:['dedi:','dedi,','dedi'],answer:0},{label:'Aktarılan sözün başlangıcı',options:['Yarın','yarın'],answer:0},{label:'Özel ad + ek',options:["Ankara'ya",'Ankaraya','ankara’ya'],answer:0}],preview:['Ali','dedi:','Yarın',"Ankara'ya"],why:'Cümle başı ve kişi adı büyük yazılır; aktarılan sözden önce iki nokta kullanılabilir; yeni cümle büyük harfle başlar ve özel ada gelen ek kesmeyle ayrılır.',hint:'Cümleyi dört parçaya ayır: kişi adı → aktarma → yeni cümle → özel ad + ek.'},
{id:'t16',stage:3,type:'boss',title:'Son Baskı — Haber Masası',instruction:'Editör olarak dört cümleyi düzelt. Her satır için doğru biçimi seçtiğinde baskı tamamlanır.',rows:[
{bad:'bugün okulda şu kitapları okuduk: Çalıkuşu ve Sefiller.',options:['Bugün okulda şu kitapları okuduk: Çalıkuşu ve Sefiller.','Bugün okulda şu kitapları okuduk, Çalıkuşu ve Sefiller.','bugün okulda şu kitapları okuduk: çalıkuşu ve Sefiller.'],answer:0},
{bad:'Öğretmen sordu: “hazır mısınız?”',options:['Öğretmen sordu: “Hazır mısınız?”','öğretmen sordu, “Hazır mısınız?”','Öğretmen sordu “hazır mısınız?”'],answer:0},
{bad:"yarın Ankara'ya gideceğiz!",options:["Yarın Ankara'ya gideceğiz.","Yarın ankara'ya gideceğiz.","yarın Ankara ya gideceğiz."],answer:0},
{bad:'Eyvah, kalemimi evde unutmuşum.',options:['Eyvah, kalemimi evde unutmuşum!','Eyvah kalemimi evde unutmuşum.','eyvah, kalemimi evde unutmuşum.'],answer:0}],why:'Son görevde cümle başlangıcı, büyük harf, özel ad, iki nokta ve duyguya uygun noktalama birlikte uygulanır.',hint:'Her satırda önce cümle başlangıcına, sonra özel adlara ve son işarete bak.'}
];

const state={index:0,score:0,energy:100,wrong:0,hints:0,started:Date.now(),results:{},drafts:{}};
for(const t of tasks)state.results[t.id]={status:'pending',answer:null,attempts:0,firstTry:null,hintUsed:false,lastResult:null};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function current(){return tasks[state.index]}
function result(t){return state.results[t.id]}
function completedCount(){return tasks.filter(t=>result(t).status==='success').length}
function resolvedCount(){return tasks.filter(t=>result(t).status!=='pending').length}
function stageName(n){return ['Giriş Kapısı','Yazım Köprüsü','Editör Sokağı','Son Baskı'][n]}
function updateHeader(){
 document.getElementById('statTask').textContent=`${Math.min(state.index+1,tasks.length)} / ${tasks.length}`;
 document.getElementById('statScore').textContent=state.score;
 document.getElementById('statEnergy').textContent=state.energy;
 document.getElementById('statWrong').textContent=state.wrong;
 document.getElementById('bar').style.width=`${Math.round((resolvedCount()/tasks.length)*100)}%`;
 document.querySelectorAll('.stage').forEach((el,i)=>{el.classList.toggle('active',i===current()?.stage);el.classList.toggle('done',tasks.filter(t=>t.stage===i).every(t=>result(t).status!=='pending'));});
}
function shell(t){const r=result(t);return `<section class="card" id="card"><div class="badge">AŞAMA ${t.stage+1} • ${esc(stageName(t.stage))}</div><h1>${esc(t.title)}</h1><p class="instruction">${esc(t.instruction)}</p>${t.text?`<div class="story">${esc(t.text)}</div>`:''}<div id="work"></div><div id="feedback"></div><div class="controls"><button class="btn secondary" id="hint">💡 İpucu</button><span class="spacer"></span><button class="btn secondary ${state.index===0?'disabled':''}" id="prev" ${state.index===0?'disabled':''}>⬅️ Önceki Soru</button><button class="btn secondary ${r.status==='pending'?'disabled':''}" id="next" ${r.status==='pending'?'disabled':''}>➡️ Sonraki Soru</button><button class="btn warn" id="skip" ${r.status!=='pending'?'disabled':''}>⏭️ Soruyu Geç</button></div></section>`}
function render(){if(state.index>=tasks.length){renderReport();return}const t=current();app.innerHTML=shell(t);updateHeader();document.getElementById('hint').onclick=hint;document.getElementById('prev').onclick=()=>go(state.index-1);document.getElementById('next').onclick=()=>go(state.index+1);document.getElementById('skip').onclick=skip;const w=document.getElementById('work');if(t.type==='choice')choice(w,t);if(t.type==='match')match(w,t);if(t.type==='sort')sort(w,t);if(t.type==='classify')classify(w,t);if(t.type==='build')build(w,t);if(t.type==='boss')boss(w,t);restoreFeedback(t)}
function restoreFeedback(t){const r=result(t);if(r.lastResult==='wrong')feedback('bad','❌ Önceki denemede hata yaptın. Aynı görevi yeniden çözebilirsin.');if(r.status==='success')feedback('good','✅ Bu görev daha önce tamamlandı. İstersen cevabını inceleyebilirsin.');if(r.status==='skipped')feedback('hint','⏭️ Bu görev daha önce geçildi. İstersen şimdi çözebilirsin.');}
function feedback(kind,html){document.getElementById('feedback').innerHTML=`<div class="feedback ${kind}">${html}</div>`}
function hint(){const t=current(),r=result(t);if(r.status!=='pending')return;if(r.hintUsed)return feedback('hint',`💡 <b>İpucu:</b> ${esc(t.hint)}`);r.hintUsed=true;state.hints++;feedback('hint',`💡 <b>İpucu:</b> ${esc(t.hint)}`)}
function wrong(msg){const t=current(),r=result(t);if(r.status!=='pending')return;r.attempts++;r.lastResult='wrong';state.wrong++;feedback('bad',`❌ <b>Henüz değil.</b> ${esc(msg)}<br><span>Aynı görevi yeniden dene. Doğru cevap henüz gösterilmiyor.</span>`);const c=document.getElementById('card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');updateHeader()}
function finish(answer){const t=current(),r=result(t);if(r.status==='success')return;r.status='success';r.answer=answer;r.lastResult='success';r.firstTry=r.attempts===0&&!r.hintUsed;if(r.firstTry)state.score+=10;else state.score+=7;state.energy=Math.min(100,state.energy+5);feedback('good',`✅ <b>Doğru!</b> ${esc(t.why)}<br>${r.firstTry?'🔥 İlk denemede başardın.':'💪 Görevi düzelterek tamamladın.'}`);document.getElementById('next').disabled=false;document.getElementById('next').classList.remove('disabled');document.getElementById('skip').disabled=true;document.getElementById('skip').classList.add('disabled');updateHeader()}
function skip(){const t=current(),r=result(t);if(r.status!=='pending')return;r.status='skipped';r.answer=null;r.lastResult='skipped';state.energy=Math.max(0,state.energy-2);feedback('hint','⏭️ Bu görev geçildi. Doğru cevap çalışma sonunda inceleme bölümünde gösterilecek.');document.getElementById('next').disabled=false;document.getElementById('next').classList.remove('disabled');document.getElementById('skip').disabled=true;document.getElementById('skip').classList.add('disabled');updateHeader()}
function go(i){if(i<0||i>tasks.length)return;if(i>state.index&&current()&&result(current()).status==='pending')return;state.index=i;render()}
function choice(w,t){const r=result(t),draft=state.drafts[t.id]??r.answer??null;w.innerHTML=`<div class="opts">${t.options.map((o,i)=>`<button class="choice ${draft===i?'selected':''}" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="controls"><button class="btn primary" id="check">✓ Cevabımı Kontrol Et</button></div>`;let sel=draft;w.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(r.status==='success')return;sel=+b.dataset.i;state.drafts[t.id]=sel;w.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('check').onclick=()=>{if(sel===null||sel===undefined)return feedback('hint','Önce bir seçenek seç.');r.answer=sel;if(sel===t.answer)finish(sel);else wrong('Seçtiğin cevap bu cümlenin anlamı veya kuralıyla uyuşmuyor. İpucundaki anahtar sözcüğü tekrar düşün.')}}
function shuffled(arr){return [...arr].sort(()=>Math.random()-.5)}
function match(w,t){const r=result(t);const pairs=t.pairs.map((p,i)=>({id:i,left:p[0],right:p[1]}));let left=shuffled(pairs),right=shuffled(pairs);let draft=state.drafts[t.id]||{};w.innerHTML=`<div class="match"><div class="matchcol" id="ml">${left.map(p=>`<button class="choice matchbtn ${draft.left===p.id?'selected':''} ${draft.locked?.includes(p.id)?'correct':''}" data-id="${p.id}" ${draft.locked?.includes(p.id)?'disabled':''}>${esc(p.left)}</button>`).join('')}</div><div class="matchcol" id="mr">${right.map(p=>`<button class="choice matchbtn ${draft.right===p.id?'selected':''} ${draft.locked?.includes(p.id)?'correct':''}" data-id="${p.id}" ${draft.locked?.includes(p.id)?'disabled':''}>${esc(p.right)}</button>`).join('')}</div></div><div class="notice" style="margin-top:12px">Önce soldan bir işarete, sonra sağdan görevine dokun.</div>`;draft.locked=draft.locked||[];let a=draft.left??null,b=draft.right??null;function pick(side,id){if(r.status==='success'||draft.locked.includes(id))return;if(side==='l')a=id;else b=id;draft[side==='l'?'left':'right']=id;state.drafts[t.id]=draft;w.querySelectorAll('.matchbtn').forEach(x=>x.classList.remove('selected'));const el=w.querySelector(`#m${side==='l'?'l':'r'} [data-id="${id}"]`);if(el)el.classList.add('selected');if(a!==null&&b!==null){if(a===b){draft.locked.push(a);delete draft.left;delete draft.right;state.drafts[t.id]=draft;if(draft.locked.length===t.pairs.length)finish([...draft.locked]);else render();}else{wrong('Bu eşleştirme uyuşmuyor. İşaretin görevini ve açıklamadaki anahtar sözcükleri yeniden düşün.');delete draft.left;delete draft.right;state.drafts[t.id]=draft;a=null;b=null;w.querySelectorAll('.matchbtn').forEach(x=>x.classList.remove('selected'))}}}w.querySelectorAll('#ml .matchbtn').forEach(b=>b.onclick=()=>pick('l',+b.dataset.id));w.querySelectorAll('#mr .matchbtn').forEach(b=>b.onclick=()=>pick('r',+b.dataset.id))}
function sort(w,t){const r=result(t);let arr=state.drafts[t.id]?.items?[...state.drafts[t.id].items]:shuffled(t.items);state.drafts[t.id]={items:arr};w.innerHTML=`<div class="sortlist" id="sortList">${arr.map((x,i)=>`<div class="sortitem"><span>${i+1}.</span><span class="grow">${esc(x)}</span><button class="tiny" data-i="${i}" data-m="-1">↑</button><button class="tiny" data-i="${i}" data-m="1">↓</button></div>`).join('')}</div><div class="controls"><button class="btn primary" id="check">Sırayı Kontrol Et</button></div>`;w.querySelectorAll('.tiny').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=i+ +b.dataset.m;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];state.drafts[t.id].items=arr;sort(w,t)});document.getElementById('check').onclick=()=>{if(arr.every((x,i)=>x===t.items[t.answer[i]]))finish(arr);else wrong('Konuşmayı tanıtan ifade ile konuşma çizgisiyle verilen sözlerin sırasını yeniden incele.')}}
function classify(w,t){
 const r=result(t), saved=state.drafts[t.id]?.map||{}; let map={...saved}; let selected=null;
 w.innerHTML=`<div class="notice">Kartı sürükle veya karta dokunup hedef kutuya dokun.</div><div class="dropgrid" style="margin-top:12px"><div class="dropzone" data-bin="Doğru"><b>✅ DOĞRU</b><div class="bin"></div></div><div class="dropzone" data-bin="Düzelt"><b>🛠️ DÜZELT</b><div class="bin"></div></div></div><div class="tokens" id="cards"></div><div class="controls"><button class="btn primary" id="check">Kartları Kontrol Et</button></div>`;
 const cards=document.getElementById('cards');
 function makeCard(i){const b=document.createElement('button');b.type='button';b.className='token';b.textContent=t.cards[i][0];b.dataset.i=i;b.draggable=true;b.addEventListener('click',e=>{e.stopPropagation();const parentBin=b.closest('.dropzone');if(parentBin&&selected!==null&&selected!==i){place(selected,parentBin.dataset.bin);return}selected=i;document.querySelectorAll('.token').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(i)));return b}
 function attachZones(){document.querySelectorAll('.dropzone').forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');place(+e.dataTransfer.getData('text/plain'),z.dataset.bin)};z.onclick=()=>{if(selected!==null)place(selected,z.dataset.bin)}})}
 function renderCards(){cards.innerHTML='';t.cards.forEach((c,i)=>{if(!map[i])cards.appendChild(makeCard(i))});document.querySelectorAll('.dropzone .bin').forEach(b=>b.innerHTML='');Object.keys(map).forEach(k=>{const z=document.querySelector(`.dropzone[data-bin="${map[k]}"] .bin`);if(z){const el=makeCard(+k);el.style.display='block';el.style.width='100%';z.appendChild(el)}});attachZones()}
 function place(i,bin){if(!Number.isInteger(i)||i<0||i>=t.cards.length)return;map[i]=bin;state.drafts[t.id]={map};selected=null;renderCards()}
 renderCards();
 document.getElementById('check').onclick=()=>{if(Object.keys(map).length<t.cards.length)return wrong('Önce bütün kartları bir kutuya yerleştir.');if(t.cards.every((c,i)=>map[i]===c[1]))finish(map);else wrong('En az bir kart yanlış kutuda. Yanlış kartı diğer kutuya taşıyıp tekrar kontrol et.')}
}
function build(w,t){const r=result(t),d=state.drafts[t.id]?.parts||t.parts.map(()=>null);w.innerHTML=`<div class="sentenceparts">${t.parts.map((p,i)=>`<div class="part"><label>${esc(p.label)}</label><select data-i="${i}"><option value="">Seç...</option>${p.options.map((o,j)=>`<option value="${j}" ${d[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('')}</div><div class="story" id="preview">${d.every(x=>x!==null)?esc(d.map((x,i)=>t.parts[i].options[x]).join(' ')): 'Cümlenin doğru biçimi burada oluşacak.'}</div><div class="controls"><button class="btn primary" id="check">Cümleyi Kontrol Et</button></div>`;w.querySelectorAll('select').forEach(s=>s.onchange=()=>{d[+s.dataset.i]=s.value===''?null:+s.value;state.drafts[t.id]={parts:d};document.getElementById('preview').textContent=d.every(x=>x!==null)?d.map((x,i)=>t.parts[i].options[x]).join(' '):'Cümlenin doğru biçimi burada oluşacak.'});document.getElementById('check').onclick=()=>{if(!d.every(x=>x!==null))return feedback('hint','Önce dört parçanın tamamını seç.');if(d.every((x,i)=>x===t.parts[i].answer))finish(d);else wrong('Cümlenin parçalarından en az biri yanlış. Kişi adı, aktarma işareti, yeni cümle başlangıcı ve özel ad + eki sırayla kontrol et.')}}
function boss(w,t){const r=result(t),d=state.drafts[t.id]?.rows||{};w.innerHTML=`<div class="notice">Her satır için doğru düzeltilmiş biçimi seç. Dört satır da doğru olunca son baskı tamamlanır.</div><div id="rows"></div><div class="controls"><button class="btn primary" id="check">Baskıyı Kontrol Et</button></div>`;const rows=document.getElementById('rows');t.rows.forEach((row,i)=>{const order=shuffled(row.options.map((_,j)=>j));const box=document.createElement('div');box.style.margin='14px 0';box.innerHTML=`<div class="small"><b>Hatalı metin:</b> ${esc(row.bad)}</div><div class="opts" style="margin-top:7px">${order.map(j=>`<button class="choice ${d[i]===j?'selected':''}" data-j="${j}">${esc(row.options[j])}</button>`).join('')}</div>`;rows.appendChild(box);box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{d[i]=+b.dataset.j;state.drafts[t.id]={rows:d};box.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})});document.getElementById('check').onclick=()=>{if(Object.keys(d).length<t.rows.length)return wrong('Dört satırın da bir seçeneğini işaretle.');if(t.rows.every((row,i)=>d[i]===row.answer))finish(d);else wrong('Her satırda cümle başlangıcı, özel adlar ve uygun noktalama işaretlerini tek tek kontrol et.')}}
function renderReport(){updateHeader();const success=tasks.filter(t=>result(t).status==='success').length,skipped=tasks.filter(t=>result(t).status==='skipped').length,first=tasks.filter(t=>result(t).firstTry).length;document.querySelectorAll('.stage').forEach(x=>x.classList.add('done'));let bad=tasks.filter(t=>result(t).status!=='success');app.innerHTML=`<section class="card"><div class="badge">🏆 ÇALIŞMA RAPORU</div><h1>Yazım Laboratuvarı tamamlandı</h1><p class="instruction">Rapor gerçek çalışma durumundan oluşturuldu.</p><div class="report"><div class="reportBox">Toplam<b>${tasks.length}</b></div><div class="reportBox">Doğru<b>${success}</b></div><div class="reportBox">İlk deneme<b>${first}</b></div><div class="reportBox">Geçilen<b>${skipped}</b></div><div class="reportBox">Yanlış deneme<b>${state.wrong}</b></div><div class="reportBox">İpucu<b>${state.hints}</b></div><div class="reportBox">Puan<b>${state.score}</b></div><div class="reportBox">Süre<b>${Math.max(1,Math.round((Date.now()-state.started)/60000))} dk</b></div></div><h2>📚 Yanlış / Geçilen Görevlerin Cevapları</h2><div class="review">${bad.length?bad.map(t=>reviewItem(t)).join(''):'<div class="notice">🎉 Yanlış veya geçilen görev yok. Tüm görevler doğru tamamlandı.</div>'}</div><div class="controls"><button class="btn primary" id="replay">🔄 Baştan Oyna</button></div></section>`;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{state.index=+b.dataset.review;render()});document.getElementById('replay').onclick=()=>location.reload()}
function reviewItem(t){const r=result(t);let correct='';if(t.type==='choice')correct=t.options[t.answer];if(t.type==='match')correct=t.pairs.map(p=>`${p[0]} → ${p[1]}`).join(' • ');if(t.type==='sort')correct=t.answer.map(i=>t.items[i]).join(' → ');if(t.type==='classify')correct=t.cards.map(c=>`${c[0]} → ${c[1]}`).join(' • ');if(t.type==='build')correct=t.parts.map((p,i)=>p.options[p.answer]).join(' ');if(t.type==='boss')correct=t.rows.map((row,i)=>row.options[row.answer]).join(' | ');let student='Geçildi';if(r.answer!==null&&r.answer!==undefined){if(t.type==='choice')student=t.options[r.answer];else if(t.type==='build')student=t.parts.map((p,i)=>p.options[r.answer[i]]).join(' ');else if(t.type==='sort')student=r.answer.join(' → ');else student='Öğrencinin son cevabı kaydedildi.'}return `<div class="reviewItem"><h3>${esc(t.title)}</h3><div class="story" style="font-size:16px;margin:8px 0"><b>Görev:</b> ${esc(t.text||t.instruction)}</div><div><b>Durum:</b> ${r.status==='skipped'?'Geçildi':'Yanlış yapıldı'}</div><div><b>Öğrencinin son cevabı:</b> ${esc(student)}</div><div class="answer"><b>Doğru cevap:</b> ${esc(correct)}</div><div style="margin-top:5px"><b>Açıklama:</b> ${esc(t.why)}</div><div class="controls"><button class="btn secondary" data-review="${tasks.indexOf(t)}">↩ Bu Göreve Dön</button></div></div>`}
updateHeader();render();
</script></body></html>
