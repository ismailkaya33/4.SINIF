<title>Hikâye Dedektifi — T.4.1.2</title>
<style>
:root{--ink:#18324b;--muted:#64788b;--paper:#fffdf8;--line:#dce6ee;--accent:#4f7cff;--accent2:#18a689;--warn:#f39a3f;--danger:#d95b5b;--good:#239b68;--shadow:0 12px 30px rgba(31,60,88,.12)}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eef6ff,#fffaf1);min-height:100vh}
button,input{font:inherit} button{cursor:pointer;border:0} .app{max-width:1080px;margin:auto;padding:18px 14px 30px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:16px;background:#18324b;color:#fff;display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}h1{font-size:clamp(20px,4vw,31px);margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-weight:700;font-size:13px}
.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}.progress{height:9px;background:#e9eef3;border-radius:999px;overflow:hidden;margin:4px 0 16px}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:.3s}
.stage{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.stage strong{font-size:14px}.stage span{font-size:13px;color:var(--muted)}
.story{border:1px solid #dfe9f1;border-radius:20px;background:var(--paper);overflow:hidden;margin-bottom:16px}.scene{min-height:148px;padding:20px;display:flex;gap:15px;align-items:center;background:linear-gradient(135deg,#eaf4ff,#fff4df)}.sceneIcon{width:78px;height:78px;border-radius:22px;background:#fff;display:grid;place-items:center;font-size:42px;flex:none;box-shadow:0 8px 20px rgba(30,70,100,.12)}.scene h2{margin:0 0 7px;font-size:20px}.scene p{margin:0;line-height:1.6}.storyText{padding:18px;font-size:17px;line-height:1.72}.storyText em{background:#fff0c9;padding:2px 5px;border-radius:6px;font-style:normal;font-weight:700}.listen{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{background:#18324b;color:#fff;border-radius:13px;padding:11px 15px;font-weight:800;min-height:44px}.btn.secondary{background:#edf3f8;color:#18324b}.btn.good{background:var(--good)}.btn.warn{background:var(--warn);color:#38210d}.btn:disabled{opacity:.45;cursor:not-allowed}
.prompt{font-size:19px;font-weight:800;line-height:1.45;margin:4px 0 13px}.hint{display:none;background:#fff7dc;border:1px solid #f2d887;border-radius:14px;padding:11px 13px;margin:10px 0;color:#604b18}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{background:#fff;border:2px solid #dfe7ee;border-radius:15px;padding:14px;text-align:left;min-height:58px;font-weight:700;color:var(--ink);transition:.15s}.option:hover{transform:translateY(-1px);border-color:#a9bfd0}.option.selected{border-color:var(--accent);background:#eef3ff}.option.correct{border-color:var(--good);background:#eaf9f1}.option.wrong{border-color:var(--danger);background:#fff0f0}
.feedback{min-height:0;margin-top:12px}.fb{padding:13px;border-radius:15px;font-weight:650;line-height:1.5}.fb.good{background:#eaf9f1;border:1px solid #a9dec5}.fb.bad{background:#fff0f0;border:1px solid #e7b4b4}.fb.info{background:#eef5ff;border:1px solid #bdd0f4}
.footerNav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:17px;flex-wrap:wrap}.leftNav,.rightNav{display:flex;gap:8px;flex-wrap:wrap}.skip{background:#fff3e6;color:#8b4f0e}.small{font-size:12px;color:var(--muted)}
.dragGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drop{border:2px dashed #b8cbd8;border-radius:17px;padding:12px;min-height:150px;background:#f9fcfe}.drop h3{margin:0 0 8px;font-size:14px}.dragCard{display:block;background:#fff;border:1px solid #d8e3eb;border-radius:12px;padding:10px;margin:7px 0;font-weight:700;cursor:grab}.dragCard.sel{outline:3px solid #b8c8ff}.tapTarget{border:2px solid #d8e3eb;background:#fff;border-radius:12px;padding:10px;margin:7px 0;font-weight:700;width:100%;text-align:left}
.sequence{display:flex;flex-wrap:wrap;gap:9px;min-height:64px;padding:10px;border:2px dashed #c8d7e2;border-radius:16px}.seq{background:#fff;border:1px solid #d5e1ea;border-radius:12px;padding:11px 13px;font-weight:750}.seq.sel{border-color:var(--accent);background:#eef3ff}.num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#18324b;color:#fff;font-size:12px;margin-right:6px}
.textAnswer{display:flex;gap:8px;flex-wrap:wrap}.textAnswer input{flex:1;min-width:220px;border:2px solid #d9e4eb;border-radius:14px;padding:13px 14px;outline:none}.textAnswer input:focus{border-color:var(--accent)}
.final{display:none}.report{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.metric{background:#f6f9fb;border:1px solid var(--line);border-radius:15px;padding:12px}.metric b{display:block;font-size:22px}.review{margin-top:15px}.reviewItem{border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0;background:#fff}.reviewItem h4{margin:0 0 6px}.reviewItem p{margin:5px 0;line-height:1.5}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef3f7;margin-right:4px}
.hidden{display:none!important}@media(max-width:700px){.options,.dragGrid{grid-template-columns:1fr}.report{grid-template-columns:repeat(2,1fr)}.scene{align-items:flex-start}.sceneIcon{width:60px;height:60px;font-size:31px}.storyText{font-size:16px}.card{padding:13px}.footerNav{align-items:stretch}.leftNav,.rightNav{width:100%}.footerNav button{flex:1}.stats{justify-content:flex-end}}
</style>

<body>
<div class="app" id="app">
<header><div class="brand"><div class="logo">🔎</div><div><h1>Hikâye Dedektifi</h1><div class="sub">T.4.1.2 • Okuduğunu kullan, geleceği tahmin et.</div></div></div><div class="stats"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⚡ <span id="energy">3</span></div></div></header>
<div class="card" id="gameCard">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="stage"><strong id="stageTitle">1. Oku ve Tahmin Et</strong><span id="counter">1 / 16</span></div>
<div id="taskArea"></div>
<div class="footerNav"><div class="leftNav"><button class="btn secondary" id="prevBtn">⬅️ Önceki Soru</button></div><div class="rightNav"><button class="btn skip" id="skipBtn">⏭️ Soruyu Geç</button><button class="btn" id="nextBtn" disabled>➡️ Sonraki Soru</button></div></div>
</div>

<script>
'use strict';
const tasks=[
{id:'t01',stage:1,type:'mc',title:'Bahçedeki uçurtma',icon:'🪁',story:'Ece, okul çıkışında bahçede uçurtmasını uçuruyordu. Birden gökyüzünde koyu bulutlar belirdi ve rüzgâr hızlandı. Ece, uçurtmanın ipini sıkıca tuttu.',prompt:'Bu olayların gelişimine göre Ece’nin biraz sonra ne yapması en olasıdır?',data:{options:[['a','Uçurtmasını daha yükseğe çıkarmaya çalışır.'],['b','Hava kötüleşmeden uçurtmasını indirip güvenli bir yere geçer.'],['c','Yağmur başlayınca bahçede koşmaya devam eder.'],['d','Uçurtmanın ipini bırakıp uzaklaşır.']],correct:'b'},explanation:'Koyu bulutların belirip rüzgârın hızlanması hava koşullarının kötüleşebileceğini düşündürür. Ece’nin uçurtmayı indirip güvenli yere geçmesi olayın gelişimine uygun bir tahmindir.'},
{id:'t02',stage:1,type:'choice2',title:'Kütüphanedeki ipucu',icon:'📚',story:'Mert kütüphanede bir kitabı açtı. Kitabın arasında eski bir harita buldu. Haritanın üzerinde okul bahçesindeki büyük çınarın yanında küçük bir yıldız işareti vardı.',prompt:'Hikâye devam ederse Mert’in aşağıdakilerden hangisini yapması daha olasıdır?',data:{options:[['a','Haritayı çöpe atar.'],['b','Çınarın yanındaki yeri araştırır.']],correct:'b'},explanation:'Haritadaki yıldız, Mert’e belirli bir yeri araştırması için ipucu verir. Tahmin doğrudan verilen olay ve ipucuna dayanır.'},
{id:'t03',stage:1,type:'evidence',title:'Kanıtı yakala',icon:'🧩',story:'Deniz, sınıf bitkisini sulamak için pencerenin yanına gitti. Toprağın çok kuru olduğunu fark etti. Yapraklardan biri de aşağı doğru eğilmişti.',prompt:'Deniz’in bitkinin durumunu fark etmesi, aşağıdaki tahminlerden hangisini en güçlü biçimde destekler?',data:{options:[['a','Bitkinin suya ihtiyacı vardır.'],['b','Bitki yakında meyve verecektir.'],['c','Bitki başka bir sınıfa taşınacaktır.'],['d','Pencere kapanacaktır.']],correct:'a'},explanation:'Kuru toprak ve eğilmiş yapraklar bitkinin suya ihtiyaç duyduğuna dair iki açık ipucudur.'},
{id:'t04',stage:1,type:'mc',title:'Dondurma arabası',icon:'🍦',story:'Sahilde yürüyen Arda, dondurma arabasının önünde uzun bir sıra gördü. Hava çok sıcaktı ve herkes sırayla dondurma alıyordu. Arda da sıranın sonuna geçti.',prompt:'Olayın gelişimine göre aşağıdakilerden hangisi beklenir?',data:{options:[['a','Arda sıranın ilerlemesini bekler.'],['b','Herkes aynı anda eve gider.'],['c','Dondurma arabası kütüphaneye dönüşür.'],['d','Arda sırayı tamamen yok eder.']],correct:'a'},explanation:'Arda sıranın sonuna geçtiğine göre olayın doğal devamında sıranın ilerlemesini beklemesi beklenir.'},
{id:'t05',stage:2,type:'sequence',title:'Kaybolan not',icon:'📝',story:'Zeynep, yarışma için hazırladığı notu masasının üzerine bıraktı. Sonra çantasını almak için dışarı çıktı. Geri döndüğünde notunu bulamadı. Masanın yanında açık bir pencere vardı.',prompt:'Zeynep’in araştırmasını olayın ipuçlarına göre sırala.',data:{items:[['s1','Masayı ve çevresini kontrol eder.'],['s2','Pencerenin açık olduğunu fark eder.'],['s3','Notun rüzgârla uçmuş olabileceğini düşünür.'],['s4','Pencerenin çevresini ve yakınını araştırır']],correct:['s1','s2','s3','s4']},explanation:'Önce kaybolan nesnenin yakın çevresi kontrol edilir; açık pencere ipucu fark edilir, buna dayanarak rüzgâr ihtimali düşünülür ve pencere çevresi araştırılır.'},
{id:'t06',stage:2,type:'mc',title:'Yağmurdan sonraki yol',icon:'☔',story:'Yağmur gece boyunca yağdı. Sabah okul yolunda bazı su birikintileri vardı. Ali, ayakkabılarının ıslanmasını istemiyordu.',prompt:'Ali’nin olayın gelişimine uygun olarak ne yapması daha olasıdır?',data:{options:[['a','Su birikintilerinin içinden koşar.'],['b','Kuru ve güvenli bir yoldan yürümeyi seçer.'],['c','Ayakkabılarını çıkarıp okula gider.'],['d','Yağmuru yeniden yağdırır.']],correct:'b'},explanation:'Su birikintileri ve Ali’nin ayakkabılarının ıslanmasını istememesi, daha kuru ve güvenli bir yol seçmesini destekler.'},
{id:'t07',stage:2,type:'classify',title:'Tahmin mi, kanıt mı?',icon:'🕵️',story:'Bir kutunun kapağı kapalı. Kutunun yanında ıslak ayak izleri ve biraz çamur var. Kutunun içinden hafif bir tıkırtı geliyor.',prompt:'Kartları “Kanıt” ve “Buna dayanarak yapılabilecek tahmin” kutularına ayır.',data:{cards:[['c1','Kutunun yanında ıslak ayak izleri var.','evidence'],['c2','Kutunun içinde hareket eden bir şey olabilir.','prediction'],['c3','Yerde çamur bulunuyor.','evidence'],['c4','Kutuyu açınca küçük bir canlı çıkabilir.','prediction']]},explanation:'Kanıt, doğrudan gözlenen bilgidir. Tahmin ise bu kanıtlardan yola çıkarak olayın devamına ilişkin öngörüdür.'},
{id:'t08',stage:2,type:'text',title:'Kendi tahminin',icon:'💭',story:'Bora, okul çıkışında arkadaşının bisikletinin zincirinin çıktığını gördü. Arkadaşı bisikleti sürmek yerine yanında yürütmeye başladı.',prompt:'Olayın gelişimine dayanarak Bora’nın arkadaşına nasıl yardım edebileceğine ilişkin kısa bir tahmin yaz. Cevabında “zincir” veya “bisiklet” ile ilgili bir çözüm bulunmalı.',data:{accepted:['bisikletin zincirini takmasına yardım eder','zinciri takmasına yardım eder','zinciri yerine takar','bisiklet zincirini yerine takar','bisikleti tamir etmesine yardım eder']},explanation:'Zincirin çıkması, bisikletin sürülememesine neden olmuştur. Olayın gelişimine uygun tahmin, zincirin yerine takılması veya bu konuda yardım edilmesidir.'},
{id:'t09',stage:3,type:'mc',title:'Son mektup',icon:'✉️',story:'Elif, dedesinin gönderdiği mektubun ilk bölümünü okudu: “Bahçedeki eski sandığın anahtarını bulduğunda, sana yıllardır sakladığım bir şeyi göstereceğim.” Elif, sandığın yerini bilizordu ama anahtarı bulamamıştı.',prompt:'Hikâyenin sonucu için en uygun tahmin hangisidir?',data:{options:[['a','Elif anahtarı aramaya koyulur ve sandığı açmayı dener.'],['b','Elif mektubu yırtıp atar.'],['c','Sandık kendiliğinden okula gider.'],['d','Elif bahçedeki tüm ağaçları keser.']],correct:'a'},explanation:'Mektupta anahtarın bulunması sandığı açmak için açık bir hedef olarak veriliyor. Bu nedenle Elif’in anahtarı araması ve sandığı açmayı denemesi güçlü bir tahmindir.'},
{id:'t10',stage:3,type:'evidence',title:'En güçlü ipucu',icon:'🔦',story:'Kerem eve geldiğinde kapının yanında ıslak bir şemsiye gördü. Koridorda da birkaç küçük su damlası vardı. Annesinin biraz önce dışarı çıktığını biliyordu.',prompt:'Kerem’in annesinin eve yakın zamanda dönmüş olabileceğini düşündüren en güçlü kanıt hangisidir?',data:{options:[['a','Kapının yanında ıslak şemsiye olması.'],['b','Kerem’in eve gelmesi.'],['c','Koridorun uzun olması.'],['d','Evin sessiz olması.']],correct:'a'},explanation:'Islak şemsiye ve su damlaları, yağmurda dışarıda bulunmuş birinin kısa süre önce eve geldiğini düşündüren somut ipuçlarıdır.'},
{id:'t11',stage:3,type:'sequence',title:'Tohumdan filize',icon:'🌱',story:'Ada bir fasulye tohumu ekti. Tohumu suladı ve saksıyı aydınlık bir yere koydu. Birkaç gün sonra toprakta küçük bir çatlak gördü.',prompt:'Bitkinin gelişimine ilişkin beklenen olayları doğru sıraya koy.',data:{items:[['a','Çatlağın olduğu yerden küçük bir filiz çıkar.'],['b','Filiz büyüyüp yapraklar oluşturur.'],['c','Ada bitkiyi düzenli olarak gözlemler.'],['d','Tohum uygun koşullarda gelişmeye devam eder.']],correct:['c','d','a','b']},explanation:'Ada önce gözlem yapar; uygun koşullar sürdükçe tohum gelişir, filiz çıkar ve zamanla yapraklar oluşur.'},
{id:'t12',stage:3,type:'choice2',title:'Kırılan kalem kutusu',icon:'✏️',story:'Sena’nın kalem kutusunun fermuarı bozuldu. Kalemler çantanın içine dökülmeye başladı. Sena, kalemlerini topladı ve kutuyu eline aldı.',prompt:'Sena’nın olayın sonucunu çözmeye yönelik ilk adımı hangisi olabilir?',data:{options:[['a','Fermuarı onarmayı veya kutuyu değiştirmeyi düşünmek.'],['b','Kalemleri tekrar yere saçmak.']],correct:'a'},explanation:'Sorunun kaynağı fermuarın bozulmasıdır. Sonuca yönelik uygun tahmin, fermuarı onarmak veya kutuyu değiştirmektir.'},
{id:'t13',stage:4,type:'mc',title:'Final — Ormandaki iz',icon:'🌲',story:'Bir grup öğrenci ormanda yürürken yerde taze ayak izleri gördü. İzler küçük bir dereye doğru gidiyordu. Biraz ileride dalları yeni kırılmış bir çalı vardı. Öğrenciler sessizce izleri takip etti.',prompt:'Bu olayların devamı için kanıtlara en çok dayanan tahmin hangisidir?',data:{options:[['a','İzlerin yakınında kısa süre önce oradan geçen bir canlıyla karşılaşabilirler.'],['b','Ormandaki bütün ağaçlar aynı anda yok olur.'],['c','Dere bir anda gökyüzüne çıkar.'],['d','Öğrenciler hiç iz görmeden geri döner.']],correct:'a'},explanation:'Taze izler ve yeni kırılmış dallar, yakın zamanda bir canlının oradan geçtiğini düşündüren iki ipucudur. İzlerin takip edilmesi karşılaşma ihtimalini artırır.'},
{id:'t14',stage:4,type:'mc',title:'Final — Pazar çantası',icon:'🛍️',story:'Mina pazardan eve dönerken bir poşetin sapının inceldiğini fark etti. Poşetin içinde birkaç ağır kavun vardı. Mina, sapın biraz daha gerilmesi hâlinde kopabileceğini düşündü.',prompt:'Mina’nın olayın gelişimine uygun olarak yapması en olası şey nedir?',data:{options:[['a','Ağır ürünleri başka bir çantaya paylaştırır.'],['b','Poşeti daha da ağırlaştırır.'],['c','Poşeti havaya atar.'],['d','Sapın kopmasını bekler.']],correct:'a'},explanation:'Sapın incelmesi ve poşetin ağır olması, kopma riskini gösterir. Ürünleri paylaştırmak bu riski azaltmaya yönelik mantıklı bir adımdır.'},
{id:'t15',stage:4,type:'drag',title:'Final — Haber izleri',icon:'📰',story:'Okul panosunda “Yarın bahçede küçük bir değişiklik olacak.” duyurusu asılı. Duyurunun altında “Çalışma alanına yaklaşmayınız.” yazıyor. Bahçede bazı saksıların yerleri değiştirilmiş.',prompt:'Kartları “Olaydan çıkarılabilecek tahmin” ve “Tahmin için yeterli olmayan bilgi” kutularına yerleştir.',data:{cards:[['d1','Bahçede bir düzenleme çalışması yapılıyor olabilir.','prediction'],['d2','Sınıfın rengi kesinlikle değişecektir.','weak'],['d3','Çalışma alanında güvenlik için yaklaşılmaması gerekebilir.','prediction'],['d4','Okul yarın tamamen kapanacaktır.','weak']]},explanation:'Duyuru ve saksıların yer değiştirmesi bahçede bir düzenleme çalışması olabileceğini düşündürür. Ancak sınıf renginin değişmesi veya okulun tamamen kapanması için yeterli kanıt yoktur.'},
{id:'t16',stage:4,type:'boss',title:'Büyük Final — İki adımlı tahmin',icon:'🏆',story:'Yağmurdan sonra okulun bahçesindeki küçük gölette su birikmişti. Ertesi sabah hava güneşliydi ve rüzgâr hafifti. Öğretmen, öğrencilerden göletin yanındaki oyun alanına gitmeden önce zemini kontrol etmelerini istedi.',prompt:'İki tahmin seç: 1) Birkaç saat sonra gölette ne olması beklenir? 2) Öğrenciler oyun alanına geçmeden önce ne yapar?',data:{options:[['a','Güneş ve zaman etkisiyle su miktarı azalabilir.','q1'],['b','Gölet bir anda buz tutar.','q1'],['c','Zeminin ıslak/kaygan olup olmadığını kontrol ederler.','q2'],['d','Kontrol etmeden koşmaya başlarlar.','q2']],correct:['a','c']},explanation:'Güneşli hava ve zaman, suyun azalabileceğine ilişkin ipucudur. Öğretmenin zemini kontrol etme uyarısı ise güvenli hareket için önce zeminin durumuna bakılacağını destekler.'}
];
const state={currentIndex:0,score:0,energy:3,wrongCount:0,skippedCount:0,hintCount:0,tasks:tasks.map(t=>({id:t.id,status:'pending',answer:null,attempts:0,firstTry:false,hintUsed:false,lastResult:null,firstWrong:null,locked:false,dataState:null})),history:[],startedAt:Date.now()};
const $=s=>document.querySelector(s); const norm=s=>String(s??'').toLocaleLowerCase('tr-TR').normalize('NFKC').replace(/[“”‘’]/g,"'").replace(/\s+/g,' ').trim();
function current(){return tasks[state.currentIndex]} function rec(){return state.tasks[state.currentIndex]}
function render(){const t=current(),r=rec(); $('#counter').textContent=`${state.currentIndex+1} / ${tasks.length}`; $('#bar').style.width=`${(state.currentIndex/tasks.length)*100}%`; $('#score').textContent=state.score; $('#energy').textContent=state.energy; $('#stageTitle').textContent=`${t.stage}. ${['Oku ve Tahmin Et','İpuçlarını Birleştir','Gelişimi Öngör','Büyük Final'][t.stage-1]}`; $('#prevBtn').disabled=state.currentIndex===0; $('#nextBtn').disabled=!(r.status==='success'||r.status==='skipped'); $('#skipBtn').disabled=r.status==='success'; $('#taskArea').innerHTML=baseStory(t)+taskUI(t,r); bind(); }
function baseStory(t){return `<div class="story"><div class="scene"><div class="sceneIcon">${t.icon}</div><div><h2>${t.title}</h2><p>Oku → ipuçlarını yakala → olayın devamını tahmin et.</p></div></div><div class="storyText">${t.story}</div></div>`}
function taskUI(t,r){let h=`<div class="prompt">${t.prompt}</div><div class="hint" id="hint">💡 İpucu: Önce olayda gerçekten okuduğun ayrıntıyı bul. Sonra bu ayrıntının hangi devamı desteklediğini düşün.</div>`;
if(t.type==='mc'||t.type==='choice2'||t.type==='evidence'){let opts=t.data.options.map(o=>`<button class="option" data-id="${o[0]}">${o[1]}</button>`).join('');h+=`<div class="options">${opts}</div>`}
if(t.type==='sequence'){const seq=r.dataState?.seq||[];h+=`<div class="small">Kartlara doğru sırayla dokun.</div><div class="options" id="seqPool">${t.data.items.map(o=>`<button class="option" data-id="${o[0]}" ${seq.includes(o[0])?'disabled':''}>${o[1]}</button>`).join('')}</div><div style="margin-top:12px" class="sequence" id="sequence">${seq.map((id,i)=>{const item=t.data.items.find(x=>x[0]===id);return `<button class="seq" data-id="${id}"><span class="num">${i+1}</span>${item?.[1]||''}</button>`}).join('')}</div><button class="btn good" id="checkSeq" ${seq.length!==t.data.items.length?'disabled':''}>✔ Sırayı Kontrol Et</button>`}
if(t.type==='classify'||t.type==='drag'){h+=`<div class="dragGrid"><div class="drop" data-target="evidence"><h3>🔎 Kanıt</h3><div id="dropEvidence"></div></div><div class="drop" data-target="prediction"><h3>🔮 Tahmin</h3><div id="dropPrediction"></div></div></div><div id="dragPool">${t.data.cards.map(c=>`<button class="dragCard" draggable="true" data-card="${c[0]}">${c[1]}</button>`).join('')}</div><div class="small" style="margin:8px 0">Kartı kutuya sürükleyebilir veya karta dokunup ardından hedef kutuya dokunabilirsin.</div><button class="btn good" id="checkClass" disabled>✔ Sınıflandırmayı Kontrol Et</button>`}
if(t.type==='text'){h+=`<div class="textAnswer"><input id="answerInput" autocomplete="off" placeholder="Tahminini kısa bir cümleyle yaz..."><button class="btn" id="checkText">Kontrol Et</button></div>`}
if(t.type==='boss'){h+=`<div class="options">${t.data.options.map(o=>`<button class="option" data-id="${o[0]}" data-q="${o[2]}">${o[1]}</button>`).join('')}</div>`}
h+=`<div class="feedback" id="feedback"></div><div style="margin-top:10px"><button class="btn secondary" id="hintBtn">💡 İpucu Kullan</button></div>`;return h}
function bind(){ $('#hintBtn').onclick=hint; document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(b.dataset.id,b)); if($('#checkSeq'))$('#checkSeq').onclick=checkSeq; if($('#checkClass'))$('#checkClass').onclick=checkClass; if($('#checkText'))$('#checkText').onclick=checkText; document.querySelectorAll('.dragCard').forEach(b=>{b.onclick=()=>tapCard(b);b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',b.dataset.card);e.dataTransfer.effectAllowed='move'});}); document.querySelectorAll('.drop').forEach(d=>{d.addEventListener('dragover',e=>{e.preventDefault();d.style.background='#eef5ff'});d.addEventListener('dragleave',()=>d.style.background='');d.addEventListener('drop',e=>{e.preventDefault();d.style.background='';assignCard(e.dataTransfer.getData('text/plain'),d.dataset.target)})}); document.querySelectorAll('.seq').forEach(b=>b.onclick=()=>removeSeq(b.dataset.id)); renderClassify(); }
function hint(){const r=rec();if(!r.hintUsed){r.hintUsed=true;state.hintCount++;}$('#hint').style.display='block';$('#hintBtn').disabled=true}
function flash(kind,msg){$('#feedback').innerHTML=`<div class="fb ${kind}">${msg}</div>`}
function scoreOnce(){const r=rec();if(!r.locked){state.score+=10;r.locked=true}}
function success(answer){const r=rec();if(r.status==='success')return;r.status='success';r.answer=answer;r.attempts++;r.firstTry=r.attempts===1;r.lastResult='success';scoreOnce();flash('good',`🎯 <b>Doğru tahmin!</b><br>${current().explanation}`);$('#nextBtn').disabled=false;document.querySelectorAll('.option').forEach(b=>b.disabled=true);}
function wrong(answer){const r=rec();r.attempts++;r.lastResult='wrong';state.wrongCount++;if(r.firstWrong===null)r.firstWrong=answer;state.energy=Math.max(0,state.energy-0);flash('bad',`🔍 <b>Henüz değil.</b> Tahminini olaydaki kanıtla yeniden karşılaştır. Yanlış cevap görevi bitirmiyor; tekrar dene.`);$('#hintBtn').disabled=r.hintUsed;}
function choose(id,btn){const t=current(),r=rec();if(r.status==='success')return;if(t.type==='boss'){const sel=[...document.querySelectorAll('.option.selected')];if(btn.classList.contains('selected')){btn.classList.remove('selected')}else{btn.classList.add('selected')}const ids=[...document.querySelectorAll('.option.selected')].map(x=>x.dataset.id); if(ids.length===2){const ok=t.data.correct.every(x=>ids.includes(x))&&ids.length===t.data.correct.length;if(ok)success(ids);else{wrong(ids.join(','));document.querySelectorAll('.option.selected').forEach(x=>x.classList.remove('selected'))}}return}
if(id===t.data.correct){btn.classList.add('correct');success(id)}else{btn.classList.add('wrong');wrong(id);setTimeout(()=>btn.classList.remove('wrong'),450)}}
function checkSeq(){const t=current(),r=rec();const ids=[...document.querySelectorAll('#sequence .seq')].map(x=>x.dataset.id);if(ids.length!==t.data.correct.length){flash('info','Önce bütün kartları sıraya yerleştir.');return}if(ids.join('|')===t.data.correct.join('|'))success(ids);else wrong(ids.join(','))}
function tapCard(b){const r=rec();if(r.status==='success')return;r.pendingCard=b.dataset.card;b.classList.add('sel');flash('info','Şimdi “Kanıt” veya “Tahmin” kutusuna dokun.');}
function assignCard(id,target){const t=current(),r=rec();if(!id)return;if(!r.dataState)r.dataState={};r.dataState[id]=target;delete r.pendingCard;renderClassify();$('#checkClass').disabled=Object.keys(r.dataState).length!==t.data.cards.length}
function renderClassify(){const t=current(),r=rec();if(!(t.type==='classify'||t.type==='drag'))return;const ev=$('#dropEvidence'),pr=$('#dropPrediction');if(!ev||!pr)return;ev.innerHTML='';pr.innerHTML='';(t.data.cards||[]).forEach(c=>{const assigned=r.dataState?.[c[0]];if(assigned){const x=document.createElement('div');x.className='dragCard';x.textContent=c[1];x.dataset.card=c[0];x.title='Başka kutuya taşımak için dokun veya sürükle';(assigned==='evidence'?ev:pr).appendChild(x)}});document.querySelectorAll('.drop').forEach(d=>{d.onclick=()=>{if(r.pendingCard)assignCard(r.pendingCard,d.dataset.target)}});}
function removeSeq(id){const r=rec();if(!r.dataState?.seq)return;const i=r.dataState.seq.indexOf(id);if(i>-1)r.dataState.seq.splice(i,1);render();}

function checkClass(){const t=current(),r=rec();let ok=true;t.data.cards.forEach(c=>{if(r.dataState?.[c[0]]!==c[2])ok=false});if(ok)success(r.dataState);else wrong(r.dataState)}
function checkText(){const t=current(),r=rec(),v=norm($('#answerInput').value);if(v.length<6){flash('info','Tahminini biraz daha açık yaz.');return}const ok=t.data.accepted.some(a=>v.includes(norm(a))||norm(a).includes(v));if(ok)success(v);else wrong(v)}
function addSeq(id){const t=current(),r=rec();const item=t.data.items.find(x=>x[0]===id);if(!item)return;if(!r.dataState)r.dataState={seq:[]};if(r.dataState.seq.includes(id))return;r.dataState.seq.push(id);const el=document.createElement('button');el.className='seq';el.dataset.id=id;el.innerHTML=`<span class="num">${r.dataState.seq.length}</span>${item[1]}`;el.onclick=()=>{const idx=r.dataState.seq.indexOf(id);r.dataState.seq.splice(idx,1);render();};$('#sequence').appendChild(el);document.querySelector(`[data-id="${id}"]`).disabled=true;$('#checkSeq').disabled=r.dataState.seq.length!==t.data.items.length}
$('#prevBtn').onclick=()=>{if(state.currentIndex>0){state.currentIndex--;render()}};
$('#nextBtn').onclick=()=>{const r=rec();if(!(r.status==='success'||r.status==='skipped'))return;if(state.currentIndex<tasks.length-1){state.currentIndex++;render()}else showFinal()};
$('#skipBtn').onclick=()=>{const r=rec();if(r.status==='success')return;r.status='skipped';r.answer=null;r.lastResult='skipped';state.skippedCount++;state.currentIndex=Math.min(tasks.length-1,state.currentIndex+1);render()};
function showFinal(){ $('#gameCard').style.display='none';const f=$('#finalCard');const completed=state.tasks.filter(x=>x.status==='success').length;const first=state.tasks.filter(x=>x.firstTry).length;const wrong=state.wrongCount;const min=Math.floor((Date.now()-state.startedAt)/60000),sec=Math.floor((Date.now()-state.startedAt)/1000)%60;f.style.display='block';f.innerHTML=`<h2>🏆 Dedektif Raporu</h2><p>Rapor yalnızca etkinlik boyunca tuttuğun verilerden hesaplandı.</p><div class="report"><div class="metric"><span>Tamamlanan</span><b>${completed}</b><small>/ ${tasks.length}</small></div><div class="metric"><span>İlk deneme</span><b>${first}</b></div><div class="metric"><span>Yanlış deneme</span><b>${wrong}</b></div><div class="metric"><span>Geçilen</span><b>${state.skippedCount}</b></div><div class="metric"><span>İpuçları</span><b>${state.hintCount}</b></div><div class="metric"><span>Puan</span><b>${state.score}</b></div><div class="metric"><span>Süre</span><b>${min}:${String(sec).padStart(2,'0')}</b></div><div class="metric"><span>Enerji</span><b>${state.energy}</b></div></div><div class="review"><h3>🔎 Yanlış / Geçilen Görevleri İncele</h3>${state.tasks.map((r,i)=>r.status==='success'? (r.attempts>1?review(i,r):'') : review(i,r)).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button class="btn" id="replay">🔄 Baştan Başla</button></div>`;$('#replay').onclick=()=>location.reload()}
function review(i,r){const t=tasks[i];return `<div class="reviewItem"><h4>${i+1}. ${t.title} <span class="tag">${r.status==='skipped'?'Geçildi':r.status==='success'?'Tekrar çözüldü':'Durum'}</span></h4><p><b>Görev:</b> ${t.prompt}</p><p><b>Senin cevabın:</b> ${r.status==='skipped'?'Geçildi':(r.answer??'—')}</p><p><b>Doğru/uygun cevap:</b> ${answerText(t)}</p><p><b>Neden:</b> ${t.explanation}</p>${r.firstWrong?`<p><b>İlk yanlış:</b> ${r.firstWrong}</p>`:''}<button class="btn secondary" data-review="${i}">Bu göreve dön</button></div>`}
function answerText(t){if(t.type==='mc'||t.type==='choice2'||t.type==='evidence'){const o=t.data.options.find(x=>x[0]===t.data.correct);return o?o[1]:''}if(t.type==='sequence')return t.data.correct.map(id=>t.data.items.find(x=>x[0]===id)?.[1]).join(' → ');if(t.type==='text')return t.data.accepted[0];if(t.type==='classify'||t.type==='drag')return t.data.cards.filter(c=>c[2]==='evidence').map(c=>c[1]).join(' / ')+' — kanıt; '+t.data.cards.filter(c=>c[2]==='prediction').map(c=>c[1]).join(' / ')+' — tahmin';if(t.type==='boss')return '1) '+t.data.options.find(x=>x[0]==='a')[1]+'  2) '+t.data.options.find(x=>x[0]==='c')[1];return ''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-review]');if(b){const i=Number(b.dataset.review);$('#finalCard').style.display='none';$('#gameCard').style.display='block';state.currentIndex=i;render()}});
// Keyboard/accessibility support for sequence cards
$('#taskArea').addEventListener('click',e=>{const b=e.target.closest('#seqPool .option');if(b&&!b.disabled)addSeq(b.dataset.id)});
render();
</script>
</body>
</html>
