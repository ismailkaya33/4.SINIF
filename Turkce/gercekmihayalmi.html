<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerçek mi Hayal mi? Hikâye Atölyesi</title>
<style>
/* Renkler JS ile OYUN.tema'dan gelir (--ana, --ikinci, --gok1, --gok2). Buradakiler yedek değerdir. */
:root{--ana:#6c3fc5;--ikinci:#c2570c;--gok1:#f3e8ff;--gok2:#fff7ec;--kart:#fff;--yazi:#1f2a44;--soluk:#5b6782;--ok:#1f9d5c;--hata:#c0392b}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--yazi);font:18px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 12% 18%,#ffffff88 0 60px,transparent 61px),radial-gradient(circle at 88% 70%,#ffffff66 0 90px,transparent 91px),
  linear-gradient(180deg,var(--gok1) 0%,var(--gok2) 75%) fixed;background-color:var(--gok2);overflow-x:hidden}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:12px 14px 110px}
.dekor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dekor svg{position:absolute;opacity:.5}
#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
h1,h2,.baslik{font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
h1{font-size:clamp(1.55rem,4.5vw,2.25rem);margin:6px 0 4px;text-align:center;color:var(--ana)}
h2{font-size:clamp(1.3rem,4vw,1.7rem);margin:8px 0 4px;text-align:center;color:var(--ana)}
.kart{background:var(--kart);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 8px 0 rgba(31,42,68,.10),0 14px 30px rgba(31,42,68,.12)}
button{font:inherit;cursor:pointer;color:var(--yazi)}
button:disabled{cursor:default}
button:focus-visible,summary:focus-visible{outline:4px solid #ffd166;outline-offset:3px}
.buyuk{display:block;margin:14px auto 4px;background:var(--ana);color:#fff;border:0;border-radius:18px;padding:14px 28px;min-height:60px;
  font-size:1.25rem;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.22);max-width:100%}
.buyuk:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
/* Üst çubuk + yol haritası */
.ust{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ust .baslik{font-size:1.02rem;color:var(--ana);background:#fffc;border-radius:999px;padding:4px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sag{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.puan{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
.puan.pop{animation:pop .4s}
.ses{background:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.yol{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:10px 0 0;padding:8px 10px;background:#fffc;border-radius:18px}
.durak{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:800;background:#fff;color:var(--soluk);border:3px dashed #c5bcd9}
.durak.simdi{border:3px solid var(--ana);color:var(--ana);transform:scale(1.15)}
.durak.yildiz,.durak.yarim,.durak.ogrendi{border:3px solid transparent;font-size:1rem}
.durak.yildiz{background:#fff3c4}.durak.yarim{background:#e2f7f4}.durak.ogrendi{background:#e8ecff}
.cizgi{flex:1 1 4px;min-width:4px;max-width:20px;height:4px;border-radius:2px;background:#c5bcd9}
.durak.son{width:40px;height:40px;font-size:1.3rem;border:3px solid #ffd166;background:#fff8e1}
/* Soru kartı */
.ust-etiket{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.etiket{display:inline-block;background:var(--ikinci);color:#fff;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.9rem}
.bolum-et{display:inline-block;background:#f1eaff;color:var(--ana);font-weight:800;border-radius:999px;padding:2px 12px;font-size:.9rem}
.kaz-kod{font-size:.75rem;color:var(--soluk)}
.gorsel{display:flex;justify-content:center;margin:10px 0 2px}
.sahne{width:100%;max-width:400px;height:auto;display:block}
.gorsel.kucuk .sahne{max-width:280px}
.soru{font-size:clamp(1.2rem,3.6vw,1.5rem);font-weight:800;margin:10px 0 12px;text-align:center}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.sec{grid-template-columns:1fr}}
.sec button{position:relative;min-height:64px;border-radius:18px;border:3px solid var(--c);background:var(--z);font-size:1.05rem;font-weight:700;
  padding:10px 40px 10px 52px;text-align:left;box-shadow:0 5px 0 var(--c);line-height:1.35}
.sec button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.sec button:nth-child(1){--c:#9b7be0;--z:#f4efff}.sec button:nth-child(2){--c:#2ec4b6;--z:#e4f8f6}
.sec button:nth-child(3){--c:#f4a300;--z:#fff6dc}.sec button:nth-child(4){--c:#ff8a5c;--z:#fff0e9}
.sec .no{position:absolute;left:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1rem}
.sec button.dogru{--c:var(--ok);--z:#e3f7ec}
.sec button.dogru::after,.kc.ok::after,.cumle.dogru::after{content:"✔";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:1.4rem}
.sec button.yanlis{--c:#a7b0c0;--z:#f1f3f7;color:#6a7389;text-decoration:line-through}
.sec button.yanlis::after,.cumle.yanlis::after{content:"✖";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--hata);font-size:1.3rem}
.alt{display:flex;justify-content:center;margin-top:14px}
.ipucu-btn{background:#fff8e1;border:3px solid #ffd166;border-radius:999px;padding:6px 20px;min-height:50px;font-weight:800;box-shadow:0 4px 0 #ffd166}
/* Metin (hikâye sayfası) */
.metin-kart{background:#fffdf6;border:2px solid #eadfc8;border-radius:18px;margin:10px 0;padding:0;
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,#e9eef7 33px 34px)}
.metin-kart summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:800;color:var(--ana);min-height:48px}
.metin-kart summary::-webkit-details-marker{display:none}
.metin-kart summary::before{content:"▸ ";}
.metin-kart[open] summary::before{content:"▾ ";}
.metin-ic{padding:4px 18px 14px 26px;border-left:3px solid #f2a7a7;margin-left:10px;line-height:1.85;font-size:1.05rem}
.metin-ic p{margin:0}
.tur-rozet{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.95rem;background:#fff3c4;color:#7a5200}
.tur-kutu{display:flex;gap:10px;align-items:flex-start;background:#fff8e1;border:2px dashed #ffd166;border-radius:16px;padding:10px 14px;margin:10px 0}
.tur-kutu .s{font-size:1.8rem;line-height:1}
.kanit{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.cumle{position:relative;text-align:left;background:#fffdf6;border:2px solid #e6dcc6;border-radius:14px;padding:10px 40px 10px 46px;min-height:52px;font-size:1.02rem;line-height:1.45;box-shadow:0 3px 0 #eadfc8}
.cumle .n{position:absolute;left:10px;top:10px;width:28px;height:28px;border-radius:50%;background:#efe7d4;font-weight:800;font-size:.9rem;display:grid;place-items:center}
.cumle:hover:not(:disabled){border-color:var(--ana)}
.cumle.dogru{border-color:var(--ok);background:#e3f7ec;box-shadow:0 3px 0 var(--ok)}
.cumle.yanlis{border-color:#c7cdd8;background:#f1f3f7;color:#6a7389;text-decoration:line-through}
/* Kural kartları (bilgi görselle) */
.kurallar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media (max-width:600px){.kurallar{grid-template-columns:1fr}}
.kural{border-radius:18px;padding:12px 14px;border:3px solid var(--kc);background:var(--kz)}
.kural h3{margin:0 0 6px;font-size:1.05rem;color:var(--kc)}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ikili div{background:#fff;border-radius:12px;padding:8px;font-size:.95rem;line-height:1.35}
.ikili b{display:block;font-size:1rem}
.kural p{margin:8px 0 0;font-size:.95rem;font-weight:700}
/* Sınıflama tahtası */
.havuz{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px;padding:10px;border:3px dashed #d4c8ee;border-radius:18px;background:#faf7ff;margin:6px 0 12px}
.havuz .bos{align-self:center;color:var(--soluk);font-weight:700}
.kc{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:3px solid #b9a6e8;border-radius:14px;padding:8px 14px;
  min-height:50px;font-size:1rem;font-weight:700;line-height:1.3;text-align:left;box-shadow:0 4px 0 #d4c8ee;max-width:100%}
.kc.secili{border-color:var(--ana);background:#efe7ff;box-shadow:0 0 0 4px #ffd16699,0 4px 0 var(--ana);transform:translateY(-2px)}
.kc.ok{border-color:var(--ok);background:#e3f7ec;box-shadow:0 3px 0 var(--ok);padding-right:38px}
.kc.cozum{border-color:#4361ee;background:#e8ecff;box-shadow:0 3px 0 #4361ee}
.kc.cozum::before{content:"📘 "}
.kc.geri{border-color:var(--hata);border-style:dashed}
.kc.geri::before{content:"↩ ";color:var(--hata)}
.kc.tasiniyor{opacity:.35}
.kc.hayalet{position:fixed;z-index:60;pointer-events:none;opacity:.92;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.kovalar{display:grid;gap:10px}
.kovalar.k2{grid-template-columns:1fr 1fr}.kovalar.k3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:600px){.kovalar.k2,.kovalar.k3{grid-template-columns:1fr}}
.kova{border:3px solid var(--kc);background:var(--kz);border-radius:20px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.kova.uzerinde{box-shadow:0 0 0 5px #ffd166}
.kova-bas{display:flex;flex-direction:column;align-items:center;border:0;border-radius:14px;background:#fff;padding:6px 8px;min-height:62px;box-shadow:0 3px 0 var(--kc)}
.kova-bas .ks{font-size:1.5rem;line-height:1.1}
.kova-bas b{color:var(--kc);font-size:1.05rem}
.kova-bas small{color:var(--soluk);font-size:.85rem;font-weight:600}
.kova-ic{display:flex;flex-direction:column;gap:6px;flex:1}
.kova-ic .kc{width:100%}
.kontrol-yer{display:flex;justify-content:center;margin-top:12px}
.kontrol{background:var(--ok);color:#fff;border:0;border-radius:16px;padding:10px 26px;min-height:56px;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 #136b3e}
.kontrol:disabled{background:#b8c0cc;box-shadow:0 5px 0 #98a1af}
.yonerge{font-size:.92rem;color:var(--soluk);text-align:center;margin:0 0 4px}
/* Karşılaştırma tablosu */
table.karsi{border-collapse:separate;border-spacing:0;width:100%;max-width:560px;margin:0 auto;font-size:1rem;border:3px solid var(--ana);border-radius:16px;overflow:hidden}
table.karsi caption{font-weight:800;color:var(--ana);padding:4px}
table.karsi th,table.karsi td{padding:8px 10px;border-bottom:2px solid #e6def7;border-right:2px solid #e6def7;text-align:left;vertical-align:top}
table.karsi thead th{background:var(--ana);color:#fff;text-align:center}
table.karsi tbody th{background:#f4efff;width:30%}
table.karsi td.soru-hucre{background:#fff3c4;text-align:center;font-size:1.4rem}
/* Rehber karakter + konuşma balonu */
.karakter-satir{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.krk{flex:0 0 auto;width:104px}
.krk.kucuk{width:84px}
.krk svg{display:block;width:100%;height:auto;transform-origin:50% 100%}
.krk .goz-mutlu,.krk .kas{display:none}
.krk.mutlu .goz-mutlu{display:inline}.krk.mutlu .goz-acik{display:none}
.krk.dusun .goz-acik{transform:translate(2px,-3px)}
.krk.uzgun .kas{display:inline}.krk.uzgun .goz-acik{transform:translateY(2px)}
.balon{position:relative;flex:1;min-width:0;background:#fff;border-radius:20px;padding:12px 16px;font-weight:600;min-height:3.2em;margin-bottom:22px;
  box-shadow:0 5px 0 rgba(31,42,68,.10);border:3px solid #fff}
.balon::before{content:"";position:absolute;left:-14px;bottom:16px;border:9px solid transparent;border-right:14px solid #fff;border-left:0}
.balon.mutlu{border-color:#bfead2}.balon.uzgun{border-color:#ffd3cc}.balon.dusun{border-color:#ffe7a3}
.devam-yer{text-align:center}
/* Bitiş */
.bitis{text-align:center}
.rozet{width:130px;height:auto}
.rozet-ad{font-weight:800;font-size:1.25rem;margin-top:-4px}
.yildizlar{font-size:1.6rem;letter-spacing:3px;margin:6px 0;word-break:break-all}
.ogrendim{display:grid;gap:8px;text-align:left;margin:12px 0}
.ogrendim div{display:flex;gap:10px;align-items:center;background:#faf7ff;border-radius:14px;padding:8px 12px;font-weight:700}
.ogrendim span{font-size:1.5rem;flex:0 0 auto}
#karne .rm{padding:4px 0;text-align:left}
#karne .rm h2{font-family:"Trebuchet MS",system-ui,sans-serif;text-align:center}
#karne .rm-k{border:0;background:#f5f8ff;border-radius:16px}
#karne .rm-bar{height:18px;border-radius:10px}
.bilgi{text-align:center;margin:4px 0}
/* Hareketler (her biri 1 saniyeden kısa; az hareket tercihinde kapanır) */
@media (prefers-reduced-motion:no-preference){
  .krk.zipla svg{animation:zipla .6s}
  .krk.salla svg,.sec button.salla,.cumle.salla,.kc.geri{animation:salla .45s}
  .kart.gir{animation:gir .35s ease-out}
  .sec button,.kc{transition:transform .08s,box-shadow .08s,background .15s}
  .durak{transition:transform .2s}
}
@keyframes zipla{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes salla{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes gir{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.25)}}
</style>

<body>
<div class="dekor" aria-hidden="true">
  <svg style="top:6%;left:2%;width:70px" viewBox="0 0 60 60"><path d="M30 4 L37 22 L56 22 L41 34 L47 53 L30 42 L13 53 L19 34 L4 22 L23 22Z" fill="#ffd166"/></svg>
  <svg style="top:22%;right:3%;width:90px" viewBox="0 0 90 60"><path d="M4 50 Q24 40 45 50 Q66 40 86 50 V14 Q66 4 45 14 Q24 4 4 14Z" fill="#c9b6f2"/><path d="M45 14 V50" stroke="#fff" stroke-width="3"/></svg>
  <svg style="bottom:8%;left:4%;width:60px" viewBox="0 0 60 60"><text x="30" y="46" font-size="48" font-weight="900" text-anchor="middle" fill="#f6b27a">?</text></svg>
  <svg style="bottom:16%;right:6%;width:54px" viewBox="0 0 60 60"><path d="M30 4 L37 22 L56 22 L41 34 L47 53 L30 42 L13 53 L19 34 L4 22 L23 22Z" fill="#a8e6cf"/></svg>
</div>
<canvas id="konfeti" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
/* RaporMotoru v2 — 4/D portalına bağlı (her etkinliğin içine gömülür; tek dosya, çevrimdışı).
 *
 * Akış:
 *   RaporMotoru.init({oyunId, oyunAdi, kazanimlar:[{kod, ad}]})   oyun başında (ve "yeniden oyna"da)
 *   RaporMotoru.kaydet({...})                                       her maddeden sonra
 *   RaporMotoru.ekranCiz(el)                                        oyun sonunda: öğrenciye "Kazanım Karnem"
 *
 * Portal bağlantısı (öğrenci kodla giriş yaptıysa etkinlik portalın içinde açılır):
 *   - Her madde: {type:'4d:item-result'} mesajı (madde bazlı kazanım/yanılgı verisi)
 *   - Oyun sonu: {type:'4d:activity-finished'} mesajı, oyun başına BİR kez (mevcut sonuç kaydı)
 *   Sayfa portal dışında (kodsuz) açıldıysa mesajlar gitmez; karne yine gösterilir.
 *   Mesajı yalnızca portal kayıt listesinde (portal/etkinlik-kayitlari.json) olan etkinlikler için
 *   sunucu kaydeder; oyunId bu listedeki "id" ile aynı olmalı.
 *
 * Seviye eşikleri öğretmen panelindekiyle AYNI olmalı (ESIK, seviye).
 */
const RaporMotoru = (() => {
  const SURUM = 2;
  const ESIK = { ustalik: 0.85, gelisiyor: 0.6, ipucuUst: 0.25, minMadde: 3 };
  let meta = null, kayit = [], t0 = Date.now(), denemeKimligi = '', bitisGonderildi = false;

  function yeniKimlik() {
    let r = '';
    try { const a = new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b => { r += b.toString(16).padStart(2, '0'); }); }
    catch (e) { r = Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    return 'rm_' + r;
  }
  function portalaGonder(mesaj) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(mesaj, '*'); } catch (e) { /* portal yok */ }
  }

  /** m = {oyunId, oyunAdi, kazanimlar:[{kod, ad}]}  (kod = MEB kazanım kodu, ör. "M.4.1.2.3") */
  function init(m) {
    meta = { oyunId: String(m.oyunId), oyunAdi: String(m.oyunAdi), kazanimlar: m.kazanimlar.map(k => ({ kod: String(k.kod), ad: String(k.ad) })) };
    kayit = []; t0 = Date.now(); denemeKimligi = yeniKimlik(); bitisGonderildi = false;
  }

  /** r = {kazanim:kod, madde:id, yanilgi:'etiket'|'', ilkDenemeDogru:bool, deneme:n, ipucu:0-3,
   *       cozumGoruldu:bool, sureMs:n, tekrar:bool}   tekrar=true → seviye hesabına katılmaz */
  function kaydet(r) {
    const i = meta ? meta.kazanimlar.findIndex(k => k.kod === r.kazanim) : -1;
    if (i < 0) { console.warn('RaporMotoru: bilinmeyen kazanım', r.kazanim); return false; }
    const x = {
      k: i, m: String(r.madde || '').slice(0, 40), y: String(r.yanilgi || '').slice(0, 40),
      i: r.ilkDenemeDogru ? 1 : 0, d: Math.max(1, r.deneme | 0), h: Math.max(0, Math.min(3, r.ipucu | 0)),
      c: r.cozumGoruldu ? 1 : 0, s: Math.max(0, Math.round((r.sureMs || 0) / 1000)), r: r.tekrar ? 1 : 0
    };
    kayit.push(x);
    portalaGonder({ type: '4d:item-result', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      kazanim: meta.kazanimlar[i].kod, madde: x.m, yanilgi: x.y, ilkDogru: x.i, deneme: x.d, ipucu: x.h,
      cozum: x.c, sureSn: x.s, tekrar: x.r });
    return true;
  }

  function seviye(a) {            // a: ilk kez sorulan madde kayıtları
    const n = a.length;
    if (n < ESIK.minMadde) return 'veri-az';
    const p = a.filter(x => x.i).length / n, h = a.filter(x => x.h > 0).length / n;
    if (p >= ESIK.ustalik && h <= ESIK.ipucuUst) return 'ustalasti';
    if (p >= ESIK.gelisiyor) return 'gelisiyor';
    return 'destek';
  }

  function ozet() {
    return meta.kazanimlar.map((k, idx) => {
      const hepsi = kayit.filter(x => x.k === idx), a = hepsi.filter(x => !x.r);
      const yan = {};
      hepsi.forEach(x => { if (x.y) yan[x.y] = (yan[x.y] || 0) + 1; });
      return {
        kod: k.kod, ad: k.ad, n: a.length, dogru: a.filter(x => x.i).length,
        p: a.length ? a.filter(x => x.i).length / a.length : null,
        ipucuOran: a.length ? a.filter(x => x.h > 0).length / a.length : 0,
        seviye: seviye(a), yanilgilar: yan
      };
    });
  }

  /** Oyun sonu: portaldaki mevcut sonuç kaydı için tek mesaj (çift gönderim yok). */
  function bitir() {
    if (!meta || bitisGonderildi) return;
    const a = kayit.filter(x => !x.r);
    if (!a.length) return;
    bitisGonderildi = true;
    const toplam = a.length, ilk = a.filter(x => x.i).length, cozulen = a.filter(x => !x.c).length;

  yaz(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* depolama kapalı */ } } }; })();
const DEPO_REKOR = 'rekor-' + OYUN.id, DEPO_SES = 'ses-' + OYUN.id;
[['--ana', T.renkAna], ['--ikinci', T.renkIkinci], ['--gok1', T.gok1], ['--gok2', T.gok2]].forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
const azHareket = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const kovalarOf = m => typeof m.kovalar === 'string' ? KOVA_TAKIM[m.kovalar] : m.kovalar;

/* --- Ses (Web Audio, dosya gerekmez; köşedeki düğmeyle kapanır) --- */
let sesAcik = depo.oku(DEPO_SES) !== '0', actx = null;
function cal(tur) {
  if (!sesAcik) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const N = (f, s, d, tip) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = tip || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + s); g.gain.exponentialRampToValueAtTime(0.16, t + s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
      o.connect(g); g.connect(actx.destination); o.start(t + s); o.stop(t + s + d + 0.05); };
    if (tur === 'dogru') { N(660, 0, 0.14); N(990, 0.11, 0.25); }
    else if (tur === 'yanlis') { N(260, 0, 0.18, 'triangle'); N(200, 0.14, 0.22, 'triangle'); }
    else if (tur === 'kutlama') { [523, 659, 784, 1047].forEach((f, i) => N(f, i * 0.12, 0.3)); }
    else { N(880, 0, 0.07); }
  } catch (e) { /* ses desteklenmiyor */ }
}
function sesDugmesi() { return '<button class="ses" id="ses" aria-label="Sesi ' + (sesAcik ? 'kapat' : 'aç') + '">' + (sesAcik ? '🔊' : '🔇') + '</button>'; }
function sesBagla() { const b = document.getElementById('ses'); if (b) b.onclick = () => { sesAcik = !sesAcik; depo.yaz(DEPO_SES, sesAcik ? '1' : '0');
  b.textContent = sesAcik ? '🔊' : '🔇'; b.setAttribute('aria-label', 'Sesi ' + (sesAcik ? 'kapat' : 'aç')); cal('tik'); }; }

/* --- Konfeti (en fazla 60 parça, ~1 sn; az hareket tercihinde çalışmaz) --- */
const cv = document.getElementById('konfeti'), cx = cv.getContext('2d');
let parca = [], kosuyor = false;
function konfeti(n, x, y) {
  if (azHareket()) return;
  const dpr = window.devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  x = x ?? innerWidth / 2; y = y ?? innerHeight / 3;
  const renk = [T.renkAna, T.renkIkinci, '#ffd166', '#ef476f', '#06d6a0', '#4cc9f0'];
  for (let i = 0; i < n && parca.length < 60; i++) { const a = Math.random() * Math.PI * 2, h = 3 + Math.random() * 7;
    parca.push({ x, y, vx: Math.cos(a) * h, vy: Math.sin(a) * h - 5, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.4, w: 7 + Math.random() * 6, c: renk[i % renk.length], t: 0 }); }
  if (!kosuyor) { kosuyor = true; requestAnimationFrame(adim); }
}
function adim() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parca.forEach(p => { p.t++; p.vy += 0.35; p.vx *= 0.98; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(0, 1 - p.t / 60); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); cx.restore(); });
  parca = parca.filter(p => p.t < 60);
  if (parca.length) requestAnimationFrame(adim); else { kosuyor = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) parca = []; });

/* --- Rehber karakterin ruh hâli + konuşma balonu --- */
function ruh(mod, hareket, metin) {
  const k = document.getElementById('krk'), b = document.getElementById('balon');
  if (k) { k.className = 'krk kucuk ' + mod; if (hareket && !azHareket()) { void k.offsetWidth; k.classList.add(hareket); } }
  if (b) { b.className = 'balon ' + mod; b.textContent = metin; }
}
function puanEkle(n) {
  const el = document.getElementById('puanSayi'); if (!el) return;
  const bas = puan; puan += n; const t0 = performance.now();
  if (azHareket()) { el.textContent = puan; return; }
  const kos = t => { const p = Math.min(1, (t - t0) / 450); el.textContent = Math.round(bas + (puan - bas) * p); if (p < 1) requestAnimationFrame(kos); };
  requestAnimationFrame(kos);
  const kap = el.parentNode; kap.classList.remove('pop'); void kap.offsetWidth; kap.classList.add('pop');
}
function yolCiz() {
  const s = { yildiz: '⭐', yarim: '✨', ogrendi: '📘' };
  return '<div class="yol" role="img" aria-label="' + sonuclar.filter(Boolean).length + ' / ' + sira.length + ' soru tamamlandı">' + sira.map((m, i) => {
    const d = sonuclar[i]; return (i ? '<span class="cizgi"></span>' : '') + '<span class="durak ' + (d || (i === idx ? 'simdi' : '')) + '">' + (d ? s[d] : (i + 1)) + '</span>';
  }).join('') + '<span class="cizgi"></span><span class="durak son">' + esc(T.sonSimge) + '</span></div>';
}
function ustCiz() {
  return '<div class="ust"><span class="baslik">' + esc(T.ad) + '</span><span class="sag"><span class="puan" aria-label="Toplanan ' + esc(T.odulAd) + '">' +
    esc(T.odulSimge) + ' <b id="puanSayi">' + puan + '</b></span>' + sesDugmesi() + '</span></div>' + yolCiz();
}
const karakterSatir = (mod, metin, buyuk) => '<div class="karakter-satir"><div id="krk" class="krk' + (buyuk ? ' ' : ' kucuk ') + mod + '">' + karakterSVG() +
  '</div><div id="balon" class="balon ' + mod + '" aria-live="polite">' + esc(metin) + '</div></div>';

/* Bilgi kartları: gerçek/hayalî ve dış görünüş/karakter (bilgi görselle) */
function kuralKartlari() {
  return '<div class="kurallar">' +
    '<div class="kural" style="--kc:#1b7f4b;--kz:#effaf3"><h3>🌍 Gerçek mi, ✨ hayalî mi?</h3><div class="ikili">' +
    '<div><b style="color:#1b7f4b">🌍 GERÇEK</b>Gerçek hayatta olabilir. Şaşırtıcı olsa bile olabilir: kar yağması, bisiklet süren dede.</div>' +
    '<div><b style="color:#6a45e0">✨ HAYALÎ</b>Gerçek hayatta olamaz: insan gibi konuşan tavşan, sihirli halı, konuşan ağaç.</div></div>' +
    '<p>Kendine sor: Bu, gerçek hayatta olabilir mi?</p></div>' +
    '<div class="kural" style="--kc:#c2255c;--kz:#fff1f5"><h3>🦸 Kahramanı tanı</h3><div class="ikili">' +
    '<div><b style="color:#1f5fbf">👀 DIŞ GÖRÜNÜŞ</b>Gözle görülür: boy, saç, göz, renk, giysi.</div>' +
    '<div><b style="color:#c2255c">💛 KARAKTER</b>Huyu: cesur, sabırlı, aceleci… Davranışından anlaşılır.</div></div>' +
    '<p>🔍 Her yargını metindeki bir cümleyle kanıtla.</p></div></div>';
}

function baslangic() {
  const rekor = depo.oku(DEPO_REKOR);
  app.innerHTML = '<div class="ust"><span></span><span class="sag">' + sesDugmesi() + '</span></div>' +
    '<div class="kart gir">' + sahneSVG() + '<h1>' + esc(OYUN.ad) + '</h1>' +
    karakterSatir('mutlu', 'Merhaba! Ben ' + T.karakterAdi + '. ' + T.hikaye, true) + kuralKartlari() +
    '<p class="bilgi">📖 3 metin &nbsp;·&nbsp; 📝 ' + OYUN.maddeler.length + ' görev &nbsp;·&nbsp; 💡 ipucu alabilirsin &nbsp;·&nbsp; ⭐ ilk denemede doğruya yıldız</p>' +
    (rekor ? '<p class="bilgi" style="color:var(--soluk)">🏆 Önceki en iyi sonucun: ' + esc(rekor) + ' yıldız</p>' : '') +
    '<button class="buyuk" id="basla">Atölyeye gir ▶</button></div>';
  sesBagla();
  document.getElementById('basla').onclick = () => {
    cal('tik');
    RaporMotoru.init({ oyunId: OYUN.id, oyunAdi: OYUN.ad, kazanimlar: OYUN.kazanimlar });
    sira = OYUN.maddeler.slice(); idx = 0; sonuclar = []; puan = 0; gosterilenBolum = -1; durum = null; soru();   // sıra kolaydan zora sabit; seçenekler karışır
  };
}

function metinParagraf(key) { return '<div class="metin-ic"><p>' + OYUN.metinler[key].map(esc).join(' ') + '</p></div>'; }

function bolumGiris(b) {
  const B = OYUN.bolumler[b];
  durum = null;
  app.innerHTML = ustCiz() + '<div class="kart gir"><div class="ust-etiket"><span class="etiket">Bölüm ' + (b + 1) + ' / ' + OYUN.bolumler.length + '</span>' +
    '<span class="tur-rozet">' + B.simge + ' ' + esc(B.tur) + '</span></div>' + gorselCiz({ tur: 'sahne', ad: B.sahne }) +
    '<h2>' + esc(B.ad) + '</h2><div class="tur-kutu"><span class="s" aria-hidden="true">' + B.simge + '</span><div>' + esc(B.aciklama) + '</div></div>' +
    (B.metin ? '<div class="metin-kart" role="region" aria-label="Metin: ' + esc(B.ad) + '">' + metinParagraf(B.metin) + '</div>' : '') +
    '<button class="buyuk" id="bolumBasla">' + (B.metin ? 'Okudum, görevlere geç ▶' : 'Hazırım ▶') + '</button></div>' +
    karakterSatir('mutlu', B.metin ? rastgele(['Önce metni dikkatle oku. Sorularda metne yeniden bakabilirsin.', 'Metni yavaşça oku; kahramanların ne yaptığına dikkat et.'])
      : 'Son görev! Şaşırtıcı olan her şey hayal değildir, unutma.');
  sesBagla();
  document.getElementById('bolumBasla').onclick = () => { cal('tik'); soru(); window.scrollTo(0, 0); };
}

function soru() {
  if (idx >= sira.length) { bitisEkrani(); return; }
  const m = sira[idx];
  if (m.bolum !== gosterilenBolum) { gosterilenBolum = m.bolum; bolumGiris(m.bolum); return; }
  const B = OYUN.bolumler[m.bolum];
  durum = { m, deneme: 0, ipucu: 0, ilkYanilgi: '', kilit: false, t0: Date.now() };
  let govde = '', metinBol = '';
  if (m.tur === 'secim') {
    durum.sec = shuffle([[m.dogru, '']].concat(m.yanlislar));          // seçenekler HER SORUDA karışır
    govde = '<div class="sec">' + durum.sec.map((s, i) => '<button data-i="' + i + '" aria-label="Seçenek ' + (i + 1) + ': ' + esc(s[0]) + '"><span class="no">' + (i + 1) + '</span>' + esc(s[0]) + '</button>').join('') + '</div>';
  } else if (m.tur === 'kanit') {
    govde = '<div class="kanit" role="group" aria-label="Metnin cümleleri">' + OYUN.metinler[m.metin].map((c, i) =>
      '<button class="cumle" data-c="' + i + '"><span class="n" aria-hidden="true">' + (i + 1) + '</span>' + esc(c) + '</button>').join('') + '</div>';
  } else {
    durum.yer = m.kartlar.map(() => null); durum.secili = null; durum.kilitli = new Set(); durum.geri = new Set(); durum.cozum = new Set();
    durum.kartSira = shuffle(m.kartlar.map((c, i) => i));
    govde = '<p class="yonerge">Bir karta dokun, sonra kutuya dokun. İstersen kartı kutuya sürükle. (Klavye: Tab ile kart seç, Enter; sonra 1, 2' + (kovalarOf(m).length > 2 ? ', 3' : '') + ' ile kutu.)</p><div id="tahta"></div>';
  }
  if (B.metin && m.tur !== 'kanit') metinBol = '<details class="metin-kart"><summary>📖 Metne yeniden bak: ' + esc(B.ad) + '</summary>' + metinParagraf(B.metin) + '</details>';
  const gorsel = m.gorsel || { tur: 'sahne', ad: B.sahne };
  app.innerHTML = ustCiz() + '<div class="kart gir"><div class="ust-etiket"><span class="etiket">Görev ' + (idx + 1) + ' / ' + sira.length + '</span>' +
    '<span class="bolum-et">' + B.simge + ' ' + esc(B.tur) + '</span></div>' + gorselCiz(gorsel, m.tur === 'kanit' || m.tur === 'kova') + metinBol +
    '<div class="soru">' + esc(m.soru) + '</div>' + govde +
    '<div class="alt"><button class="ipucu-btn" id="ip">💡 İpucu</button></div><div class="kaz-kod">' + esc(m.kaz) + '</div></div>' +
    karakterSatir('', rastgele(['Hadi bakalım, bunu çözebilirsin!', 'Metindeki ipuçlarına dikkat et.', 'Acele etme, düşün.', 'Kendine sor: Bunu metin nerede söylüyor?'])) +
    '<div class="devam-yer" id="devamYer"></div>';
  sesBagla();
  if (m.tur === 'secim') app.querySelectorAll('.sec button').forEach(b => { b.onclick = () => sec_(+b.dataset.i); });
  else if (m.tur === 'kanit') app.querySelectorAll('.cumle').forEach(b => { b.onclick = () => kanitSec(+b.dataset.c); });
  else tahtaYenile();
  document.getElementById('ip').onclick = ipucuVer;
}

function ipucuVer() {
  if (!durum || durum.kilit) return;
  const ip = durum.m.ipucu;
  durum.ipucu = Math.min(ip.length, durum.ipucu + 1);               // kademeli ipucu (en fazla 3)
  cal('tik'); ruh('dusun', null, '💡 ' + ip[durum.ipucu - 1]);
  const b = document.getElementById('ip'); if (b && durum.ipucu >= ip.length) b.textContent = '💡 İpucunu yeniden oku';
}

function dogruCevap(el) {
  const r = el ? el.getBoundingClientRect() : null, ilk = durum.deneme === 1;
  cal('dogru'); konfeti(ilk ? 45 : 22, r ? r.left + r.width / 2 : undefined, r ? r.top + r.height / 2 : undefined); puanEkle(ilk ? 10 : 5);
  sonuclar[idx] = ilk ? 'yildiz' : 'yarim';
  bitir(false, 'mutlu', 'zipla', (ilk ? '⭐ ' + rastgele(['Harika!', 'Süpersin!', 'Tam isabet!', 'Usta okur!']) : '✨ Buldun!') + ' ' + durum.m.why);
}
function ikinciSans() { cal('yanlis'); ruh('uzgun', 'salla', '🤔 Henüz değil. Bir daha dene; istersen ipucu al.'); }

/* --- 4 seçenekli soru --- */
function sec_(i) {
  if (!durum || durum.kilit || durum.m.tur !== 'secim') return;     // çift tıklama kilidi
  const [metin, yan] = durum.sec[i], btn = app.querySelectorAll('.sec button')[i];
  if (!btn || btn.disabled) return;
  durum.deneme++;
  if (metin === durum.m.dogru) { btn.classList.add('dogru'); dogruCevap(btn); return; }
  btn.classList.add('yanlis', 'salla'); btn.disabled = true;
  if (!durum.ilkYanilgi) durum.ilkYanilgi = yan;
  if (durum.deneme >= 2) {                                           // 2. yanlış → çözümü göster
    app.querySelectorAll('.sec button').forEach((b, k) => { if (durum.sec[k][0] === durum.m.dogru) b.classList.add('dogru'); });
    cozumGoster(); return;
  }
  ikinciSans();
}
/* --- Metinden kanıt seçme --- */
function kanitSec(i) {
  if (!durum || durum.kilit || durum.m.tur !== 'kanit') return;
  const btns = app.querySelectorAll('.cumle'), btn = btns[i];
  if (!btn || btn.disabled) return;
  durum.deneme++;
  if (i === durum.m.dogru) { btn.classList.add('dogru'); dogruCevap(btn); return; }
  btn.classList.add('yanlis', 'salla'); btn.disabled = true;
  if (!durum.ilkYanilgi) durum.ilkYanilgi = durum.m.yanlislar[i] || 'ilgisiz-cumle';
  if (durum.deneme >= 2) { btns[durum.m.dogru].classList.add('dogru'); btns[durum.m.dogru].scrollIntoView({ block: 'nearest' }); cozumGoster(); return; }
  ikinciSans();
}
function cozumGoster() { cal('tik'); sonuclar[idx] = 'ogrendi'; bitir(true, 'dusun', null, '📘 Birlikte bakalım: ' + durum.m.why); }

/* --- Sınıflama tahtası (dokun-seç + sürükle-bırak + klavye) --- */
function kartBtn(i) {
  const c = durum.m.kartlar[i], cls = ['kc'];
  if (durum.secili === i) cls.push('secili');
  if (durum.cozum.has(i)) cls.push('cozum'); else if (durum.kilitli.has(i)) cls.push('ok');
  if (durum.geri.has(i) && durum.yer[i] == null) cls.push('geri');
  const kilitli = durum.kilit || durum.kilitli.has(i);
  return '<button class="' + cls.join(' ') + '" data-c="' + i + '" aria-pressed="' + (durum.secili === i) + '"' + (kilitli ? ' disabled' : '') + '>' + esc(c.t) + '</button>';
}
function tahtaYenile(odak) {
  const t = document.getElementById('tahta'); if (!t || !durum || durum.m.tur !== 'kova') return;
  const m = durum.m, K = kovalarOf(m), havuz = durum.kartSira.filter(i => durum.yer[i] == null);
  t.innerHTML = '<div class="havuz" aria-label="Yerleştirilecek kartlar">' + (havuz.length ? havuz.map(kartBtn).join('') : '<span class="bos">Bütün kartlar yerleşti. Şimdi kontrol et! ✔</span>') + '</div>' +
    '<div class="kovalar k' + K.length + '">' + K.map((k, ki) => '<div class="kova" data-k="' + k.id + '" style="--kc:' + k.renk + ';--kz:' + k.zemin + '">' +
      '<button class="kova-bas" data-k="' + k.id + '" aria-label="' + (ki + 1) + '. kutu: ' + esc(k.ad) + ' (' + esc(k.alt) + '). Seçili kartı buraya koy"' + (durum.kilit ? ' disabled' : '') + '>' +
      '<span class="ks" aria-hidden="true">' + k.simge + '</span><b>' + esc(k.ad) + '</b><small>' + esc(k.alt) + '</small></button>' +
      '<div class="kova-ic">' + durum.kartSira.filter(i => durum.yer[i] === k.id).map(kartBtn).join('') + '</div></div>').join('') + '</div>' +
    (durum.kilit ? '' : '<div class="kontrol-yer"><button class="kontrol" id="kontrol"' + (havuz.length ? ' disabled' : '') + '>✔ Kontrol et</button></div>');
  t.querySelectorAll('.kc').forEach(b => {
    const i = +b.dataset.c;
    b.onclick = e => { e.stopPropagation(); if (Date.now() - sonSurukle < 350) return; kartSec(i); };
    b.addEventListener('pointerdown', e => surukleBaslat(e, i, b));
  });
  t.querySelectorAll('.kova').forEach(kv => { kv.onclick = () => { if (Date.now() - sonSurukle < 350) return; if (durum.secili != null) yerlestir(durum.secili, kv.dataset.k); }; });
  const hv = t.querySelector('.havuz');
  hv.onclick = () => { if (Date.now() - sonSurukle < 350) return; if (durum.secili != null && durum.yer[durum.secili] != null) { durum.yer[durum.secili] = null; durum.secili = null; tahtaYenile(); } };
  const kb = document.getElementById('kontrol'); if (kb) kb.onclick = kovaKontrol;
  if (odak) { const el = t.querySelector(odak); if (el && !el.disabled) el.focus({ preventScroll: true }); }
}
function kartSec(i) {
  if (!durum || durum.kilit || durum.kilitli.has(i)) return;
  durum.secili = durum.secili === i ? null : i; cal('tik');
  if (durum.secili != null) ruh('', null, '👉 Şimdi bu kartın gideceği kutuya dokun' + (durum.yer[i] != null ? ' (havuza dokunursan geri döner).' : '.'));
  tahtaYenile('.kc[data-c="' + i + '"]');
}
function yerlestir(i, k) {
  if (!durum || durum.kilit || durum.kilitli.has(i)) return;
  durum.yer[i] = k; durum.secili = null; durum.geri.delete(i); cal('tik');
  const kalan = durum.kartSira.filter(j => durum.yer[j] == null);
  tahtaYenile(kalan.length ? '.havuz .kc' : '#kontrol');
}
function yanilgiEtiketi(i) { const c = durum.m.kartlar[i], y = c.y; return typeof y === 'object' ? (y[durum.yer[i]] || y.diger) : y; }
function kovaKontrol() {
  if (!durum || durum.kilit || durum.m.tur !== 'kova') return;
  const m = durum.m;
  if (durum.yer.some(v => v == null)) return;
  durum.deneme++;
  const yanlis = m.kartlar.map((c, i) => i).filter(i => durum.yer[i] !== m.kartlar[i].k);
  if (!yanlis.length) {
    m.kartlar.forEach((c, i) => durum.kilitli.add(i)); durum.kilit = true; tahtaYenile();
    dogruCevap(document.querySelector('#tahta .kovalar')); return;
  }
  if (!durum.ilkYanilgi) durum.ilkYanilgi = yanilgiEtiketi(yanlis[0]);
  if (durum.deneme >= 2) {                                           // 2. yanlış → çözümü göster
    m.kartlar.forEach((c, i) => { if (durum.yer[i] !== c.k) durum.cozum.add(i); durum.yer[i] = c.k; durum.kilitli.add(i); });
    durum.secili = null; durum.kilit = true; tahtaYenile(); cozumGoster(); return;
  }
  m.kartlar.forEach((c, i) => { if (durum.yer[i] === c.k) durum.kilitli.add(i); });
  yanlis.forEach(i => { durum.yer[i] = null; durum.geri.add(i); });
  durum.secili = null; tahtaYenile('.havuz .kc');
  cal('yanlis'); ruh('uzgun', 'salla', '🤔 Henüz değil. ' + yanlis.length + ' kart yanlış kutudaydı; havuza geri döndü (↩). Doğru olanlar ✔ ile kilitlendi. Bir daha dene; istersen ipucu al.');
}
/* Sürükle-bırak (fare ve dokunma; 10 px'ten az hareket "dokunma" sayılır) */
let surukle = null, sonSurukle = 0;
function surukleBaslat(e, i, el) {
  if (!durum || durum.kilit || durum.kilitli.has(i)) return;
  if (e.button !== undefined && e.button !== 0) return;
  surukle = { i, x: e.clientX, y: e.clientY, el, hayalet: null, id: e.pointerId };
}
document.addEventListener('pointermove', e => {
  if (!surukle || e.pointerId !== surukle.id) return;
  const dx = e.clientX - surukle.x, dy = e.clientY - surukle.y;
  if (!surukle.hayalet) {
    if (dx * dx + dy * dy < 100) return;
    const h = surukle.el.cloneNode(true); h.className = 'kc hayalet'; h.style.width = Math.min(surukle.el.offsetWidth, 320) + 'px';
    document.body.appendChild(h); surukle.hayalet = h; surukle.el.classList.add('tasiniyor');
  }
  const h = surukle.hayalet; h.style.left = (e.clientX - h.offsetWidth / 2) + 'px'; h.style.top = (e.clientY - 26) + 'px';
  document.querySelectorAll('.kova.uzerinde').forEach(k => k.classList.remove('uzerinde'));
  const alt = document.elementFromPoint(e.clientX, e.clientY), kv = alt && alt.closest('.kova'); if (kv) kv.classList.add('uzerinde');
});
document.addEventListener('pointerup', e => {
  if (!surukle || e.pointerId !== surukle.id) return;
  const s = surukle; surukle = null;
  if (!s.hayalet) return;                                            // sürüklenmedi: normal dokunma (click) işler
  s.hayalet.remove(); sonSurukle = Date.now();
  const alt = document.elementFromPoint(e.clientX, e.clientY), kv = alt && alt.closest('.kova'), hv = alt && alt.closest('.havuz');
  if (kv) yerlestir(s.i, kv.dataset.k);
  else if (hv && durum) { durum.yer[s.i] = null; durum.secili = null; tahtaYenile(); }
  else tahtaYenile();
});
document.addEventListener('pointercancel', () => { if (surukle && surukle.hayalet) { surukle.hayalet.remove(); surukle = null; tahtaYenile(); } else surukle = null; });

function bitir(cozumGoruldu, mod, hareket, mesaj) {
  durum.kilit = true;
  RaporMotoru.kaydet({ kazanim: durum.m.kaz, madde: durum.m.id, yanilgi: durum.ilkYanilgi,
    ilkDenemeDogru: durum.deneme === 1 && !cozumGoruldu, deneme: durum.deneme, ipucu: durum.ipucu,
    cozumGoruldu, sureMs: Date.now() - durum.t0 });
  ruh(mod, hareket, mesaj);
  app.querySelectorAll('.sec button, .cumle, #tahta button, #ip').forEach(b => { b.disabled = true; });
  const yol = app.querySelector('.yol'); if (yol) yol.outerHTML = yolCiz();
  const sonMu = idx + 1 >= sira.length, sonrakiBolum = !sonMu && sira[idx + 1].bolum !== durum.m.bolum;
  const dev = document.createElement('button'); dev.className = 'buyuk';
  dev.textContent = sonMu ? T.sonSimge + ' Atölyeyi bitir!' : sonrakiBolum ? 'Sonraki hikâyeye geç →' : 'Devam →';
  dev.id = 'dev'; dev.onclick = () => { idx++; soru(); window.scrollTo(0, 0); };
  document.getElementById('devamYer').appendChild(dev); dev.focus({ preventScroll: true });
}

function bitisEkrani() {
  durum = null;
  const yildiz = sonuclar.filter(x => x === 'yildiz').length, oran = yildiz / sira.length;
  const [rozetAd, rozetRenk] = oran >= 0.85 ? ['Usta Hikâyeci', '#f4b400'] : oran >= 0.6 ? ['Gelişen Hikâyeci', '#9aa5b1'] : ['Cesur Okur', '#cd7f32'];
  app.innerHTML = ustCiz() + '<div class="kart gir bitis"><h1>🎉 ' + esc(T.bitisBaslik) + '</h1>' +
    '<svg viewBox="0 0 120 150" class="rozet" role="img" aria-label="' + rozetAd + ' rozeti">' +
    '<path d="M40 92 L26 146 L45 137 L56 150 L60 98Z" fill="#ef476f"/><path d="M80 92 L94 146 L75 137 L64 150 L60 98Z" fill="#6c3fc5"/>' +
    '<circle cx="60" cy="60" r="46" fill="' + rozetRenk + '"/><circle cx="60" cy="60" r="36" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4"/>' +
    '<path d="M42 50 Q51 44 60 50 L60 78 Q51 72 42 78Z M78 50 Q69 44 60 50 L60 78 Q69 72 78 78Z" fill="#fff"/></svg><div class="rozet-ad">' + rozetAd + '</div>' +
    '<div class="yildizlar" aria-label="' + yildiz + ' yıldız">' + (sonuclar.map(x => x === 'yildiz' ? '⭐' : x === 'yarim' ? '✨' : '📘').join('')) + '</div>' +
    karakterSatir('mutlu', 'Tebrikler! ' + yildiz + ' yıldız ve ' + puan + ' ' + T.odulAd + ' topladın. Aşağıda hangi konuda ne kadar güçlü olduğunu görebilirsin.') +
    '<div class="ogrendim"><div><span aria-hidden="true">🌍✨</span>Gerçek: gerçek hayatta olabilir. Hayalî: olamaz. Şaşırtıcı olan her şey hayal değildir.</div>' +
    '<div><span aria-hidden="true">👀💛</span>Dış görünüş gözle görülür; karakter davranışlardan anlaşılır.</div>' +
    '<div><span aria-hidden="true">🔍</span>Kahraman hakkındaki her yargı metindeki bir cümleyle kanıtlanır.</div></div>' +
    '<div id="karne"></div><button class="buyuk" id="yeniden">↻ Yeniden oyna</button></div>';
  sesBagla();
  RaporMotoru.ekranCiz(document.getElementById('karne'));            // karne + sonucu portala gönderir (oyun başına bir kez)
  const eski = parseInt(depo.oku(DEPO_REKOR), 10) || 0;
  if (yildiz > eski) depo.yaz(DEPO_REKOR, String(yildiz));
  document.getElementById('yeniden').onclick = baslangic;
  cal('kutlama'); ruh('mutlu', 'zipla', document.getElementById('balon').textContent);
  konfeti(60); setTimeout(() => konfeti(40, innerWidth * 0.25, innerHeight * 0.3), 350);
}

document.addEventListener('keydown', e => {                       // klavye: 1-4 seçenek / kutu, İ/i ipucu, Enter devam
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const n = e.key >= '1' && e.key <= '9' ? +e.key : 0;
  if (n && durum && !durum.kilit) {
    if (durum.m.tur === 'secim' && n <= 4) { sec_(n - 1); return; }
    if (durum.m.tur === 'kova' && durum.secili != null) { const K = kovalarOf(durum.m); if (n <= K.length) { yerlestir(durum.secili, K[n - 1].id); return; } }
  }
  if ((e.key === 'i' || e.key === 'İ' || e.key === 'ı' || e.key === 'I') && document.getElementById('ip')) ipucuVer();
  else if (e.key === 'Enter') {
    const d = document.getElementById('dev') || document.getElementById('bolumBasla');
    if (d && document.activeElement !== d && !(document.activeElement && document.activeElement.tagName === 'BUTTON' && !document.activeElement.disabled)) { e.preventDefault(); d.click(); }
  }
});
baslangic();
</script>
