<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C8102E">
<title>İnternet bağlantısı yok</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px 16px;background:#eef4fb;color:#233e63;font:600 17px/1.5 system-ui,Arial,sans-serif}
.card{width:min(100%,480px);padding:28px 22px;border-radius:24px;background:#fff;text-align:center;border-top:8px solid #c8102e}
button{margin-top:12px;padding:14px 20px;border:0;border-radius:14px;background:#c8102e;color:#fff;font:inherit;font-weight:800}
</style>
</head>
<body>
<main class="card">
  <h1>📶 İnternet yok</h1>
  <p>Portal ve etkinlikler internetle çalışır. Bağlantın gelince tekrar dene.</p>
  <button type="button" onclick="location.reload()">Tekrar dene</button>
</main>
</body>
</html>
