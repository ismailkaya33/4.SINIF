<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ulaşım Araçları Karşılaştırma</title>
<style>
/* Renkler JS ile OYUN.tema'dan gelir (--ana, --ikinci, --gok1, --gok2). Buradakiler yedek değerdir. */
:root{--ana:#f3722c;--ikinci:#118ab2;--gok1:#8fd8ff;--gok2:#eefaff;--kart:#fff;--yazi:#1f2a44;--soluk:#55627d;--ok:#1f9d5c;--hata:#c0392b;--sari:#ffd166}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--yazi);font:18px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,var(--gok1) 0%,var(--gok2) 72%) fixed;background-color:var(--gok2);overflow-x:hidden}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:12px 14px 120px}
.dekor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dekor .bulut{position:absolute;opacity:.85}
.dekor .sehir{position:absolute;left:0;bottom:0;width:100%;height:110px}
#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
h1,h2,.baslik{font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
h1{font-size:clamp(1.5rem,4.8vw,2.2rem);margin:6px 0 4px;text-align:center}
h2{font-size:clamp(1.25rem,4vw,1.6rem);margin:8px 0 6px;text-align:center}
.kart{background:var(--kart);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 8px 0 rgba(31,42,68,.10),0 14px 30px rgba(31,42,68,.12)}
button{font:inherit;cursor:pointer;color:var(--yazi)}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid #7b5cff;outline-offset:3px}
.buyuk{display:block;margin:14px auto 4px;background:var(--ana);color:#fff;border:0;border-radius:18px;padding:12px 28px;min-height:58px;
  font-size:1.25rem;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.buyuk:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.buyuk.ikincil{background:var(--ikinci)}
/* Üst çubuk + yol haritası */
.ust{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ust .baslik{font-size:1rem;background:#fffc;border-radius:999px;padding:4px 12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sag{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.puan{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
.puan.pop{animation:pop .4s}
.ses{background:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.yol{display:flex;align-items:center;flex-wrap:wrap;gap:3px;margin:10px 0 0;padding:8px 10px;background:#fffb;border-radius:18px}
.durak{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:#fff;color:var(--soluk);border:3px dashed #b9c3d6}
.durak.simdi{border:3px solid var(--ana);color:var(--ana);transform:scale(1.15)}
.durak.yildiz,.durak.yarim,.durak.ogrendi{border:3px solid transparent;font-size:.95rem}
.durak.yildiz{background:#fff3c4}.durak.yarim{background:#e2f7f4}.durak.ogrendi{background:#e8ecff}
.cizgi{flex:1 1 4px;min-width:4px;max-width:16px;height:4px;border-radius:2px;background:#b9c3d6}
.durak.son{width:38px;height:38px;font-size:1.3rem;border:3px solid var(--sari);background:#fff8e1}
/* Soru kartı */
.etiketler{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.etiket{display:inline-block;background:var(--ikinci);color:#fff;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.88rem}
.etiket.asama{background:var(--ana)}
.gorsel{display:flex;justify-content:center;margin:10px 0 2px}
.emoji-gorsel{font-size:clamp(2rem,7vw,2.8rem);line-height:1.2;text-align:center}
.durum{background:#fff6d6;border:2px dashed #f4c24d;border-radius:16px;padding:10px 14px;margin:10px 0 4px;font-size:1.05rem}
.soru{font-size:clamp(1.2rem,3.8vw,1.55rem);font-weight:800;margin:10px 0 12px;text-align:center}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec.uzun{grid-template-columns:1fr}
@media (max-width:460px){.sec{grid-template-columns:1fr}}
.sec button{position:relative;min-height:62px;border-radius:18px;border:3px solid var(--c);background:var(--z);font-size:1.25rem;font-weight:800;
  padding:8px 40px 8px 52px;text-align:left;box-shadow:0 5px 0 var(--c)}
.sec.uzun button{font-size:1.05rem;font-weight:700}
.sec button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.sec button:nth-child(1){--c:#ff8a5c;--z:#fff0e9}.sec button:nth-child(2){--c:#2ec4b6;--z:#e4f8f6}
.sec button:nth-child(3){--c:#f4a300;--z:#fff6dc}.sec button:nth-child(4){--c:#7b5cff;--z:#efeaff}
.sec .no{position:absolute;left:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1rem}
.sec button.dogru{--c:var(--ok);--z:#e3f7ec}
.sec button.dogru::after{content:"✔";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:1.5rem}
.sec button.yanlis{--c:#a7b0c0;--z:#f1f3f7;color:#6b7489;text-decoration:line-through}
.sec button.yanlis::after{content:"✖";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--hata);font-size:1.3rem}
.alt{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.ipucu-btn,.kucuk-btn{background:#fff8e1;border:3px solid var(--sari);border-radius:999px;padding:6px 18px;min-height:50px;font-weight:800;box-shadow:0 4px 0 var(--sari)}
.kucuk-btn{background:#eef4ff;border-color:#9db7f5;box-shadow:0 4px 0 #9db7f5}
.kontrol-btn{background:var(--ikinci);color:#fff;border:0;border-radius:999px;padding:8px 22px;min-height:52px;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 rgba(0,0,0,.2)}
/* Tablo, grafik, bilgi kartları */
.tablo-kap{width:100%;overflow-x:auto}
.tablo{width:100%;border-collapse:separate;border-spacing:0;font-size:1rem;border-radius:14px;overflow:hidden;border:2px solid #d4dcec}
.tablo caption{font-weight:800;margin-bottom:6px;font-size:1.02rem}
.tablo th{background:var(--ikinci);color:#fff;padding:7px 8px;text-align:left;font-size:.95rem}
.tablo td{padding:7px 8px;border-top:1px solid #e3e8f2}
.tablo tr:nth-child(even) td{background:#f4f8ff}
.tablo .yildizlar-h{color:#e09f00;letter-spacing:1px;white-space:nowrap}
.tablo-not{font-size:.85rem;color:var(--soluk);margin-top:4px;text-align:center}
@media (max-width:420px){.tablo{font-size:.86rem}.tablo th{font-size:.82rem}.tablo th,.tablo td{padding:6px 5px}}
.bilgi{width:100%}
.bilgi .sahne-emo{font-size:clamp(1.9rem,7vw,2.6rem);text-align:center;letter-spacing:.06em}
.ciplar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.cip{background:#eef6ff;border:2px solid #bcd7f7;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.98rem}
.olcutler{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.olcut{background:#f4f8ff;border-radius:16px;padding:8px;text-align:center;font-weight:700}
.olcut b{display:block;font-size:1.8rem}
.kural{background:#eaf6ff;border-left:6px solid var(--ikinci);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:1.05rem}
.uyari-k{background:#fff1e6;border-left:6px solid var(--ana);border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:700}
/* Sınıflama (sürükle-bırak / dokun-yerleştir) */
.havuz{min-height:72px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;border:3px dashed #c3cde0;border-radius:18px;background:#f8faff;margin:6px 0 12px}
.havuz.bos::before{content:"Bütün kartlar yerleştirildi ✓";color:var(--soluk);font-weight:700;align-self:center}
.kartc{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid #9db7f5;border-radius:14px;padding:6px 12px;min-height:50px;font-weight:800;font-size:1.02rem;
  box-shadow:0 4px 0 #9db7f5;touch-action:none;user-select:none;-webkit-user-select:none}
.kartc .emo{font-size:1.5rem}
.kartc[aria-pressed="true"]{background:#fff3c4;border-color:var(--ana);box-shadow:0 4px 0 var(--ana);transform:translateY(-2px)}
.kartc.geri{border-style:dashed;border-color:var(--hata);box-shadow:0 4px 0 #f1b0a8}
.kartc.geri::after{content:"↩";color:var(--hata);font-weight:800}
.kartc.duzeltildi{border-color:var(--ok);box-shadow:0 4px 0 #9ddbb8;background:#e9f9f0}
.kartc.surukleniyor{opacity:.35}
.hayalet{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.25)!important}
.kutular{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kutular.tek{grid-template-columns:1fr 1fr}
.kutular.uc{grid-template-columns:1fr 1fr 1fr}
@media (max-width:560px){.kutular.uc{grid-template-columns:1fr}}
.kutu{border:3px solid var(--kc);border-radius:18px;background:var(--kz);min-height:120px;display:flex;flex-direction:column}
.kutu:nth-child(1){--kc:#8d99ae;--kz:#f2f4f7}.kutu:nth-child(2){--kc:#4cc9f0;--kz:#e9f8fd}.kutu:nth-child(3){--kc:#b8a1ff;--kz:#f3efff}.kutu:nth-child(4){--kc:#e76f51;--kz:#fff0eb}
.kutu-bas{border:0;background:var(--kc);color:#fff;font-weight:800;font-size:1.02rem;border-radius:14px 14px 0 0;padding:8px 6px;min-height:48px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.kutu-ic{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:8px;align-content:flex-start;justify-content:center}
.kutu-ic .kartc{font-size:.92rem;min-height:44px;padding:4px 8px}
.kutu.hedef{outline:4px dashed var(--ana);outline-offset:2px}
.yardim{font-size:.92rem;color:var(--soluk);text-align:center;margin:2px 0 4px}
/* Sıralama */
.uc{font-weight:800;color:var(--ikinci);font-size:.95rem;margin:4px 4px}
.uc.son{text-align:right}
.yuvalar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.yuvalar.n3{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.yuvalar,.yuvalar.n3{grid-template-columns:1fr}}
.yuva{position:relative;min-height:74px;border:3px dashed #b9c3d6;border-radius:16px;background:#f8faff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 26px 6px 34px;font-weight:800;text-align:center}
.yuva .sira-no{position:absolute;left:8px;top:50%;margin-top:-13px;width:26px;height:26px;border-radius:50%;background:var(--ikinci);color:#fff;display:grid;place-items:center;font-size:.85rem}
.yuva.dolu{border-style:solid;border-color:#9db7f5;background:#fff}
.yuva .emo{font-size:1.6rem;line-height:1.1}
.yuva .deger{font-size:.82rem;color:var(--soluk);font-weight:700}
.yuva.dogru-y{border-color:var(--ok);background:#e9f9f0}
.yuva.yanlis-y{border-color:var(--hata);background:#fdeceb}
.yuva.dogru-y::after{content:"✔";position:absolute;right:8px;top:6px;color:var(--ok)}
.yuva.yanlis-y::after{content:"✖";position:absolute;right:8px;top:6px;color:var(--hata)}
/* Rehber karakter + konuşma balonu */
.karakter-satir{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.krk{flex:0 0 auto;width:104px}
.krk.kucuk{width:84px}
.krk svg{display:block;width:100%;height:auto;transform-origin:50% 100%}
.krk .goz-mutlu,.krk .kas{display:none}
.krk.mutlu .goz-mutlu{display:inline}.krk.mutlu .goz-acik{display:none}
.krk.dusun .goz-acik{transform:translate(3px,-3px)}
.krk.uzgun .kas{display:inline}.krk.uzgun .goz-acik{transform:translateY(2px)}
.balon{position:relative;flex:1;min-width:0;background:#fff;border-radius:20px;padding:12px 14px;font-weight:600;min-height:3.2em;margin-bottom:24px;
  box-shadow:0 5px 0 rgba(31,42,68,.10);border:3px solid #fff}
.balon::before{content:"";position:absolute;left:-14px;bottom:16px;border:9px solid transparent;border-right:14px solid #fff;border-left:0}
.balon.mutlu{border-color:#bfead2}.balon.uzgun{border-color:#ffd3cc}.balon.dusun{border-color:#ffe7a3}
.devam-yer{text-align:center}
/* Bitiş */
.bitis{text-align:center}
.rozet{width:126px;height:auto}
.rozet-ad{font-weight:800;font-size:1.2rem;margin-top:-4px}
.yildizlar{font-size:1.5rem;letter-spacing:3px;margin:6px 0;word-break:break-all}
#karne .rm{padding:4px 0;text-align:left}
#karne .rm h2{font-family:"Trebuchet MS",system-ui,sans-serif;text-align:center}
#karne .rm-k{border:0;background:#f5f8ff;border-radius:16px}
#karne .rm-bar{height:18px;border-radius:10px}
.kod{font-size:.78rem;color:var(--soluk);text-align:center;margin-top:6px}
/* Telefon (dar ekran) ayarları */
@media (max-width:480px){
  .durak{width:24px;height:24px;font-size:.68rem;border-width:2px!important}
  .durak.yildiz,.durak.yarim,.durak.ogrendi{font-size:.75rem}
  .durak.son{width:30px;height:30px;font-size:1rem}
  .cizgi{min-width:2px;max-width:6px}
  .krk{width:76px}.krk.kucuk{width:66px}
  .kartc{font-size:.9rem;padding:4px 9px;min-height:44px;gap:4px}
  .kartc .emo{font-size:1.2rem}
  .yuva{flex-direction:row;gap:8px;min-height:54px}
  .kart{padding:14px 12px}
}
/* Hareketler (her biri 1 saniyeden kısa; az hareket tercihinde kapanır) */
@media (prefers-reduced-motion:no-preference){
  .krk.zipla svg{animation:zipla .6s}
  .krk.salla svg,.sec button.salla,.salla{animation:salla .45s}
  .kart.gir{animation:gir .35s ease-out}
  .sec button,.kartc{transition:transform .08s,box-shadow .08s,background .15s}
  .durak{transition:transform .2s}
}
@keyframes zipla{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes salla{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes gir{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.25)}}
</style>
</head>
<body>
<div class="dekor" aria-hidden="true">
  <svg class="bulut" style="top:4%;left:-2%;width:160px" viewBox="0 0 170 60"><g fill="#fff"><ellipse cx="50" cy="38" rx="45" ry="20"/><ellipse cx="90" cy="28" rx="40" ry="26"/><ellipse cx="128" cy="40" rx="38" ry="18"/></g></svg>
  <svg class="bulut" style="top:14%;right:-3%;width:130px" viewBox="0 0 170 60"><g fill="#fff"><ellipse cx="50" cy="38" rx="45" ry="20"/><ellipse cx="90" cy="28" rx="40" ry="26"/><ellipse cx="128" cy="40" rx="38" ry="18"/></g></svg>
  <svg class="sehir" viewBox="0 0 1200 110" preserveAspectRatio="none">
    <g fill="#9ccbe8" opacity=".55"><rect x="20" y="30" width="70" height="80"/><rect x="100" y="10" width="50" height="100"/><rect x="160" y="45" width="90" height="65"/><rect x="330" y="20" width="60" height="90"/><rect x="400" y="50" width="80" height="60"/><rect x="560" y="5" width="55" height="105"/><rect x="625" y="40" width="85" height="70"/><rect x="800" y="25" width="70" height="85"/><rect x="880" y="55" width="60" height="55"/><rect x="1010" y="15" width="65" height="95"/><rect x="1085" y="45" width="90" height="65"/></g>
    <rect x="0" y="88" width="1200" height="22" fill="#6c7a8c" opacity=".55"/>
    <path d="M0 99 H1200" stroke="#fff" stroke-width="3" stroke-dasharray="26 18" opacity=".7"/>
  </svg>
</div>
<canvas id="konfeti" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
/* RaporMotoru v2 — 4/D portalına bağlı (her etkinliğin içine gömülür; tek dosya, çevrimdışı).
 *
 * Akış:
 *   RaporMotoru.init({oyunId, oyunAdi, kazanimlar:[{kod, ad}]})   oyun başında (ve "yeniden oyna"da)
 *   RaporMotoru.kaydet({...})                                       her maddeden sonra
 *   RaporMotoru.ekranCiz(el)                                        oyun sonunda: öğrenciye "Kazanım Karnem"
 *
 * Portal bağlantısı (öğrenci kodla giriş yaptıysa etkinlik portalın içinde açılır):
 *   - Her madde: {type:'4d:item-result'} mesajı (madde bazlı kazanım/yanılgı verisi)
 *   - Oyun sonu: {type:'4d:activity-finished'} mesajı, oyun başına BİR kez (mevcut sonuç kaydı)
 *   Sayfa portal dışında (kodsuz) açıldıysa mesajlar gitmez; karne yine gösterilir.
 *   Mesajı yalnızca portal kayıt listesinde (portal/etkinlik-kayitlari.json) olan etkinlikler için
 *   sunucu kaydeder; oyunId bu listedeki "id" ile aynı olmalı.
 *
 * Seviye eşikleri öğretmen panelindekiyle AYNI olmalı (ESIK, seviye).
 */
const RaporMotoru = (() => {
  const SURUM = 2;
  const ESIK = { ustalik: 0.85, gelisiyor: 0.6, ipucuUst: 0.25, minMadde: 3 };
  let meta = null, kayit = [], t0 = Date.now(), denemeKimligi = '', bitisGonderildi = false;

  function yeniKimlik() {
    let r = '';
    try { const a = new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b => { r += b.toString(16).padStart(2, '0'); }); }
    catch (e) { r = Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    return 'rm_' + r;
  }
  function portalaGonder(mesaj) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage(mesaj, '*'); } catch (e) { /* portal yok */ }
  }

  /** m = {oyunId, oyunAdi, kazanimlar:[{kod, ad}]}  (kod = MEB kazanım kodu, ör. "M.4.1.2.3") */
  function init(m) {
    meta = { oyunId: String(m.oyunId), oyunAdi: String(m.oyunAdi), kazanimlar: m.kazanimlar.map(k => ({ kod: String(k.kod), ad: String(k.ad) })) };
    kayit = []; t0 = Date.now(); denemeKimligi = yeniKimlik(); bitisGonderildi = false;
  }

  /** r = {kazanim:kod, madde:id, yanilgi:'etiket'|'', ilkDenemeDogru:bool, deneme:n, ipucu:0-3,
   *       cozumGoruldu:bool, sureMs:n, tekrar:bool}   tekrar=true → seviye hesabına katılmaz */
  function kaydet(r) {
    const i = meta ? meta.kazanimlar.findIndex(k => k.kod === r.kazanim) : -1;
    if (i < 0) { console.warn('RaporMotoru: bilinmeyen kazanım', r.kazanim); return false; }
    const x = {
      k: i, m: String(r.madde || '').slice(0, 40), y: String(r.yanilgi || '').slice(0, 40),
      i: r.ilkDenemeDogru ? 1 : 0, d: Math.max(1, r.deneme | 0), h: Math.max(0, Math.min(3, r.ipucu | 0)),
      c: r.cozumGoruldu ? 1 : 0, s: Math.max(0, Math.round((r.sureMs || 0) / 1000)), r: r.tekrar ? 1 : 0
    };
    kayit.push(x);
    portalaGonder({ type: '4d:item-result', schemaVersion: 1, activityId: meta.oyunId, attemptId: denemeKimligi,
      kazanim: meta.kazanimlar[i].kod, madde: x.m, yanilgi: x.y, ilkDogru: x.i, deneme: x.d, ipucu: x.h,
      cozum: x.c, sureSn: x.s, tekrar: x.r });
    return true;
  }

  function seviye(a) {            // a: ilk kez sorulan madde kayıtları
    const n = a.length;
    if (n < ESIK.minMadde) return 'veri-az';
    const p = a.filter(x => x.i).length / n, h = a.filter(x => x.h > 0).length / n;

    if (p >= ESIK.gelisiyor) return 'gelisiyor';
    return 'destek';
  }

    return meta.kazanimlar.map((k, idx) => {
      const hepsi = kayit.filter(x => x.k === idx), a = hepsi.filter(x => !x.r);

      hepsi.forEach(x => { if (x.y) yan[x.y] = (yan[x.y] || 0) + 1; });
      return {
        kod: k.kod, ad: k.ad, n: a.length, dogru: a.filter(x => x.i).length,
        p: a.length ? a.filter(x => x.i).length / a.length : null,
        ipucuOran: a.length ? a.filter(x => x.h > 0).length / a.length : 0,
        seviye: seviye(a), yanilgilar: yan
      };
    });
  }

  /** Oyun sonu: portaldaki mevcut sonuç kaydı için tek mesaj (çift gönderim yok). */
  function bitir() {

  }

  };

  function ekranCiz(el) {

      const st = document.createElement('style'); st.id = 'rm-css';

        '.rm-k b{display:block;font-size:1.05rem}.rm-bar{height:14px;background:#e8ebf0;border-radius:8px;overflow:hidden;margin:8px 0}' +
        '.rm-bar i{display:block;height:100%;border-radius:8px}.rm-m{font-size:.95rem;font-weight:700}.rm-d{font-size:.9rem;opacity:.8}';
      document.head.appendChild(st);
    }

        '<span class="rm-m" style="color:' + e[1] + '">' + e[0] + '</span> <span class="rm-d">(' + x.dogru + '/' + x.n + ' ilk denemede doğru)</span></div>';
    });
    h += '<p class="rm-d">' + (window.parent !== window ? 'Sonucun öğretmenine gönderildi.' : 'Sonucunun öğretmenine gitmesi için etkinliği öğrenci portalından aç.') + '</p></div>';
    el.innerHTML = h;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

  return { init, kaydet, ozet, bitir, ekranCiz, seviye, ESIK, SURUM };

/* ===================== SORU GÖRSELLERİ ===================== */
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const CIZ = {
  tablo(g) {
    return '<div class="tablo-kap"><table class="tablo"><caption>📋 ' + esc(g.baslik) + '</caption><thead><tr>' + g.sutunlar.map(s => '<th scope="col">' + esc(s) + '</th>').join('') +
      '</tr></thead><tbody>' + g.satirlar.map(r => '<tr>' + r.map((h, i) => i === 0 ? '<th scope="row" style="background:none;color:inherit">' + esc(h) + '</th>'
        : '<td' + (g.yildiz ? ' class="yildizlar-h" aria-label="' + String(h).length + ' yıldız"' : '') + '>' + esc(h) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table>' + (g.not ? '<div class="tablo-not">ℹ️ ' + esc(g.not) + '</div>' : '') + '</div>';
  },
  cubuk(g) {      // yatay çubuk grafik
    const enb = Math.max(...g.veriler.map(v => v.deger)), satir = 64, H = 40 + g.veriler.length * satir, L = 12, W = 300;
    let P = '<text x="170" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2a44">' + esc(g.baslik) + '</text>';
    g.veriler.forEach((v, i) => {
      const y = 38 + i * satir, w = Math.max(10, Math.round(v.deger / enb * (W - 70))), renk = i % 2 ? T.renkIkinci : T.renkAna;
      P += '<text x="' + L + '" y="' + (y + 14) + '" font-size="14" font-weight="700" fill="#1f2a44">' + esc(v.e + ' ' + v.ad) + '</text>' +
        '<rect x="' + L + '" y="' + (y + 22) + '" width="' + w + '" height="24" rx="8" fill="' + renk + '"/>' +
        '<text x="' + (L + w + 8) + '" y="' + (y + 40) + '" font-size="17" font-weight="800" fill="#1f2a44">' + v.deger + ' ' + esc(g.birim) + '</text>';

    if (hedef) hedef.classList.remove('hedef');
    if (!hayalet) return;                       // kıpırdamadı: dokunma (click) olarak işlenir
    hayalet.remove(); btn.classList.remove('surukleniyor'); durum.surukledi = true;
    setTimeout(() => { if (durum) durum.surukledi = false; }, 60);
    const h = ev.type === 'pointerup' ? hedefBul(ev.clientX, ev.clientY) : null;
    if (h && h.dataset.kutu) kutuyaKoy(h.dataset.kutu, i);
    else if (h && h.dataset.havuz) kutuyaKoy(null, i);
  };
  addEventListener('pointermove', hareket); addEventListener('pointerup', bitis); addEventListener('pointercancel', bitis);
}
function sinifKontrol() {
  if (!durum || durum.kilit) return;
  const m = durum.m, bos = durum.yer.filter(v => !v).length;
  if (bos) { ruh('dusun', null, '👆 Önce bütün kartları bir kutuya yerleştir. ' + bos + ' kart kaldı.'); return; }
  const yanlis = m.kartlar.map((k, i) => i).filter(i => durum.yer[i] !== m.kartlar[i].k);
  durum.deneme++;
  if (!yanlis.length) { durum.secili = null; dogruOldu(document.getElementById('kontrol')); sinifCiz(); return; }
  if (!durum.ilkYanilgi) durum.ilkYanilgi = m.kartlar[yanlis[0]].y || 'yol-turu-karisti';
  if (durum.deneme >= 2) {
    yanlis.forEach(i => { durum.yer[i] = m.kartlar[i].k; durum.duzelt.add(i); });
    durum.geri.clear(); durum.secili = null;
    cozumGoster(); sinifCiz(); return;
  }
  yanlis.forEach(i => { durum.yer[i] = null; durum.geri.add(i); });
  durum.secili = null; sinifCiz();
  const kap = document.querySelector('.havuz'); if (kap && !azHareket()) { kap.classList.remove('salla'); void kap.offsetWidth; kap.classList.add('salla'); }
  henuzDegil('Henüz değil. ' + yanlis.length + ' kart yanlış kutudaydı; ↩ işaretiyle havuza döndüler. Doğru kutuya yerleştirip yeniden "Kontrol et"e bas.');
}

/* --- Sıralama: dokunarak sıraya koy --- */
function siraCiz() {
  const m = durum.m, kap = document.getElementById('sirala'); if (!kap) return;
  const n = m.dogruSira.length;
  kap.innerHTML = '<div class="uc">1. sıra: ' + esc(m.uclar[0]) + '</div>' +
    '<div class="yuvalar' + (n === 3 ? ' n3' : '') + '">' + durum.yuva.map((v, j) => {
      const isr = durum.isaret ? (durum.isaret[j] ? ' dogru-y' : ' yanlis-y') : '';
      if (v === null) return '<div class="yuva' + isr + '"><span class="sira-no">' + (j + 1) + '</span><span style="color:var(--soluk);font-weight:600">boş</span></div>';
      const k = m.dogruSira[v];
      return '<button class="yuva dolu' + isr + '" data-y="' + j + '"' + (durum.kilit ? ' disabled' : '') + ' aria-label="' + (j + 1) + '. sıra: ' + esc(k.t) + (durum.kilit ? '' : ', geri almak için dokun') + '">' +
        '<span class="sira-no">' + (j + 1) + '</span><span class="emo" aria-hidden="true">' + k.e + '</span>' + esc(k.t) + (durum.cozum ? '<span class="deger">' + esc(k.d) + '</span>' : '') + '</button>';
    }).join('') + '</div><div class="uc son">' + n + '. sıra: ' + esc(m.uclar[1]) + '</div>' +
    '<div class="havuz' + (durum.havuz.length ? '' : ' bos') + '">' + durum.havuz.map(v => '<button class="kartc" data-h="' + v + '"' + (durum.kilit ? ' disabled' : '') +
      ' aria-label="' + esc(m.dogruSira[v].t) + ' aracını sıradaki boş kutuya koy"><span class="emo" aria-hidden="true">' + m.dogruSira[v].e + '</span>' + esc(m.dogruSira[v].t) + '</button>').join('') + '</div>';
  kap.querySelectorAll('[data-h]').forEach(b => { b.onclick = () => siraKoy(+b.dataset.h); });
  kap.querySelectorAll('[data-y]').forEach(b => { b.onclick = () => siraGeriAl(+b.dataset.y); });
}
function siraKoy(v) {
  if (!durum || durum.kilit) return;
  const j = durum.yuva.indexOf(null); if (j < 0) return;
  durum.yuva[j] = v; durum.havuz = durum.havuz.filter(x => x !== v); durum.isaret = null; cal('tik'); siraCiz();
  const s = document.querySelector('#sirala [data-h]') || document.getElementById('kontrol'); if (s) s.focus({ preventScroll: true });
}
function siraGeriAl(j) {
  if (!durum || durum.kilit || durum.yuva[j] === null) return;
  durum.havuz.push(durum.yuva[j]); durum.yuva[j] = null; durum.isaret = null; cal('tik'); siraCiz();
}
function siraTemizle() {
  if (!durum || durum.kilit) return;
  durum.yuva.forEach(v => { if (v !== null) durum.havuz.push(v); }); durum.yuva = durum.yuva.map(() => null); durum.isaret = null; cal('tik'); siraCiz();
}
function siraKontrol() {
  if (!durum || durum.kilit) return;
  if (durum.yuva.includes(null)) { ruh('dusun', null, '👆 Önce bütün araçları kutulara yerleştir.'); return; }
  durum.deneme++;
  const n = durum.yuva.length, isaret = durum.yuva.map((v, j) => v === j);
  if (isaret.every(Boolean)) { durum.isaret = isaret; durum.cozum = true; dogruOldu(document.getElementById('kontrol')); siraCiz(); return; }
  if (!durum.ilkYanilgi) durum.ilkYanilgi = durum.yuva.every((v, j) => v === n - 1 - j) ? 'ters-sira' : (durum.m.yanilgi || 'sira-karisti');
  if (durum.deneme >= 2) {
    durum.yuva = durum.m.dogruSira.map((_, j) => j); durum.havuz = []; durum.isaret = durum.yuva.map(() => true); durum.cozum = true;
    cozumGoster(); siraCiz(); return;
  }
  durum.isaret = isaret; siraCiz();
  const dogruSay = isaret.filter(Boolean).length;
  henuzDegil('Henüz değil. ' + dogruSay + ' araç doğru yerde (✔), ' + (n - dogruSay) + ' araç yanlış yerde (✖). Yanlış olanlara dokunup geri al, yeniden sırala.');
}

/* --- Madde sonu --- */
function bitir(cozumGoruldu, mod, hareket, mesaj) {
  durum.kilit = true;
  RaporMotoru.kaydet({ kazanim: durum.m.kaz || OYUN.kazanimlar[0].kod, madde: durum.m.id, yanilgi: durum.ilkYanilgi,
    ilkDenemeDogru: durum.deneme === 1 && !cozumGoruldu, deneme: durum.deneme, ipucu: durum.ipucu,
    cozumGoruldu, sureMs: Date.now() - durum.t0, tekrar: durum.x.tekrar });
  ruh(mod, hareket, mesaj);
  app.querySelectorAll('.sec button, #ip, #atla, #kontrol, #temizle, .kartc, .kutu-bas, .yuva').forEach(b => { b.disabled = true; });
  const yol = app.querySelector('.yol'); if (yol) yol.outerHTML = yolCiz();
  const sonMu = idx + 1 >= sira.length && tekrarEklendi;
  const dev = document.createElement('button'); dev.className = 'buyuk'; dev.textContent = sonMu ? T.sonSimge + ' Sonuçlarımı gör' : 'Devam →';
  dev.id = 'dev'; dev.onclick = () => { idx++; soru(); window.scrollTo(0, 0); };
  document.getElementById('devamYer').appendChild(dev); dev.focus({ preventScroll: true });
  balonaKaydir();
}

function yildizYol(cx0, cy0, R, r) { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, u = i % 2 ? r : R;
  d += (i ? 'L' : 'M') + (cx0 + Math.cos(a) * u).toFixed(1) + ' ' + (cy0 + Math.sin(a) * u).toFixed(1); } return d + 'Z'; }
function bitisEkrani() {
  durum = null;
  const ana = sonuclar.slice(0, ilkTur), yildiz = ana.filter(x => x === 'yildiz').length, oran = yildiz / ilkTur;
  const [rozetAd, rozetRenk] = oran >= 0.85 ? ['Altın Yolculuk Planlamacısı', '#f4b400'] : oran >= 0.6 ? ['Gümüş Yolculuk Planlamacısı', '#9aa5b1'] : ['Cesur Yolculuk Planlamacısı', '#cd7f32'];
  app.innerHTML = ustCiz() + '<div class="kart gir bitis"><h1>🎉 ' + esc(T.bitisBaslik) + '</h1>' +
    '<svg viewBox="0 0 120 150" class="rozet" role="img" aria-label="' + rozetAd + ' rozeti">' +
    '<path d="M40 92 L26 146 L45 137 L56 150 L60 98Z" fill="#ef476f"/><path d="M80 92 L94 146 L75 137 L64 150 L60 98Z" fill="#118ab2"/>' +
    '<circle cx="60" cy="60" r="46" fill="' + rozetRenk + '"/><circle cx="60" cy="60" r="36" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4"/>' +
    '<path d="' + yildizYol(60, 60, 24, 10) + '" fill="#fff"/></svg><div class="rozet-ad">' + rozetAd + '</div>' +
    '<div class="yildizlar" aria-label="' + yildiz + ' yıldız">' + ana.map(x => x === 'yildiz' ? '⭐' : x === 'yarim' ? '✨' : '📘').join('') + '</div>' +
    '<div class="karakter-satir"><div id="krk" class="krk kucuk">' + karakterSVG() + '</div><div id="balon" class="balon mutlu">Tebrikler! ' + yildiz +
    ' yıldız ve ' + puan + ' ' + esc(T.odulAd) + ' topladın. Aşağıda kazanım karneni görebilirsin.</div></div>' +
    '<div class="uyari-k" style="text-align:left">🧠 Unutma: En uygun araç duruma göre değişir. Uzaklığa, yolcu ya da yük miktarına, zamana, maliyete, güvenliğe ve çevreye birlikte bak. Toplu taşıma trafiği ve hava kirliliğini azaltır.</div>' +
    '<div id="karne"></div><button class="buyuk" id="yeniden">↻ Yeniden oyna</button></div>';
  sesBagla();
  RaporMotoru.ekranCiz(document.getElementById('karne'));            // karne + sonucu portala gönderir (oyun başına bir kez)
  const eski = parseInt(depo.oku(DEPO_REKOR), 10) || 0;
  if (yildiz > eski) depo.yaz(DEPO_REKOR, String(yildiz));
  document.getElementById('yeniden').onclick = () => { baslangic(); window.scrollTo(0, 0); };
  cal('kutlama'); ruh('mutlu', 'zipla', document.getElementById('balon').textContent);
  konfeti(60); setTimeout(() => konfeti(40, innerWidth * 0.25, innerHeight * 0.3), 350);
}

document.addEventListener('keydown', e => {   // klavye: 1-4 seçenek, İ/i ipucu, Enter devam
  const yazim = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
  if (yazim) return;
  if (e.key >= '1' && e.key <= '4' && durum && !durum.kilit && durum.m.tur === 'secim') sec_(+e.key - 1);
  else if ((e.key === 'i' || e.key === 'İ' || e.key === 'ı') && durum && !durum.kilit) ipucuVer();
  else if (e.key === 'Enter') { const d = document.getElementById('dev'); if (d && document.activeElement !== d) { e.preventDefault(); d.click(); } }
});
baslangic();
