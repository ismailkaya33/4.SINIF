<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Maden Kaşifi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:700;color:#fff;background:#140d0a}
#app{height:100vh;height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;background:linear-gradient(#3d2c22,#1d1411);position:relative;overflow:hidden}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0006}
#bk{width:44px;height:44px;border:0;border-radius:12px;background:#ffb300;font-size:22px;font-weight:900}
#tt{flex:1;text-align:center;font-size:17px}
#sc{background:#0008;border-radius:20px;padding:8px 12px;color:#ffd54a;font-size:16px}
#main{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.card{background:#ffffff14;border:2px solid #ffffff25;border-radius:18px;padding:12px;text-align:center}
.big{font-size:clamp(17px,4.6vw,22px);line-height:1.3}
.msg{margin-top:8px;font-size:15px;color:#ffe9a8;min-height:40px;line-height:1.35}
.btn{min-height:56px;width:100%;border:0;border-radius:16px;font:900 18px 'Trebuchet MS',Arial,sans-serif;color:#2b1a00;background:linear-gradient(#ffd54a,#ff9800);box-shadow:0 5px 0 #a35f00;padding:10px 14px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a35f00}
.btn.sm{min-height:46px;font-size:15px;background:linear-gradient(#8ecbff,#3b8de0);box-shadow:0 4px 0 #1d4f8c;color:#06223f}
.btn.alt{background:linear-gradient(#b9a07e,#7d6446);box-shadow:0 5px 0 #4a3a28;color:#fff}
.logo{font-size:34px;font-weight:900;color:#ffd54a;text-shadow:0 3px 0 #7a4a00;line-height:1.1}
.hero{font-size:70px}.txt{font-size:18px;line-height:1.5;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{aspect-ratio:1;border:0;border-radius:14px;background:linear-gradient(#8d7b6b,#5d4a3b);font-size:clamp(28px,9vw,44px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #2d2118}
.cell small{font-size:11px;font-weight:800}
.cell.dug{background:#241a14;box-shadow:none;animation:pop .35s}
.cell.gold{background:#7a5a00;box-shadow:0 0 18px #ffd54a}
@keyframes pop{50%{transform:scale(1.18)}}
.opts{display:grid;gap:10px}
.opt{min-height:72px;border:0;border-radius:16px;font:900 20px 'Trebuchet MS',Arial,sans-serif;background:#fff;color:#2b1a00;display:flex;align-items:center;gap:12px;padding:8px 16px;box-shadow:0 5px 0 #b9a07e}
.opt span{font-size:38px}.opt.bad{background:#ffb4a8;animation:shk .3s;opacity:.6}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mapsvg{width:100%;height:auto;background:#12324a;border-radius:16px;touch-action:none;flex-shrink:0}
.land{fill:#c9a66b;stroke:#7a5a2c;stroke-width:4;stroke-linejoin:round}
.pc{fill:#ffffffcc;stroke:#b3261e;stroke-width:4}
.pin{cursor:pointer}.pin.bad .pc{fill:#ff8a80}.pin.ok .pc{fill:#a5f3a5;stroke:#1b7a1b}.pin.sel .pc{fill:#ffe082}
.pl{fill:#fff;stroke:#2b1a00;stroke-width:5;paint-order:stroke;font-size:21px;font-weight:900;text-anchor:middle}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px}
.chip{background:#fff;color:#2b1a00;border-radius:14px;padding:8px 12px;font-size:16px;font-weight:900;text-align:center;box-shadow:0 4px 0 #b9a07e;min-width:84px;touch-action:none;cursor:grab}
.chip span{font-size:28px;display:block}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.col{display:flex;flex-direction:column;gap:8px}
.slot{min-height:72px;border:3px dashed #ffffff80;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:15px}
.slot.ok{background:#2e7d32;border-style:solid}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:.9;border:0;border-radius:12px;background:linear-gradient(#4aa3ff,#2563b8);color:#fff;font:900 13px 'Trebuchet MS',Arial,sans-serif;font-size:clamp(12px,3.4vw,16px);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mc em{font-style:normal;font-size:clamp(26px,8vw,40px)}
.mc.up{background:#fff;color:#2b1a00}.mc.done{background:#2e7d32;color:#fff}
.stage{min-height:110px;display:flex;justify-content:center;align-items:center}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{min-height:110px;border:3px dashed #ffffff80;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;line-height:1.5;background:#ffffff10}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd{border-radius:16px;padding:12px;text-align:center;background:#ffd54a30;border:2px solid #ffd54a}
.bd.lock{filter:grayscale(1);opacity:.45;background:#fff2;border-color:#fff4}
.bd b{display:block;font-size:40px}.bd small{display:block;font-size:12px;font-weight:700;margin-top:4px}
.nb{display:flex;gap:10px;align-items:center;text-align:left;background:#ffffff14;border-radius:14px;padding:10px;font-size:14px;line-height:1.35}
.nb.lock{opacity:.4}.nb .e{font-size:36px}
#sheet{display:none;position:absolute;inset:0;background:#000a;z-index:50;align-items:flex-end}
#sheet.on{display:flex}
.sh{width:100%;background:#fff;color:#2b1a00;border-radius:22px 22px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:85%;overflow-y:auto;animation:up .25s}
@keyframes up{from{transform:translateY(60px)}}
.sh h2{font-size:26px;text-align:center}.sh .bdy{font-size:16px;line-height:1.45}.pts{font-size:19px;color:#b35a00;margin-top:6px}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#ffd54a;color:#2b1a00;padding:10px 16px;border-radius:20px;z-index:60;display:none;font-size:16px;text-align:center;box-shadow:0 4px 12px #0008}
#toast.on{display:block;animation:pop .4s}
.lnk{background:none;border:0;color:#ffffff90;font:700 13px Arial;text-decoration:underline;padding:10px}
</style></head><body>
<div id="app">
 <div id="top"><button id="bk">←</button><div id="tt"></div><div id="sc"></div></div>
 <div id="main"></div>
 <div id="sheet"></div><div id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DEF={score:0,badges:{},mi:0,dig:0,map:0,vis:{},mv:{},lab:0};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('mk1')||'{}'))}catch(e){S=Object.assign({},DEF)}
const save=()=>{try{localStorage.setItem('mk1',JSON.stringify(S))}catch(e){}};
const M={
bor:{n:'Bor',e:'🧊',ul:'Cam ve seramik 🍽️',u:'Bor; cam, seramik ve temizlik ürünlerinde kullanılır.',h:'Cam ve seramik yapımında kullanılan bir madeni düşün.',pl:'Eskişehir, Kütahya ve Balıkesir çevresi önemli çıkarım merkezleridir',c:'Eskişehir',x:200,y:140},
komur:{n:'Taş Kömürü',e:'⚫',ul:'Enerji ve ısınma 🔥',u:'Kömür yakılarak enerji ve ısı elde edilir.',h:'Yanınca enerji ve ısı veren siyah bir madeni düşün.',pl:'Zonguldak çevresi önemli çıkarım merkezidir',c:'Zonguldak',x:252,y:60},
demir:{n:'Demir',e:'🔩',ul:'Araç ve çelik 🚗',u:'Demirden çelik yapılır; araçlar, köprüler ve makineler üretilir.',h:'Çelik ve araç yapımında kullanılan sert bir madeni düşün.',pl:'Sivas (Divriği) gibi merkezler önemli demir yataklarına sahiptir',c:'Sivas',x:504,y:159},
bakir:{n:'Bakır',e:'🟠',ul:'Elektrik kablosu ⚡',u:'Bakır elektrik kablolarında ve çeşitli sanayi alanlarında kullanılır.',h:'Elektrik kablolarında kullanılan turuncu-kahverengi bir madeni düşün.',pl:'Artvin, Kastamonu ve Elazığ gibi merkezler önemlidir',c:'Artvin',x:652,y:73},
krom:{n:'Krom',e:'💠',ul:'Paslanmaz çelik 🍴',u:'Krom, çeliği paslanmaz yapar ve parlak kaplamalarda kullanılır.',h:'Çeliği paslanmaz yapan parlak bir madeni düşün.',pl:'Elazığ ve farklı bölgelerdeki önemli yataklarda çıkarılır',c:'Elazığ',x:548,y:193},
altin:{n:'Altın',e:'🥇',ul:'Takı 💍',u:'Altın takı yapımında ve elektronik parçalarda kullanılır.',h:'Takılarda kullanılan sarı ve değerli bir madeni düşün.',pl:'Türkiye\'nin farklı bölgelerinde önemli yatakları vardır (ör. Uşak)',c:'Uşak',x:156,y:193},
petrol:{n:'Petrol',e:'🛢️',ul:'Benzin ve motorin ⛽',u:'Petrolden benzin, motorin ve plastik gibi ürünler elde edilir.',h:'Arabaların yakıtını (benzin, motorin) veren madeni düşün.',pl:'Batman ve Güneydoğu Anadolu\'daki önemli üretim alanlarında çıkarılır',c:'Batman',x:625,y:231},
tuz:{n:'Tuz',e:'🧂',ul:'Yemek ve gıda 🍲',u:'Tuz yemeklerde ve gıdaları saklamada kullanılır.',h:'Yemeklere lezzet veren beyaz bir madeni düşün.',pl:'Tuz Gölü çevresi önemli merkezlerden biridir',c:'Tuz Gölü',x:316,y:192},
boksit:{n:'Boksit',e:'🟥',ul:'Alüminyum ✈️',u:'Boksitten alüminyum elde edilir; folyo, kutu ve pencere profilleri yapılır.',h:'Alüminyum üretiminde kullanılan kırmızımsı bir madeni düşün.',pl:'Konya (Seydişehir) çevresi önemli merkezlerden biridir',c:'Seydişehir',x:254,y:252},
mermer:{n:'Mermer',e:'🏛️',ul:'Yapı ve dekorasyon 🏠',u:'Mermer yapılarda ve dekorasyonda kullanılır.',h:'Zemin ve duvarları süsleyen parlak bir taşı düşün.',pl:'Afyonkarahisar ve Muğla gibi merkezler önemlidir',c:'Muğla',x:116,y:263}};
const keys=Object.keys(M);
const MS=[{t:'dig',k:'bakir'},{t:'pick',q:'🚗 Araç ve çelik yapımında hangi maden kullanılır?',a:'demir',o:['demir','altin','tuz']},{t:'find',k:'bor',o:['bor','komur','petrol','bakir']},{t:'dig',k:'demir'},{t:'pick',q:'📍 Zonguldak\'ta hangi maden çıkarılır?',a:'komur',o:['komur','bor','tuz'],h:'Zonguldak\'ta enerji ve ısınmada kullanılan siyah bir maden çıkarılır.'},{t:'match',o:['bakir','demir','bor','altin']},{t:'find',k:'komur',o:['komur','krom','boksit','altin']},{t:'dig',k:'altin'},{t:'memory',o:['bor','komur','demir','bakir']},{t:'pick',q:'📍 Batman\'da hangi madeni aramalısın?',a:'petrol',o:['petrol','krom','mermer'],h:'Batman\'da arabaların yakıtı için çıkarılan bir maden var.'},{t:'find',k:'krom',o:['krom','petrol','altin','mermer']},{t:'mapdrag',o:['bor','komur','petrol','bakir']},{t:'pick',q:'📍 Artvin hangi madenle ilişkilendirilebilir?',a:'bakir',o:['bakir','mermer','boksit'],h:'Artvin\'de elektrik kablolarında kullanılan bir maden çıkarılır.'},{t:'dig',k:'krom'},{t:'match',o:['petrol','tuz','boksit','mermer']}];
const B=[['kayac','🪨','Kayaç Kaşifi','Kayaç Laboratuvarı\'nı tamamla'],['avci','⛏️','Maden Avcısı','3 madeni kazıp bul'],['harita','🗺️','Harita Uzmanı','Haritada 3 görev tamamla'],['turkiye','🇹🇷','Türkiye Kaşifi','Haritadaki 10 madeni keşfet'],['usta','🏆','Maden Ustası','Tüm maceranın görevlerini bitir']];
const LS=[{e:'🌍',t:'Yer Kabuğu',b:'Yer kabuğunun kara tabakası kayaçlardan oluşur. Bastığımız toprağın altında kayaçlar vardır.'},{e:'🪨',t:'Kayaç Nedir?',b:'Kayaç, doğada bulunan taş kütlesidir. Örnekler: granit, mermer, bazalt, kireç taşı.'},{e:'⛏️',t:'Maden Nedir?',b:'Maden, yer kabuğundan çıkarılıp işlenerek kullanılan değerli maddedir. Örnekler: bakır, demir, altın, bor.'},{e:'🔗',t:'Aralarındaki İlişki',b:'Birçok maden kayaçların içinde bulunur. Madenleri çıkarmak için kayaçlar kazılır.'}];
const SORT=[['Granit','🪨','kayac','Granit sert bir kayaçtır; içinde farklı mineraller bulunur.'],['Mermer','🏛️','kayac','Mermer bir kayaçtır; yapı ve dekorasyonda kullanılır.'],['Bazalt','🌋','kayac','Bazalt, lavın soğumasıyla oluşan koyu renkli bir kayaçtır.'],['Kireç taşı','🐚','kayac','Kireç taşı, deniz canlılarının kalıntılarından oluşan bir kayaçtır.'],['Bakır','🟠','maden','Bakır bir madendir; elektrik kablolarında kullanılır.'],['Demir','🔩','maden','Demir bir madendir; çelik yapımında kullanılır.'],['Altın','🥇','maden','Altın bir madendir; takı yapımında kullanılır.'],['Bor','🧊','maden','Bor bir madendir; cam ve seramikte kullanılır.']];
const OUT='M'+[[26.1,41.7],[27,42],[28,41.95],[29.1,41.2],[30.5,41.1],[31.6,41.4],[33,42],[34.5,42],[35.2,42],[36.5,41.3],[38,41],[39.7,41],[41.5,41.5],[43.4,41.1],[44.3,40],[44.6,39.7],[44,39.4],[44.5,38.4],[44.2,37.3],[42.4,37.1],[41.2,37.1],[38.8,36.7],[36.8,36.8],[36.1,36.7],[36,36],[35.5,36.6],[34.6,36.7],[33.5,36.1],[32.5,36.1],[31.5,36.8],[30.6,36.85],[29.8,36.2],[28.9,36.6],[28,36.7],[27.4,37],[27.2,37.7],[26.7,38.3],[26.4,39.2],[26.2,39.5],[26.2,40.1],[26.8,40.5],[27.5,40.9],[26.6,41]].map(p=>((p[0]-26)/19*760+20).toFixed(0)+','+((42.3-p[1])/6.3*300+20).toFixed(0)).join('L')+'Z';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const view=h=>{$('#main').innerHTML=h;$('#main').scrollTop=0};
const msg=t=>{const e=$('#msg');if(e)e.innerHTML=t};
const upd=()=>$('#sc').textContent='⭐ '+S.score;
function ttl(t,back=true){$('#tt').textContent=t;$('#bk').style.visibility=back?'visible':'hidden'}
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2600)}
function sheet(h,b,cb){const s=$('#sheet');s.innerHTML=`<div class="sh"><h2>${h}</h2><div class="bdy">${b}</div><button class="btn" id="sb">Devam →</button></div>`;s.className='on';$('#sb').onclick=()=>{s.className='';cb&&cb()}}
function chk(){const g=(k,c)=>{if(c&&!S.badges[k]){S.badges[k]=1;toast('🏅 Yeni rozet: '+B.find(b=>b[0]==k)[2])}};g('kayac',S.lab);g('avci',S.dig>=3);g('harita',S.map>=3);g('turkiye',Object.keys(S.mv).length>=10);g('usta',S.mi>=MS.length)}
const info=k=>`<p>${M[k].e} <b>${M[k].n}:</b> ${M[k].u}</p><p>📍 ${M[k].pl}.</p>`;
function win(first,hint,ks,html,next,kind){const p=hint?5:first?15:10;S.score+=p;(ks||[]).forEach(k=>S.vis[k]=1);if(kind=='dig')S.dig++;if(kind=='map')S.map++;chk();save();upd();sheet('🎉 Harika!',html+`<p class="pts">⭐ +${p} puan${hint?' (ipucu kullanıldı)':first?' (ilk denemede bonus!)':''}</p>`,next)}
function adv(){S.mi++;save();chk();mission()}
function inside(z,x,y){const r=z.getBoundingClientRect(),p=14;return x>r.left-p&&x<r.right+p&&y>r.top-p&&y<r.bottom+p}
function drag(el,zones,onDrop){let sx,sy,on=0;el.style.touchAction='none';
 el.addEventListener('pointerdown',e=>{if(el.dataset.lock)return;on=1;sx=e.clientX;sy=e.clientY;try{el.setPointerCapture(e.pointerId)}catch(_){}el.style.transition='none';el.style.zIndex=30;e.preventDefault()});
 el.addEventListener('pointermove',e=>{if(on)el.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.12)`});
 const end=e=>{if(!on)return;on=0;const hit=zones().filter(z=>inside(z,e.clientX,e.clientY));let z=null,d=1e9;hit.forEach(h=>{const r=h.getBoundingClientRect(),dd=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));if(dd<d){d=dd;z=h}});
  let ok=z?onDrop(z,el):false;if(!ok){el.style.transition='transform .25s';el.style.transform=''}el.style.zIndex=''};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function mapSVG(pins,mode){return `<svg class="mapsvg" viewBox="0 0 800 345"><path class="land" d="${OUT}"/>${pins.map(k=>{const I=M[k];return `<g class="pin" data-k="${k}"><circle class="pc" cx="${I.x}" cy="${I.y}" r="26"/><text x="${I.x}" y="${I.y+10}" text-anchor="middle" font-size="28" class="pe">${mode=='x'?I.e:mode=='d'?'❔':'📍'}</text><text class="pl" x="${I.x}" y="${I.y+50}">${I.c}</text></g>`}).join('')}</svg>`}
const hintBtn='<button class="btn sm" id="hn">💡 İpucu (daha az puan)</button>';
const G={};
function home(){ttl('⛏️ Maden Kaşifi',false);upd();
 view(`<div class="card"><div class="logo">⛏️ MADEN KAŞİFİ</div><div class="big" style="margin-top:6px">Türkiye'nin Yeraltı Hazineleri</div></div>
 <button class="btn" id="m1">⛏️ ${S.mi>0&&S.mi<MS.length?'MACERAYA DEVAM ET':'MACERAYA BAŞLA'}</button>
 <button class="btn alt" id="m2">🗺️ TÜRKİYE MADEN HARİTASI</button><button class="btn alt" id="m3">🪨 KAYAÇ LABORATUVARI</button>
 <button class="btn alt" id="m4">🏆 ROZETLERİM</button><button class="btn alt" id="m5">📖 KAŞİF DEFTERİ</button>
 <button class="lnk" id="rs">İlerlemeyi sıfırla</button>`);
 $('#m1').onclick=()=>{if(S.mi>=MS.length){S.mi=0;save()}mission()};$('#m2').onclick=explore;$('#m3').onclick=lab;$('#m4').onclick=badges;$('#m5').onclick=notebook;
 $('#rs').onclick=()=>{if(confirm('Tüm puan ve rozetler silinsin mi?')){S=Object.assign({},DEF,{badges:{},vis:{},mv:{}});save();home()}}}
function mission(){const m=MS[S.mi];if(!m)return fin();ttl('Görev '+(S.mi+1)+'/'+MS.length);upd();G[m.t](m)}
function fin(){ttl('Maceranın Sonu');view(`<div class="card"><div class="hero">🏆</div><div class="logo">MADEN USTASI!</div><p class="txt">Tüm görevleri tamamladın.<br>Toplam puanın: <b>⭐ ${S.score}</b></p></div><button class="btn" id="a">🔁 Maceraya baştan başla</button><button class="btn alt" id="b">Ana menü</button>`);$('#a').onclick=()=>{S.mi=0;save();mission()};$('#b').onclick=home}
G.dig=m=>{const k=m.k,I=M[k];let H=0,n=0;const cells=shuffle([k,...shuffle(keys.filter(x=>x!=k)).slice(0,5),...Array(6).fill('r')]);
 view(`<div class="card"><div class="big">🔎 Aranan maden: ${I.e} <b>${I.n}</b></div><div id="msg" class="msg">Kayalara dokun ve kaz! Altında ne var?</div></div><div class="grid">${cells.map((c,i)=>`<button class="cell" data-i="${i}">🪨</button>`).join('')}</div>${hintBtn}`);
 $('#hn').onclick=()=>{H=1;msg('💡 İpucu: '+I.h)};
 $$('.cell').forEach(b=>b.onclick=()=>{if(b.classList.contains('dug'))return;n++;const c=cells[b.dataset.i];b.classList.add('dug');
  if(c==k){b.classList.add('gold');b.innerHTML=I.e+'<small>'+I.n+'</small>';win(n<=4,H,[k],`<p>⛏️ Maden bulundu! <b>${I.n}</b> buldun.</p>${info(k)}`,adv,'dig')}
  else if(c=='r'){b.innerHTML='🪨<small>Kaya</small>';msg('Bu sadece kaya! Başka bir yeri kaz.')}
  else{b.innerHTML=M[c].e+'<small>'+M[c].n+'</small>';msg(`Bu ${M[c].n}. Aradığımız ${I.n} değil, kazmaya devam et! 💡 ${I.h}`)}})};
G.pick=m=>{let H=0,w=0;view(`<div class="card"><div class="big">${m.q}</div><div id="msg" class="msg">Doğru kartı seç!</div></div><div class="opts">${shuffle(m.o).map(k=>`<button class="opt" data-k="${k}"><span>${M[k].e}</span>${M[k].n}</button>`).join('')}</div>${hintBtn}`);
 $('#hn').onclick=()=>{H=1;msg('💡 İpucu: '+(m.h||M[m.a].h))};
 $$('.opt').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==m.a)win(!w,H,[k],info(k),adv);else{w++;b.classList.add('bad');b.disabled=true;msg('💡 Henüz değil! İpucu: '+(m.h||M[m.a].h))}})};
G.find=m=>{let H=0,w=0;const I=M[m.k];view(`<div class="card"><div class="big">🗺️ ${I.e} <b>${I.n}</b> madeninin önemli çıkarım merkezlerinden birini haritada bul!</div><div id="msg" class="msg">Haritada bir noktaya dokun.</div></div>${mapSVG(shuffle(m.o),'f')}${hintBtn}`);
 $('#hn').onclick=()=>{H=1;msg('💡 İpucu: '+I.h)};
 $$('.pin').forEach(g=>g.onclick=()=>{const k=g.dataset.k;if(k==m.k)win(!w,H,[k],info(k),adv,'map');else{w++;g.classList.add('bad');msg(`📍 ${M[k].c} daha çok <b>${M[k].n}</b> ile bilinir. ${I.n} için başka bir yere bak! 💡 ${I.h}`)}})};
G.mapdrag=m=>{let H=0,w=0,left=m.o.length;view(`<div class="card"><div class="big">🧭 Maden kartlarını doğru ile sürükle!</div><div id="msg" class="msg">Kartı tutup haritadaki şehrin üstüne bırak.</div></div>${mapSVG(m.o,'d')}<div class="tray">${shuffle(m.o).map(k=>`<div class="chip" data-k="${k}"><span>${M[k].e}</span>${M[k].n}</div>`).join('')}</div>${hintBtn}`);
 $('#hn').onclick=()=>{H=1;const r=$$('.chip').filter(c=>!c.dataset.lock)[0];if(r)msg('💡 İpucu: '+M[r.dataset.k].h)};
 $$('.chip').forEach(c=>drag(c,()=>$$('.pin:not(.ok)'),z=>{const k=c.dataset.k;if(z.dataset.k==k){z.classList.add('ok');z.querySelector('.pe').textContent=M[k].e;c.dataset.lock=1;c.style.visibility='hidden';msg('✅ '+M[k].n+': '+M[k].pl+'.');if(--left==0)setTimeout(()=>win(!w,H,m.o,m.o.map(info).join(''),adv,'map'),900);return true}w++;msg('💡 Henüz değil! İpucu: '+M[k].h);return false}))};
G.match=m=>{let H=0,w=0,left=m.o.length;view(`<div class="card"><div class="big">🔗 Madeni kullanım alanıyla eşleştir!</div><div id="msg" class="msg">Maden kartını doğru kutuya sürükle.</div></div><div class="mrow"><div class="col">${shuffle(m.o).map(k=>`<div class="chip" data-k="${k}"><span>${M[k].e}</span>${M[k].n}</div>`).join('')}</div><div class="col">${shuffle(m.o).map(k=>`<div class="slot" data-k="${k}">${M[k].ul}</div>`).join('')}</div></div>${hintBtn}`);
 $('#hn').onclick=()=>{H=1;const r=$$('.chip').filter(c=>!c.dataset.lock)[0];if(r)msg('💡 İpucu: '+M[r.dataset.k].h)};
 $$('.chip').forEach(c=>drag(c,()=>$$('.slot:not(.ok)'),z=>{const k=c.dataset.k;if(z.dataset.k==k){z.classList.add('ok');z.textContent=M[k].e+' '+M[k].n+' → '+M[k].ul;c.dataset.lock=1;c.style.visibility='hidden';msg('✅ '+M[k].u);if(--left==0)setTimeout(()=>win(!w,H,m.o,m.o.map(info).join(''),adv),900);return true}w++;msg('💡 Henüz değil! '+M[k].n+' için ipucu: '+M[k].h);return false}))};
G.memory=m=>{let moves=0,a=null,lock=0,left=m.o.length;const cs=shuffle(m.o.flatMap(k=>[{k,t:'e'},{k,t:'n'}]));
 view(`<div class="card"><div class="big">🧩 Hafıza: maden simgesi ile adını eşleştir!</div><div id="msg" class="msg">Aynı madene ait iki kartı bul.</div></div><div class="mem">${cs.map((c,i)=>`<button class="mc" data-i="${i}">❓</button>`).join('')}</div>`);
 const show=(b,c)=>{b.classList.add('up');b.innerHTML=c.t=='e'?`<em>${M[c.k].e}</em>`:M[c.k].n};
 $$('.mc').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('up')||b.classList.contains('done'))return;const c=cs[b.dataset.i];show(b,c);
  if(!a){a={b,c};return}moves++;const p=a;a=null;
  if(p.c.k==c.k){p.b.className=b.className='mc done';left--;msg('✅ '+M[c.k].n+': '+M[c.k].u);if(!left)setTimeout(()=>win(moves<=6,0,m.o,m.o.map(info).join(''),adv),900)}
  else{lock=1;msg('Olmadı, tekrar dene! 🙂');setTimeout(()=>{[p.b,b].forEach(x=>{x.className='mc';x.textContent='❓'});lock=0},900)}})};
function explore(){ttl('🗺️ Türkiye Maden Haritası');view(`<div class="card"><div class="big">Bir maden simgesine dokun ve öğren!</div></div>${mapSVG(keys,'x')}<div class="card" id="inf" style="text-align:left;min-height:110px">Keşfettiğin madenler: <b id="cn">${Object.keys(S.mv).length}</b>/10</div>`);
 $$('.pin').forEach(g=>g.onclick=()=>{const k=g.dataset.k;$$('.pin').forEach(x=>x.classList.remove('sel'));g.classList.add('sel');S.mv[k]=1;S.vis[k]=1;chk();save();$('#inf').innerHTML=info(k)+`<p>🏠 Günlük hayat: ${M[k].ul}</p><p style="color:#ffd54a">Keşfedilen: ${Object.keys(S.mv).length}/10</p>`})}
function lab(){ttl('🪨 Kayaç Laboratuvarı');lesson(0)}
function lesson(i){const L=LS[i];view(`<div class="card"><div class="hero">${L.e}</div><div class="big"><b>${L.t}</b></div><p class="txt">${L.b}</p></div><button class="btn" id="nx">${i<LS.length-1?'Sonraki →':'🧪 Mini oyuna geç'}</button>`);$('#nx').onclick=()=>i<LS.length-1?lesson(i+1):sortG()}
function sortG(){let i=0,w=0;const it=shuffle(SORT);view(`<div class="card"><div class="big">🧪 Kartı doğru kutuya sürükle!</div><div id="msg" class="msg">Bu bir kayaç mı, maden mi?</div></div><div class="stage" id="cw"></div><div class="bins"><div class="bin" data-k="kayac">🪨<br>KAYAÇ</div><div class="bin" data-k="maden">💎<br>MADEN</div></div>`);
 const nextCard=()=>{if(i>=it.length){S.lab=1;return win(!w,0,[],'<p>Kayaçların ve madenlerin farkını öğrendin! 🪨⛏️</p>',home)}const c=it[i];
  $('#cw').innerHTML=`<div class="chip" id="cd"><span>${c[1]}</span>${c[0]}</div>`;msg(`Kart ${i+1}/${it.length}`);
  drag($('#cd'),()=>$$('.bin'),z=>{if(z.dataset.k==c[2]){$('#cw').innerHTML='<button class="btn" id="nn">Sonraki kart →</button>';msg('✅ '+c[3]);i++;$('#nn').onclick=nextCard;return true}w++;msg('💡 İpucu: '+(c[2]=='kayac'?'Kayaçlar taş kütleleridir.':'Madenler çıkarılıp işlenerek kullanılan değerli maddelerdir.'));return false})};
 nextCard()}
function badges(){ttl('🏆 Rozetlerim');view(`<div class="bgrid">${B.map(b=>`<div class="bd ${S.badges[b[0]]?'':'lock'}"><b>${b[1]}</b>${b[2]}<small>${b[3]}</small></div>`).join('')}</div>`)}
function notebook(){ttl('📖 Kaşif Defteri');view(keys.map(k=>S.vis[k]?`<div class="nb"><div class="e">${M[k].e}</div><div><b>${M[k].n}</b><br>${M[k].u}<br>📍 ${M[k].pl}.</div></div>`:`<div class="nb lock"><div class="e">🔒</div><div>Bu madeni henüz keşfetmedin!</div></div>`).join(''))}
$('#bk').onclick=home;upd();chk();home();
</script></body></html>
